project: neo4j-cli
kind: Minor
body: 'Add `aura virtual-graph` commands for managing Aura Virtual Graphs in a project: `create`, `get`, `list`, `update`, `delete` and `allowed-configs`. `create` takes `--name`, `--data-source-id`, `--import-model-id`, `--cloud-provider` and `--region`, plus optional `--memory`, `--maximum-bytes-billed` and `--wait`, and prints the initial password once as `plain_password`. `list` is cursor-paginated via `--page-limit`/`--page-token`, printing the next page''s cursor to stderr when more results are available'
