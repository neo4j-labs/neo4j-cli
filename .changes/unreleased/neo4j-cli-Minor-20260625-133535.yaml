project: neo4j-cli
kind: Minor
body: 'Add a global `accept-env-vars` config key (default `false`) that gates whether the CLI reads credentials from environment variables. Set it with `neo4j-cli config set accept-env-vars true --rw`, or set `NEO4J_CLI_ACCEPT_ENV_VARS=1` for zero-setup CI usage with no config file. When enabled, env vars override stored credentials at the precedence flag > env var > stored, uniformly across Aura (`NEO4J_AURA_CLIENT_ID`/`NEO4J_AURA_CLIENT_SECRET`, now synthesized into an ephemeral in-memory credential), DBMS (`NEO4J_URI`/`NEO4J_USERNAME`/`NEO4J_PASSWORD`/`NEO4J_DATABASE`), and embed (`NEO4J_EMBED_*`, `OPENAI_API_KEY`, `HF_TOKEN`, `GEMINI_API_KEY`, `GOOGLE_API_KEY`) credentials; partial sets are rejected with a missing-variable error. BREAKING: DBMS and embed credential env vars are no longer read unless `accept-env-vars` is enabled — this covers `query` and the whole `admin` command tree. BREAKING: the CLI-212 `NEO4J_DATABASE` override applied alongside `--credential` now also requires `accept-env-vars` (the explicit `--database` flag is unaffected). Stored credentials are never modified.'
