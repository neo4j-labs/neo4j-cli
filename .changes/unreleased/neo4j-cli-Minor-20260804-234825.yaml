project: neo4j-cli
kind: Minor
body: 'New `neo4j-cli mcp` command group (`serve`, `tool`, `install`, `remove`, `list`, `check`, `bundle`) behind the `flag.mcp-server` feature flag (`NEO4J_CLI_FLAG_MCP_SERVER=1` or `neo4j-cli config set flag.mcp-server true`). This targets agents and chat surfaces with no filesystem or shell access, which therefore cannot invoke `neo4j-cli` themselves — Claude Desktop being the reference client. Agents that can already run commands are better served by `neo4j-cli skill install`. Exposes the CLI through five tools: `neo4j_cli_list_targets` (discovers reachable Neo4j databases), `neo4j_cli_list_commands` (lists CLI command trees), `neo4j_cli_read_docs` (returns documentation from the generated skill bundle), `neo4j_cli_run` (executes read-only CLI commands), and `neo4j_cli_run_write` (executes destructive CLI commands, requires `--rw`). To install into Claude Desktop, run `neo4j-cli config set flag.mcp-server true` then `neo4j-cli mcp install --agent claude-desktop --bundle --rw`, which generates a `.mcpb` bundle and opens the Desktop install UI; omit `--bundle` to write `mcpServers."neo4j-cli"` directly into `claude_desktop_config.json`. Write, Aura and credential access are each off by default and are enabled per-connector in the Desktop settings UI.'
