project: neo4j-cli
kind: Minor
body: 'New `neo4j-cli mcp` command group (`serve`, `tools`, `install`, `remove`, `list`, `check`, `bundle`) behind the `flag.mcp-server` feature flag (`NEO4J_CLI_FLAG_MCP_SERVER=1` or `neo4j-cli config set flag.mcp-server true`). Exposes the CLI to MCP clients such as Claude Desktop through five tools: `neo4j_cli_list_targets` (discovers reachable Neo4j databases), `neo4j_cli_list_commands` (lists CLI command trees), `neo4j_cli_read_docs` (returns documentation from the generated skill bundle), `neo4j_cli_run` (executes read-only CLI commands), and `neo4j_cli_run_write` (executes destructive CLI commands, requires `--rw`).'
time: 2026-08-04T23:48:25.362572+02:00
