project: neo4j-cli
kind: Minor
body: 'Add `neo4j-cli k8s instance credential` and `neo4j-cli k8s instance connect` to the `flag.k8s-commands` preview. `credential` reads NEO4J_AUTH from the Secret `<name>-auth` and stores a DBMS credential. Its name is `k8s-<context>-<namespace>-<name>`, so two Kubernetes clusters keep separate credentials for the same instance. A second run replaces the password and URI and keeps the default credential and any embedding link. `connect` forwards the Bolt port of a ready standalone pod to 127.0.0.1 and waits up to 60 seconds for an authenticated query. It then prints a dotenv environment for `query --env`, or writes it with `--env-out-file` at owner-only permissions on Unix. The command keeps running until Ctrl-C. Both commands take `--port` (default 7687) and need `--rw`. A local port that is already in use fails with the reason from kubectl. When Bolt TLS is on, the URI uses `bolt+ssc` and the command warns that it accepts any server certificate. A Neo4j cluster reports that these commands do not support it yet.'
time: 2026-11-27T12:31:50+00:00
