project: neo4j-cli
kind: Patch
body: '`mcp install` now writes an env block, so write / Aura / credential access actually works with Claude Desktop in config mode (previously unreachable without --bundle). A typed `--rw` enables all three gates; the new `--allow-writes`, `--allow-aura`, and `--allow-credential-write` flags scope them individually. `mcp check` now reports a pre-existing entry without the env block as drift.'
