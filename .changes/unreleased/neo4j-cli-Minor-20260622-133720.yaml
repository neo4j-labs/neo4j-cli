project: neo4j-cli
kind: Minor
body: Add admin privilege commands for managing Neo4j Enterprise privileges via the system database. `grant`/`deny`/`revoke` each expose a per-category subcommand (property, entity, graph, label, load, database, dbms) taking the action as a positional argument (e.g. `admin privilege grant property read --on-graph * --role analyst`), plus `admin privilege list`
