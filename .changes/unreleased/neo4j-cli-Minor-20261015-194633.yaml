project: neo4j-cli
kind: Minor
body: 'New `neo4j-cli feedback` command group (`enable`, `disable`, `status`, `submit`, `register`) behind the `flag.feedback-command` feature flag (`NEO4J_CLI_FLAG_FEEDBACK_COMMAND=1` or `neo4j-cli config set flag.feedback-command true --rw`). Coding agents can send short reports about problems with `neo4j-cli` to the Neo4j team, only after a person agrees: `feedback enable --accept`, run by a person at a terminal (refused when a coding agent is detected or stdin is not a terminal), or accepting the question the registered feedback tool asks in Claude Code or Codex the first time an agent reports (a question left unanswered for 5 minutes sends nothing). Reports are checked locally and rejected, never trimmed, if they look like they contain queries, file paths, connection details, credentials or identifiers; every attempt is recorded locally. `enable` and `register` are writes (`--rw` under an agent); `disable` never needs `--rw`. `status` follows `--format`. `DO_NOT_TRACK=1` or `telemetry` set to false switches feedback off. The text of `feedback submit` is masked in command history, telemetry and crash output and is never saved by tee.'
