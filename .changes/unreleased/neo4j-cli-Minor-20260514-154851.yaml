project: neo4j-cli
kind: Minor
body: Setting NEO4J_CLI_AUTO_INSTALL_SKILL=1 before installing via npm, Homebrew, or the curl installer now automatically runs `skill install --rw` after binary placement; the feature is strictly opt-in and any failure is suppressed so the install always succeeds.
