project: neo4j-cli
kind: Minor
body: Cap Neo4j driver ConnectionAcquisitionTimeout and MaxTransactionRetryTime at 10s on query commands so interactive failures (e.g. wrong URI scheme/port) surface within seconds instead of the driver's 1m / 30s defaults that read as a hang.
