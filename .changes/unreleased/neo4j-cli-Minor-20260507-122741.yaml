project: neo4j-cli
kind: Minor
body: 'Add embedding support to neo4j-cli query: new `:embed` modifier on --param computes a vector inline (e.g. `--param q:embed=hello`) and feeds it as a Cypher parameter; new `query :embed [text]` standalone leaf prints a vector without opening a Bolt connection; five new persistent flags on `query` (--embed-credential, --embed-provider, --embed-model, --embed-base-url, --embed-dimensions) configure the provider (openai, ollama, huggingface). New `credential embed {add,list,remove,use}` subtree stores embed-provider credentials. New `--embed-credential` flag on `credential dbms add` and new `credential dbms set-embed` leaf link a dbms credential to a stored embed credential so `query` can auto-resolve embedding config from the active dbms credential.'
time: 2026-05-07T12:27:45Z
