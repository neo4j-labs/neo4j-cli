name: "CLA Check"

on:
    # pull_request_target is required, not incidental: the job needs
    # secrets.TEAM_GRAPHQL_PERSONAL_ACCESS_TOKEN (private-repo checkout plus
    # org GraphQL queries), and secrets are not exposed to `pull_request`
    # runs from forks — which is exactly where the CLA check matters.
    # Safe here: the checkout targets neo-technology/whitelist-check at a
    # fixed ref; the PR head is never checked out or executed.
    # GitHub blocks pull_request_target by default in public repositories
    # from 2026-12-02 — this repo's Actions event policy must explicitly
    # allow it, or this check silently stops running on PRs.
    pull_request_target:
        branches: ["main"]

permissions:
    contents: read
    pull-requests: read

jobs:
    cla-check:
        #if: github.event.pull_request.user.login != 'renovate[bot]'

        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
              with:
                  repository: neo-technology/whitelist-check
                  token: ${{ secrets.TEAM_GRAPHQL_PERSONAL_ACCESS_TOKEN }}
            - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
              with:
                  python-version: 3
            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
            - run: |
                  owner=$(echo "$GITHUB_REPOSITORY" | cut -d/ -f1)
                  repository=$(echo "$GITHUB_REPOSITORY" | cut -d/ -f2)

                  ./bin/examine-pull-request "$owner" "$repository" "$GITHUB_TOKEN_PAT" "$PULL_REQUEST_NUMBER" cla-database.csv
              env:
                  GITHUB_TOKEN_PAT: ${{ secrets.TEAM_GRAPHQL_PERSONAL_ACCESS_TOKEN }}
                  PULL_REQUEST_NUMBER: ${{ github.event.number }}
