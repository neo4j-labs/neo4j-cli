# Lints distribution/installation-scripts/install-neo4j-cli.sh on every PR.
#
# Scope is the install script only — npm/pypi shell scripts are out of scope
# (see .plans/prd-fix-install-checksum-macos-tahoe.md). We limit `scandir`
# to `distribution/installation-scripts` so the action's recursive *.sh
# discovery doesn't pick up `distribution/npm/*.sh`, `.github/scripts/*.sh`,
# or `.research/**/*.sh`.
#
# Severity gate is `warning`: real portability bugs (the class that triggered
# the macOS Tahoe regression) fail the build, while `style`/`info` noise
# stays non-blocking.

name: ShellCheck

on:
    push:
        branches: ["main"]
        paths:
            - "distribution/installation-scripts/**"
            - ".github/workflows/shellcheck.yml"
    pull_request:
        branches: ["main"]
        paths:
            - "distribution/installation-scripts/**"
            - ".github/workflows/shellcheck.yml"

permissions:
    contents: read

jobs:
    shellcheck:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
            - name: Run shellcheck on install script
              uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
              with:
                  scandir: distribution/installation-scripts
                  severity: warning
