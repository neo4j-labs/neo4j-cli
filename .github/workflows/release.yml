name: release

on:
  push:
    branches: ["main"]
    paths: ["CHANGELOG-neo4j.md", "CHANGELOG-aura.md"]

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.versions.outputs.neo4j }}
      include_neo4j: ${{ steps.changed.outputs.include_neo4j }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 2

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version: "stable"

      - name: Get aura-cli latest version
        id: latest-aura
        uses: miniscruff/changie-action@6dcc2533cac0495148ed4046c438487e4dceaa23 # v2
        with:
          version: latest
          args: latest --project aura-cli

      - name: Get neo4j-cli latest version
        id: latest-neo4j
        uses: miniscruff/changie-action@6dcc2533cac0495148ed4046c438487e4dceaa23 # v2
        with:
          version: latest
          args: latest --project neo4j-cli

      - name: Extract version numbers
        id: versions
        run: |
          AURA_VERSION=$(echo "${{ steps.latest-aura.outputs.output }}" | sed 's/^aura-cli//')
          NEO4J_VERSION=$(echo "${{ steps.latest-neo4j.outputs.output }}" | sed 's/^neo4j-cli//')
          echo "aura=$AURA_VERSION" >> $GITHUB_OUTPUT
          echo "neo4j=$NEO4J_VERSION" >> $GITHUB_OUTPUT

      - name: Detect changed changelogs
        id: changed
        run: |
          # Detect which changelogs were updated in this commit; surface as job
          # outputs so downstream workflows (e.g. publish-npm.yml) can gate on
          # whether neo4j-cli was actually released in this run.
          CHANGED_FILES=$(git diff HEAD~1 --name-only)
          INCLUDE_NEO4J="false"
          INCLUDE_AURA="false"
          if echo "$CHANGED_FILES" | grep -q "CHANGELOG-neo4j.md"; then
            INCLUDE_NEO4J="true"
          fi
          if echo "$CHANGED_FILES" | grep -q "CHANGELOG-aura.md"; then
            INCLUDE_AURA="true"
          fi
          echo "include_neo4j=$INCLUDE_NEO4J" >> $GITHUB_OUTPUT
          echo "include_aura=$INCLUDE_AURA" >> $GITHUB_OUTPUT

      - name: Generate release notes
        run: |
          NEO4J_VERSION="${{ steps.versions.outputs.neo4j }}"
          AURA_VERSION="${{ steps.versions.outputs.aura }}"
          NEO4J_CHANGES_FILE=".changes/neo4j-cli/${NEO4J_VERSION}.md"
          AURA_CHANGES_FILE=".changes/aura-cli/${AURA_VERSION}.md"
          INCLUDE_NEO4J="${{ steps.changed.outputs.include_neo4j }}"
          INCLUDE_AURA="${{ steps.changed.outputs.include_aura }}"
          # Extract the changelog body: skip the first line (## vX.Y.Z - DATE header)
          # Guard: only read the file if it exists
          NEO4J_BODY=""
          if test -f "$NEO4J_CHANGES_FILE"; then
            NEO4J_BODY=$(tail -n +2 "$NEO4J_CHANGES_FILE")
          fi
          AURA_BODY=""
          if test -f "$AURA_CHANGES_FILE"; then
            AURA_BODY=$(tail -n +2 "$AURA_CHANGES_FILE")
          fi
          {
            printf '## Versions\n\n'
            printf -- '- neo4j-cli: %s\n' "${NEO4J_VERSION}"
            printf -- '- aura-cli: %s\n' "${AURA_VERSION}"
            printf '\n## Changes\n\n'
            if [ "$INCLUDE_NEO4J" = "true" ]; then
              printf '### neo4j-cli\n\n'
              printf '%s\n' "${NEO4J_BODY}"
              printf '\n'
            fi
            if [ "$INCLUDE_AURA" = "true" ]; then
              printf '### aura-cli\n\n'
              printf '%s\n' "${AURA_BODY}"
            fi
          } > "$GITHUB_WORKSPACE/release-notes.md"

      - name: Add env vars
        run: |
          echo "GORELEASER_CURRENT_TAG=${{ steps.versions.outputs.neo4j }}" >> $GITHUB_ENV
          echo "AURA_CLI_VERSION=${{ steps.versions.outputs.aura }}" >> $GITHUB_ENV

      - name: Mint Homebrew tap token
        id: brew-token
        uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3
        with:
          app-id: ${{ secrets.HOMEBREW_TAP_APP_ID }}
          private-key: ${{ secrets.HOMEBREW_TAP_APP_PRIVATE_KEY }}
          owner: neo4j-labs
          repositories: homebrew-tap

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@ec59f474b9834571250b370d4735c50f8e2d1e29 # v7.0.0
        with:
          version: latest
          args: --clean --release-notes=release-notes.md --skip=validate --verbose
        env:
          GITHUB_TOKEN: ${{ secrets.TEAM_GRAPHQL_PERSONAL_ACCESS_TOKEN }}
          AURA_CLI_VERSION: ${{ env.AURA_CLI_VERSION }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ steps.brew-token.outputs.token }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}

      - name: Write release-meta.json
        if: steps.changed.outputs.include_neo4j == 'true'
        env:
          NEO4J_VERSION_TAG: ${{ steps.versions.outputs.neo4j }}
          INCLUDE_NEO4J: ${{ steps.changed.outputs.include_neo4j }}
        run: |
          # Compact metadata blob consumed by publish-npm.yml's workflow_run path.
          # Only emitted when neo4j-cli was actually released in this run; the
          # downstream workflow also gates on the include_neo4j job output.
          # Strip the leading `v` from the GoReleaser tag — publish-npm.yml expects
          # bare semver (its regex rejects a leading v and it prepends v itself).
          NEO4J_VERSION="${NEO4J_VERSION_TAG#v}"
          printf '{"version":"%s","include_neo4j":%s}\n' \
            "${NEO4J_VERSION}" \
            "${INCLUDE_NEO4J}" \
            > release-meta.json

      - name: Upload dist artifact
        if: steps.changed.outputs.include_neo4j == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/
          retention-days: 7
          if-no-files-found: error

      - name: Upload release-meta artifact
        if: steps.changed.outputs.include_neo4j == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-meta
          path: release-meta.json
          retention-days: 7
          if-no-files-found: error
