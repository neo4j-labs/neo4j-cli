name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    # Gate: only react to @claude mentions from org members/owners/collaborators,
    # and never from a Bot sender (dependabot/renovate/etc.). The author_association
    # field path differs per event, so each branch checks the matching path.
    # See claude-review-conventions.yml:13-15 for the same MEMBER/OWNER/COLLABORATOR shape.
    if: |
      github.event.sender.type != 'Bot' && (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') && contains(fromJSON('["MEMBER","OWNER","COLLABORATOR"]'), github.event.comment.author_association)) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude') && contains(fromJSON('["MEMBER","OWNER","COLLABORATOR"]'), github.event.comment.author_association)) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude') && contains(fromJSON('["MEMBER","OWNER","COLLABORATOR"]'), github.event.review.author_association)) ||
        (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')) && contains(fromJSON('["MEMBER","OWNER","COLLABORATOR"]'), github.event.issue.author_association))
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: read
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 1

      - name: Configure Claude attribution
        # Override the default Co-authored-by trailers Claude adds to commits.
        # settings.local.json is workflow-scoped (not checked in), so local
        # `claude` runs and the read-only review workflows are unaffected.
        # See https://code.claude.com/docs/en/settings#attribution-settings.
        run: |
          mkdir -p .claude
          cat > .claude/settings.local.json <<'EOF'
          {
            "attribution": {
              "commit": "Generated by Claude on request from @${{ github.event.sender.login }}",
              "pr": ""
            }
          }
          EOF

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@939ae9c056ecf8a1a01409ddd1c4eadec5f8c77b # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # Unsigned commits authored by the @claude invoker (not claude[bot]).
          # Trade-off vs CLI-148: no verified badge — accepted so PR history shows
          # the requester as the author. Claude's role is recorded in the commit
          # body via the attribution byline written in the previous step.
          bot_name: ${{ github.event.sender.login }}
          bot_id: ${{ github.event.sender.id }}

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # Optional: Give a custom prompt to Claude. If this is not specified, Claude will perform the instructions specified in the comment that tagged it.
          # prompt: 'Update the pull request description to include a summary of changes.'

          # Optional: Add claude_args to customize behavior and configuration
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
          # claude_args: '--allowed-tools Bash(gh pr *)'

