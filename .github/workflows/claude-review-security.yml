name: Claude Review — Security

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  security-review:
    # Skip drafts; restrict to org members/owners/collaborators. Outside
    # contributors and bots (dependabot, renovate, etc.) do not match and the
    # job is skipped without consuming Actions minutes or OAuth tokens. They
    # can still invoke @claude manually via .github/workflows/claude.yml.
    if: |
      github.event.pull_request.draft == false &&
      contains(fromJSON('["MEMBER","OWNER","COLLABORATOR"]'), github.event.pull_request.author_association)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # required so Claude can post review comments via gh / MCP
      issues: read
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 1

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod

      - name: Install govulncheck
        # Required by the golang-security skill for vulnerability scanning.
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Force HTTPS for github.com git clones
        # The Claude Code plugin installer shells out to `git clone` to fetch
        # marketplace plugins. The runner has no SSH key configured, so any
        # `git@github.com:` URL fails with `Permission denied (publickey)`.
        # Rewriting to HTTPS works for public repos without requiring auth.
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: Load security prompt into env
        run: |
          {
            echo 'PROMPT<<PROMPT_EOF'
            cat .github/prompts/claude-review-security.md
            echo 'PROMPT_EOF'
          } >> "$GITHUB_ENV"

      - name: Run Claude Code (security review)
        id: claude
        uses: anthropics/claude-code-action@939ae9c056ecf8a1a01409ddd1c4eadec5f8c77b # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # WORKFLOW-CHANGE ESCAPE HATCH — keep commented out on main.
          #
          # claude-code-action mints a GitHub App token, and that exchange 401s
          # ("Workflow validation failed ... identical content to the version on
          # the repository's default branch") whenever a PR edits this file. The
          # action then exits 1, so a PR that touches these review workflows can
          # never satisfy its own required check. It clears on merge.
          #
          # Supplying github_token skips the App-token exchange entirely, letting
          # the review actually run on such a PR. Two coupled consequences:
          #   - comments post as github-actions[bot], NOT claude[bot], so the
          #     verdict step below must set VERDICT_BOT_LOGIN to match or the
          #     gate fail-closes on a review that really ran;
          #   - a wider trusted author is a weaker forgery guard, which is why
          #     this is temporary scaffolding and not the default.
          # Uncomment BOTH this and the VERDICT_BOT_LOGIN line below, together.
          #
          # github_token: ${{ secrets.GITHUB_TOKEN }}

          additional_permissions: |
            actions: read

          # Install the vendored golang-security skill from the in-repo
          # marketplace at .claude-plugin/marketplace.json. Pin is enforced
          # there (ref + sha) so the action sees a reproducible plugin source.
          plugin_marketplaces: |
            ./
          plugins: |
            cc-skills-golang@neo4j-cli-review

          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            ${{ env.PROMPT }}

          # Narrow tool allowlist (PRD REQ-F-007). `Bash(tee:*)` is the narrowest
          # form that lets Claude write the one-word verdict to /tmp/claude-verdict.txt
          # (`echo pass | tee /tmp/claude-verdict.txt`). `Skill` enables invoking
          # the vendored golang-security plugin; `Bash(govulncheck:*)` lets that
          # skill shell out to govulncheck. `Bash(gh api:*)` lets the summary step
          # look up + PATCH an existing claude[bot] comment so each push updates
          # one comment instead of appending a new one. No general `Bash`, no
          # `Write`/`Edit` on repo files, no `curl`/`wget`.
          claude_args: >-
            --allowed-tools
            "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr checks:*),Bash(gh api:*),Bash(tee:*),Bash(govulncheck:*),Read,Grep,Glob,Skill"

      - name: Enforce verdict
        # Four-tier verdict gate; see script header.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REVIEW_KIND: "Security review"
          # Paired with the github_token escape hatch above — uncomment both or neither.
          # VERDICT_BOT_LOGIN: "github-actions[bot]"
        run: .github/scripts/enforce-claude-verdict.sh
