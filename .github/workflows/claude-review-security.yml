name: Claude Review — Security

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  security-review:
    # Skip drafts; restrict to org members/owners/collaborators. Outside
    # contributors and bots (dependabot, renovate, etc.) do not match and the
    # job is skipped without consuming Actions minutes or OAuth tokens. They
    # can still invoke @claude manually via .github/workflows/claude.yml.
    if: |
      github.event.pull_request.draft == false &&
      contains(fromJSON('["MEMBER","OWNER","COLLABORATOR"]'), github.event.pull_request.author_association)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # required so Claude can post review comments via gh / MCP
      issues: read
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 1

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod

      - name: Install govulncheck
        # Required by the golang-security skill for vulnerability scanning.
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Force HTTPS for github.com git clones
        # The Claude Code plugin installer shells out to `git clone` to fetch
        # marketplace plugins. The runner has no SSH key configured, so any
        # `git@github.com:` URL fails with `Permission denied (publickey)`.
        # Rewriting to HTTPS works for public repos without requiring auth.
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: Load security prompt into env
        run: |
          {
            echo 'PROMPT<<PROMPT_EOF'
            cat .github/prompts/claude-review-security.md
            echo 'PROMPT_EOF'
          } >> "$GITHUB_ENV"

      - name: Run Claude Code (security review)
        id: claude
        uses: anthropics/claude-code-action@939ae9c056ecf8a1a01409ddd1c4eadec5f8c77b # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          additional_permissions: |
            actions: read

          # Install the vendored golang-security skill from the in-repo
          # marketplace at .claude-plugin/marketplace.json. Pin is enforced
          # there (ref + sha) so the action sees a reproducible plugin source.
          plugin_marketplaces: |
            ./
          plugins: |
            cc-skills-golang@neo4j-cli-review

          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            ${{ env.PROMPT }}

          # Narrow tool allowlist (PRD REQ-F-007). `Bash(tee:*)` is the narrowest
          # form that lets Claude write the one-word verdict to /tmp/claude-verdict.txt
          # (`echo pass | tee /tmp/claude-verdict.txt`). `Skill` enables invoking
          # the vendored golang-security plugin; `Bash(govulncheck:*)` lets that
          # skill shell out to govulncheck. No general `Bash`, no `Write`/`Edit`
          # on repo files, no `curl`/`wget`.
          claude_args: >-
            --allowed-tools
            "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr checks:*),Bash(tee:*),Bash(govulncheck:*),Read,Grep,Glob,Skill"

      - name: Enforce verdict
        # Fail-closed: missing verdict file is treated as fail so an early Claude
        # exit (or tool denial) cannot silently pass the check.
        #
        # Robustness: Claude occasionally posts the mandated summary comment
        # but skips the final verdict-file write. The comment carries a
        # mandated marker line (`**Security review:** ✅ no issues found`
        # or `**Security review:** ⚠️ N issue(s) flagged inline`); when the
        # verdict file is empty we fall back to scraping the latest
        # claude[bot] PR comment that contains the kind marker. Mirrors the
        # logic in claude-review-conventions.yml.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REVIEW_KIND: "Security review"
        run: |
          set -uo pipefail

          verdict=""
          if [ -s /tmp/claude-verdict.txt ]; then
            verdict="$(tr -d '[:space:]' < /tmp/claude-verdict.txt)"
            echo "Verdict from file: '${verdict}'"
          else
            echo "Verdict file empty/missing; will scrape PR comment fallback."
          fi

          if [ -z "${verdict}" ]; then
            latest="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
              --jq 'map(select(.user.login == "claude[bot]"
                                and (.body | contains("**'"${REVIEW_KIND}"':**"))))
                    | sort_by(.created_at)
                    | last
                    | .body // ""')"
            if [ -z "${latest}" ]; then
              echo "No claude[bot] comment with the ${REVIEW_KIND} marker found."
            elif echo "${latest}" | grep -qF '⚠️'; then
              verdict="fail"
              echo "Verdict from comment: 'fail' (⚠️ marker)"
            elif echo "${latest}" | grep -qF '✅'; then
              verdict="pass"
              echo "Verdict from comment: 'pass' (✅ marker, no ⚠️)"
            else
              echo "Latest claude[bot] comment had neither ✅ nor ⚠️ marker."
            fi
          fi

          if [ "${verdict}" = "pass" ]; then
            exit 0
          fi
          echo "::error::Claude security review did not produce a pass verdict (file='/tmp/claude-verdict.txt'; comment-fallback also did not yield pass)"
          exit 1
