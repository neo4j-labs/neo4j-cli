# CI for .github/scripts/ — bats + shellcheck.
# Path-scoped to .github/scripts/ and this file only.

name: CI Scripts Tests

on:
    push:
        paths:
            - ".github/scripts/**"
            - ".github/workflows/ci-scripts-tests.yml"
    pull_request:
        paths:
            - ".github/scripts/**"
            - ".github/workflows/ci-scripts-tests.yml"

permissions:
    contents: read

jobs:
    scripts-tests:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

            - name: Install bats-core
              run: sudo npm install -g bats

            - name: Run bats tests
              run: bats .github/scripts/tests/

            - name: Run shellcheck
              uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
              with:
                  scandir: .github/scripts
                  severity: warning
