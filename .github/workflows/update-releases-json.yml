name: Update releases.json

# Publishes https://neo4j.sh/releases.json (gh-pages branch root), the feed
# `neo4j-cli update` discovers releases from instead of the rate-limited
# GitHub API (CLI-244).
#
# Kept apart from update-website.yml so the feed never waits on, or fails
# with, the paid Claude website step. It also re-runs once
# post-release-notes.yml has rewritten the new release's body: that edit is
# made with GITHUB_TOKEN, which never fires a `release: edited` run, hence
# the workflow_run trigger. No workflow_run event data is used — main and
# gh-pages are checked out by name.
on:
  release:
    types: [published]
  workflow_run:
    workflows: ["Post release notes"]
    types: [completed]
  workflow_dispatch:

# Serialize feed runs. Deliberately not update-website.yml's `gh-pages`
# group: a pending run in a shared group is cancelled by the next one, which
# could drop a website run. The two workflows write disjoint files and
# push-gh-pages.sh rebases whichever push loses the race.
concurrency:
  group: releases-json
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  releases-json:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          ref: main

      - name: Checkout gh-pages into subdirectory
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          ref: gh-pages
          path: gh-pages
          fetch-depth: 1

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Generate releases.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Idempotent: unchanged release data yields a byte-identical file,
          # so the commit step below stays a no-op when nothing changed.
          go run ./tools/releases-json --out gh-pages/releases.json

      - name: Commit and push
        run: |
          cd gh-pages
          git add releases.json
          git diff --cached --quiet && {
            echo "releases.json is already up to date."
            exit 0
          }
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(website): sync releases.json"
          bash "$GITHUB_WORKSPACE/.github/scripts/push-gh-pages.sh" .
