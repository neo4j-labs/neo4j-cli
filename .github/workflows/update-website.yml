name: Update website

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          ref: main
          fetch-depth: 50

      - name: Checkout gh-pages into subdirectory
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          ref: gh-pages
          path: gh-pages
          fetch-depth: 1

      - name: Create update branch
        id: branch
        run: |
          BRANCH="website-update/$(date +%Y-%m-%d)-$(git rev-parse --short HEAD)"
          cd gh-pages
          git checkout -b "$BRANCH"
          echo "name=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Verify API key
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          [ -n "$ANTHROPIC_API_KEY" ] || { echo "ANTHROPIC_API_KEY secret not set"; exit 1; }
          echo "API key present (${#ANTHROPIC_API_KEY} chars)"

      - name: Run website update
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          cat .github/prompts/website-update.md \
            | claude --bare \
              -p - \
              --output-format stream-json \
              --verbose \
              --include-partial-messages \
              --no-session-persistence \
              --allowedTools "Bash,Read,Edit,Write" \
              --max-turns 50 \
              --max-budget-usd 2.00 \
            | stdbuf -oL tee /tmp/update-raw.jsonl \
            | jq -r --unbuffered '
                if .type == "assistant" then
                  (.message.content[]? |
                    if .type == "text" then .text
                    elif .type == "tool_use" then
                      "[tool] \(.name) \((.input.command // .input.url // .input.file_path // "") | .[0:120])"
                    else empty end)
                elif .type == "stream_event" then
                  if .event.type == "content_block_start"
                     and .event.content_block.type == "tool_use" then
                    "[tool] \(.event.content_block.name)"
                  else empty end
                else empty
                end
              ' \
            | stdbuf -oL tee /tmp/update-summary.txt

      - name: Check for changes
        id: changes
        run: |
          cd gh-pages
          git add -A
          git diff --cached --quiet \
            && echo "changed=false" >> "$GITHUB_OUTPUT" \
            || echo "changed=true"  >> "$GITHUB_OUTPUT"

      - name: Commit
        if: steps.changes.outputs.changed == 'true'
        run: |
          cd gh-pages
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(website): sync with ${{ github.ref_name }}"

      - name: Push branch
        if: steps.changes.outputs.changed == 'true'
        run: |
          cd gh-pages
          git push origin "${{ steps.branch.outputs.name }}"

      - name: Extract summary for PR body
        if: steps.changes.outputs.changed == 'true'
        run: |
          { sed -n '/^<!-- SUMMARY_START -->/,$ p' /tmp/update-summary.txt \
              | tail -n +2 | head -60
            echo
            echo "---"
            echo "🤖 Generated by [update-website](.github/workflows/update-website.yml) using [Claude Code](https://claude.ai/code)"
          } > /tmp/pr-body.txt

      - name: Open or update PR
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="${{ steps.branch.outputs.name }}"
          if gh pr view "$BRANCH" --repo "$GITHUB_REPOSITORY" &>/dev/null; then
            gh pr edit "$BRANCH" \
              --title "chore(website): sync with ${{ github.ref_name }}" \
              --body-file /tmp/pr-body.txt
          else
            gh pr create \
              --title "chore(website): sync with ${{ github.ref_name }}" \
              --body-file /tmp/pr-body.txt \
              --base gh-pages \
              --head "$BRANCH"
          fi

      - name: No changes
        if: steps.changes.outputs.changed == 'false'
        run: echo "No website updates needed for ${{ github.ref_name }}."
