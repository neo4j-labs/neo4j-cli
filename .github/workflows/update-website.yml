name: Update website

on:
  release:
    types: [published]
  workflow_dispatch:

# Serialize runs: two overlapping runs check out the same gh-pages tip and
# race each other's push (publish-gh-pages.sh then rebases the loser, but not
# starting twice is cheaper). Other gh-pages writers still race a run, chiefly
# update-releases-json.yml on the same release, plus manual prompt-flow
# pushes; the publish helper rebases over those.
concurrency:
  group: gh-pages
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          ref: main
          fetch-depth: 50

      - name: Checkout gh-pages into subdirectory
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          ref: gh-pages
          path: gh-pages
          fetch-depth: 1

      - name: Install neo4j-cli
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          # On workflow_dispatch ref_name is a branch (e.g. "main"), not a release tag.
          # Only treat values shaped like a release tag (v*) as authoritative; anything
          # else falls back to the latest published release.
          case "$TAG" in
            v*) ;;
            # `gh release view` (no args) skips prereleases — all our releases
            # are prerelease per goreleaser, so use `gh release list --limit 1`
            # which returns the latest release regardless of prerelease flag.
            *) TAG=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1 --json tagName -q '.[0].tagName') ;;
          esac
          gh release download "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "*Linux*x86_64*.tar.gz" \
            --dir /tmp/neo4j-cli-release
          tar -xzf /tmp/neo4j-cli-release/*.tar.gz -C /tmp/neo4j-cli-release
          mkdir -p "$HOME/.local/bin"
          install -m755 /tmp/neo4j-cli-release/neo4j-cli "$HOME/.local/bin/neo4j-cli"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Verify API key
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          [ -n "$ANTHROPIC_API_KEY" ] || { echo "ANTHROPIC_API_KEY secret not set"; exit 1; }
          echo "API key present (${#ANTHROPIC_API_KEY} chars)"

      - name: Run website update
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ENABLE_PROMPT_CACHING_1H: "1"
          NEO4J_URI: neo4j+s://demo.neo4jlabs.com
          NEO4J_USERNAME: movies
          NEO4J_PASSWORD: movies
          NEO4J_DATABASE: movies
        run: |
          cat .github/prompts/website-update.md \
            | claude --bare \
              -p - \
              --output-format stream-json \
              --verbose \
              --include-partial-messages \
              --no-session-persistence \
              --exclude-dynamic-system-prompt-sections \
              --allowedTools "Bash,Read,Edit,Write" \
              --max-turns 50 \
              --max-budget-usd 2.00 \
            | stdbuf -oL tee /tmp/update-raw.jsonl \
            | jq -r --unbuffered '
                if .type == "assistant" then
                  (.message.content[]? |
                    if .type == "text" then .text
                    elif .type == "tool_use" then
                      "[tool] \(.name) \((.input.command // .input.url // .input.file_path // "") | .[0:120])"
                    else empty end)
                elif .type == "stream_event" then
                  if .event.type == "content_block_start"
                     and .event.content_block.type == "tool_use" then
                    "[tool] \(.event.content_block.name)"
                  else empty end
                else empty
                end
              ' \
            | stdbuf -oL tee /tmp/update-summary.txt

      - name: Publish
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          # releases.json belongs to update-releases-json.yml and the helper
          # publishes the whole checkout, so drop any change the website step
          # made to it. Restore it rather than leave it unstaged: a dirty tree
          # stops the helper's rebase.
          if ! git -C gh-pages diff --quiet HEAD -- releases.json; then
            echo "::warning::The website update modified releases.json; discarding it (owned by update-releases-json.yml)"
            git -C gh-pages restore --staged --worktree -- releases.json
          fi
          # update-releases-json.yml fires on the same release and pushes
          # minutes before this step, so this push usually goes through the
          # helper's rebase-and-retry. Never force-pushes; fails on conflict.
          bash .github/scripts/publish-gh-pages.sh gh-pages "chore(website): sync with ${REF_NAME}"
