name: Post release notes

# Generates richer release notes via Claude Code after a neo4j-cli release.
# First-PR scope (CLI-147): generate + print to the job log only. The Slack
# POST and `gh release edit` steps land in a follow-up PR; this file is the
# skeleton that resolves the tag, version, and previous-tag inputs.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "neo4j-cli version (no leading v), e.g. 1.4.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Resolve release tag and version
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          # On `release` the tag already carries the leading `v` (GoReleaser
          # publishes `vX.Y.Z`); on `workflow_dispatch` the input is the bare
          # version, so prepend `v` ourselves. Either way RELEASE_TAG ends up
          # `vX.Y.Z` and RELEASE_VERSION ends up `X.Y.Z`.
          if [ "${EVENT_NAME}" = "release" ]; then
            TAG="${RELEASE_EVENT_TAG}"
          else
            TAG="v${INPUT_VERSION}"
          fi
          VERSION="${TAG#v}"
          echo "RELEASE_TAG=${TAG}" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "[post-release-notes] RELEASE_TAG=${TAG} RELEASE_VERSION=${VERSION}"

      - name: Validate release tag
        run: |
          # Same regex as publish-npm.yml — semver with optional pre-release /
          # build metadata. Reject anything that doesn't look like a release tag
          # before we run anything expensive.
          if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "ERROR: RELEASE_TAG '${RELEASE_TAG}' does not match ^v[0-9]+\\.[0-9]+\\.[0-9]+([.-][0-9A-Za-z.-]+)?\$" >&2
            exit 1
          fi
          echo "[post-release-notes] tag validated: ${RELEASE_TAG}"

      - name: Verify Slack webhook
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          # Fail fast BEFORE we spend ~$1.50 on Claude Code generation if the
          # webhook secret is missing. Mirrors the ANTHROPIC_API_KEY guard
          # pattern further down — early abort with a clear error.
          if [ -z "${SLACK_WEBHOOK_URL}" ]; then
            echo "ERROR: SLACK_WEBHOOK_URL secret not set" >&2
            exit 1
          fi
          echo "[post-release-notes] Slack webhook present (${#SLACK_WEBHOOK_URL} chars)"

      - name: Checkout main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve previous release tag
        run: |
          # `git describe --tags --abbrev=0 <tag>^` returns the nearest tag
          # reachable from the parent of <tag>. The `|| true` keeps the job
          # alive when there is no prior tag (very first release) — PREV_TAG
          # is then exported as an empty string and the prompt handles that
          # branch via `git log --oneline -30`.
          PREV_TAG=$(git describe --tags --abbrev=0 "${RELEASE_TAG}^" 2>/dev/null || true)
          echo "PREV_TAG=${PREV_TAG}" >> "$GITHUB_ENV"
          echo "[post-release-notes] PREV_TAG=${PREV_TAG:-<none>}"

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Verify API key
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          [ -n "$ANTHROPIC_API_KEY" ] || { echo "ANTHROPIC_API_KEY secret not set"; exit 1; }
          echo "API key present (${#ANTHROPIC_API_KEY} chars)"

      - name: Generate release notes
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ENABLE_PROMPT_CACHING_1H: "1"
        run: |
          # Stream Claude Code output through jq for a human-readable log,
          # mirroring update-website.yml. The prompt writes the final markdown
          # to /tmp/release-notes-generated.md; we never read it from stdout.
          cat .github/prompts/release-notes.md \
            | claude --bare \
              -p - \
              --output-format stream-json \
              --verbose \
              --include-partial-messages \
              --no-session-persistence \
              --exclude-dynamic-system-prompt-sections \
              --allowedTools "Bash,Read,Write" \
              --max-turns 30 \
              --max-budget-usd 1.50 \
            | stdbuf -oL tee /tmp/release-notes-raw.jsonl \
            | jq -r --unbuffered '
                if .type == "assistant" then
                  (.message.content[]? |
                    if .type == "text" then .text
                    elif .type == "tool_use" then
                      "[tool] \(.name) \((.input.command // .input.url // .input.file_path // "") | .[0:120])"
                    else empty end)
                elif .type == "stream_event" then
                  if .event.type == "content_block_start"
                     and .event.content_block.type == "tool_use" then
                    "[tool] \(.event.content_block.name)"
                  else empty end
                else empty
                end
              ' \
            | stdbuf -oL tee /tmp/release-notes-summary.txt

      - name: Guard generated notes file
        run: |
          # Hard-fail if Claude didn't produce the expected artifact. Anything
          # downstream (print, Slack payload) assumes a non-empty markdown
          # body — better to fail here with a clear message.
          if [ ! -s /tmp/release-notes-generated.md ]; then
            echo "ERROR: /tmp/release-notes-generated.md is missing or empty" >&2
            exit 1
          fi
          echo "[post-release-notes] generated notes: $(wc -c < /tmp/release-notes-generated.md) bytes"

      - name: Print generated release notes
        run: |
          # Surface the generated markdown in the job log so reviewers can read
          # what Claude produced without downloading any artifact. Always-on
          # (no `if:`) — runs on every triggered execution.
          echo "----- /tmp/release-notes-generated.md -----"
          cat /tmp/release-notes-generated.md
          echo "----- end -----"

      - name: Convert release notes to Slack mrkdwn
        run: |
          # Slack's `mrkdwn` flavour does not understand GitHub headings
          # (`##`, `###`) or `**bold**` — they render as literal characters.
          # Translate the GitHub-flavoured body produced by Claude into Slack
          # mrkdwn so headings and bold weights render. Bullets (`- `) and
          # triple-backtick fenced code blocks pass through unchanged because
          # Slack already handles those. The GitHub-flavoured original stays
          # on disk for the GH release append step further down.
          perl -pe '
            s{^### (.*)}{*$1*};
            s{^## (.*)}{*$1*};
            s{\*\*([^*]+)\*\*}{*$1*}g;
            s{\[([^\]]+)\]\(([^)]+)\)}{<$2|$1>}g;
          ' /tmp/release-notes-generated.md > /tmp/release-notes-slack.md

      - name: Build Slack payload
        run: |
          # Assemble the Slack message body as:
          #   <preamble>
          #
          #   Release notes
          #   <body>
          #
          #   <release-url>
          # `jq -nR --rawfile body ...` slurps the markdown verbatim, so newlines,
          # backticks, and quotes are JSON-escaped safely without our own
          # sed/printf gymnastics. The body comes from the Slack-flavoured copy
          # so `##` headings and `**bold**` actually render.
          PREAMBLE="neo4j-labs/neo4j-cli ${RELEASE_TAG} is now out. Update with \`neo4j-cli update\` or use your favourite package manager."
          RELEASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}"
          jq -nR \
            --arg preamble "${PREAMBLE}" \
            --arg url "${RELEASE_URL}" \
            --rawfile body /tmp/release-notes-slack.md \
            '{text: ($preamble + "\n\nRelease notes\n" + $body + "\n\n" + $url)}' \
            > /tmp/slack-payload.json
          echo "----- /tmp/slack-payload.json -----"
          cat /tmp/slack-payload.json
          echo "----- end -----"

      - name: Print Slack message (rendered)
        run: |
          # The Actions UI clips the very long single-line JSON `text` value
          # above. Re-render it with jq so newlines render as actual newlines
          # and reviewers can read the message body inline without copying the
          # JSON elsewhere.
          echo "----- Slack message (rendered) -----"
          jq -r '.text' /tmp/slack-payload.json
          echo "----- end -----"

      - name: Post to Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          # Defense in depth: the "Verify Slack webhook" step at the top of the
          # job already early-aborts on an empty secret, but keep the guard
          # here too so this step is safe to copy/paste or reorder.
          if [ -z "${SLACK_WEBHOOK_URL}" ]; then
            echo "ERROR: SLACK_WEBHOOK_URL secret not set" >&2
            exit 1
          fi
          curl -X POST \
            -H 'Content-Type: application/json' \
            --data @/tmp/slack-payload.json \
            "${SLACK_WEBHOOK_URL}"

      - name: Append release notes to GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Idempotent prepend (REQ-F-021): if the current body already starts
          # with `## Release notes` AND contains a `\n---\n` separator, strip
          # the leading Claude block up to and including the first separator
          # before prepending the new block. Re-runs cleanly REPLACE the
          # section rather than stacking. If the marker is present without a
          # separator, fall back to keeping the full body so we never lose
          # data.
          CURRENT=$(gh release view "${RELEASE_TAG}" --json body -q '.body')
          case "${CURRENT}" in
            "## Release notes"*)
              REMAINING="${CURRENT#*$'\n---\n'}"
              # ${var#*pattern} returns the original string when the pattern
              # is absent — fall back to the full body so we don't drop
              # content when a malformed marker was left behind.
              [ "${REMAINING}" = "${CURRENT}" ] && REMAINING="${CURRENT}"
              ;;
            *)
              REMAINING="${CURRENT}"
              ;;
          esac
          {
            printf '## Release notes\n\n'
            cat /tmp/release-notes-generated.md
            printf '\n\n---\n\n'
            printf '%s\n' "${REMAINING}"
          } > /tmp/release-body.md
          gh release edit "${RELEASE_TAG}" --notes-file /tmp/release-body.md
