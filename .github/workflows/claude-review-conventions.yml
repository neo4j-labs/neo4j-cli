name: Claude Review — Conventions

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  conventions-review:
    # Skip drafts; restrict to org members/owners/collaborators. Outside
    # contributors and bots (dependabot, renovate, etc.) do not match and the
    # job is skipped without consuming Actions minutes or OAuth tokens. They
    # can still invoke @claude manually via .github/workflows/claude.yml.
    if: |
      github.event.pull_request.draft == false &&
      contains(fromJSON('["MEMBER","OWNER","COLLABORATOR"]'), github.event.pull_request.author_association)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # required so Claude can post review comments via gh / MCP
      issues: read
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 1

      - name: Load security prompt into env
        run: |
          {
            echo 'PROMPT<<PROMPT_EOF'
            cat .github/prompts/claude-review-conventions.md
            echo 'PROMPT_EOF'
          } >> "$GITHUB_ENV"

      - name: Run Claude Code (conventions review)
        id: claude
        uses: anthropics/claude-code-action@1d6de8cb0c237e7c15e9e1bdf973826ebae490cc # v1.0.248
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # WORKFLOW-CHANGE ESCAPE HATCH — keep commented out on main.
          # See the full explanation in claude-review-security.yml. Short form:
          # a PR editing this file 401s the App-token exchange, so the review
          # cannot run; supplying github_token skips that exchange but posts as
          # github-actions[bot], which requires the paired VERDICT_BOT_LOGIN
          # below. Uncomment BOTH lines together, and revert before merge.
          #
          github_token: ${{ secrets.GITHUB_TOKEN }}

          additional_permissions: |
            actions: read

          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            HEAD SHA: ${{ github.event.pull_request.head.sha }}

            ${{ env.PROMPT }}

          # Narrow tool allowlist (PRD REQ-F-007). `Bash(tee:*)` is the narrowest
          # form that lets Claude write the one-word verdict to /tmp/claude-verdict.txt
          # (`echo pass | tee /tmp/claude-verdict.txt`). `Bash(gh api:*)` lets the
          # summary step look up + PATCH an existing claude[bot] comment so each
          # push updates one comment instead of appending a new one. No general
          # `Bash`, no `Write`/`Edit` on repo files, no `curl`/`wget`.
          claude_args: >-
            --model sonnet
            --allowed-tools
            "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr checks:*),Bash(gh api:*),Bash(tee:*),Read,Grep,Glob"

      - name: Upload Claude execution log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: claude-execution-conventions
          path: ${{ runner.temp }}/claude-execution-output.json
          if-no-files-found: ignore

      - name: Detect verdict
        id: detect
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REVIEW_KIND: "Conventions review"
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MODE: detect
          VERDICT_BOT_LOGIN: "github-actions[bot]"
        run: .github/scripts/enforce-claude-verdict.sh

      - name: Retry Claude Code (conventions review)
        id: claude_retry
        if: steps.detect.outputs.verdict == 'none'
        uses: anthropics/claude-code-action@1d6de8cb0c237e7c15e9e1bdf973826ebae490cc # v1.0.248
        # Keep this with: block identical to the first Claude step above
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # WORKFLOW-CHANGE ESCAPE HATCH — keep commented out on main.
          # See the full explanation in claude-review-security.yml. Short form:
          # a PR editing this file 401s the App-token exchange, so the review
          # cannot run; supplying github_token skips that exchange but posts as
          # github-actions[bot], which requires the paired VERDICT_BOT_LOGIN
          # below. Uncomment BOTH lines together, and revert before merge.
          #
          github_token: ${{ secrets.GITHUB_TOKEN }}

          additional_permissions: |
            actions: read

          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            HEAD SHA: ${{ github.event.pull_request.head.sha }}

            ${{ env.PROMPT }}

          # Narrow tool allowlist (PRD REQ-F-007). `Bash(tee:*)` is the narrowest
          # form that lets Claude write the one-word verdict to /tmp/claude-verdict.txt
          # (`echo pass | tee /tmp/claude-verdict.txt`). `Bash(gh api:*)` lets the
          # summary step look up + PATCH an existing claude[bot] comment so each
          # push updates one comment instead of appending a new one. No general
          # `Bash`, no `Write`/`Edit` on repo files, no `curl`/`wget`.
          claude_args: >-
            --model sonnet
            --allowed-tools
            "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr checks:*),Bash(gh api:*),Bash(tee:*),Read,Grep,Glob"

      - name: Upload retry execution log
        if: always() && steps.detect.outputs.verdict == 'none'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: claude-execution-conventions-retry
          path: ${{ runner.temp }}/claude-execution-output.json
          if-no-files-found: ignore

      - name: Enforce verdict
        # Four-tier verdict gate; see script header.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REVIEW_KIND: "Conventions review"
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # Paired with the github_token escape hatch above — uncomment both or neither.
          VERDICT_BOT_LOGIN: "github-actions[bot]"
        run: .github/scripts/enforce-claude-verdict.sh
