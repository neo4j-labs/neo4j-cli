# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Test

on:
    push:
        branches: ["main"]
    pull_request:
        branches: ["main"]

jobs:
    build:
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, windows-latest, macos-latest]
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

            - name: Set up Go
              uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
              with:
                  go-version-file: go.mod

            - name: Build
              run: make build

            - name: Govulncheck
              if: matrix.os == 'ubuntu-latest'
              run: |
                  go install golang.org/x/vuln/cmd/govulncheck@latest
                  govulncheck ./...

            - name: Generate check
              run: make generate-check

            - name: Lint
              if: matrix.os == 'ubuntu-latest'
              uses: golangci/golangci-lint-action@v7
              with:
                  version: v2.11.4
                  install-mode: binary

            - name: Test
              run: make test

            - name: HTTPS smoke test (--insecure against real Neo4j)
              if: matrix.os == 'ubuntu-latest'
              run: NEO4J_HTTPS_TEST=1 go test -run TestHTTPS_Smoke -v ./neo4j-cli/query/...

            # Tier-1 e2e: drive the freshly-built binary against the REAL GitHub
            # API. Catches regressions that mocks miss — filter drift between
            # release.go's Latest and the head of the API, JSON-shape changes,
            # cobra-flag wiring breaks. Runs on every matrix OS so a Windows-only
            # path bug in update can't slip through.
            #
            # Auth: GITHUB_TOKEN is the auto-injected workflow token; on fork
            # PRs it is the target repo's read-only token, which has enough
            # scope to call /releases (public read) without burning the
            # unauthenticated 60/h ratelimit across the matrix × forks.
            #
            # We build a SEPARATE binary with a low non-"dev" semver baked in
            # via ldflags. The production `make build` artifact has
            # `app.Version == "dev"`, which short-circuits the update flow
            # before any network call (REQ-F-002). The e2e binary uses
            # v0.0.0-e2e so any real prerelease wins the semver compare and
            # the `check` subcommand reports a newer version.
            - name: Build e2e binary (low semver)
              shell: bash
              run: go build -ldflags='-X github.com/neo4j/cli/neo4j-cli/app.Version=v0.0.0-e2e' -o bin/neo4j-cli-e2e ./neo4j-cli

            - name: Update --help smoke test
              shell: bash
              run: bin/neo4j-cli-e2e update --help > /dev/null

            - name: Update e2e (check subcommand)
              shell: bash
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  set -euo pipefail
                  # Pull the head of the prerelease list straight from GitHub
                  # so we can detect filter drift between our Latest() and what
                  # the API actually says is at the top of the feed.
                  expected_tag="$(gh release list \
                      --repo neo4j-labs/neo4j-cli \
                      --limit 1 \
                      --exclude-drafts \
                      --json tagName \
                      --jq '.[0].tagName')"
                  echo "expected_tag=${expected_tag}"

                  # Capture stdout. The current neo4j-cli convention is exit 0
                  # even on RunE errors (cobra prints `Error:` to stderr and
                  # main() doesn't os.Exit(1)) — semantic correctness is
                  # asserted via the JSON helper rather than the exit code, so
                  # `update check` exits 0 in both up-to-date and
                  # newer-available cases (REQ-F-001 — the friendly check
                  # output); we keep `set +e` here as defense in depth so a
                  # future exit-code change can't fail the step before the
                  # helper sees the JSON.
                  set +e
                  out="$(bin/neo4j-cli-e2e update check --pre-releases -f json)"
                  set -e
                  echo "--- update check stdout ---"
                  printf '%s\n' "$out"
                  echo "--- end stdout ---"

                  # Validate the six documented fields, semver of `latest`, and
                  # cross-check against the `gh release list` head. Our e2e
                  # binary is ldflag'd to v0.0.0-e2e, so any real prerelease
                  # wins the semver compare and the helper sees
                  # `updated=false / check=true`.
                  printf '%s' "$out" | go run ./test/e2e/check_json \
                      --expect-channel pre-release \
                      --cross-check "${expected_tag}"

            # Tier-2 e2e: real download + atomic-swap against a local fixture
            # server. Tier-1 (above) covers the `check` subcommand read path
            # against real GitHub; this exercises the WRITE path — archive download,
            # SHA256 verification, extraction, and the same-dir atomic
            # rename — without publishing throwaway tags upstream.
            #
            # The e2e_seams build tag (see seams_e2e.go) lets the binary
            # honor NEO4J_CLI_UPDATE_E2E_* env vars to point at the fixture
            # server. The default `make build` artifact does NOT include
            # this file, so production binaries can't be tricked into
            # talking to a non-GitHub host via env vars (asserted in
            # TestE2ESeams_NotCompiledByDefault).
            #
            # On Windows the runner's bash is Git-Bash; $RUNNER_TEMP is a
            # native Windows path under there. The harness deliberately
            # uses `cygpath -u` to convert it for shell ops and falls back
            # to a relative form when cygpath isn't available (linux/macos).
            - name: Build e2e_seams binary (tier-2)
              shell: bash
              run: go build -tags e2e_seams -ldflags='-X github.com/neo4j/cli/neo4j-cli/app.Version=v0.0.0-e2e' -o bin/neo4j-cli-e2e2 ./neo4j-cli

            - name: Update e2e (tier-2 download + swap)
              shell: bash
              run: |
                  set -euo pipefail

                  # Stage area: same-dir-as-target rename means swap.go's
                  # os.Rename stays on a single filesystem.
                  stage="${RUNNER_TEMP:-/tmp}/n4j-e2e"
                  rm -rf "${stage}"
                  mkdir -p "${stage}"

                  # Pick the right binary name for the host so the swap path
                  # (which targets neo4j-cli or neo4j-cli.exe based on
                  # runtime.GOOS) finds the same shape on disk.
                  case "${RUNNER_OS:-}" in
                    Windows) target_name="neo4j-cli.exe"; src_name="bin/neo4j-cli-e2e2.exe" ;;
                    *)       target_name="neo4j-cli";     src_name="bin/neo4j-cli-e2e2" ;;
                  esac
                  # `go build -o bin/neo4j-cli-e2e2 ./neo4j-cli` emits
                  # `bin/neo4j-cli-e2e2.exe` on Windows automatically.
                  if [ ! -f "${src_name}" ] && [ -f "bin/neo4j-cli-e2e2" ]; then
                    src_name="bin/neo4j-cli-e2e2"
                  fi
                  cp "${src_name}" "${stage}/${target_name}"
                  chmod +x "${stage}/${target_name}" || true

                  # Build the fixture once so we have a single PID to kill on
                  # cleanup. `go run` spawns an intermediate process that's
                  # awkward to clean up reliably on Windows.
                  fixture_bin="${stage}/update_fixture"
                  case "${RUNNER_OS:-}" in
                    Windows) fixture_bin="${fixture_bin}.exe" ;;
                  esac
                  go build -o "${fixture_bin}" ./test/e2e/update_fixture

                  # Spawn fixture server. It prints `listening on
                  # http://127.0.0.1:<port>` to its FIRST stdout line.
                  fixture_log="${stage}/fixture.log"
                  : > "${fixture_log}"
                  "${fixture_bin}" > "${fixture_log}" 2>&1 &
                  fixture_pid=$!
                  trap 'kill "${fixture_pid}" 2>/dev/null || true' EXIT

                  # Wait up to 60s for the fixture to print its port (cold
                  # `go run` + fakebin builds can take a while on Windows).
                  port=""
                  for i in $(seq 1 60); do
                    if [ -s "${fixture_log}" ]; then
                      port="$(grep -oE 'listening on http://127\.0\.0\.1:[0-9]+' "${fixture_log}" | head -1 | sed -E 's|.*:([0-9]+)$|\1|')"
                      if [ -n "${port}" ]; then break; fi
                    fi
                    sleep 1
                  done
                  if [ -z "${port}" ]; then
                    echo "fixture failed to start; log:"
                    cat "${fixture_log}"
                    exit 1
                  fi
                  echo "fixture listening on 127.0.0.1:${port}"

                  base="http://127.0.0.1:${port}"

                  # Drive the swap. Stable tag is v9.9.0, prerelease is
                  # v9.9.1-alpha.1; --pre-releases picks the prerelease.
                  set +e
                  NEO4J_CLI_UPDATE_E2E_API_URL="${base}" \
                  NEO4J_CLI_UPDATE_E2E_DL_URL="${base}" \
                  NEO4J_CLI_UPDATE_E2E_ALLOW_HTTP=1 \
                      "${stage}/${target_name}" update --pre-releases > "${stage}/swap.out" 2> "${stage}/swap.err"
                  swap_rc=$?
                  set -e
                  echo "--- swap stdout ---"
                  cat "${stage}/swap.out"
                  echo "--- swap stderr ---"
                  cat "${stage}/swap.err"
                  echo "--- swap rc=${swap_rc} ---"

                  # Assertion 1: the running narrative reached the success
                  # line (REQ-F-017). This is the byte-for-byte plain-text
                  # success message.
                  if ! grep -q "Successfully updated from" "${stage}/swap.out"; then
                    echo "ASSERTION FAILED: missing 'Successfully updated from' in stdout"
                    exit 1
                  fi

                  # Assertion 2: the swapped binary actually runs and
                  # reports the new tag. fakebin prints `swapped: <TAG>` on
                  # any invocation; we expect the prerelease tag.
                  swapped_out="$("${stage}/${target_name}")"
                  echo "swapped binary output: ${swapped_out}"
                  if [ "${swapped_out}" != "swapped: v9.9.1-alpha.1" ]; then
                    echo "ASSERTION FAILED: swapped binary did not print 'swapped: v9.9.1-alpha.1' (got '${swapped_out}')"
                    exit 1
                  fi

                  echo "tier-2 e2e: OK"
