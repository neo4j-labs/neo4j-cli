name: Claude Review — Oplane Threat Model

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# ── env ──────────────────────────────────────────────────────────────────
# Copying this workflow? Change OPLANE_WORKSPACE_ID below — that is the one
# value you need. It routes threat models to the shared org workspace:
#   workspace: neo4j-labs/neo4j-cli
#   Gravity:   https://gravity.oplane.io/org/neo4j/workspaces/4
#
# To find the UUID for a different workspace, use the Oplane MCP tool
# `search_workspaces` with `name_pattern: "<org>/<repo>"`, or browse the
# workspace page in Gravity — the UUID is in the URL, NOT derivable from
# the `/workspaces/N` numerical id you start from.
env:
  OPLANE_WORKSPACE_ID: 6a246538-76d1-4857-830e-2aad4681d044

jobs:
  oplane-review:
    # Skip drafts; restrict to org members/owners/collaborators. Outside
    # contributors and bots (dependabot, renovate, etc.) do not match and the
    # job is skipped without consuming Actions minutes or OAuth tokens. They
    # can still invoke @claude manually via .github/workflows/claude.yml.
    #
    # Also restrict to same-repo PRs only (head.repo.full_name == github.repository).
    # Fork PRs receive no repo secrets, so OPLANE_PAT would be empty; skipping
    # silently beats posting a spurious "MCP unavailable" comment on a legitimate
    # collaborator PR.
    if: |
      github.event.pull_request.draft == false &&
      contains(fromJSON('["MEMBER","OWNER","COLLABORATOR"]'), github.event.pull_request.author_association) &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Concurrency: cancel-in-progress ensures only one run per PR is active
    # at any time. This is a deliberate deviation from repo convention — no
    # existing workflow sets concurrency — justified because this is the only
    # workflow that mutates *external* state (Gravity threat models). Two
    # racing runs would double-create Gravity models and clobber each other's
    # PR comment.
    concurrency:
      group: oplane-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true

    permissions:
      contents: read
      pull-requests: write # required so Claude can post review comments via gh / MCP
      issues: read
      id-token: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          # fetch-depth 0 (full history) is chosen defensively — the Oplane skill
          # may inspect base history beyond the current diff. If the first real run
          # shows `gh pr diff` alone suffices, this can be reduced to 1.
          fetch-depth: 0

      - name: Force HTTPS for github.com git clones
        # The Claude Code plugin installer shells out to `git clone` to fetch
        # marketplace plugins. The runner has no SSH key configured, so any
        # `git@github.com:` URL fails with `Permission denied (publickey)`.
        # Rewriting to HTTPS works for public repos without requiring auth.
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: Load Oplane prompt into env
        run: |
          {
            echo 'PROMPT<<PROMPT_EOF'
            cat .github/prompts/claude-review-oplane.md
            echo 'PROMPT_EOF'
          } >> "$GITHUB_ENV"

      - name: Run Claude Code (Oplane threat-model review)
        id: claude
        continue-on-error: true # advisory check: neither findings nor integration
                                # breakage can turn the job red. A failing step
                                # still surfaces as a warning annotation.
        env:
          OPLANE_BASE_URL: https://gravity.oplane.io
        uses: anthropics/claude-code-action@939ae9c056ecf8a1a01409ddd1c4eadec5f8c77b # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          additional_permissions: |
            actions: read

          # Install the Oplane plugin from its own marketplace (not vendored).
          # Unlike cc-skills-golang (pinned by ref+sha in marketplace.json),
          # this plugin is consumed straight from its GitHub marketplace.
          # Upstream changes reach CI without review — accepted because the
          # check is advisory and the plugin repo is first-party to Oplane.
          #
          # The .git suffix is REQUIRED: the action validates marketplace URLs
          # against /^https:\/\/[...]+\.git$/ and throws "Invalid marketplace
          # URL format" without it, before any plugin install happens.
          plugin_marketplaces: |
            https://github.com/oplane/oplane-plugin.git
          plugins: |
            oplane@oplane-plugins

          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            OPLANE WORKSPACE ID: ${{ env.OPLANE_WORKSPACE_ID }}

            ${{ env.PROMPT }}

          # --mcp-config merges with (does not replace) the action's built-in
          # GitHub MCP servers, so mcp__github_inline_comment__* remains
          # available. --strict-mcp-config is deliberately NOT passed.
          #
          # KNOWN GAP: the PAT interpolates into argv, so it is readable via
          # /proc/<pid>/cmdline (GitHub masks logs, not /proc). Contradicts the
          # AGENTS.md "secrets via env, never argv" rule.
          #
          # Passing --mcp-config a FILE PATH does not fix it — the action always
          # prepends its built-in servers as inline JSON, and mergeMcpConfigs
          # cannot read a file at parse time, so the path is discarded and this
          # server never registers. Inline JSON is the only shape that works.
          # Revisit if upstream teaches mergeMcpConfigs to read file paths.
          #
          # OPLANE_PAT is a personal PAT belonging to Oskar Hane (no Oplane
          # service account exists yet). Threat models are created in the
          # shared workspace named by OPLANE_WORKSPACE_ID; the PAT supplies
          # identity and write access only. CI reviews stop working if the
          # token is rotated or the account is deprovisioned — the failure is
          # visible (the MCP-unavailable path posts a warning comment) rather
          # than silent. Migrate to a service account when Oplane offers one.
          #
          # The --allowed-tools wildcard mcp__oplane__* covers list_threatmodels,
          # but the predecessor PRD's REQ-F-016 fallback enumerates six names
          # without it. Adopting that fallback silently breaks dedup.
          claude_args: >-
            --mcp-config
            '{"mcpServers":{"oplane":{"type":"http","url":"https://gravity.oplane.io/mcp/","headers":{"Authorization":"Bearer ${{ secrets.OPLANE_PAT }}"}}}}'
            --allowed-tools
            "mcp__oplane__*,mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh api:*),Bash(tee:*),Read,Grep,Glob,Skill"
