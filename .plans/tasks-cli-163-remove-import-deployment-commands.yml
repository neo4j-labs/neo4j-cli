      their tests, and the database/, server/, server/database/, and token/
      subdirectories. aura.go must already be cleaned up (task-001) so no package
      references remain.
    status: completed
    dependencies:
      - task-001
    acceptance_criteria:
      - "neo4j-cli/aura/internal/subcommands/deployment/ does not exist"
      - "`go build ./...` succeeds after deletion"
    completed_at: 2026-05-29T00:10:00Z

  - id: task-004
    title: "Verify skill bundle and run quality gates"
    description: |
      Run `go generate ./neo4j-cli/internal/skill/...` and confirm it produces no
