tasks:
  - id: task-001
    title: "Remove import and deployment registrations from aura.go"
    description: |
      Edit neo4j-cli/aura/aura.go to remove the two package imports and their
      AddCommand calls from the flag.aura-beta block. Remove the import alias
      `_import "github.com/neo4j/cli/neo4j-cli/aura/internal/subcommands/import"`
      and `"github.com/neo4j/cli/neo4j-cli/aura/internal/subcommands/deployment"`.
      Inside the if-block, remove `cmd.AddCommand(_import.NewCmd(cfg))` and
      `cmd.AddCommand(deployment.NewCmd(cfg))` so only `dataapi.NewCmd(cfg)` remains.
      This must happen before the directories are deleted to avoid a broken build state.
    status: completed
    dependencies: []
    acceptance_criteria:
      - "aura.go contains no reference to the import or deployment packages"
      - "The flag.aura-beta block contains exactly one AddCommand call: dataapi.NewCmd(cfg)"
      - "`go build ./neo4j-cli/aura/...` succeeds (packages still exist on disk at this point)"
    completed_at: 2026-05-29T00:00:00Z

  - id: task-002
    title: "Delete the import subcommand directory"
    description: |
      Delete the entire neo4j-cli/aura/internal/subcommands/import/ directory tree,
      which contains import.go and the job/ subdirectory (job.go, create.go, get.go,
      cancel.go, and their _test.go counterparts). aura.go must already be cleaned up
      (task-001) so no package references remain.
    status: in_progress
    dependencies:
      - task-001
    acceptance_criteria:
      - "neo4j-cli/aura/internal/subcommands/import/ does not exist"
      - "`go build ./...` succeeds after deletion"
    completed_at: null

  - id: task-003
    title: "Delete the deployment subcommand directory"
