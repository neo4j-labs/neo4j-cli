      - "`make fmt-check` exits zero (no unformatted files)"
      - "`make lint` exits zero (no lint errors)"
      - "`make generate-check` exits zero (no bundle drift)"
      - "A changie entry exists under .changes/unreleased/ with kind Minor describing the auto-refresh feature"
    completed_at: null
