  - id: task-011
    title: 'Pass the Aura password to neo4j-admin via env, not docker exec argv'
    description: |
      Security review (Medium): docker/deploy.go passes the freshly-generated
      Aura instance admin password to neo4j-admin as a command-line argument
      (`--to-password=` + target.Password, deploy.go:128). execClient.Exec shells
      `docker exec <name> neo4j-admin ... --to-password=<secret>`, so the secret
      lands in the docker CLI process argv on the host AND in neo4j-admin's argv
      inside the container — both readable via the world-readable
      /proc/<pid>/cmdline during the upload window, so any unprivileged local
      user can capture the Aura admin credential. neo4j-admin database upload
      reads NEO4J_USERNAME/NEO4J_PASSWORD from the environment as an alternative
      to --to-user/--to-password (Operations Manual). Harden by keeping the
      secret out of argv entirely: add an env-aware exec seam (e.g.
      ExecWithEnv(ctx, name, args, env) on the dockerClient interface +
      execClient + fakeDockerClient) that sets the extra KEY=VALUE entries on the
      docker process's exec.Cmd.Env (append to os.Environ()), and have PushToAura
      invoke `docker exec -e NEO4J_PASSWORD -e NEO4J_USERNAME <name> neo4j-admin
      database upload <db> --from-path=... --to-uri=... --overwrite-destination`
      — the `-e VAR` passthrough form (NAME only, no =value) forwards the values
      from the docker CLI's environment, so they travel via /proc/<pid>/environ
      (same-uid/root readable) instead of world-readable cmdline. Drop
      --to-password and --to-user from the neo4j-admin argv. Ensure the env value
      is never echoed in the error path (it isn't in args, so redactArgs already
      won't touch it — verify). This is the canonical-layer fix for the exported
      PushToAura entry point.
    dependencies: []
    acceptance_criteria:
      - "The Aura password is supplied to neo4j-admin via the docker process environment (exec.Cmd.Env) and the `docker exec -e NEO4J_PASSWORD`/`-e NEO4J_USERNAME` passthrough flags, not as a --to-password/--to-user argv value"
      - "An env-aware exec seam exists on the dockerClient interface, execClient, and fakeDockerClient, and the fake records the env so tests can assert it"
      - "A unit test asserts the password value never appears in the recorded docker argv and is provided via env, and that argv carries `-e NEO4J_PASSWORD` (name only)"
      - "make test, make fmt-check, and make lint are clean"
    source: review
    status: completed
    completed_at: 2026-06-01T14:16:17Z

  - id: task-012
    title: 'Pass NEO4J_AUTH to docker run via env passthrough, not argv'
    description: |
      Follow-on from the same security finding: docker/create.go builds the
      generated container password into the `docker run` argv as
      `-e NEO4J_AUTH=neo4j/<pw>` (create.go ~322) and calls client.Run(argv).
      The value is therefore in the docker CLI process's world-readable
      /proc/<pid>/cmdline (any local user can read it during create), and is
      ALSO persisted permanently in `docker inspect <container>.Config.Env`. The
      Config.Env persistence is inherent to how NEO4J_AUTH provisions the
      password and is out of scope; this task closes the world-readable
      host-argv leak the same way as task-011: pass the value via the docker
      process environment and use the `docker run -e NEO4J_AUTH` passthrough form
      (NAME only, no =value) so it isn't in argv. Reuse the env-aware run
      plumbing introduced in task-011 (e.g. a RunWithEnv variant sharing the same
      cmd.Env mechanism). This narrows readability from "any local user via
      cmdline" to "docker-socket users via docker inspect", a real reduction.
    status: completed
    dependencies:
      - task-011
    acceptance_criteria:
      - "docker run receives NEO4J_AUTH via the docker process environment + `-e NEO4J_AUTH` passthrough flag, not as an `-e NEO4J_AUTH=<value>` argv element"
      - "create's existing tests still pass (container still gets the password; credential storage unchanged), with a test asserting the password value is absent from the recorded docker argv"
      - "make test, make fmt-check, and make lint are clean"
    source: review
    completed_at: 2026-06-01T14:20:59Z

  - id: task-013
    title: 'Fast-fail deploy --from-docker on community-edition containers'
    description: |
      The `aura instance deploy --from-docker` path is Enterprise-only and fails
      cryptically on a community-edition container. Empirically confirmed: the
      docker path runs `STOP DATABASE <db>` over Bolt to take a consistent
      offline dump, but `STOP DATABASE` is an Enterprise-only Cypher admin
      command — on community edition it errors `51N27 ... 'STOP DATABASE' is not
      supported in community edition`, and `neo4j-admin dump` refuses to run on a
      live database. Because `neo4j-cli docker create --edition community` makes
      community containers trivial to create, a user can point `--from-docker` at
      one; today the failure happens mid-deploy AFTER the Aura instance is
      already created and left behind (cryptic error + an orphaned billable
      instance). Fix: add a fast-fail pre-flight in the `--from-docker` branch of
      the deploy leaf that inspects the source container's edition (the docker
      client's Inspect already returns Edition from the container labels) BEFORE
      creating any Aura instance, returning a clear clierr.UsageError when the
      container is community edition — e.g. "deploy --from-docker requires an
      enterprise Neo4j container; community edition cannot take an online dump
      (STOP DATABASE is enterprise-only). Recreate the container with `neo4j-cli
      docker create --edition enterprise`." Also add a one-line note to the
      deploy command's Long help text stating that deploy operates on Enterprise
      sources only (Desktop 2 only manages enterprise DBMSs, and the docker path
      requires enterprise). The edition check must run as part of the docker
      source pre-flight before createAndStoreInstance, must not regress the
      existing enterprise happy path, and (since deploy.go is in the aura/instance
      package and docker.Inspect/Container live in the docker package) will need
      a small exported docker helper or to reuse docker.NewDeployClient plus an
      exported Inspect/Container surface — keep it minimal and consistent with
      the existing docker.PushToAura entry point. Cover the guard with a unit
      test using a fake/seamed docker client returning a community-edition
      container, asserting no Aura instance is created (no POST to /instances)
      and the usage error is returned; if go generate is needed for the Long
      change, run `go generate ./neo4j-cli/internal/skill/...`.
    dependencies: []
    acceptance_criteria:
      - "deploy --from-docker performs a pre-flight edition check BEFORE creating any Aura instance and returns a clear clierr.UsageError for a community-edition source container"
      - "No Aura instance is created when the source container is community edition (test asserts no POST to /instances)"
      - "The enterprise happy path is unchanged; the deploy Long help text notes deploy requires Enterprise sources"
      - "make test, make fmt-check, and make lint are clean (and the skill bundle is regenerated if the Long text changed)"
    source: review
    status: completed
    completed_at: 2026-06-02T00:00:00Z
