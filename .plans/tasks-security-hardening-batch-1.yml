tasks:
  - id: task-001
    title: "Add RedactArgs helper for secret-flag scrubbing"
    description: |
      Create common/clievents/redact.go exposing func RedactArgs(args []string) string.
      Mask values of the secret-bearing flags password, client-secret, api-key,
      instance-password across three argv shapes: --flag value, --flag=value, and
      defensive -f value form. This helper is the single source of truth for
      "what flag is sensitive" and is reused by telemetry and panic templates.
    status: completed
    completed_at: 2026-05-08T14:24:04Z
    dependencies: []
    acceptance_criteria:
      - "redact.go exports RedactArgs with the four hardcoded secret flags"
      - "redact_test.go is table-driven and covers --flag X, --flag=X, -f X, multi-flag, secret-as-final-arg, no-secret, value-less flag, mixed positional+flag"
      - "Each test case asserts the redacted output contains the flag NAME but never the secret value"
      - "make test, make fmt-check, and make lint stay green"

  - id: task-002
    title: "Add ValidateRemoteURL SSRF allowlist helper"
    description: |
      Create common/clicfg/urlcheck/urlcheck.go with func ValidateRemoteURL(raw string) error.
      Accept https:// to any host. Accept http:// only when host is loopback
      (localhost, 127.0.0.1, ::1). Reject IP-literal hosts that are private,
      link-local unicast, link-local multicast, or multicast. Reject the metadata
      IP 169.254.169.254 explicitly. Reject empty/malformed URLs. Hostnames
      pass through (DNS-rebinding is documented as out of scope).
    status: completed
    completed_at: 2026-05-08T14:35:00Z
    dependencies: []
    acceptance_criteria:
      - "urlcheck.go exists with no third-party dependency (stdlib net only)"
      - "urlcheck_test.go is table-driven covering: https://api.neo4j.io OK, http://localhost:8080 OK, http://[::1] OK, http://api.openai.com rejected, http://10.0.0.1 rejected, http://169.254.169.254 rejected, http://[fe80::1] rejected, empty/malformed rejected"
      - "Helper has no dependency on cobra, viper, or clicfg (so any package can import it)"
      - "make test passes"

  - id: task-003
    title: "Extract shared dotenv discovery helper"
    description: |
      Create common/clicfg/dotenv/dotenv.go (or similar) holding the single
      findDotenv implementation. The function takes an afero.Fs and start dir,
      walks up stopping at the first .git ancestor or $HOME boundary
      (resolved via os.UserHomeDir()), and returns (path, found, walkedAboveCWD).
      The two existing duplicates in neo4j-cli/query/connect.go and
      neo4j-cli/query/embed/embed.go will be deleted in a later task that wires
      this helper in.
    status: completed
    completed_at: 2026-05-08T14:48:00Z
    dependencies: []
    acceptance_criteria:
      - "Shared helper package exists with one exported finder function"
      - "dotenv_test.go uses afero.MemMapFs and t.Setenv(\"HOME\", …) per AGENTS.md hermetic-test rules"
      - "Tests cover: stop at .git ancestor, stop at $HOME, no walk above $HOME, returns walkedAboveCWD true when ancestor .env, false when CWD .env"
      - "make test passes; no afero.NewOsFs in tests"

