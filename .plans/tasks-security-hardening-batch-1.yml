  - id: task-006
    title: "Atomic credentials.json write plus mode tightening"
    description: |
      In common/clicfg/fileutils/fileutils.go change WriteFile to perform an
      atomic temp-write+rename: open path+\".tmp\" with O_CREATE|O_WRONLY|O_TRUNC
      mode 0o600, write, Sync, Close, then Rename over path; remove the temp
      file on rename failure. Replace createFile's Create→Chmod chain with a
      single OpenFile so the umask race window is gone. Tighten the MkdirAll
      mode at fileutils.go:62 and clicfg.go:72 from 0o755 to 0o700.
    status: completed
    completed_at: 2026-05-08T15:35:00Z
    dependencies: []
    acceptance_criteria:
      - "WriteFile is atomic (temp+sync+rename); fileutils_test.go injects a Rename failure and asserts the original file is intact and tmp is cleaned up"
      - "createFile uses a single OpenFile with mode 0o600; no Create→Chmod chain"
      - "Both MkdirAll sites use 0o700; an integration test confirms the directory mode after first invocation"
      - "Manual: kill -9 mid-write of credentials.json leaves a valid JSON readable by the next invocation"
      - "make test, make lint, make fmt-check green on macOS, Linux, and Windows CI"

