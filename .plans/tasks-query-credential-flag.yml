updated_at: 2026-05-06T00:00:00Z

tasks:
  - id: task-001
    title: "Add --credential flag to query command and resolveConn integration"
    description: |
      Add --credential as a persistent string flag (empty default, no shorthand) to the
      query parent command in neo4j-cli/query/query.go. Update resolveConn() in
      neo4j-cli/query/connect.go to handle the new flag: when set, verify none of
      --username/--password/--uri/--database are also Changed (error if any are), look
      up the named credential via cfg.Credentials.Database.Get(), error with a helpful
      message including a hint to run 'neo4j-cli credential database list' if not found,
      then populate conn from the credential. --insecure overrides the credential's
      stored insecure value when Changed. When --credential is not set, existing logic
      is completely unchanged.
    status: completed
    dependencies: []
    acceptance_criteria:
      - "--credential is registered as a persistent flag on the query command with an empty default"
      - "Passing --credential mydb with no other connection flags resolves the connection from the stored credential"
      - "Passing --credential mydb alongside --username errors with a conflict message before any HTTP call"
      - "Passing --credential unknown errors with a message containing 'unknown' and a hint to run 'credential database list'"
      - "Passing --credential mydb --insecure overrides the credential's stored insecure value"
      - "Omitting --credential leaves existing resolveConn behaviour identical"
      - "make test, make fmt-check, and make lint pass"
    completed_at: 2026-05-06T12:00:00Z

  - id: task-002
    title: "Regenerate skill bundle, add changelog, verify all quality gates"
    description: |
      Run go generate ./neo4j-cli/internal/skill/... to regenerate the skill bundle
      after the query command's flag list changed. Create a changelog entry for neo4j-cli
      using changie new. Verify make test, make fmt-check, make lint, make license-check,
      and make generate-check all pass.
    status: completed
    dependencies:
      - task-001
    acceptance_criteria:
      - "Skill bundle regenerated and make generate-check exits 0"
      - "Changelog entry present for neo4j-cli describing the --credential flag"
      - "make test passes with no failures"
      - "make fmt-check and make lint both exit 0"
      - "make license-check passes"
    completed_at: 2026-05-06T13:00:00Z
