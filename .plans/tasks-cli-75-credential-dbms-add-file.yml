tasks:
  - id: task-001
    title: "Lift MarkFlagRequired off four flags; move required-validation into RunE"
    description: |
      Refactor `neo4j-cli/internal/subcommands/credential/dbms/add.go` to remove `cmd.MarkFlagRequired(...)` for `--name`, `--username`, `--password`, `--uri`. Move required-ness validation into `RunE`, emitting a `clierr.NewUsageError` with the shape `--<flag> is required (provide via --file as <KEY>, or pass --<flag>)`. Keep Usage strings (`(required) Name`, etc.) unchanged.
      Update the four existing test cases in `add_test.go` (`missing --name`, `missing --username`, `missing --password`, `missing --uri produces usage error`) to assert the new RunE-emitted message instead of cobra's auto-generated `required flag(s) "X" not set`. No `--file` flag yet — this task is purely the required-validation refactor.
      Implements PRD REQ-F-004, REQ-F-007.
    status: pending
    dependencies: []
    acceptance_criteria:
      - "`MarkFlagRequired` calls removed for name, username, password, uri in add.go"
      - "Running `dbms add` with any of those four flags missing returns a clierr.UsageError naming the missing field"
      - "Four existing missing-flag test cases updated to match new message and pass"
      - "All other existing dbms add tests still pass unchanged"
      - "`make test`, `make fmt-check`, `make lint` all green"
    completed_at: null

  - id: task-002
    title: "Add --file flag with Aura-env parsing, merge, and empty-value handling"
    description: |
      Add a `--file <path>` flag to `credential dbms add` (long form only — no shorthand; avoid colliding with `-f`/`--format` registered on the parent). When set, open via `cfg.Aura.Fs()` and parse with `gotenv.Parse` (reuse the pattern at `neo4j-cli/query/connect.go:315`). Map `NEO4J_URI` → uri, `NEO4J_USERNAME` → username, `NEO4J_PASSWORD` → password, `NEO4J_DATABASE` → database-name, `AURA_INSTANCENAME` → name (fallback). Ignore `AURA_INSTANCEID` and any unrecognised keys.
      Track per-key file-presence separately from the value map (gotenv collapses `KEY=` and missing-key both to `""`) so empty-value handling can distinguish them. Merge order: file → flag override (when `cmd.Flag(K).Changed`) → default `"neo4j"` for database-name only when neither file nor flag supplied it. Empty value in file with no flag override → `clierr.NewUsageError("--file %q: %s has an empty value", path, K)`. Open errors wrap to `--file %q: <underlying>`.
      Extend the test helper with a `files map[string]string` field seeded into `h.fs` after `testfs.GetTestFs(...)`. Add table-driven cases per PRD acceptance criteria (happy path, --name override, --password override, comments/blank-lines from the exact issue snippet, empty file, NEO4J_URI= empty + no flag, NEO4J_URI= empty + --uri override succeeds, NEO4J_DATABASE= empty + no --database-name override, missing path, --embed-credential happy + missing).
      Implements PRD REQ-F-001, REQ-F-002, REQ-F-003, REQ-F-005, REQ-F-006, REQ-F-008, REQ-F-009, REQ-F-010, REQ-F-011, REQ-NF-001, REQ-NF-002, REQ-NF-003, REQ-NF-006.
    status: pending
    dependencies:
      - task-001
    acceptance_criteria:
      - "`--file` flag accepted; long form only; help text shows the flag"
      - "`dbms add --file <aura.txt>` with no other flags stores a credential using AURA_INSTANCENAME as the name and populates all four fields from the file"
      - "Flag values override file values for each of name/username/password/uri/database-name/embed-credential when the flag is .Changed"
      - "Empty value in file for a recognised key with no flag override returns the empty-value usage error and persists nothing"
      - "Empty NEO4J_DATABASE= with no --database-name flag is an error (default \"neo4j\" not silently applied)"
      - "Missing/unreadable --file path returns a wrapped open error citing the path; nothing persisted"
      - "Comments (`#`) and blank lines parsed without error; AURA_INSTANCEID ignored silently"
      - "Test helper gains a `files` map seeded into the in-memory FS; new table cases all pass cross-platform"
      - "`make test`, `make fmt-check`, `make lint` all green"
    completed_at: null

