  - id: task-007
    title: "Make --name optional on graphql create with auto-name resolution"
    description: |
      In `create.go`, remove `cmd.MarkFlagRequired(nameFlag)`. Add a
      `resolveGraphQLName(cfg *clicfg.Config, name, instanceID string) (string, error)`
      function that returns `name` unchanged when non-empty; otherwise fetches
      `GET /instances/{instanceID}/data-apis/graphql`, collects the `name` field from
      each entry in the response array, and returns `defaultGraphQLName(existingNames)`.
      Call it at the top of `RunE` before the request body is built. Update the
      `--name` flag description to reflect it is now optional. Update `Example` strings
      to include at least one invocation without `--name`.
    status: pending
    dependencies:
      - task-006
    acceptance_criteria:
      - "MarkFlagRequired is removed for the name flag in create.go"
      - "resolveGraphQLName is called in RunE before building the request body"
      - "When --name is omitted, a GET to the list endpoint is made and the generated name is used in the POST body"
      - "When --name is provided, no extra GET is made"
      - "Example strings include at least one invocation without --name"
    completed_at: null

