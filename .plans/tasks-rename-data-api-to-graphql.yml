      `aura data-api graphql`. Also update any Short/Long descriptions that still say
      "Data APIs" to say "GraphQL data APIs". Every runnable leaf must retain at least two
      example invocations as required by TestAllLeafCommands_HaveExamples.
    status: completed
    dependencies:
      - task-002
    acceptance_criteria:
      - "No Example field in the graphql subtree contains the string 'data-api'"
      - "graphql.go Short describes managing GraphQL data APIs"
      - "All leaf commands retain valid Example fields with >= 2 invocations using the neo4j-cli prefix"
      - "`make test` passes TestAllLeafCommands_HaveExamples with no failures"
    completed_at: "2026-06-04T12:00:00Z"

