tasks:
  - id: task-001
    title: "Move subcommands/dataapi/graphql/ to subcommands/graphql/ and fix imports"
    description: |
      Create the new `neo4j-cli/aura/internal/subcommands/graphql/` directory tree and move
      all 34 files from `subcommands/dataapi/graphql/` into it, preserving the
      `authprovider/` and `corspolicy/allowedorigin/` subdirectory structure.
      Update every import path inside the moved files that referenced
      `dataapi/graphql/authprovider` or `dataapi/graphql/corspolicy` to use the new
      `graphql/authprovider` / `graphql/corspolicy` paths. Package-level `package` declarations
      are unchanged (they stay `graphql`, `authprovider`, `corspolicy`, `allowedorigin`).
      Do not yet touch `aura.go`, `data_api.go`, or the flags in `graphql.go`.
    status: pending
    dependencies: []
    acceptance_criteria:
      - "All files previously under subcommands/dataapi/graphql/ now exist under subcommands/graphql/ with identical names"
      - "subcommands/dataapi/graphql/ directory is gone (only data_api.go remains under subcommands/dataapi/)"
      - "Import paths inside the moved files reference the new graphql/ location (e.g. .../subcommands/graphql/authprovider)"
      - "Package declarations in all moved files are unchanged"
    completed_at: null

  - id: task-002
    title: "Merge data_api.go flags into graphql.go, remove dataapi/, update aura.go"
    description: |
      Edit the new `subcommands/graphql/graphql.go` so its `NewCmd` function adds the
      `--auth-url` and `--base-url` persistent flags and calls
      `flags.RegisterAuraCredentialFlag(cmd, cfg)`, and includes the `PersistentPreRunE`
      hook that binds both URL flags (exactly as in `data_api.go`). Then delete
      `neo4j-cli/aura/internal/subcommands/dataapi/data_api.go` and the now-empty
      `dataapi/` directory. Finally, update `neo4j-cli/aura/aura.go` to remove the
      `dataapi` import, add a `graphql` import pointing to the new path, and replace
      `cmd.AddCommand(dataapi.NewCmd(cfg))` with `cmd.AddCommand(graphql.NewCmd(cfg))`.
      After this task the project must compile cleanly.
    status: pending
    dependencies:
      - task-001
    acceptance_criteria:
      - "graphql.NewCmd registers --auth-url, --base-url persistent flags and RegisterAuraCredentialFlag"
      - "graphql.NewCmd has a PersistentPreRunE that calls cfg.Aura.BindBaseUrl and cfg.Aura.BindAuthUrl"
      - "neo4j-cli/aura/internal/subcommands/dataapi/ directory no longer exists"
      - "aura.go mounts graphql.NewCmd(cfg) and has no reference to the dataapi package"
      - "`go build ./...` succeeds with no errors"
    completed_at: null

  - id: task-003
    title: "Update Short/Long/Example strings across all affected commands"
    description: |
      Update every `Short`, `Long`, and `Example` field in the moved graphql command tree.
      In `graphql.go` update Short to describe managing GraphQL data APIs. In every leaf
      command (`create.go`, `get.go`, `list.go`, `update.go`, `delete.go`, `pause.go`,
      `resume.go`) and in `authprovider/` and `corspolicy/allowedorigin/` commands, change
