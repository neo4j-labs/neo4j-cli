    title: 'Add table-driven tests for the upgrade leaf'
    description: |
      Create upgrade_test.go following the create_test.go/start_test.go pattern
      using an httptest.Server, SetNewDesktopClientFnForTest, and the poll-sleep
      seam. Cover the happy path, version auto-pick, running-target refuse/force,
      plugin-mode mapping/validation, flag-to-body mapping, and JSON output.
    status: pending
    dependencies:
      - task-002
      - task-003
    acceptance_criteria:
      - "Stopped DBMS + explicit --version asserts the POST body (version, options.pluginUpgradeMode=UPGRADABLE, migrate, backup) and the rendered row"
      - "--version omitted mocks GET /dbmss/versions and asserts auto-pick + breadcrumb + body version"
      - "Running target without --force asserts a refusal error and that no upgrade POST is issued; with --force asserts Stop -> GET(stopped) -> upgrade sequence"
      - "--plugin-upgrade-mode none/all uppercased in body; invalid value yields a usage error; --no-migrate and --backup=false reflected in body; --format json emits full DbmsInfo"
      - "Tests use the in-memory test FS (no real-FS/credentials access) and pass with go test ./neo4j-cli/internal/subcommands/desktop/dbms/..."
    completed_at: null

