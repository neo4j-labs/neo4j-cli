tasks:
  - id: task-001
    title: 'Add UpgradeDbms client method + options type + 30m timeout'
    description: |
      Extend the Desktop relate client to call POST /dbmss/:id/upgrade. Add a
      UpgradeDbmsOptions type to desktopclient/types.go and an UpgradeDbms method
      to desktopclient/client.go that builds the request body and decodes the
      returned DbmsInfo. Introduce a dedicated dbmsUpgradeTimeout constant.
    status: completed
    dependencies: []
    acceptance_criteria:
      - "desktopclient/types.go defines UpgradeDbmsOptions{ Backup *bool; Migrate *bool; PluginUpgradeMode string } with a doc comment"
      - "client.go defines dbmsUpgradeTimeout = 30 * time.Minute alongside the existing timeout constants"
      - "UpgradeDbms(ctx, id, version string, opts UpgradeDbmsOptions) (*DbmsInfo, error) POSTs to /dbmss/<url.PathEscape(id)>/upgrade via doWithTimeout with dbmsUpgradeTimeout"
      - "Request body is {version, options?} where options only includes keys that are set (Backup/Migrate non-nil, PluginUpgradeMode non-empty); options omitted entirely when empty"
      - "Reply is unmarshalled into *DbmsInfo; package builds with go build ./..."
    completed_at: 2026-06-01T12:29:52Z

  - id: task-002
    title: 'Add desktop dbms upgrade leaf command (upgrade.go)'
    description: |
      Create neo4j-cli/internal/subcommands/desktop/dbms/upgrade.go mirroring
      create.go/start.go. Implement newUpgradeCmd(cfg) with the version
      auto-pick, plugin-upgrade-mode validation/mapping, running-target
      refuse/--force handling, the upgrade call, result rendering, and the
      stopped-DBMS start hint. Reuse existing dbms-package helpers.
    status: pending
    dependencies:
      - task-001
    acceptance_criteria:
      - "Use: 'upgrade <id>', Args: cobra.ExactArgs(1), Annotations write:true, copyright header present"
      - "Flags: --version (optional, auto-pick latest stable enterprise via pickLatestStableEnterprise + ListDbmsVersions when empty, with stderr breadcrumb), --plugin-upgrade-mode (default 'upgradable'; accepts all|none|upgradable case-insensitively, maps to uppercase, usage error listing valid values otherwise), --no-migrate (bool), --backup (bool default true), --force (bool)"
      - "Fetches target via GetDbms; if status==started and !force returns a fatal error hinting to stop or pass --force; if status==started and force then StopDbms + pollUntilStatus(stopped) before upgrading"
      - "Calls client.UpgradeDbms with Migrate=&(!noMigrate), Backup=&backup, PluginUpgradeMode=<uppercased>; renders upgraded DbmsInfo via output.PrintBodyMap with {id,name,version,status,connectionUri} and prints a stderr 'DBMS is stopped; start with neo4j-cli desktop dbms start <id> --rw' hint"
      - "Flush-left Example: block with >=2 invocations, each with --rw and at least one with --format json"
    completed_at: null

