    acceptance_criteria:
      - "dbms.go calls cmd.AddCommand(newUpgradeCmd(cfg))"
      - "Parent Short/Long list 'upgrade' among the dbms lifecycle commands and note upgrade requires --rw"
      - "neo4j-cli desktop dbms upgrade --help renders the command with all flags"
    completed_at: null

