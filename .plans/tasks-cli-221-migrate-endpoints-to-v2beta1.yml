tasks:
  - id: task-001
    title: 'Add centralized v2beta1 response-field normalization helper'
    description: |
      Provide a single, centralized normalization step for v2beta1 instance and
      session responses that (a) normalises `legacy_status` -> `status` and (b)
      ensures the `tenant_id` -> `project_id` rename is applied, reusing the
      existing `utils.RenameResponseField`. This is the shared output-contract
      layer the migrated commands will call so field mapping is not duplicated
      per command.
    status: completed
    dependencies: []
    acceptance_criteria:
      - "A reusable helper normalises `legacy_status` to `status` on v2beta1 response bodies (single and list)."
      - "The helper renames/guarantees `project_id` (from v2beta1 native `project_id` or legacy `tenant_id`)."
      - "Helper lives in a shared location (e.g. utils) and is unit-tested with table-driven tests using testfs, not afero.NewOsFs()."
      - "No behavioural change yet for callers not wired to it."
    completed_at: 2026-07-10T11:45:00Z

  - id: task-002
    title: 'Fix parseResourceFromRequest for nested v2beta1 paths (REQ-F-013a)'
    description: |
      Update `parseResourceFromRequest` in `neo4j-cli/aura/internal/api/response.go`
      so it resolves the trailing plural/id pair rather than assuming the flat
      `/<version>/<plural>/<id>` shape. For a nested path like
      `/v2beta1/organizations/{org}/projects/{proj}/instances/{id}` it must return
      resourceType=`instance` and resourceID=`{id}`, so 404 envelopes and
      `suggestionForResource` hints are correct. Flat v1 paths must keep working.
    status: completed
    dependencies: []
    acceptance_criteria:
      - "Nested v2beta1 instance/session paths yield the correct trailing resource type and id."
      - "Flat v1 paths (e.g. /v1/instances/{id}) still resolve correctly."
      - "Sub-resource paths ending in an action (e.g. .../pause) do not mis-report the action as an id."
      - "Table-driven tests cover v1 flat, v2beta1 nested, and action-suffixed paths."
    completed_at: 2026-07-10T12:15:00Z

  - id: task-003
