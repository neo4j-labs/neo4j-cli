updated_at: 2026-07-10T11:00:37Z

tasks:
  - id: task-001
    title: 'Add centralized v2beta1 response-field normalization helper'
    description: |
      Provide a single, centralized normalization step for v2beta1 instance and
      session responses that (a) normalises `legacy_status` -> `status` and (b)
      ensures the `tenant_id` -> `project_id` rename is applied, reusing the
      existing `utils.RenameResponseField`. This is the shared output-contract
      layer the migrated commands will call so field mapping is not duplicated
      per command.
    status: completed
    dependencies: []
    acceptance_criteria:
      - "A reusable helper normalises `legacy_status` to `status` on v2beta1 response bodies (single and list)."
      - "The helper renames/guarantees `project_id` (from v2beta1 native `project_id` or legacy `tenant_id`)."
      - "Helper lives in a shared location (e.g. utils) and is unit-tested with table-driven tests using testfs, not afero.NewOsFs()."
      - "No behavioural change yet for callers not wired to it."
    completed_at: 2026-07-10T11:45:00Z

  - id: task-002
    title: 'Fix parseResourceFromRequest for nested v2beta1 paths (REQ-F-013a)'
    description: |
      Update `parseResourceFromRequest` in `neo4j-cli/aura/internal/api/response.go`
      so it resolves the trailing plural/id pair rather than assuming the flat
      `/<version>/<plural>/<id>` shape. For a nested path like
      `/v2beta1/organizations/{org}/projects/{proj}/instances/{id}` it must return
      resourceType=`instance` and resourceID=`{id}`, so 404 envelopes and
      `suggestionForResource` hints are correct. Flat v1 paths must keep working.
    status: completed
    dependencies: []
    acceptance_criteria:
      - "Nested v2beta1 instance/session paths yield the correct trailing resource type and id."
      - "Flat v1 paths (e.g. /v1/instances/{id}) still resolve correctly."
      - "Sub-resource paths ending in an action (e.g. .../pause) do not mis-report the action as an id."
      - "Table-driven tests cover v1 flat, v2beta1 nested, and action-suffixed paths."
    completed_at: 2026-07-10T12:15:00Z

  - id: task-003
    title: 'Migrate instance list to v2beta1 org/project-scoped endpoint'
    description: |
      Change `aura instance list` to call
      `GET /organizations/{orgID}/projects/{projectID}/instances` with
      `Version: api.AuraApiVersion2`, resolving org/project via
      `utils.ResolveAndValidateOrgProject`. Apply the task-001 normalization so
      output preserves `status` and exposes `project_id`. Pagination behaviour is
      unchanged (render the single response; do not follow page tokens).
    status: completed
    dependencies:
      - task-001
    acceptance_criteria:
      - "instance list issues a request to the v2beta1 org/project-scoped instances path."
      - "org/project resolved through ResolveAndValidateOrgProject; no new flags/config added."
      - "Output preserves `status` and renames `tenant_id`->`project_id`; other columns remain populated."
      - "Existing list tests updated for the new path and field names and pass."
    completed_at: 2026-07-10T13:05:00Z

  - id: task-004
    title: 'Migrate instance create (incl. auto-naming, credential display) to v2beta1'
    description: |
      Change `aura instance create` in `create_core.go` to POST
      `/organizations/{orgID}/projects/{projectID}/instances` on v2beta1,
      including the auto-naming pre-list lookup. Confirm the v2beta1
      `CreateInstanceResponse` (`connection_url`/`username`/`password`/`project_id`)
      is unwrapped from the `{data:...}` envelope and that `RegisterSecretValue`
      and DBMS credential storage read the correct field names (V-1). Preserve the
      existing tenant_id->project_id rename in `renderInstanceResult`.
    status: completed
    dependencies:
      - task-001
      - task-003
    acceptance_criteria:
      - "instance create POSTs to the v2beta1 scoped instances path and reads the `{data:...}` create response."
      - "Auto-naming pre-list lookup uses the v2beta1 scoped list path."
      - "Printed credentials (username/password/connection_url) populate correctly; password is registered via RegisterSecretValue before printing."
      - "DBMS credential storage still succeeds using the v2beta1 field names."
      - "Create tests updated and pass; no secret leaks in redaction/tee tests."
    completed_at: 2026-07-10T14:05:00Z

  - id: task-005
    title: 'Migrate instance get + delete; remove tenant_id ownership preflight'
    description: |
      Migrate `aura instance get` and `aura instance delete` to the v2beta1 scoped
      `.../instances/{instanceID}` paths, and update
      `utils.FetchAndVerifyInstanceInProject` so the ownership check collapses into
      the scoped path (removing the `tenant_id` comparison and its preflight
      GET where redundant). Not-found for an instance outside the project must
      surface via the v2beta1 path's native 404 with the existing message/exit
      code.
    status: completed
    dependencies:
      - task-001
      - task-002
    acceptance_criteria:
      - "instance get and delete issue requests to the v2beta1 scoped instance path."
      - "The tenant_id-based ownership preflight for instances is removed; scoping is native to the path."
      - "A not-found instance yields the existing error message, resource type, suggestion, and exit code."
      - "get output preserves `status` and exposes `project_id`; tests updated and pass."
    completed_at: 2026-07-10T15:05:00Z

  - id: task-006
    title: 'Migrate graph-analytics session create/list/get/delete to v2beta1'
    description: |
      Migrate all `aura graph-analytics session` operations to the v2beta1
      org/project-scoped paths
      (`/organizations/{orgID}/projects/{projectID}/graph-analytics/sessions[/{id}]`),
      resolving org/project via `ResolveAndValidateOrgProject`. Update
      `utils.FetchAndVerifySessionInProject` to drop the redundant `tenant_id`
      ownership preflight. Apply task-001 normalization to session output.
    status: completed
    dependencies:
      - task-001
      - task-002
    acceptance_criteria:
      - "session create/list/get/delete issue requests to the v2beta1 scoped session paths."
      - "org/project resolved via ResolveAndValidateOrgProject; no new flags/config."
      - "The tenant_id-based session ownership preflight is removed."
      - "session output preserves `status` and exposes `project_id`; tests updated and pass."
    completed_at: 2026-07-10T16:05:00Z

  - id: task-007
    title: 'Migrate project get to derive from v2beta1 project list (REQ-F-008a)'
    description: |
      Change `aura project get` to stop calling v1 `/tenants/{id}` and instead
      derive the single project from `GET /organizations/{orgID}/projects`
      (v2beta1) by reusing `api.ListProjects` and filtering for the requested
      projectID. Return the existing not-found error (message/resource/exit code)
      when the project is absent.
    status: completed
    dependencies:
      - task-001
    acceptance_criteria:
      - "project get makes no v1 /tenants/{id} call and reuses api.ListProjects."
      - "A present project is returned with the same output fields as before."
      - "An absent project yields the existing not-found message, suggestion, and exit code."
      - "project get tests updated for the derived-from-list behaviour and pass."
    completed_at: 2026-07-10T17:05:00Z

