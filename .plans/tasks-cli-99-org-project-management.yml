tasks:
  - id: task-001
    title: "Update config layer: validAuraConfigKeys and DefaultTenant() resolution"
    description: |
      In common/clicfg, add `default-context` to validAuraConfigKeys (both get and set) and
      remove `default-tenant`. Update cfg.Aura.DefaultTenant() to resolve in this order:
      (1) project portion of aura.default-context (split on '/', take right side);
      (2) default-tenant config key as legacy fallback. Add tests covering both resolution
      paths and the case where neither is set.
    status: completed
    dependencies: []
    acceptance_criteria:
      - "aura config set/get/list accepts default-context and rejects default-tenant"
      - "DefaultTenant() returns the project portion of aura.default-context when set"
      - "DefaultTenant() falls back to default-tenant when aura.default-context is unset"
      - "DefaultTenant() returns empty string when neither is set"
      - "Unit tests pass for all DefaultTenant() resolution cases"
    completed_at: 2026-05-15T12:30:00Z

  - id: task-002
    title: "Add v2beta1 API client methods for organizations and projects"
    description: |
      In neo4j-cli/aura/internal/api, add functions for the four v2beta1 endpoints needed:
      GET /organizations, GET /organizations/{organizationId},
      GET /organizations/{organizationId}/projects, and
      GET /organizations/{organizationId}/projects/{projectId}. Each function must use
      AuraApiVersion2 and define the corresponding response struct types. Add unit tests
      using the existing httptest mock helpers.
    status: completed
    dependencies: []
    acceptance_criteria:
      - "ListOrganizations() calls GET /organizations with AuraApiVersion2"
      - "GetOrganization(orgID) calls GET /organizations/{orgID} with AuraApiVersion2"
      - "ListProjects(orgID) calls GET /organizations/{orgID}/projects with AuraApiVersion2"
      - "GetProject(orgID, projectID) calls GET /organizations/{orgID}/projects/{projectID} with AuraApiVersion2"
      - "Response structs defined for all four endpoints"
      - "Unit tests cover success and error (404, 5xx) cases for each method"
    completed_at: 2026-05-15T13:00:00Z

  - id: task-003
    title: "Remove config project subsystem"
    description: |
      Delete the neo4j-cli/aura/internal/subcommands/config/project/ subcommand directory
      and all its files (project.go, add.go, use.go, list.go, remove.go and their _test.go
      files). Remove the aura-projects config storage key and the AuraProject struct from
      common/clicfg/projects/. Clean up all references in clicfg.go and anywhere else that
      imports or uses these types. Verify make test still passes after deletion.
    status: completed
    dependencies: []
    acceptance_criteria:
      - "neo4j-cli/aura/internal/subcommands/config/project/ directory no longer exists"
      - "AuraProject struct and aura-projects key removed from common/clicfg/"
      - "aura config project add/use/list/remove commands no longer registered"
      - "No compilation errors or dangling references after removal"
      - "make test passes"
    completed_at: 2026-05-15T14:00:00Z

  - id: task-004
    title: "Implement validateAndSetDefaultContext shared helper"
    description: |
      Create a shared helper function (e.g. validateAndSetDefaultContext) in an appropriate
      package (e.g. neo4j-cli/aura/internal/subcommands/context/ or a shared util package).
      It must parse a {organizationId}/{projectId} slug, call GetProject() on v2beta1 to
      verify the pair exists, and on success write aura.default-context to config. Fail with
      clear errors on missing slash, invalid format, 404, or other API errors. Add
      table-driven unit tests for all error paths and the success path.
    status: completed
    dependencies:
      - task-001
      - task-002
    acceptance_criteria:
      - "Fails with clear error when slug has no '/'"
      - "Fails with clear error when org or project portion is empty"
      - "Calls GET /organizations/{orgID}/projects/{projectID} to validate the pair"
      - "Persists aura.default-context only on successful API validation"
      - "Returns API error (including 404) without persisting if validation fails"
      - "Table-driven tests cover all error paths and success path"
    completed_at: 2026-05-15T15:00:00Z

