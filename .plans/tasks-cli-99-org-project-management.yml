      list calls ListProjects(orgID); get <id> calls GetProject(orgID, projectID). Both
      support --format json|table|toon. Register the project subcommand in aura.go.
    status: completed
    dependencies:
      - task-001
      - task-002
    acceptance_criteria:
      - "aura project list resolves org from --organization-id then aura.default-context"
      - "aura project list fails with a clear error when no org source is available"
      - "aura project list does not filter by the project portion of aura.default-context"
      - "aura project get <id> uses the same org resolution as project list"
      - "Both commands support --format json, table, and toon"
      - "Example fields present, flush-left, ≥3 invocations on each leaf"
      - "Table-driven tests cover org resolution paths and API error cases"
    completed_at: 2026-05-15T00:00:00Z

  - id: task-007
