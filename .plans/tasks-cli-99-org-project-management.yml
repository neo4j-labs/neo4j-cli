      output via RegisterOutputFlag (json/table/toon). Include a flush-left Example field
      with ≥3 invocations. Register the organization subcommand in aura.go. Add colocated
      list_test.go with table-driven tests using the mock HTTP server.
    status: completed
    dependencies:
      - task-002
    acceptance_criteria:
      - "aura organization list calls GET /organizations on v2beta1"
      - "Supports --format json, table, and toon"
      - "Does not read or use aura.default-context"
      - "Example field present, flush-left, ≥3 invocations including one --format json"
      - "Registered in aura.go and visible in aura --help"
      - "Table-driven tests cover success and API error cases"
    completed_at: 2026-05-15T16:00:00Z

  - id: task-006
    title: "Add aura project list and project get commands"
    description: |
      Create neo4j-cli/aura/internal/subcommands/project/ with project.go (parent), list.go,
      get.go, and their _test.go files. Both leaves resolve the organization ID using the
