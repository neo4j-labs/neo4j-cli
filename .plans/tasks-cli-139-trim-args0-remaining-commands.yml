tasks:
  - id: task-001
    title: "Group A — trim args[0] in 16 URL-path / API call commands + tests"
    description: |
      Apply `strings.TrimSpace(args[0])` inside RunE to every file in Group A
      (URL-path commands). Assign once to a local var (e.g. `instanceId`,
      `snapshotId`, `graphqlId`, `sessionId`) and reuse for every reference
      to args[0] in that RunE — do not sprinkle TrimSpace at multiple
      callsites. Add `"strings"` to the import block of each file. Add a
      `TestXxxWithTrailingNewline` test next to each leaf in
      `<file>_test.go`, mirroring PR #128's shape (`instance/get_test.go`
      at commit 7e7f0fa): build a mock handler at the URL with the CLEAN
      ID, invoke via `helper.ExecuteCommand(fmt.Sprintf("<cmd> %s\"\n\"",
      id))`, assert the mock was called exactly once with the trimmed
      path. Commit as a single commit on branch
      `oskar/cli-139-trim-args0-remaining`.
    status: completed
    completed_at: 2026-05-18T12:30:00Z
    dependencies: []
    acceptance_criteria:
      - "Files modified: `neo4j-cli/aura/internal/subcommands/instance/{delete,pause,resume,update}.go`, `neo4j-cli/aura/internal/subcommands/instance/snapshot/get.go`, `neo4j-cli/aura/internal/subcommands/customermanagedkey/{get,delete}.go`, `neo4j-cli/aura/internal/subcommands/dataapi/graphql/{get,delete,pause,resume,update}.go`, `neo4j-cli/aura/internal/subcommands/dataapi/graphql/authprovider/{get,delete}.go`, `neo4j-cli/aura/internal/subcommands/graphanalytics/session/{get,delete}.go` — 16 files total"
      - "Each modified file imports `strings` and assigns `strings.TrimSpace(args[0])` to a named local variable before any subsequent use; multi-use sites (customermanagedkey/delete.go, dataapi/graphql/pause.go, resume.go, update.go) reuse the variable, not re-trim"
      - "Each fixed file has a matching `TestXxxWithTrailingNewline` test in its `_test.go` neighbour, asserting the mock handler was hit exactly once at the URL containing the clean ID (no `%0A`)"
      - "Single commit on `oskar/cli-139-trim-args0-remaining` titled with a conventional-commit `fix:` prefix; commit body references CLI-139"
      - "`make test && make fmt-check && make lint && make license-check && make generate-check` all pass; skill bundle diff is empty"

