  - id: task-003
    title: "Group C — trim args[0] inside Args func for config get + config set"
    description: |
      For `config/get.go`: replace `Args: cobra.MatchAll(cobra.ExactArgs(1),
      cobra.OnlyValidArgs)` with a custom function that runs
      `cobra.ExactArgs(1)`, then `args[0] = strings.TrimSpace(args[0])`,
      then `cobra.OnlyValidArgs(cmd, args)`. RunE is otherwise unchanged
      (it reads the already-trimmed `args[0]`). For `config/set.go`: add
      `args[0] = strings.TrimSpace(args[0])` at the top of the existing
      Args func, immediately after the `ExactArgs(2)` check; existing
      manual validation against `cfg.Aura.IsValidConfigKey` then sees the
      trimmed key. CRITICAL: do NOT trim `args[1]` (the value) in
      config/set.go — out of scope per REQ-F-004. Add `"strings"` to
      imports. Add two test cases per file: (1) the trailing-newline path
      succeeds with the trimmed key, (2) regression guard — passing
      `default-tenant\n` does NOT surface an "invalid argument" error.
      Commit as a single commit on the same branch.
    status: completed
    completed_at: 2026-05-18T13:30:00Z
    dependencies:
      - task-002
    acceptance_criteria:
      - "Files modified: `neo4j-cli/aura/internal/subcommands/config/get.go`, `neo4j-cli/aura/internal/subcommands/config/set.go` — 2 files total"
      - "`config/get.go` Args field is a custom `func(cmd, args) error` that calls ExactArgs(1), mutates args[0] in place via TrimSpace, then calls OnlyValidArgs — slice mutation is intentional (cobra passes by reference)"
      - "`config/set.go` Args func includes `args[0] = strings.TrimSpace(args[0])` directly after the ExactArgs(2) check; `args[1]` is untouched"
      - "Each file has two new test cases: one asserting the trimmed key works end-to-end, one asserting `<key>\\n` does NOT produce an 'invalid argument' error (regression guard for REQ-F-007)"
      - "Single commit on the same branch, conventional-commit `fix:` prefix, body explicitly notes the in-Args-func mutation and references CLI-139"
      - "`make test && make fmt-check && make lint && make license-check && make generate-check` all pass; skill bundle diff is empty"

