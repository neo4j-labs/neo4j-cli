  - id: task-010
    title: 'Ephemeral Aura JWT cache module (token_cache.go)'
    description: |
      Liam's PR #197 review (env.go:81) flags that in env credential-storage
      mode the Aura JWT lives only for the duration of one CLI process: the
      in-memory access token is cleared on every process start (env.go:74-82,
      the commit-a19d8989 security fix) and save() is a no-op, so every CLI
      invocation re-mints a token via POST /oauth/token. Neo4j Aura API v2 will
      rate-limit token minting aggressively, so a CI job issuing many neo4j-cli
      aura calls would exhaust the limit. The fix is an ephemeral, identity-bound
      JWT cache that reuses the token across invocations within a CI job while
      guaranteeing a change of identity always misses and re-mints (so the CLI
      can never act as a previous identity).

      Create neo4j-cli/aura/internal/api/token_cache.go providing env-mode-only,
      best-effort cache load/save. Cache file location:
      filepath.Join(os.TempDir(), "neo4j-cli-aura-token-"+identityHash+".json")
      where identityHash = hex(sha256(clientID + "\x00" + clientSecret +
      "\x00" + authURL))[:16]. Contents: JSON { "access-token", "token-expiry"
      (the tolerance-adjusted ms value UpdateAccessToken computes), "identity"
      (the FULL sha256 hex) }. Never write clientSecret or any raw secret to the
      file. Writes go through fileutils.WriteFileErr (atomic .tmp+rename, mode
      0600, error-returning) using cfg.Aura.Fs() so tests stay hermetic. Reads
      are best-effort via afero (Exists/ReadFile): any error — missing, corrupt
      JSON, identity mismatch, or expired — yields a cache miss, never a panic
      (do NOT use fileutils.ReadFileSafe, which panics on read error). Reuse
      AuraCredential.HasValidAccessToken() for the validity/expiry check.
    status: completed
    dependencies:
      - task-002
    acceptance_criteria:
      - 'token_cache.go computes the os.TempDir path from sha256(clientID\x00secret\x00authURL)[:16]'
      - 'Save writes 0600 atomic JSON via fileutils.WriteFileErr using cfg.Aura.Fs(); no raw secret in the file'
      - 'Load is best-effort: missing/corrupt/identity-mismatch/expired all return a cache miss with no panic'
      - 'Full identity hash is stored in the file and re-verified on load'
      - 'All cache behavior is gated to StorageModeEnv'
    completed_at: 2026-06-03T00:00:00Z

  - id: task-011
    title: 'Wire JWT cache into getToken (load before mint, write after)'
    description: |
      Wire the token_cache module into the single mint entry point, getToken in
      neo4j-cli/aura/internal/api/token.go. This is the right layer (over the
      credentials package) because getToken has cfg in scope: cfg.Aura.AuthUrl()
      for identity keying, cfg.Aura.Fs() for the fs handle, and
      cfg.Credentials.StorageMode() for the env gate — and the credentials
      package cannot import clicfg (import cycle). The security clearing in
      credentials.loadAuraFromEnv stays untouched as the safe default; cache-load
      is a pure optimization layered on top that re-verifies identity, so a bug
      in the cache can only ever cause an extra mint, never identity reuse
      (defense in depth). At the top of getToken, before the existing
      HasValidAccessToken() check: if storage mode is env and the in-memory token
      is invalid, attempt a cache load; on a valid identity-matching hit, set
      credential.AccessToken/TokenExpiry in memory and return it (skip mint).
      After a successful mint + UpdateAccessToken: if env mode, write the cache
      file. Caching is active ONLY in StorageModeEnv — insecure/keyring already
      persist the token via save() and must not write tokens to os.TempDir.
    status: pending
    dependencies:
      - task-010
    acceptance_criteria:
      - 'getToken loads from cache before the HasValidAccessToken check, env-mode only'
      - 'A valid identity-matching cache hit returns the cached token and skips the mint request'
      - 'After a mint, the token is written to the cache in env mode (best-effort, warn-on-error, never fails the command)'
      - 'No cache file is read or written in insecure/keyring modes'

