tasks:
  - id: task-001
    title: 'Add StorageModeEnv constant, getenv seam, and save() no-op'
    description: |
      In common/clicfg/credentials/credentials.go add the constant
      StorageModeEnv = "env" alongside the existing mode constants, add a
      package-level test seam `var getenv = os.Getenv`, and make
      Credentials.save() return nil without writing when storageMode is
      StorageModeEnv (keyring and insecure branches unchanged). Add a
      SetGetenvForTest helper in export_test.go mirroring the existing
      SetKeyringProviderForTest / SetNowUnixForTest pattern.
    status: completed
    dependencies: []
    acceptance_criteria:
      - 'StorageModeEnv constant defined and documented in credentials.go'
      - 'save() is a no-op (returns nil, no disk/keyring write) when storageMode == StorageModeEnv'
      - 'getenv package var added and SetGetenvForTest exposed via export_test.go'
      - 'Existing keyring/insecure save() behavior unchanged; package compiles and existing tests pass'
    completed_at: 2026-06-01T13:05:00Z

  - id: task-002
    title: 'Implement env-var credential synthesis (env.go)'
    description: |
      Create common/clicfg/credentials/env.go with loadFromEnv(warnW) plus
      one helper per type, all reading via the getenv seam and mutating
      in-memory structs directly (never via Add/SetDefault, to avoid onUpdate
      side effects). Aura: requires both NEO4J_AURA_CLIENT_ID and
      NEO4J_AURA_CLIENT_SECRET (synthesize default "env", warn if only one
      set). Dbms: synthesize on NEO4J_PASSWORD, populating URI/Username/
      DatabaseName from NEO4J_URI/USERNAME/DATABASE. Embed: synthesize only on
      NEO4J_EMBED_PROVIDER, populating Provider/Model/BaseURL/Dimensions/APIKey
      from NEO4J_EMBED_*. Each synthesized credential is named "env" and set as
      its type's default.
    status: completed
    dependencies:
      - task-001
    acceptance_criteria:
      - 'env.go defines loadFromEnv and per-type synthesis helpers reading via getenv'
      - 'Aura synthesizes only when both id+secret present; warns to warnW when exactly one is set'
      - 'Dbms synthesizes on NEO4J_PASSWORD; Embed synthesizes only on NEO4J_EMBED_PROVIDER'
      - 'Synthesized creds use reserved name "env", set as default, with no disk/keyring writes'
      - 'Overlays onto an existing in-memory "env" credential rather than duplicating it'
    completed_at: 2026-06-01T13:25:00Z

