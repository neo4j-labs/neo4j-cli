tasks:
  - id: task-001
    title: 'Add desktopclient debug seam (debug.go + export_test.go)'
    description: |
      Create neo4j-cli/internal/desktopclient/debug.go mirroring
      neo4j-cli/aura/internal/api/debug.go. Define the package-level writer seam
      (var debugW io.Writer = os.Stderr), the enabled flag (var debugEnabled
      bool) with exported SetDebug(bool), the prefixes ([desktop-debug] > / < /
      info), a scrub helper delegating to common/debug.Scrub, and the emit
      helpers debugRequest / debugResponse / debugInfo plus writeHeaders. Each
      emit helper early-returns when !debugEnabled so call sites stay
      unconditional. Add SetDebugWriterForTest and SetDebugForTest (both restore
      via t.Cleanup) in an export_test.go. Include the Neo4j copyright header.
    status: completed
    dependencies: []
    acceptance_criteria:
      - "debug.go defines debugW (os.Stderr default), debugEnabled, and exported SetDebug(bool)"
      - "Prefixes are exactly '[desktop-debug] > ', '[desktop-debug] < ', '[desktop-debug] '"
      - "scrub delegates to common/debug.Scrub (StripControl(RedactText)); helpers no-op when debugEnabled is false"
      - "export_test.go exposes SetDebugWriterForTest and SetDebugForTest, each restoring via t.Cleanup"
      - "File has the Neo4j copyright header; package compiles"
    completed_at: 2026-06-08T13:05:00Z

  - id: task-002
    title: 'Trace authenticated relate-API wire in client.go doRaw'
    description: |
      In neo4j-cli/internal/desktopclient/client.go, retain the marshalled
      request body bytes in doRaw (currently only wrapped in a reader) and emit
      debugRequest(method, url, req.Header, rawBody) before httpDoFn, recording
      a start time. On a successful round-trip emit debugResponse(status,
      resp.Header, respBody, elapsed) after the body read; on transport error
      emit a debugInfo line with the error and elapsed before mapping to the
      canonical unreachable/timeout errors. In NewClient, register the signed
      JWT via clievents.RegisterSecretValue(token) so the X-API-Token header is
      always redacted.
    status: completed
    dependencies:
      - task-001
    acceptance_criteria:
      - "doRaw emits request line + headers + body before httpDoFn and response line + headers + body + elapsed after"
      - "Transport-error path emits a [desktop-debug] line with elapsed before returning the canonical error"
      - "rawBody is captured without changing the request that is actually sent"
      - "NewClient calls clievents.RegisterSecretValue(token)"
      - "Stdout/return values of all Client methods are unchanged when debug is off"
    completed_at: 2026-06-08T14:05:00Z

  - id: task-003
    title: 'Trace discovery wire in discovery.go'
    description: |
      In neo4j-cli/internal/desktopclient/discovery.go emit [desktop-debug]
      lines for the discovery path: probeOne logs each port probe target and
      result; DiscoverViaMDNS/advertisedPort log the mDNS/dns-sd outcome and
      Discover logs which tier resolved; FetchAppInfo emits debugRequest/
      debugResponse around its httpDoFn call. All emission is gated by the
      shared debugEnabled flag (helpers already no-op when off).
    status: completed
    dependencies:
      - task-001
    acceptance_criteria:
      - "probeOne emits a [desktop-debug] line per probed port (target + status/miss)"
      - "mDNS/dns-sd discovery outcome and the resolved Discover tier are logged"
      - "FetchAppInfo emits request/response debug lines around its HTTP call"
      - "No discovery behavior (return values, error mapping) changes when debug is off"
    completed_at: 2026-06-08T15:05:00Z

  - id: task-004
    title: 'Add --debug persistent flag + PersistentPreRunE on desktop root'
    description: |
      In neo4j-cli/internal/subcommands/desktop/desktop.go register a persistent
      Bool --debug flag on the desktop parent (NewCmd) with wording mirroring
      aura/docker incl. the '[env: NEO4J_DEBUG (set to 1 to enable)]' suffix and
      noting discovery is traced. Set cmd.PersistentPreRunE to call
      desktopclient.SetDebug(debug.Resolve(cmd)). Rely on the neo4j-cli root's
      cobra.EnableTraverseRunHooks=true so it runs for every nested leaf; confirm
      no leaf/subtree shadows it with its own PersistentPreRunE.
    status: completed
    dependencies:
      - task-001
    acceptance_criteria:
      - "Persistent --debug Bool flag registered on the desktop parent command"
      - "PersistentPreRunE calls desktopclient.SetDebug(debug.Resolve(cmd))"
      - "Flag is inherited by all leaves across dbms, dbms/plugin, connection, list, doctor, install"
      - "Flag description mirrors aura/docker style with the NEO4J_DEBUG env suffix"
    completed_at: 2026-06-08T16:05:00Z

  - id: task-005
    title: 'Register write-command passwords as secret values'
    description: |
      Before the client call, register the password via
      clievents.RegisterSecretValue in the three write leaves so the raw request
      body is redacted in the trace (RedactText catches the connections
      "password" key but NOT the CreateDbms "credentials" key): dbms/create.go
      before client.CreateDbms, connection/create.go before
      client.CreateConnection, and connection/update.go before
      client.UpdateConnection (only when a password is set).
    status: completed
    dependencies:
      - task-002
    acceptance_criteria:
      - "dbms/create.go registers the password before CreateDbms"
      - "connection/create.go registers the password before CreateConnection"
      - "connection/update.go registers the password before UpdateConnection when set"
      - "No change to command behavior or output when debug is off"
    completed_at: 2026-06-08T17:05:00Z

