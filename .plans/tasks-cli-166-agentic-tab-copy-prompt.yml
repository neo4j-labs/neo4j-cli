tasks:
  - id: task-001
    title: "Make Quickstart .step-cmd copy handler mode-aware in gh-pages/index.html"
    description: |
      Set up a gh-pages worktree at the repo root via
      `git worktree add gh-pages gh-pages` and edit
      `gh-pages/index.html`. Replace the `.step-cmd` click handler block
      at lines 1871-1879 so it consults the existing `viewMode` global
      and, in agentic mode, copies the `.agentic-comment` text inside
      the clicked element (with the leading `> ` and following whitespace
      stripped) instead of `el.dataset.copy`. When `.agentic-comment` is
      absent (Quickstart steps 1 and 2 — the install commands), fall
      back to `data-copy` unconditionally so behaviour is unchanged
      there. Keep the toast-rendering call shape identical so it
      reflects the actually-copied string. Do NOT touch the
      `.copy-mini` handler (lines 1856-1869), the HTML markup, the CSS,
      or the `> ` prefix that lives in `.agentic-comment` (Invariant 1
      of `website-update.md` requires it on screen).
    status: completed
    dependencies: []
    acceptance_criteria:
      - "`gh-pages` worktree exists at repo-root `gh-pages/` checked out at the `gh-pages` branch."
      - "`gh-pages/index.html` `.step-cmd` handler reads `viewMode` at click time and, when `viewMode === 'agentic'` AND the clicked element has a `.agentic-comment` descendant, copies `agentic-comment.textContent.trim().replace(/^>\\s*/, '')`."
      - "When `viewMode === 'cli'` OR the element has no `.agentic-comment`, the handler copies `el.dataset.copy` unchanged."
      - "Toast message uses whichever string was copied (`'Copied: ' + cmd.slice(0, 40) + …`)."
      - "Diff is confined to the `.step-cmd` handler block; no edits to markup, CSS, the `.copy-mini` handler, or the `.alt-install` handler."
      - "`grep -n 'data-copy=\"neo4j-cli credential aura-client add' gh-pages/index.html` still finds the original `data-copy` attribute (the agent prompt is sourced from the DOM, not duplicated as a new attribute)."
    completed_at: 2026-05-21T06:34:37Z

  - id: task-002
