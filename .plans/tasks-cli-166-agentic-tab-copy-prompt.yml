    description: |
      Open `gh-pages/index.html` directly in a browser (file://) from
      the worktree and exercise every Quickstart step in both modes,
      pasting into a scratch buffer to confirm the actual clipboard
      content. Cover: agentic mode steps 3-6 (each pastes the
      `.agentic-comment` text minus the `> ` prefix and matches the
      ticket-expected strings); agentic mode steps 1-2 (still paste the
      install / skill-install commands as today); cli mode steps 1-6
      (byte-identical paste to pre-fix behaviour — regression check).
      Spot-check at least one Examples-section `.copy-mini` button in
      each mode to confirm no collateral damage. Repeat on a second
      browser (Chrome + Safari) because clipboard API behaviour
      differs. Record any discrepancy and re-iterate task-001 if a
      paste does not match.
    status: completed
    dependencies:
      - task-001
    acceptance_criteria:
      - "Agentic mode step 3 pastes exactly `Add my Aura credentials — grab client ID and secret from console.neo4j.io` (no `> `, no CLI text)."
      - "Agentic mode steps 4, 5, 6 each paste their respective `.agentic-comment` text with the `> ` prefix stripped."
      - "Agentic mode steps 1 and 2 still paste the install / skill-install commands from `data-copy`."
      - "CLI mode steps 1-6 each paste the `data-copy` CLI command byte-identically to pre-fix behaviour."
      - "At least one `.copy-mini` button verified in each mode and still works (regression check)."
      - "Verified in both Chrome and Safari (clipboard API behaviour differs)."
    completed_at: 2026-05-21T06:50:00Z

