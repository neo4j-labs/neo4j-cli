  - id: task-012
    title: 'Fix embed completeness check to validate the resolved Config (folds in provider-const dedup)'
    description: |
      (Review finding #1 BLOCKING + #3 should-fix — the same fix resolves both.)
      embed.go:244-248 calls credentials.ValidateEmbedEnvSet(os.Getenv), and
      ValidateEmbedEnvSet (env_spec.go:120-140) only inspects os.Getenv for the
      API-key vars. But the provider can be set via env while the key legitimately
      arrives via the .env walk-up or the stored embed credential — both of which
      Resolve has ALREADY merged into out.APIKey by line 239. Concrete failure:
      accept-env-vars=true, NEO4J_EMBED_PROVIDER=openai in the environment, key in
      a .env file (or a stored credential). out.APIKey is correctly populated, but
      ValidateEmbedEnvSet(os.Getenv) sees no key env var and returns a usage error
      — the command fails even though the key was resolved. This contradicts the
      PRD precedence (flag > env > .env > stored) and the README claim that .env is
      "unaffected by this gate." Contrast the DBMS check in conn.go:172-183, which
      validates against the RESOLVED uri/username/password (so a flag- or
      dotenv-supplied piece counts as present) — that is the right shape. Fix:
      validate against the already-resolved Config inside embed.Resolve — check
      out.Provider != "" && providerNeedsKey(out.Provider) && out.APIKey == ""
      — rather than re-reading os.Getenv. This also lets the embed-specific
      key-completeness policy live in the embed package (which owns the provider
      taxonomy via ProviderOllama/ProviderVertex), so finding #3 collapses:
      remove ValidateEmbedEnvSet from common/clicfg/credentials/env_spec.go AND the
      embedProviderOllama/embedProviderVertex constants that were duplicated there
      (env_spec.go:37-40) purely to express this rule. Keep Ollama and Vertex (ADC)
      exempt from the key requirement, matching production resolveAPIKey logic.
    status: completed
    dependencies: []
    acceptance_criteria:
      - "With accept-env-vars=true, NEO4J_EMBED_PROVIDER=openai in the env and the API key supplied via .env (or stored credential), embed resolves successfully — no usage error"
      - "With accept-env-vars=true, NEO4J_EMBED_PROVIDER=openai and NO key from any source, a usage error is still returned"
      - "Ollama and Vertex providers never require an API key"
      - "ValidateEmbedEnvSet and the embedProviderOllama/embedProviderVertex constants are removed from common/clicfg/credentials; the key-completeness policy lives in the embed package"
      - "make test, make fmt-check, make lint pass"
    source: review
    completed_at: 2026-06-25T13:02:16Z

