    acceptance_criteria:
      - "Two sequential env-var Aura invocations with the same client ID/secret result in one OAuth token mint (second hits cache)"
      - "Changing NEO4J_AURA_CLIENT_SECRET causes a cache miss and a fresh mint"
      - "The cache file contains only the JWT (and expiry/hash), never the raw client secret, at 0600 permissions"
      - "An expired cache (past expiry minus 60s buffer) triggers a fresh mint"
      - "The cache is not consulted in keyring/insecure credential modes"
    completed_at: 2026-06-25T12:28:39Z

