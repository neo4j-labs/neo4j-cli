  - id: task-008
    title: 'Add identity-bound Aura JWT token cache for env-var mode'
    description: |
      Add neo4j-cli/aura/internal/api/token_cache.go caching the derived OAuth
      JWT (never the client secret) to os.TempDir()/neo4j-cli-aura-token-<hash>.json
      at mode 0600. shortHash = first 16 hex of sha256(clientID|clientSecret|authURL);
