  - id: task-015
    title: 'Length-prefix tokenCacheHash components to prevent separator-injection collisions'
    description: |
      (CI security-review finding, [Low] Cryptography — token_cache.go line 39.)
      tokenCacheHash builds its SHA-256 input by concatenating
      clientID + "|" + clientSecret + "|" + authURL with an unescaped "|"
      separator. Because "|" can also appear inside a component, two different
      credential identities can map to the same digest: e.g.
      tokenCacheHash("a|b","c",url) and tokenCacheHash("a","b|c",url) collide.
      The consequence is a wrong cache hit — one invocation receives a cached JWT
      minted for a DIFFERENT identity and then fails with a 401 from the Aura API.
      No credential is exposed (the secret is still never written to disk), and
      severity is Low, but it is a real correctness bug in the cache-identity
      derivation. Fix: make component boundaries unambiguous by length-prefixing
      each component before hashing, e.g.
      fmt.Sprintf("%d:%s|%d:%s|%d:%s", len(clientID), clientID,
      len(clientSecret), clientSecret, len(authURL), authURL). Apply this
      consistently to BOTH the filename short-hash and the in-file full-hash if
      they derive from the same construction, so a changed secret still misses and
      a same-identity hit still works. Add a focused test asserting the two
      previously-colliding inputs now produce distinct hashes, and confirm the
      existing cache hit/miss tests (same id/secret => hit; changed secret => miss)
      still pass.
    status: completed
    dependencies: []
    acceptance_criteria:
      - "tokenCacheHash length-prefixes each component so clientID|secret boundary ambiguity cannot cause a collision"
      - "A test asserts that two inputs which collided under the old | concatenation now hash differently"
      - "Existing token-cache behaviour holds: same id/secret/authURL => cache hit; changed secret => cache miss + fresh mint"
      - "The raw client secret is still never written to disk; cache file remains 0600"
      - "make test, make fmt-check, make lint pass"
    source: review
    completed_at: 2026-06-25T15:55:43Z

  - id: task-016
    title: 'Fix default-path override completeness: three params complete, database optional, for flags AND env'
    description: |
      (QA Finding 1 [Medium-High] — confirmed behavioural bug. REQ-F-014.)
      On the default resolution path (no --credential), dbconn.ResolveConn
      (neo4j-cli/internal/dbconn/conn.go) treats a "complete" override as all
      FOUR params (uri/username/password/database) in query mode via the
      explicitCount / fullCount switch, so when a stored default credential
      exists a three-var override (uri/user/pass, no database) is rejected with
      "partial connection params: ...all four are required". This contradicts
      REQ-F-010 (NEO4J_DATABASE optional) and the acceptance criterion that env
      vars override the stored credential: the new ValidateEnvCredentialSet check
      passes for three, but the legacy switch then rejects.

      Fix: base the completeness decision on the THREE required params
      (uri/username/password) only; treat database (--database / NEO4J_DATABASE)
      as an always-optional extra that is applied when present but never required
      and never counted toward completeness. A set of the three required params
      (regardless of database) bypasses the stored credential cleanly; one or two
      of them remains a partial override. Per the user's explicit decision, apply
      this UNIFORMLY to both explicit --flags and env vars (intentionally relaxing
      the older flag-only "all four when a stored credential exists" contract down
      to three). Admin mode (skipDatabase=true) already counts three and must stay
      unchanged. CLI-212's applyDBOverride (--credential path, REQ-F-013) is a
      separate path and must NOT be touched.

      Reconcile the partial-params messaging: after the fix the only remaining
      partial errors are genuine subsets (<=2 of the three). Ensure the env-mode
      partial error names the missing NEO4J_* vars (via ValidateEnvCredentialSet,
      REQ-F-010) and the flag-mode partial error names the --flags.

      Update README: the "must supply all four" statement for the connection
      override (and the embed/env sections as needed) must change to "all three of
      URI/username/password, database optional" across both flags and env vars.
    dependencies: []
    acceptance_criteria:
      - "accept-env-vars=true + stored default cred + NEO4J_URI/USERNAME/PASSWORD (no NEO4J_DATABASE) overrides the stored cred and resolves without an 'all four' error"
      - "Stored default cred + --uri/--username/--password flags (no --database) overrides the stored cred without an 'all four' error"
      - "One or two of uri/user/pass (env OR flags) with a stored default cred is still a rejected partial override, naming the missing values (NEO4J_* in env mode, --flags in flag mode)"
      - "--database / NEO4J_DATABASE, when supplied, is applied to conn.Database but is never required to complete an override"
      - "Admin mode (skipDatabase=true) behaviour is unchanged; CLI-212 applyDBOverride path is untouched"
      - "No stored credential: three-var override still works (no regression)"
      - "New tests cover three-env + stored cred, three-flag + stored cred, two-of-three partial (env and flag), and database-applied-but-optional"
      - "README updated to 'three required, database optional' for both flags and env vars"
      - "make test, make fmt-check, make lint pass; go generate produces no bundle drift"
    status: completed
    source: qa
    completed_at: 2026-06-26T10:35:00Z

  - id: task-017
    title: 'Reword off-mode error messages so they do not advertise gated env vars'
    description: |
      (QA Finding 2 [Medium]. REQ-F-015.)
      When accept-env-vars is off, error messages that prompt for a missing
      connection/embed value still tell users to "set NEO4J_PASSWORD" /
      "set NEO4J_URI" etc. — env vars the gate is ignoring (and which may already
      be set). With accept-env-vars explicitly false there is not even a discovery
      hint, so the user is told to set a variable that does nothing. Rework the
      affected messages so that, when the gate is OFF, the env-var suggestion is
      dropped or redirected (reference --flags / .env and/or point at
      accept-env-vars, e.g. "set --password, or enable accept-env-vars to read
      NEO4J_PASSWORD"); when the gate is ON the messages may continue to name the
      env vars. Thread cfg.Global.AcceptEnvVars() (or a derived bool) into the
      message-construction sites.

      Sites identified in QA:
