  - id: task-029
    title: 'Fix partial-override source attribution in dbconn.ResolveConn: ungate dotenv completeness + name only env-sourced pieces'
    description: |
      (Fifth-round QA findings, REQ-F-024 and REQ-F-025. Both live at the single
      completeness site in neo4j-cli/internal/dbconn/conn.go (~155-247) and MUST
      be implemented together — REQ-F-025's expected outputs depend on REQ-F-024's
      ungating.)

      Two partial-override message defects remain after REQ-F-018/022:

      (1) REQ-F-024 — the env/dotenv completeness check
      `ValidateEnvCredentialSet(DBMSEnvSpec, …)` (conn.go ~204) is gated behind
      `cfg.Global.AcceptEnvVars()`, but the .env (--env walk-up) mechanism is
      NEVER gated and uses the same NEO4J_* keys. So the SAME action — a .env with
      only NEO4J_URI (partial, no flags) — gives two different errors:
        - on : "incomplete credential environment: NEO4J_URI, NEO4J_USERNAME,
          NEO4J_PASSWORD must be set when NEO4J_URI is provided (missing:
          NEO4J_USERNAME, NEO4J_PASSWORD)" (clierr.UsageError, exit 2)
        - off: "partial connection params: when any of --uri, --username, or
          --password is provided, all three (--uri, --username, --password) are
          required" (exit 1) — names --flags the user never used.
      This contradicts the conn.go ~149-154 comment ("dotenv-supplied pieces count
      as env-sourced … so the partial-override error can name the source the user
      actually used"): in off-mode `envSourced` is computed but never consulted
      because its only use site is gated off.
      Fix: REMOVE the `cfg.Global.AcceptEnvVars()` condition from the guard at
      conn.go ~204 so the check runs whenever `envSourced` is true and
      `requiredCount != 3`, in BOTH gate states. `envURI`/`envUsername`/
      `envPassword`/`envSourced` are already `Overlay(dotenvVals[…],
      cfg.GatedGetenv(…))` (conn.go ~155-158), so off-mode reflects dotenv-only
      (OS env gated to "") and on-mode folds in OS env — exactly the set to name
      with NEO4J_*. A purely-flag subset (`envSourced` false) is unchanged: it
      still falls through to the --flags `partial connection params` branch
      (exit 1).

