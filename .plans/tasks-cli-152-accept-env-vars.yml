  - id: task-023
    title: 'Fix OAuth mint to return clear per-status errors and never an empty token'
    description: |
      (Second-round QA Finding 3 [Medium, pre-existing]. REQ-F-019.)
      mintTokenHTTP (neo4j-cli/aura/internal/api/token.go) special-cases only HTTP
      401 (auth error) and 404 (panic); its case http.StatusBadRequest: and
      case http.StatusForbidden: arms are EMPTY, so 400/403 (and any other unlisted
      non-2xx e.g. 422/500) fall through, the body is parsed into a Grant, and an
      EMPTY AccessToken is returned WITH NO ERROR. Downstream this yields an
      "Authorization: Bearer " (empty) request and the generic
      "unexpected status code 422 ... please report an issue". Repro confirmed in QA
      with a staging client credential returning 403 against api.neo4j.io.
      Rework the status switch so every non-2xx returns a clear, actionable error
      and an empty access_token after a 2xx is also treated as an error:
        - 401 -> existing auth error ("credentials invalid/expired/revoked").
        - 403 -> a DISTINCT forbidden error: credentials valid but not authorized for
          this request (insufficient permission); NOT the 401 wording. MUST NOT mention
          a wrong/mismatched Aura environment - that is a niche cause mainly affecting
          internal users and would clutter the user-facing message. Suggested:
          "forbidden (HTTP 403): the credentials are valid but not authorized for this
          request (insufficient permission)."
        - any other non-2xx (incl. 400/422/5xx) and any 2xx with empty access_token ->
          clear error naming the status (or "empty token"), reusing existing
          response-error helpers rather than the generic "please report" panic.
      Decision (confirmed): fix ALL mint paths (single mintTokenHTTP chokepoint), not
      env-var-only, so stored keyring/insecure credentials benefit identically; and
      distinguish 401 vs 403 vs other. Add tests via the mintToken seam for 401, 403,
      another non-2xx (422 or 500), and a 200-with-empty-token response. Verify any
      new debug/error text obeys the AGENTS.md redaction rule (no <secretword>:/=
      prefix immediately before a word).
    status: completed
    completed_at: 2026-06-26T16:45:00Z
    dependencies: []
    acceptance_criteria:
      - "401 -> invalid-credentials auth error; 403 -> distinct 'forbidden / not authorized' error (NOT the 401 wording, and NOT mentioning a wrong Aura environment)"
      - "Other non-2xx (e.g. 422/500) and a 2xx with empty access_token -> clear error naming the status, NOT the generic 'please report' panic"
      - "No code path returns an empty AccessToken as success; no downstream 'Authorization: Bearer ' (empty) request occurs"
      - "Fix applies to both env-var-synthesized and stored-credential mints (single chokepoint)"
      - "Tests via the mintToken seam cover 401, 403, another non-2xx, and empty-token; make test, make fmt-check, make lint pass; no new redaction regressions"
    source: qa

