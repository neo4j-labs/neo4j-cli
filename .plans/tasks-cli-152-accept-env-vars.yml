  - id: task-008
    title: 'Add identity-bound Aura JWT token cache for env-var mode'
    description: |
      Add neo4j-cli/aura/internal/api/token_cache.go caching the derived OAuth
      JWT (never the client secret) to os.TempDir()/neo4j-cli-aura-token-<hash>.json
      at mode 0600. shortHash = first 16 hex of sha256(clientID|clientSecret|authURL);
      cache file stores token, expiry, and full hash. On read verify the full
      hash and expiry with a 60s buffer; on miss/corrupt/expired/mismatch mint
      fresh and write back. Only consult the cache when the Aura credential came
      from env vars (not keyring/insecure).
    status: completed
    dependencies:
