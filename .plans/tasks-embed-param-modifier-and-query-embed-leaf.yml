  - id: task-005
    title: "Add embed provider package skeleton (Provider, Config, Resolve, New, dbms-link helper)"
    description: |
      Create `neo4j-cli/query/embed/embed.go` defining `Provider`
      (interface with `Embed(ctx, text) ([]float32, error)`), `Config`
      (Provider, Model, BaseURL, APIKey, Dimensions, UserAgent), and
      package-private helper `resolveSelectedDbmsCred(cmd, cfg)
      *credentials.DbmsCredential` returning the cred named by
      `--credential` if `Changed`, else `cfg.Credentials.Dbms.GetDefault()`,
      else nil. Implement `Resolve(cmd, cfg) (Config, error)` applying the
      precedence in REQ-F-013: pick base embed cred (explicit
      `--embed-credential` → linked-from-resolved-dbms-cred → default
      embed cred → empty), overlay `.env` (export/use the existing
      `findDotenv` from `query/connect.go`), then OS env, then flags;
      resolve API key per provider (provider-specific env →
      NEO4J_EMBED_API_KEY → stored cred APIKey). Add `New(cfg) (Provider,
      error)` switch (returns "not implemented" stubs for openai/ollama/
      huggingface — fleshed out in tasks 006-008). Expose
      `var providerFactory = New` as the test seam. Cover Resolve with a
      table-driven precedence-matrix test using `testfs.GetTestFs` and a
      synthetic `*cobra.Command` with the persistent flags registered for
      tests only.
    status: completed
    dependencies:
      - task-001
      - task-003
    acceptance_criteria:
      - "Provider interface, Config struct, Resolve, New, providerFactory test seam, and resolveSelectedDbmsCred helper all defined."
      - "Resolve precedence test covers: flags > OS env > .env > explicit --embed-credential > linked-from-dbms > default-embed-cred > empty."
      - "Resolve returns a clear usage error when --embed-credential names a missing cred (points at `credential embed list`)."
      - "API-key resolution per provider: OPENAI_API_KEY beats NEO4J_EMBED_API_KEY beats stored APIKey for OpenAI; HF_TOKEN equivalent for HuggingFace; Ollama needs no key."
      - "Tests use testfs.GetTestFs (no afero.NewOsFs) and pass under `make test`."
    completed_at: 2026-05-07T13:00:00Z

  - id: task-006
    title: "Implement OpenAI embedding provider"
    description: |
      Create `neo4j-cli/query/embed/openai.go` and tests. POST to
      `{BaseURL}/embeddings` with `Authorization: Bearer <APIKey>`, body
      `{"model": ..., "input": <text>, "dimensions": <int>}` (dimensions
      omitted when zero/unset). Parse `data[0].embedding` into
      `[]float32`. Default `BaseURL = https://api.openai.com/v1`. Return
      `clierr.NewUsageError("missing API key for openai: set
      OPENAI_API_KEY")` when APIKey empty. Wrap non-2xx responses with
      provider name + HTTP status; never include the Authorization header
      value in error text. Honour `cmd.Context()` (no client timeout, but
      ctx-aware request). Tests use `httptest.NewServer` and cover happy
      path, missing key, non-200, malformed body, dimensions present/
      omitted, ctx cancellation.
    status: completed
    dependencies:
      - task-005
    acceptance_criteria:
      - "POST URL is `{BaseURL}/embeddings`; default BaseURL is the OpenAI v1 endpoint."
      - "Request body includes `dimensions` only when Config.Dimensions > 0."
      - "Missing APIKey returns the documented usage error before any HTTP call."
      - "Non-2xx responses surface the provider name + HTTP status; no Authorization header value leaks."
      - "Tests cover happy path, dimensions omit/include, missing key, non-200, malformed body, ctx-cancellation."
    completed_at: 2026-05-07T11:54:50Z

