  - id: task-009
    title: "Extend parseParams to recognise the `:embed` modifier"
    description: |
      Modify `neo4j-cli/query/params.go` so `parseParams` returns
      `(map[string]any, []EmbedJob, error)` where
      `type EmbedJob struct{ Name, Text string }`. Detect `key:modifier`
      by splitting on the first `:` in the key portion (before `=`). Only
      `embed` is recognised; any other modifier returns
      `clierr.NewUsageError("invalid --param %q: unknown modifier %q", entry, modifier)`.
      Empty `Name` after split errors. Empty Text is accepted. With the
      `:embed` modifier, JSON-typing of the value is disabled (text
      passes through verbatim) — except: if the value parses as a JSON
      array, return
      `clierr.NewUsageError("--param %q: :embed expects text, got JSON array", entry)`.
      Multiple `--param NAME:embed=...` entries are collected in order.
      Update `params_test.go` table to cover the new cases (`q:embed=hello`,
      `q:bogus=x`, `:embed=x`, `q:embed=`, `q:embed=[1,2,3]`, mixed
      embed + literal).
    status: completed
    dependencies: []
    acceptance_criteria:
      - "parseParams signature is `(map[string]any, []EmbedJob, error)` and existing literal-param cases still pass."
      - "`q:embed=hello` produces no entry in the params map and one EmbedJob `{Name: q, Text: hello}`."
      - "Unknown modifier (`q:bogus=x`) and empty name (`:embed=x`) each return a usage error referencing the offending entry."
      - "`q:embed=[1,2,3]` returns the documented JSON-array rejection error."
      - "Multiple embed entries preserve command-line order in the EmbedJob slice."
    completed_at: 2026-05-07T14:30:00Z

  - id: task-010
    title: "Register `--embed-*` flags on `query` parent and wire embed resolution into runQuery"
    description: |
      Modify `neo4j-cli/query/query.go` to register five new persistent
      flags: `--embed-credential` (string), `--embed-provider` (string),
      `--embed-model` (string), `--embed-base-url` (string),
      `--embed-dimensions` (int). Each `--embed-{provider,model,base-url,
      dimensions}` is annotated in help text as `[env: NEO4J_EMBED_<NAME>]`.
      Modify `runQuery` in `run.go`: after the new `parseParams` returns
      `(params, embeds, err)`, when `len(embeds) > 0` call
      `embed.Resolve(cmd, cfg)`, then `providerFactory(ec)`, then loop
      `provider.Embed(ctx, j.Text)` and assign into `params[j.Name]`. The
      same `params` map then feeds both `rejectWriteCypher` (EXPLAIN
      preflight) and the real `runStatement`/`runStatementWrite`. Extend
      `run_test.go` with end-to-end cases using a fake providerFactory:
      embed-once-up-front, --rw still embeds once, mixing literal +
      embed params, provider error aborts before EXPLAIN.
    status: completed
    dependencies:
      - task-005
      - task-006
      - task-007
      - task-008
      - task-009
    acceptance_criteria:
      - "Five persistent flags registered on the `query` parent and inherited by `:schema` (and forthcoming `:embed`)."
      - "Embed resolution runs exactly once before EXPLAIN preflight; same vector consumed by EXPLAIN and the real run."
      - "Provider error during embed aborts the command before any Cypher is sent (verified by a fake driverOpener that panics)."
      - "Mock providerFactory called exactly len(embeds) times per invocation regardless of `--rw`."
      - "All existing run_test.go cases (no embed) continue to pass byte-identical."
    completed_at: 2026-05-07T15:00:00Z

  - id: task-011
    title: "Add `query :embed [text]` standalone leaf and shared input helper"
    description: |
      Create `neo4j-cli/query/input.go` exporting
      `readPositionalOrStdin(cmd, args, name string) (string, error)`:
      single positional arg wins; otherwise read piped stdin via
      `stdinReader()`; TTY stdin with no arg returns a usage error.
      Refactor `resolveCypher` in `run.go` to delegate to it. Create
      `neo4j-cli/query/embed.go` defining `newEmbedCmd(cfg)` with
      `Use: ":embed [text]"` and `Args: cobra.MaximumNArgs(1)`. RunE
      reads text via the helper, calls `embed.Resolve` +
      `providerFactory`, and renders via `commonoutput.PrintBodyMap`.
      Output type is a `[]float32` newtype (`embedVector`) implementing
      `ResponseData.AsArray()` (single-cell `[N floats]` row for table)
      and `json.Marshaler` (raw vector for json/toon). Mount via
      `query.go` `cmd.AddCommand(newEmbedCmd(cfg))`. The leaf MUST NOT
      open a Bolt driver and MUST NOT prompt for password. Add
      `embed_test.go` covering arg + stdin paths, json/table/toon
      rendering, provider error propagation, and a fake driverOpener
      that panics to prove no DB connection is opened.
    status: completed
    dependencies:
      - task-010
    acceptance_criteria:
      - "`query :embed \"hello\"` and `echo hello | query :embed` both produce the same output; TTY-stdin with no arg returns usage error."
      - "`--format json` outputs a raw JSON array of floats; `--format table` outputs a single cell `[N floats]`; `--format toon` parses with the toon decoder."
      - "Bolt driver is NOT opened (panicking driverOpener seam confirms) and password prompt is NOT triggered even with no --password/NEO4J_PASSWORD."
      - "`readPositionalOrStdin` is reused by both `resolveCypher` and `runEmbed`; no duplicated stdin/TTY logic remains."
      - "Provider errors propagate cleanly with a `query: ` prefix or wrapped form consistent with the rest of the package."
    completed_at: 2026-05-07T15:30:00Z

