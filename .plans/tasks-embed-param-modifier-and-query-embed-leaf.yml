tasks:
  - id: task-001
    title: "Add EmbedCredentials storage type and wire into Credentials"
    description: |
      Create `common/clicfg/credentials/embed.go` mirroring `dbms.go`. Define
      `EmbedCredential` (Name, Provider, Model, BaseURL, Dimensions, APIKey;
      kebab-case JSON keys) and `EmbedCredentials` with `Add / Remove /
      SetDefault / GetDefault / Get / List / Printable` methods plus an
      `onUpdate` callback. `PrintableEmbedCredentials.AsArray` and
      `MarshalJSON` MUST omit `api-key`. Update `credentials.go` to add
      `Embed *EmbedCredentials` to `CredentialsFile` + `Credentials`, init
      it in `load()`, and rewire `onUpdate` after JSON unmarshal (mirror the
      Dbms block at lines 45-65). Add `embed_test.go` covering add/remove/
      default round-trip, JSON round-trip preserves `api-key` on disk,
      `Printable` omits it, first-added becomes default.
    status: completed
    dependencies: []
    acceptance_criteria:
      - "EmbedCredential and EmbedCredentials types defined with kebab-case JSON keys (base-url, api-key)."
      - "PrintableEmbedCredentials.AsArray and MarshalJSON never include api-key."
      - "credentials.json round-trips: add a cred, reload Credentials, default and fields preserved including api-key on disk."
      - "First credential added is automatically marked default (matches DbmsCredentials.Add)."
      - "onUpdate callback rewired correctly post-load so subsequent mutations persist."
    completed_at: 2026-05-07T11:00:00Z

