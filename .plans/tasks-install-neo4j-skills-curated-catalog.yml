  - id: task-019
    title: "Refactor Catalog struct: separate data from deps; dedupe skill-entry conversion"
    description: |
      `catalog.Catalog` mixes data (Version, Skills) with dependencies
      (Doer, BinaryVersion) and location (cacheRoot, plus SetCacheRoot /
      CacheRoot getter+setter pair). `loadOrRefreshCatalog` patches the
      Load() result back together by hand (`cat.BinaryVersion = ...; if
      catalogHTTPDoer != nil { cat.Doer = ... }; cat.SetCacheRoot(...)`).
      That assembly is plumbing the type itself should own.

      Cleanest reshape: `catalog.New(opts CatalogOpts) *Catalog` where
      `CatalogOpts{CacheRoot, Doer, BinaryVersion}` carries the deps; the
      returned service exposes `Load() / Refresh(ctx, fs) / Lookup(fs,
      name, binaryName) / Stale(fs, ttl)`. Data fields (Version, Skills)
      stay on the type; the field-set-after-construction dance disappears.

      Also: `refresh.go:170 skillEntriesFromPluginJSON` duplicates the
      inline conversion loop in `catalog.go:71`. One helper, called from
      both.
    status: pending
    dependencies: []
    source: review
    acceptance_criteria:
      - "Catalog has a single constructor that takes CacheRoot + Doer + BinaryVersion (no after-the-fact field assignment in callers)"
      - "SetCacheRoot setter is removed (deps set at construction)"
      - "skillEntriesFromPluginJSON is the single conversion path used by both Load and Refresh"
      - "loadOrRefreshCatalog no longer mutates Catalog fields after construction"
      - "make test / make fmt-check / make lint all clean"
