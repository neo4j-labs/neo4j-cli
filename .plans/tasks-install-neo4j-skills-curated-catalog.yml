      - "Reserved-name list is the single source of truth shared with catalog.Lookup"
    completed_at: 2026-05-27T13:15:00Z

  - id: task-006
    title: "Replace positional [agent] with --agent flag; positional becomes skill-name"
    description: |
      Update the cobra surface in `common/skill/` so `install`, `remove`, and
      `print` accept an optional skill-name positional (validated against
      self+catalog names) and a new `--agent <name>` flag (case-insensitive)
      that scopes to one agent. Hard-break: if the positional doesn't match any
      known skill but matches an agent name, error with
      `unknown skill: <name>; did you mean '--agent <name>'?`. Update Long /
      Example / help text. No silent fall-through to the old positional shape.
    status: completed
    dependencies:
      - task-004
      - task-005
    acceptance_criteria:
      - "install/remove/print all accept --agent <name> with case-insensitive matching"
      - "Positional that resolves to a known skill name proceeds; unknown positional matching an agent name yields the did-you-mean error and non-zero exit"
      - "Help text + Example blocks for each leaf reflect the new shape"
      - "Old form 'skill install claude-code' (no matching skill) fails with the hard-break error in a colocated test"
    completed_at: 2026-05-27T13:30:00Z

  - id: task-007
    title: "Wire install leaf for catalog skills (--all, --refresh, auto-refresh, network policy)"
    description: |
      Extend `install.go` to install a catalog skill by name (via
      `catalog.Lookup` + the Source-aware Install), to install everything when
      `--all` is set (self-skill + each `plugin.json.skills[]` entry), and to
      force `catalog.Refresh` when `--refresh` is set or the cache is missing /
      older than 24 h. On network failure with no cache, fail with a clear
      pointer to `neo4j-cli skill refresh`; with cache, log to stderr and
      proceed using cached content (read commands), but install of a
      catalog-only skill requires a usable cache.
    status: completed
    dependencies:
      - task-003
      - task-006
    acceptance_criteria:
      - "skill install <catalog-name> installs from cached content/<version>/<name>/ into every detected agent"
      - "skill install --all installs the self-skill plus every catalog entry"
      - "skill install --refresh forces plugin.json fetch + tarball check before installing"
      - "Cold cache + network failure on a catalog install exits non-zero with a refresh hint"
      - "Stale cache (>24 h) triggers auto-refresh on install when network is available"
    completed_at: 2026-05-27T13:21:08Z

  - id: task-008
