  - id: task-027
    title: "Add canonical Zip Slip prefix check in extract.go to silence CodeQL (defense in depth)"
    description: |
      CodeQL flagged `common/skill/catalog/extract.go:66` as a "Zip Slip"
      (`go/zipslip`) high-severity alert. The current code IS actually
      safe — `classifyEntry` explicitly rejects any segment equal to
      `..`, rejects absolute paths, rejects symlinks/hardlinks/devices,
      and strips the top-level archive dir. But CodeQL's taint analyzer
      doesn't pattern-match the per-segment loop and reports the alert
      anyway.

      Two reasonable fixes:

      1. **Belt-and-braces:** after computing `destPath :=
         filepath.Join(destRoot, filepath.FromSlash(rel))`, add the
         canonical Zip Slip guard that CodeQL recognizes:

             cleanRoot := filepath.Clean(destRoot) + string(os.PathSeparator)
             if !strings.HasPrefix(destPath, cleanRoot) {
                 return fmt.Errorf("catalog: tar entry %q escapes destination root", name)
             }

         The original per-segment `..` rejection stays — this is true
         defense-in-depth, not a replacement.

      2. **Suppress with a justified comment** — riskier (future
         refactors might remove the underlying protection without the
         scanner noticing). Skip unless option 1 turns out to be
         awkward.

      Prefer option 1. Add a test that synthesizes a tar entry crafted to
      defeat the per-segment check but still produce a destPath outside
      destRoot (hard to construct given the current guards — but the
      prefix check is then a documented safety net that future readers
      see).

      Confirm CodeQL clears the alert on next push.
    status: completed
    dependencies: []
    source: review
    acceptance_criteria:
      - "extract.go writes a file/dir only when destPath has the cleaned-destRoot prefix"
      - "Original per-segment '..' check in classifyEntry is preserved (not replaced)"
      - "Test asserts the prefix check is exercised (synthetic tar entry intercepted)"
      - "CodeQL go/zipslip alert clears on next PR push"
      - "make test / make fmt-check / make lint all clean"
    completed_at: 2026-05-27T19:30:00Z

