  - id: task-029
    title: "Inline canonical Zip Slip prefix check so CodeQL recognizes the sanitizer"
    description: |
      CI CodeQL still flags `common/skill/catalog/extract.go:66` as
      `go/zipslip` high-severity AFTER task-027 added the
      `verifyDestPath` helper. The current check IS effective at runtime
      — the issue is purely that CodeQL's taint analyzer for the
      `go/zipslip` rule doesn't reliably follow into helper functions
      when looking for the sanitizer pattern. It expects the prefix
      check inline at the destPath construction.

      Fix: inline the canonical prefix check directly in `Extract`, just
      after `destPath := filepath.Join(destRoot, filepath.FromSlash(rel))`
      and before the Typeflag switch. The literal pattern CodeQL
      recognizes is:

          cleanRoot := filepath.Clean(destRoot)
          if destPath != cleanRoot && !strings.HasPrefix(destPath, cleanRoot+string(os.PathSeparator)) {
              return fmt.Errorf("catalog: tar entry path %q escapes destination root %q", destPath, cleanRoot)
          }

      Options:
      - **Option A (preferred):** delete `verifyDestPath` helper, inline
        the check. The helper was added for testability but the inline
        version is small (4 lines) and the existing
        `TestVerifyDestPath` table can stay if you keep the helper as a
        pure-function side-by-side with the inline check (slightly
        redundant but covers both surfaces). Or move the test logic to
        an Extract-level integration test that exercises the inline
        check via crafted tar headers.
      - **Option B:** keep `verifyDestPath` AND inline the check (the
        helper becomes belt-and-braces). Marginally more code; might
        confuse future readers.
      - **Option C:** suppress the alert via GitHub's dismiss-with-
        reason API. Rejected — the cleanest fix is to let the scanner
        see the canonical pattern.

      Pick **Option A**. Delete the helper, inline the check, retarget
      the existing test against the Extract surface (synthesize a tar
      entry whose first segment is in the allowlist but whose computed
      destPath escapes — hard to construct given classifyEntry's `..`
      guards, but doable by directly testing the path-comparison logic
      via a tiny exported helper if needed). If the test becomes
      contrived, just delete it and rely on `make test`'s other
      end-to-end coverage of Extract.

      After landing, push and verify CodeQL clears the `go/zipslip`
      alert on the next run.
    status: pending
    dependencies: []
    source: review
    acceptance_criteria:
      - "extract.go has the canonical 'destPath has cleanRoot+sep prefix' check inline at the destPath construction site"
      - "verifyDestPath helper removed (or, if kept, also called inline so both surfaces match)"
      - "classifyEntry's per-segment '..' rejection unchanged (still the first line of defense)"
      - "CodeQL go/zipslip alert clears on next push (verify via `gh api .../code-scanning/alerts`)"
