tasks:
  - id: task-001
    title: "Scaffold common/skill/catalog package (types, constants, Load, Stale)"
    description: |
      Create the new `common/skill/catalog/` package with the URL constants
      (`plugin.json` + tarball) in `source.go`, the `Catalog` / `SkillEntry`
      types, cache-path helpers under `os.UserCacheDir()/neo4j-cli/skill-catalog/`,
      and the read-only `Load(fs, cacheRoot)` + `Stale(ttl)` functions plus the
      test seams (`userCacheDirFn`, `nowFn`). No network or extraction yet —
      `Load` reads cached `plugin.json` + `fetched-at` via afero only.
    status: completed
    dependencies: []
    acceptance_criteria:
      - "Package compiles with hardcoded raw.githubusercontent / codeload URLs in source.go"
      - "Catalog and SkillEntry structs match the PRD shape (Name, Path, Version, cacheRoot)"
      - "Load parses a fixture plugin.json from an afero mem fs and populates Version + Skills"
      - "Stale(ttl) returns true on missing fetched-at, false when nowFn-fetched diff < ttl"
      - "userCacheDirFn package var overrides os.UserCacheDir in tests"
    completed_at: 2026-05-27T12:45:00Z

  - id: task-002
    title: "Implement secure tar+gzip extractor with allowlist + traversal guards"
    description: |
      Add `extract.go` to `common/skill/catalog/` exposing a pure extractor that
      streams a `.tar.gz` reader, strips the top-level archive directory, and
      writes only entries whose first path segment appears in a caller-supplied
      allowlist (the `plugin.json.skills[]` names). Reject `..`/absolute paths,
      symlinks (`tar.TypeSymlink`/`TypeLink`), device/fifo nodes; accept only
      `tar.TypeReg` + `tar.TypeDir`. Enforce a 20 MB max-decompressed-size cap.
      All writes go through `afero.Fs` with 0600 files / 0755 dirs.
    status: completed
    dependencies: []
    acceptance_criteria:
      - "Synthetic tarball with ../../../etc/passwd entry causes extract to error and abort"
      - "Symlink entry and char-device entry both rejected with a clear error"
      - "Entry outside the allowlist is silently skipped; allowlisted skill content lands at content/<version>/<skill>/"
      - "Decompressed payload exceeding the cap aborts mid-stream with a size-limit error"
      - "Uses only archive/tar + compress/gzip stdlib — no third-party deps added to go.mod"
    completed_at: 2026-05-27T13:00:00Z

  - id: task-003
    title: "Implement Catalog.Refresh + Lookup with self-name collision guard"
    description: |
      Wire HTTP fetch of `plugin.json` (User-Agent `neo4j-cli/<version>`, 30 s
      timeout via injectable `httpDoer` seam) and conditional tarball download
      into `Catalog.Refresh(ctx, fs)`. Re-extract via task-002 only when
      `cached.version != upstream.version`. Implement `Lookup(name)` returning
      the per-skill `fs.FS` rooted at `content/<version>/<name>/`; reject any
      upstream skill named `self` or matching the binary name (fail-closed
      collision guard).
    status: completed
    dependencies:
      - task-001
      - task-002
    acceptance_criteria:
      - "Refresh against httptest server fetches plugin.json, writes cache, downloads tarball when version differs"
      - "Refresh skips tarball download when cached.version == upstream.version"
      - "Lookup returns fs.FS reading SKILL.md + references/* for the requested catalog skill"
      - "Lookup rejects an upstream entry named 'self' with a clear error; same for an entry matching the binary name"
      - "Refresh uses net/http.DefaultClient by default but accepts an httpDoer interface for tests"
    completed_at: 2026-05-27T12:59:07Z

  - id: task-004
    title: "Refactor common/skill installer to take Source{FS, Version} + inject version frontmatter"
    description: |
      Introduce `Source{FS fs.FS; Version string}` in `common/skill/` and change
      `Install(filesystem, src, skillName, agentFilter)` to consume it. Refactor
      `copyBundleWithVersion` to inject `version: <Source.Version>` into the
      copied SKILL.md YAML frontmatter — overwriting any existing `version:`
      line, or inserting it immediately before the closing `---` when upstream
      has none. Existing self-skill callers pass a Source backed by the
      embedded `bundle.FS` + binary version.
    status: completed
    dependencies: []
    acceptance_criteria:
      - "Install signature accepts Source and existing self-skill flow continues to install with binary version"
      - "Frontmatter injection overwrites a pre-existing version: line"
      - "Frontmatter injection inserts a new version: line before --- when absent"
      - "All existing common/skill tests pass with the new Source wiring"
      - "resolveTargets is unchanged — agent resolution remains orthogonal"
    completed_at: 2026-05-27T12:50:10Z

  - id: task-005
    title: "Add 'self' canonical name + binary-name alias for the self-skill"
    description: |
      Add resolution in `common/skill/` so that `self` is the canonical
      self-skill name and the binary name (`neo4j-cli`, threaded via
      `skill.NewCmd`'s skillName arg) is accepted as an alias. Both names must
