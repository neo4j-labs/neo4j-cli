  - id: task-021
    title: "Validate upstream skill names against path-traversal in catalog + installer"
    description: |
      HIGH security finding. `common/skill/catalog/catalog.go:127
      skillNameFromPath` derives the skill id from an upstream
      `plugin.json.skills[]` entry via `path.Base` after stripping `./`.
      `path.Base` returns `".."` for `".."`, `"."` for `""` / `"."` /
      `"./"`, and `"/"` for `"/"`. Any of these survive as `entry.Name`
      and propagate through `cat.Lookup` → `Install(..., skillName, ...)`
      → `dst := filepath.Join(skillsRoot, skillName)` where Join cleans
      `..` segments so dst ESCAPES skillsRoot.

      `Install` then calls `RemoveDir(dst)` which is `afero.Fs.RemoveAll`.
      With a compromised upstream publishing `"skills": [".."]`, the call
      chain on `--all` becomes `RemoveAll("/Users/x/.claude")` per
      detected agent — destruction of the user's entire Claude config
      directory. `cat.Lookup`'s existence probe does NOT defend (with
      `name=".."`, `filepath.Join(contentPath, "..")` resolves to
      `<cacheRoot>/content`, which exists, so Lookup returns success).
      The tarball extractor correctly rejects `..` segments in tar entry
      names but the SAME defense is missing for upstream-controlled
      skill names — even though those names also feed a destructive op
      (`RemoveAll`).

      Reachable via supply-chain compromise of `neo4j-contrib/neo4j-skills`
      (org takeover, malicious PR merged, or successful TLS MITM). The
      blast radius is much larger than the upstream's normal attack
      surface — treat as a privilege-escalation amplifier over baseline.

