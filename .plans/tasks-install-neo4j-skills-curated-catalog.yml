  - id: task-022
    title: "Cap plugin.json HTTP body read with io.LimitReader"
    description: |
      MEDIUM security finding. `common/skill/catalog/refresh.go:71`
      reads the upstream `plugin.json` body via unbounded `io.ReadAll`:

          body, err := fetch(ctx, doer, userAgent, PluginJSONURL)
          ...
          data, err := io.ReadAll(body)

      No `io.LimitReader` wrapping. A malicious upstream (or successful
      MITM) returning a 10 GB body forces the CLI to allocate it all in
      memory before the JSON parser sees it. The tarball path is already
      correctly capped at 20 MiB inside `Extract` (via per-entry
      LimitReader + total-bytes accumulator) — but plugin.json is not.

      Realistic impact: memory exhaustion / OOM-kill of the CLI process.
      Not privesc, but a trivial DoS that crosses a network trust
      boundary. The fix is one line.

      Fix: wrap the body read with `io.LimitReader(body, maxPluginJSON+1)`
      and reject when the cap is exceeded. A plugin.json is in the
      kilobyte range; 1 MiB is generous. Pattern:

          const maxPluginJSONBytes = 1 << 20
          data, err := io.ReadAll(io.LimitReader(body, maxPluginJSONBytes+1))
          if err != nil { ... }
          if int64(len(data)) > maxPluginJSONBytes {
              return fmt.Errorf("catalog: plugin.json exceeds %d byte cap", maxPluginJSONBytes)
          }

      Test: httptest server returning > 1 MiB body produces the cap
      error; <= 1 MiB body parses normally.
    status: completed
    dependencies: []
    source: review
    acceptance_criteria:
      - "plugin.json body read uses io.LimitReader with a per-call cap (≤ 1 MiB suggested)"
      - "Refresh returns a clear error when the body exceeds the cap"
      - "Test asserts the cap with a > 1 MiB httptest-served body"
      - "Existing happy-path tests still pass with the LimitReader wrapper"
      - "make test / make fmt-check / make lint all clean"
    completed_at: 2026-05-27T19:00:00Z

  - id: task-023
    title: "Prune stale cache versions; validate pj.Version against same allowlist"
    description: |
      MEDIUM security finding. `common/skill/catalog/refresh.go:96`
      extracts to `content/<version>/` and `cache.go:46 contentPath` joins
      `cacheRoot/content/version`. Two problems:

      1. Old `content/<version>/` subtrees are never reclaimed. Every
         upstream version bump appends another extraction. With a 20 MiB
         per-extract cap, after 100 refreshes there's up to ~2 GiB of
         stale data. A malicious upstream bumping version on every fetch
         (or even a fast-moving honest one) accumulates disk usage
         indefinitely. Combined with the unbounded body finding
         (task-022), this becomes a more effective exhaustion vector.

      2. The same path-traversal class from task-021 applies to
         `pj.Version` itself — `contentPath(cacheRoot, "..")` resolves to
         `cacheRoot/content/..` = `cacheRoot`. MkdirAll on destRoot would
         then point at the cache root rather than a version subtree. The
         tarball allowlist + classifyEntry guards limit the blast radius
         to inside cacheRoot, but the defense is still missing one
         layer.

      Fix part A: after a successful tarball extract + plugin.json
      write, list `<cacheRoot>/content/` and `RemoveAll` any subdirectory
      whose name isn't the new `c.Version`. One `afero.ReadDir` + a
      selective remove loop.

      Fix part B: validate `pj.Version` with the same allowlist
      task-021 establishes for skill names (no empty, no `.`, no `..`,
      no `/` or `\`, no leading `.`). Reject the refresh entirely if the
      upstream version is unsafe — the catalog stays at its prior good
      state.

      Test: simulate two successive refreshes with different versions
      and assert the old `content/<v1>/` subtree is gone after the second
      refresh; assert a refresh with `pj.Version = ".."` is rejected and
      the cache is untouched.
    status: completed
    dependencies:
      - task-021
    source: review
    acceptance_criteria:
      - "Refresh prunes stale content/<version>/ subtrees after a successful refresh; only the current pj.Version remains"
      - "Refresh rejects an upstream plugin.json with an unsafe Version (validated against the same allowlist as skill names)"
      - "Test covers two successive refreshes with different versions (stale dir removed) and one refresh with pj.Version='..' (rejected, prior cache intact)"
      - "make test / make fmt-check / make lint all clean"
    completed_at: 2026-05-27T17:11:22Z

