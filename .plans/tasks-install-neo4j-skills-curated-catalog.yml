  - id: task-015
    title: "Collapse list + check into one inventory abstraction"
    description: |
      `common/skill/list.go` and `common/skill/check.go` ship as parallel
      implementations of the same idea: build "one row per (self + catalog)
      × agents", classify status, render JSON/table/toon. Each owns its own
      Row struct (ListRow / CheckRowView), its own JSON shape (listResultRow
      / checkResultRow), its own AsArray, its own MarshalJSON, its own
      iteration helper (rowsForSkill / checkRowsForSkill), its own status
      classifier (statusFor / checkStatus). Check is literally
      `list().filter(installed).failIf(driftOrUnknownVersion)`. Two copies
      of the iteration + classification will drift the moment anyone adds
      a column — `list.go` already renders `installed` as `"yes"/"no"` via
      `boolStr` while check has no installed column at all.

      Refactor: introduce one `InventoryRow` carrying everything both leaves
      need (skill, source, *Agent, detected, installed, installed_version,
      available_version, status) and one `BuildInventory(fs, binaryName,
      version, cat) []InventoryRow` builder. `list` renders all rows;
      `check` filters to installed rows and returns a ValidationError when
      any row's status is `drift` or `unknown-version`. One status
      classifier (`statusFor` already covers all four states; delete
      `checkStatus`). One JSON shape (or keep two thin render funcs that
      select the column subset). One iteration. Delete the duplicate
      `rowsForSkill` / `checkRowsForSkill` pair.
    status: completed
    dependencies: []
    source: review
    acceptance_criteria:
      - "Single InventoryRow + BuildInventory(...) used by both list.go and check.go"
      - "checkRowsForSkill and rowsForSkill are gone (one iteration helper remains)"
      - "checkStatus is deleted; statusFor is the single classifier"
      - "All existing list_test.go + check_test.go cases pass with the unified builder"
      - "make test / make fmt-check / make lint / make generate-check all clean"
    completed_at: 2026-05-27T17:00:00Z

