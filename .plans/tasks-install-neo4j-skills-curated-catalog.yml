  - id: task-017
    title: "Unify skill-name resolver across install / print / remove"
    description: |
      `catalog_helpers.go:resolveCatalogSkillSource` and
      `print.go:resolvePrintSource` are the same five-step branch
      (empty → self bundle; ResolveSelf → self bundle; catalog.Lookup →
      catalog skill; isAgentName → did-you-mean-agent hard-break; otherwise
      → unknown-skill). The only delta is return type: install needs
      `Source` (FS + Version for frontmatter injection), print needs
      `fs.FS` (no version injection). One resolver returning `Source`
      satisfies both — print discards `.Version`. Print's "no network"
      constraint is satisfied by passing `cat == nil` (caller decides
      whether to refresh), not by forking the function.

      While there, replace `remove.go:catalogSkillKnown` (the third walk
      over `cat.Skills`) with a call to the same resolver (or to
      `cat.Lookup`, discarding the FS). Three places that load+inspect the
      catalog by name should be one.
    status: completed
    dependencies: []
    source: review
    acceptance_criteria:
