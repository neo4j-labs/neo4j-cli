  - id: task-025
    title: "Fix ValidSkillName to reject embedded whitespace (\\n / \\r / \\t / space)"
    description: |
      CI security-review bot caught this. Found by the `golang-security`
      skill running in `security-review` GitHub Action on PR #178.

      `common/skill/catalog/catalog.go:155 ValidSkillName` doc-comment
      claims it rejects "names containing whitespace", but the
      implementation only catches LEADING/TRAILING whitespace via
      `strings.TrimSpace(name) != name`. Embedded characters like `\n`,
      `\r`, `\t`, or interior space pass through unchecked. The check
      currently does:

          if strings.TrimSpace(name) != name { return false }

      Real risk: a compromised upstream `plugin.json` could set
      `"version": "1.0.0\nmalicious: payload"`. This currently passes
      `ValidSkillName`, gets written as a path component via
      `contentPath` (creates a directory with a newline on Linux), and
      gets injected into installed SKILL.md frontmatter via
      `injectVersion`, corrupting YAML and inserting content AI agents
      would read as instructions — prompt injection.

      This is the follow-on from the MEDIUM #4 frontmatter-injection
      finding in the original golang-security audit, which I'd downgraded
      because upstream-control implies SKILL.md control. The bot is right
      that the cheap fix here closes the legibility gap regardless.

      Fix: tighten the check to also reject embedded whitespace. The bot's
      suggested patch:

          if strings.TrimSpace(name) != name ||
             strings.ContainsAny(name, " \t\n\r") {
              return false
          }

      Test: add cases for `"foo bar"`, `"foo\nbar"`, `"foo\tbar"`,
      `"foo\rbar"` to the existing `TestValidSkillName` table — all should
      return false.
    status: completed
    dependencies: []
    source: review
    acceptance_criteria:
      - "ValidSkillName returns false for names containing embedded \\n, \\r, \\t, or interior space"
      - "Existing valid names ('foo', 'neo4j-cypher-skill', etc.) still return true"
      - "Test coverage expanded to embedded-whitespace cases"
      - "make test / make fmt-check / make lint all clean"
    completed_at: 2026-05-27T17:52:53Z

