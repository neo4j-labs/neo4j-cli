  - id: task-021
    title: "Fix role get to check existence before querying privileges (REQ-F-052)"
    source: qa
    description: |
      role/get.go treats an empty result from SHOW ROLE $name PRIVILEGES as
      "role not found". A freshly created role with no granted privileges returns
      an empty privilege set — not a not-found condition — so the current code
      gives a false not_found (exit 3) for any empty role.

      Fix: before querying privileges, call roleExecFn with
        SHOW ROLES WHERE name = $name
      If that returns zero rows, return clierr.NewNotFoundError("role %q not found", name).
      Otherwise call SHOW ROLE $name PRIVILEGES; if that returns zero rows,
      return an empty result (exit 0, empty array) rather than not_found.

      Update get_test.go to cover:
        - existing role with privileges → returns privilege rows (existing test)
        - existing role with no privileges → empty list (exit 0)
        - nonexistent role → not_found (exit 3)

      Run make test, make fmt-check, make lint.
    status: not_started
    dependencies:
      - task-009
    acceptance_criteria:
      - "'role get <new-empty-role>' returns an empty JSON array (exit 0), not not_found"
      - "'role get <nonexistent>' returns not_found (exit 3)"
      - "get_test.go covers empty-privilege and not-found cases"
      - "make test passes; make fmt-check and make lint pass clean"

