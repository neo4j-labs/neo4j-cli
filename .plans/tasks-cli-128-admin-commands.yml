               SET USER STATUS, SET PASSWORDS, SET USER HOME DATABASE, ALTER USER,
               RENAME USER, USER MANAGEMENT, CREATE DATABASE, DROP DATABASE,
               DATABASE MANAGEMENT, SHOW PRIVILEGE, ASSIGN PRIVILEGE, REMOVE PRIVILEGE,
               PRIVILEGE MANAGEMENT, EXECUTE PROCEDURE, EXECUTE BOOSTED PROCEDURE,
               EXECUTE ADMIN PROCEDURES, EXECUTE FUNCTION, EXECUTE BOOSTED FUNCTION,
               ALL ON PROCEDURES, ALL ON FUNCTIONS, IMPERSONATE, ALL DBMS PRIVILEGES,
               SERVER MANAGEMENT, COMPOSITE DATABASE MANAGEMENT, ALIAS MANAGEMENT
        2. Remove FIND from validActions.
        3. Remove the dbmsActions map (replace with category lookups).
        4. In buildPrivilegeCypher:
