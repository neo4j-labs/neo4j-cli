               CREATE NEW PROPERTY NAME, NAME MANAGEMENT, ALL DATABASE PRIVILEGES,
               SHOW TRANSACTION, TERMINATE TRANSACTION, TRANSACTION MANAGEMENT
             catDbms: CREATE ROLE, DROP ROLE, ASSIGN ROLE, REMOVE ROLE, SHOW ROLE,
