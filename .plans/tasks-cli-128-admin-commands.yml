      neo4j-cli/app/app.go so it appears as 'neo4j-cli admin'. Add the Neo4j
      copyright header to all new .go files. Run go build to confirm the tree compiles.
    status: completed
    dependencies:
      - task-001
    acceptance_criteria:
      - "'neo4j-cli admin --help' shows database, user, and role subcommands"
      - "--credential flag is persistent and inherited by all admin subcommands"
      - "go build ./... produces no errors"
      - "All new .go files carry the Neo4j copyright header"
    completed_at: "2026-06-04T09:00:00Z"

