    completed_at: "2026-06-04T09:45:00Z"

  - id: task-004
    title: "database subtree: create, drop, start, stop with --wait and --yes"
    description: |
      Create create.go, drop.go, start.go, and stop.go under the database subtree.
      All require --rw. drop requires --yes confirmation (y/N prompt or error if
      non-TTY without --yes, same pattern as docker delete). create and start accept
      --wait and poll SHOW DATABASE <name> YIELD currentStatus at 1-second intervals
      (60s timeout) until currentStatus="online"; stop --wait polls until
      currentStatus="offline". Emit progress messages to stderr during polling
      (follow docker create --wait style). Write colocated tests.
    status: completed
    dependencies:
      - task-003
    acceptance_criteria:
      - "'database create <name> --rw' executes 'CREATE DATABASE <name> IF NOT EXISTS'"
      - "'database create <name> --wait --rw' blocks and polls until currentStatus=online, emitting progress to stderr"
      - "'database stop <name> --wait --rw' polls until currentStatus=offline"
      - "'database drop <name> --rw --yes' executes DROP DATABASE without prompting; without --yes prompts interactively or errors on non-TTY"
      - "All four commands require --rw; omitting it produces a usage error"
      - "All four have >=2 flush-left Example invocations including --rw"
      - "Unit tests cover happy path, --wait timeout, and --yes/non-TTY error paths"
    completed_at: "2026-06-04T12:30:00Z"

