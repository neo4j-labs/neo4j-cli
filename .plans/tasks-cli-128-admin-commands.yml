  - id: task-018
    title: "privilege subtree: grant, deny, revoke"
    description: |
      Create grant.go, deny.go, and revoke.go under the privilege subtree, plus a
      shared helpers.go containing buildPrivilegeCypher.

      buildPrivilegeCypher(action, resource, qualifiers) constructs the ON-resource
      clause and entity+property qualifiers:
        - Action: uppercase + replace _ with space (e.g. all_graph_privileges → ALL GRAPH PRIVILEGES)
        - Resource: --on-dbms → "ON DBMS"; --on-database <n> → "ON DATABASE <n>";
          default/--on-graph <n> → "ON GRAPH <n>" + entity + property clause
        - Property clause: {*} when --property absent; {p1, p2, ...} when --property set
        - Entity clause: ELEMENTS * (neither flag); NODES l1, l2 (--node-label only);
          RELATIONSHIPS t1, t2 (--relationship-type only)
