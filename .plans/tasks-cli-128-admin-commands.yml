      within the admin package (currently only runAdminStatement is called from
      RunAdminStatement itself, so no other internal callers to update). The exported
      name is already used by sub-packages via injection — no change needed there.
    status: completed
    dependencies:
      - task-010
    acceptance_criteria:
      - "Only one function named RunAdminStatement exists in admin package (no runAdminStatement private alias)"
      - "make test passes with zero failures"
      - "make fmt-check and make lint pass clean"
