  - id: task-024
    title: "Write commands emit updated resource after mutation (REQ-F-055)"
    source: qa
    description: |
      All non-drop mutating commands currently exit 0 with no output, requiring
      callers to issue a follow-up get to observe the mutation. Per REQ-F-055,
      write commands should emit the affected resource using the same --format
      path as the corresponding read command.

      After each mutation, run the appropriate follow-up query using the same
      package-level execFn seam and pass the result through commonoutput.PrintBodyMap
      with the same field list as the read command. Mapping:

        database create/start/stop  → SHOW DATABASE $name        (fields from get.go)
        user create/set-password/
          suspend/activate          → SHOW USERS WHERE user=$name (fields from get.go)
        user rename                 → SHOW USERS WHERE user=$newName
        role create                 → SHOW ROLES WITH USERS WHERE role=$name
        role grant/revoke           → SHOW USERS WHERE user=$user

      Drop commands produce no output on success (resource is gone); no change needed.

      Implementation notes:
