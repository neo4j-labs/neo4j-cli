  - id: task-035
    title: "Wire --debug to Bolt driver and add Cypher trace logging in boltAdminRunner (REQ-F-046, REQ-F-063)"
    source: security-review
    status: pending
    description: |
      `--debug` / `NEO4J_DEBUG=1` is currently a silent no-op for admin commands.
      `dbconn.ResolveConn` sets `conn.Debug = true` when the flag or env var is active,
      but `boltAdminRunner.run()` in `admin/run.go` never reads `conn.Debug`.

      Two changes to `boltAdminRunner.run()` in `neo4j-cli/internal/subcommands/admin/run.go`:

      1. **Bolt driver debug logging:** When `conn.Debug` is true, configure the driver
         with debug-level logging inside the `func(c *config.Config)` closure:
           if conn.Debug {
               c.Log = neo4j.ConsoleLogger(neo4j.DEBUG)
           }

      2. **Cypher trace line:** Immediately before calling `tx.Run(ctx, cypher, params)`,
         when `conn.Debug` is true, write to `os.Stderr`:
           fmt.Fprintf(os.Stderr, "[debug] admin cypher: %s\n", cypher)
           if len(params) > 0 {
               fmt.Fprintf(os.Stderr, "[debug] admin params: %s\n", redactParams(params))
           }
         `redactParams` is a new unexported helper in `run.go` that renders the params
         map as a string, replacing the value of any key that case-insensitively contains
         "password", "passwd", "secret", "token", "key", or "credential" with "***".
         Example output: `map[name:alice password:***]`.

      Add a unit test `TestRedactParams` in `run_test.go` that calls `redactParams`
      directly and asserts password/secret keys are scrubbed while non-secret keys
      (e.g. "name") pass through unchanged.

      No change to the `queryRunner` interface or `fakeQueryRunner` seam — the debug
      path lives inside `boltAdminRunner.run()` which tests never exercise directly.

      Run make test, make fmt-check, make lint as final gates.
    dependencies:
      - task-015
    acceptance_criteria:
      - "boltAdminRunner.run() reads conn.Debug and passes neo4j.ConsoleLogger(neo4j.DEBUG) to the driver config when true"
      - "boltAdminRunner.run() writes '[debug] admin cypher: <cypher>' to os.Stderr before tx.Run when conn.Debug is true"
      - "boltAdminRunner.run() writes '[debug] admin params: <redacted>' to os.Stderr when conn.Debug is true and params is non-empty"
      - "redactParams replaces values of keys matching password/passwd/secret/token/key/credential (case-insensitive) with '***'"
      - "redactParams passes through non-secret keys unchanged"
      - "TestRedactParams covers redactParams with a table of secret and non-secret keys"
      - "make test passes; make fmt-check and make lint pass clean"

  - id: task-036
    title: "Prefix all admin Cypher with CYPHER 25; translate unsupported-version error (REQ-F-064)"
    source: qa
    status: pending
    description: |
      All admin Cypher statements should be prefixed with "CYPHER 25 " to pin the
      Cypher language version. This eliminates cross-version syntax ambiguity and
      removes the need to worry about syntax differences when targeting Neo4j 2025.x.
      Servers that do not support CYPHER 25 (older Neo4j versions) will return a
      SyntaxError; that error must be translated into a clear, actionable message.

      Changes to neo4j-cli/internal/subcommands/admin/run.go:

      1. In RunAdminStatement (or boltAdminRunner.run()), prepend "CYPHER 25 " to
         the cypher string before passing it to tx.Run:
           cypher = "CYPHER 25 " + cypher
         This applies universally — all admin commands gain the prefix without any
         per-leaf change.

      2. In translateNeo4jError, add a new case for the unsupported-version error.
         Neo4j servers that don't support CYPHER 25 return SyntaxError with a message
         containing "Invalid input 'CYPHER'" (or similar). Add a check:
           ne.Code == "Neo.ClientError.Statement.SyntaxError" &&
           (strings.Contains(ne.Msg, "Invalid input 'CYPHER'") ||
            strings.Contains(ne.Msg, "version") && strings.Contains(ne.Msg, "not supported"))
         Translate to:
           clierr.NewValidationError("admin commands require Neo4j 2025.x or later " +
             "(CYPHER 25 language version is not supported by this server)")
         Place this check BEFORE the generic ClientError fallthrough so it takes
         priority.

      3. Update all unit tests in run_test.go and in every leaf *_test.go that asserts
         on the exact Cypher string passed to fakeQueryRunner: prepend "CYPHER 25 "
         to all expected Cypher strings. Also add a test in run_test.go for the new
         error translation path: inject a *neo4j.Neo4jError with Code
         "Neo.ClientError.Statement.SyntaxError" and Msg containing
         "Invalid input 'CYPHER'" and assert the result is a validation_error with
         the expected message.

      The --debug trace line (REQ-F-063) shows the cypher after prefixing; no
      separate change needed there if the prefix is added before tx.Run is called.

      Run make test, make fmt-check, make lint as final gates.
    dependencies:
      - task-001
    acceptance_criteria:
      - "RunAdminStatement (or boltAdminRunner.run()) prepends 'CYPHER 25 ' to every cypher string"
      - "All leaf command tests updated: expected Cypher strings include the 'CYPHER 25 ' prefix"
      - "translateNeo4jError translates SyntaxError with 'Invalid input CYPHER' to the version-requirement message"
      - "run_test.go has a test case for the unsupported-version SyntaxError path"
      - "The version-error translation takes priority over the generic SyntaxError ClientError path"
      - "make test passes; make fmt-check and make lint pass clean"
