tasks:
  - id: task-001
    title: "Execution helper: queryRunner interface, runAdminStatement, error translation"
    description: |
      Create neo4j-cli/internal/subcommands/admin/run.go with the queryRunner
      interface (test seam), a default Bolt-backed implementation, and
      runAdminStatement(ctx, cred, cypher, params). The helper resolves the dbms
      credential, opens an ExecuteWrite session targeting the system database, and
      translates errors: UnsupportedAdministrationCommand -> "(requires Enterprise
      edition)" hint or "(not supported on Aura)" hint when the message contains the
      Aura KB URL; Community SET STATUS / HOME DATABASE errors -> clear
      Community-limitation message; RENAME USER ArgumentError about non-native auth
      -> "renaming users is not supported on Aura connections". Study
      neo4j-cli/query/run.go and neo4j-cli/query/connect.go for the Bolt connection
      pattern to reuse.
    status: completed
    dependencies: []
    acceptance_criteria:
      - "runAdminStatement executes Cypher via ExecuteWrite targeting the system database"
      - "UnsupportedAdministrationCommand without Aura URL appends '(requires Enterprise edition)'"
      - "UnsupportedAdministrationCommand containing the Aura KB URL appends '(not supported on Aura — use the Aura Console or API)'"
      - "Errors matching 'SET STATUS is not available in community edition' are translated to a clear Community-limitation message"
      - "RENAME USER ArgumentError matching 'non-native' auth text is translated to 'renaming users is not supported on Aura connections (Aura uses a non-native authentication provider)'"
      - "All error-translation paths are covered by unit tests using a fakeQueryRunner"
    completed_at: "2026-06-04T08:30:00Z"

