  - id: task-001
    title: "Create SECURITY.md at repo root with five-section trust-root doc"
    description: |
      Create a new flush-left Markdown file `SECURITY.md` at the repo
      root (NOT under `.github/`). Five H2 sections in this exact order:
      `## Reporting a vulnerability` (advertises security@neo4j.com and
      tells reporters not to file public GitHub issues for security
      reports); `## Supply-chain trust root for \`neo4j-cli update\``
      enumerating four trust links (Go TLS vs. host root store; TLS
      certs for the five-host allowlist github.com / api.github.com /
      codeload.github.com / objects.githubusercontent.com /
      release-assets.githubusercontent.com; integrity of GitHub
      release-assets storage for neo4j-labs/neo4j-cli; SHA256
      `…_checksums.txt` manifest verified BEFORE archive extraction);
      `## Accepted residual risks` (three bullets: GitHub Actions
      release-workflow compromise, release-assets storage compromise,
      single-channel substitution; close with one sentence noting the
      next-step mitigations are not yet implemented);
      `## Mitigation roadmap (not committed)` (three bullets:
      sigstore/cosign signed releases with verification in `update`,
      reproducible builds, out-of-band publication of release public
      keys — the `(not committed)` qualifier MUST be in the heading);
      `## Review cadence` (one short paragraph, deliberately vague — no
      calendar binding, no retrospective binding). No Oplane references,
      no internal threat-model IDs, no file:line anchors into the source
      tree. Target ≤120 lines total.
    status: completed
