tasks:
  - id: task-001
    title: "Add update check subcommand and drop --check flag"
    description: |
      Create `neo4j-cli/internal/subcommands/update/check.go` defining
      `newCheckCmd(cfg, bundle, skillName)` with `Use: "check"`, flags
      `--pre-releases` (bool) and `--version` (string), and a RunE that calls
      the existing `runUpdate(ctx, cmd, cfg, runOpts{check: true, …})`. Do
      NOT register `--force` on the subcommand.

      In `neo4j-cli/internal/subcommands/update/update.go` remove the `check`
      var, `checkFlag` const, the `cmd.Flags().BoolVar(&check, checkFlag, …)`
      line, and the `check: check` entry inside the `runOpts{}` literal in
      the parent's RunE. Mount the new subcommand via
      `cmd.AddCommand(newCheckCmd(cfg, bundle, skillName))`.

      Update internal doc comments that still reference `--check`:
      `update.go` (`runUpdate` flow block at lines ~273-285 and
      `refreshSkillBundles` block at line ~453), `install_method.go:72`, and
      `neo4j-cli/internal/versioncheck/cache.go:10`. Keep `runOpts.check`
      field — `runUpdate` still branches on it and the JSON output preserves
      the `check: bool` field per the original REQ-F-018.

      License header on the new file must match the rest of the package
      (`// Copyright (c) "Neo4j" / // Neo4j Sweden AB [http://neo4j.com]`).
    status: completed
    dependencies: []
    acceptance_criteria:
      - "`check.go` defines `newCheckCmd` with `Use: \"check\"` and the two flags `--pre-releases`, `--version` (and no `--force`)"
      - "Parent `update` command no longer declares the `--check` boolean flag"
      - "`cmd.AddCommand(newCheckCmd(cfg, bundle, skillName))` is wired in `update.go`"
      - "All four doc-comment locations (`update.go` flow + skill-refresh blocks, `install_method.go:72`, `versioncheck/cache.go:10`) reference `update check` instead of `--check`"
      - "New file carries the standard Neo4j copyright header; `make build` succeeds"
    completed_at: 2026-05-10T20:00:00Z

  - id: task-002
    title: "Migrate update_test.go and add colocated check_test.go"
    description: |
      In `neo4j-cli/internal/subcommands/update/update_test.go`:

      - Keep all existing `runWithOpts(…, runOpts{check: true})` test cases
        verbatim (the internal flow is unchanged).
      - Migrate the one cobra-args case around line 756
        (`cmd.SetArgs([]string{"--check"})`) to drive the new subcommand —
        either retarget to `cmd.SetArgs([]string{"check"})` against the
        parent or relocate the case into the new `check_test.go`.
      - Drop `"check"` from the flag-registration assertion loop at line
        ~405 for the parent (`[]string{"pre-releases", "check", "version",
        "force"}` becomes `[]string{"pre-releases", "version", "force"}`).

      Add `neo4j-cli/internal/subcommands/update/check_test.go`, style
      mirroring `common/skill/check_test.go`. Cover:

      - Subcommand is mounted on the `update` parent
        (`cmd.Find([]string{"check"})` returns non-nil).
      - Flags `pre-releases` and `version` are registered on the subcommand;
        `force` and `check` are NOT.
      - RunE plumbs through to `runUpdate` with `check: true` — stub the
        package-level seams (`latestFn`, `detectFn`, `swapFn` and skill
        seams as needed) and assert swap is never invoked, JSON shape sets
        `check: true` / `updated: false`, and a `clierr.NewUsageError`
        bearing exit code 1 is returned when newer is available.
      - `--pre-releases` and `--version v0.1.0-alpha.10` reach
        `resolveTarget` correctly.
    status: completed
    dependencies:
      - task-001
    acceptance_criteria:
      - "`update_test.go` cobra-args case no longer uses `--check`; flag-registration loop omits `\"check\"` for the parent"
      - "New `check_test.go` exists colocated with `check.go`"
      - "Tests assert subcommand mounting, registered flags, and absence of `--force` / `--check` on the subcommand"
      - "Tests use the existing `latestFn` / `detectFn` / `swapFn` seams to verify swap is never invoked and JSON sets `check: true`, `updated: false`"
      - "`make test` passes"
    completed_at: 2026-05-10T20:30:00Z

