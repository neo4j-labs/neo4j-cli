tasks:
  - id: task-001
    title: "Scaffold docker package: dockerClient interface, labels, parent cmd, app mount"
    description: |
      Create `neo4j-cli/internal/subcommands/docker/` with the package skeleton.
      `client.go` defines a `dockerClient` interface (Run, Start, Stop, RemoveForce, PsAll, Inspect) with a default `execClient` that shells out via `os/exec` and caches the result of `exec.LookPath("docker")`; missing docker returns a `clierr.NewUsageError` with the install hint (REQ-F-060, REQ-F-061).
      `labels.go` exports label key constants (`org.neo4j.cli.managed`, `...edition`, `...version`, `...bolt-port`, `...http-port`, `...ephemeral`) and a `Container` metadata struct with an `Inspect(name)` helper that returns it.
      `docker.go` defines `NewCmd(cfg *clicfg.Config) *cobra.Command` with `Use: "docker"`, `Short`, and `Long` (≤80 lines per AGENTS.md "Cobra Command Layout"); leaves are added in later tasks.
      Mount in `neo4j-cli/app/app.go` via `cmd.AddCommand(docker.NewCmd(cfg))` between the existing `query` and `skill` lines.
      Add `helpers_test.go` with a `fakeDockerClient` implementing the interface for use by all leaf tests.
      Every new `.go` file carries the Neo4j copyright header.
    status: completed
    dependencies: []
    acceptance_criteria:
