  - id: task-019
    title: "writeEnvFile: temp file + atomic rename to close symlink-follow and chmod-TOCTOU"
    description: |
      `neo4j-cli/internal/subcommands/docker/create.go:345-365` (writeEnvFile) opens `<path>` with `O_WRONLY|O_CREATE|O_TRUNC|0o600` and then calls `fs.Chmod(path, 0o600)`. Two interlocking issues surfaced in the golang-security review:
      - **Symlink follow on open**: POSIX `open()` follows symlinks by default; an attacker with write access to the containing dir can plant `<path>` as a symlink to `~/.ssh/authorized_keys` or similar and have the generated Neo4j password written there with `O_TRUNC` semantics.
      - **TOCTOU between OpenFile and Chmod**: the small window between the two syscalls combined with a swap-in symlink lets an attacker land the credentials in an unowned target where our subsequent Chmod fails (we return the chmod error but the credential is already on disk in the wrong place).
      DREAD ≈ 4.0 (Medium). Threat surface is a shared-host / shared-`/tmp` model — narrow for single-user dev boxes, real for shared CI / cloud-shells. Operator decision: **temp file + atomic rename** (user's pick).
      Implementation in `writeEnvFile`:
      ```go
      func writeEnvFile(fs afero.Fs, path, contents string) error {
          dir := filepath.Dir(path)
          // O_EXCL guarantees we own the temp file we open; .neo4j-cli-env-<rand>
          // keeps it discoverable on a stray ^C.
          tmp, err := afero.TempFile(fs, dir, ".neo4j-cli-env-")
          if err != nil { return fmt.Errorf("docker create: create temp env-file in %s: %w", dir, err) }
          tmpPath := tmp.Name()
          // Wire a cleanup that fires on any error path.
          cleanup := func() { _ = fs.Remove(tmpPath) }
          if _, werr := tmp.WriteString(contents); werr != nil {
              _ = tmp.Close(); cleanup()
              return fmt.Errorf("docker create: write temp env-file %s: %w", tmpPath, werr)
          }
          if cerr := tmp.Close(); cerr != nil {
              cleanup(); return fmt.Errorf("docker create: close temp env-file %s: %w", tmpPath, cerr)
          }
          // Chmod while we still own the temp file. Atomic w.r.t. external symlinks
          // because the temp path is fresh and O_EXCL-guarded.
          if cerr := fs.Chmod(tmpPath, 0o600); cerr != nil {
              cleanup(); return fmt.Errorf("docker create: chmod temp env-file %s: %w", tmpPath, cerr)
          }
          // Atomic rename (POSIX). On Windows fs.Rename will return an error if
          // the destination exists on older Go; modern Go handles atomic replace
          // on NTFS. If rename fails, cleanup and surface — do not leave the
          // temp file behind.
          if rerr := fs.Rename(tmpPath, path); rerr != nil {
              cleanup(); return fmt.Errorf("docker create: rename env-file to %s: %w", path, rerr)
          }
          return nil
      }
      ```
      Notes:
      - `afero.TempFile(fs, dir, prefix)` works on both `afero.OsFs` (production) and `afero.MemMapFs` (tests).
      - Use `path/filepath` (not `path/path`) for `Dir` so Windows separators are handled.
      - `O_EXCL` is set internally by `TempFile` via its random suffix; the call returns an error if the temp path already exists.
      - **Behavior change**: an operator-intended symlink at the target gets REPLACED with a regular file. Document this in `Long:` / additions.md so operators using `--env-file ~/.creds/n.env` where `~/.creds/n.env` is a symlink to a vault-mounted file know the symlink will be clobbered.
      Tests (`create_test.go`):
      - Existing `TestCreate_Ephemeral_EnvFile_WritesFile` / `TestCreate_Ephemeral_EnvFile_ChmodsPreexistingFileTo0600` should still pass with the new implementation.
      - New: pre-create a symlink at the target path in the memfs pointing to a different file. Run create; assert the final path is a REGULAR file with mode 0o600 and the documented blob; assert the original symlink target is unchanged.
      - New: simulate rename failure (afero memfs hook OR a fake fs wrapper); assert no temp file is left on disk.
      - New: simulate chmod failure; assert no temp file is left on disk.
      - New: target dir does not exist → error; no temp file.
      Update the `Long:` string on `create.go --env-file` flag to mention "writes via a temp file in the same directory and atomically renames; a pre-existing symlink at the path will be replaced." Regenerate skill bundle.
      Also update `additions.md` and the README "Local Neo4j (Docker)" symlink note.
    status: completed
    dependencies:
      - task-015
    acceptance_criteria:
      - "writeEnvFile creates a `.neo4j-cli-env-<rand>` temp file in the target's directory via afero.TempFile, writes + chmods + renames atomically"
      - "any error path (write, close, chmod, rename) removes the temp file before returning"
      - "tests cover: existing happy path, pre-existing-symlink → replaced with regular file mode 0o600 (original symlink target untouched), rename failure → no temp left, chmod failure → no temp left, dir missing → error"
      - "create.go --env-file flag Long: mentions the symlink-replacement behaviour; README + additions.md updated; bundle regenerated"
      - "make fmt-check, make lint, make test, make license-check all pass; security review verifies the new write path has no symlink-follow + no chmod-TOCTOU window"
