  - id: task-024
    title: "Add --data-dir / --logs-dir / --import-dir flags on `docker create` for host-side volume mounts"
    description: |
      Neo4j stores DB data at `/data`, logs at `/logs`, and import CSVs at `/import` inside the container. Without a volume mount these live in the container layer and are lost on `docker delete`. Add three optional host-side bind-mount flags so operators can persist or inspect each directory from the host.

      User-locked decisions:
      - **Default**: empty — no mount unless the flag is set explicitly. Matches the current behaviour (no surprise filesystem writes outside docker storage). Operators opt in per directory.
      - **Scope**: all three flags in this single task (`--data-dir`, `--logs-dir`, `--import-dir`).

      ### Flags (new on `docker create`)

      | Flag | Maps to | Notes |
      |---|---|---|
      | `--data-dir <path>` | `-v <host>:/data` | Persistent Neo4j data. Survives `docker delete`. |
      | `--logs-dir <path>` | `-v <host>:/logs` | Grep / tail Neo4j logs from the host. |
      | `--import-dir <path>` | `-v <host>:/import` | Host-side CSVs for `LOAD CSV`. |

      Each flag is independent; you can set one, two, or all three. Each is empty by default.

      ### Behaviour per flag

      1. **Path expansion**: support `~` (HOME) and environment variables via the existing helper if one exists. Search `common/clicfg/`, `common/clicfg/credentials/`, and `neo4j-cli/query/` for `expandPath` or similar — AGENTS.md "Windows CI Gotchas" mentions `expandPath` helpers, so a reusable one likely exists. If none is reusable, add a small private `expandPath(s string) (string, error)` helper in `docker/` package — keep it minimal (HOME + `os.ExpandEnv`); don't shell out. Test the helper.

      2. **Resolve to absolute path** via `filepath.Abs` after expansion so docker doesn't choke on relative paths.

      3. **mkdir-if-missing**: `os.MkdirAll(resolved, 0o755)` (NOT 0o700 — the official Neo4j docker image's entrypoint runs the chown step that adjusts ownership for the container's neo4j user; 0o755 lets docker's root inspect the dir during that step). Log `info: created host directory <path>` to stderr on first creation.

      4. **Compose into argv**: append `-v <resolved>:/data` (or /logs, /import) per flag. Order in argv doesn't matter semantically; keep the existing ports → env → labels → image order and slot volume args between env and labels.

      5. **Incompatibility with --ephemeral**: any of the three volume flags combined with `--ephemeral` → `clierr.NewUsageError("--%s is incompatible with --%s (ephemeral containers do not persist data; mount and ephemeral are mutually exclusive)", "<flag>", ephemeralFlag)`. Fires BEFORE port pre-flight so a misconfigured invocation doesn't waste cycles on listener checks.

      6. **Symlink and path-traversal hygiene**: NOT in scope. The operator explicitly supplies the path; we don't follow-or-refuse symlinks here (unlike `--env-out-file` which is a credential write target). If the host dir is a symlink, the bind mount follows it — that's docker's behaviour, document it but don't try to override.

      ### Files to touch

      1. `neo4j-cli/internal/subcommands/docker/create.go`:
         - Three new string flags (`--data-dir`, `--logs-dir`, `--import-dir`) and three local vars + consts.
         - New helper `mountFlag(flag, hostPath, containerPath string) ([]string, error)` or inline expansion+abs+mkdir per flag.
         - Argv composition (slot `-v ...` args before labels).
         - --ephemeral compat checks (one per flag).
         - Long: + Example: blocks updated to mention the three flags (one new example showing `--data-dir ~/n4j-data` is enough; don't bloat the Example block).

      2. `neo4j-cli/internal/subcommands/docker/create_test.go`:
         - For each flag, a happy-path test asserting the `-v <abs-path>:/data` (or /logs, /import) appears in argv.
         - Path expansion test: `--data-dir ~/foo` → resolved to `<HOME>/foo`.
         - mkdir test: against a memfs (or temp OsFs dir) — flag points at a non-existent path → after RunE, the dir exists with mode 0o755 (use `t.TempDir()` if needed because mkdir on memfs may have quirks per AGENTS.md).
         - Combination test: all three flags set together → all three `-v` args present, exactly once each.
         - Each flag's `--ephemeral` incompatibility test → usage error; no docker call.

      3. `README.md` "Local Neo4j (Docker)" section: add a paragraph + example showing the volume flow:
         ```
         # Persist data on the host so it survives delete + recreate
         neo4j-cli docker create --name dev --data-dir ~/neo4j-dev/data --rw
         neo4j-cli docker delete dev --force --rw
         neo4j-cli docker create --name dev --data-dir ~/neo4j-dev/data --rw  # reuses the same data
         ```
         Document the chown gotcha briefly: "Neo4j inside the container adjusts ownership of the mounted directories at startup; expect the dirs to show up under the container's neo4j UID on the host after first start."

      4. `neo4j-cli/internal/skill/additions.md` docker section: mirror with a short bullet block (one line per flag + one line on the persistence flow).

      5. `AGENTS.md` "Docker Subsystem Notes": one terse line — "Volume flags (`--data-dir`/`--logs-dir`/`--import-dir`) bind-mount host paths to `/data`/`/logs`/`/import`; empty-default = no mount; incompatible with `--ephemeral`."

      6. Regenerate skill bundle: `go generate ./neo4j-cli/internal/skill/...`.

      7. Changelog: not needed (still on unreleased docker tree).

      ### Out of scope for this task

      - Named docker volumes (`--data-volume <volname>` style). If wanted later, separate task.
      - chown management — the official Neo4j image entrypoint handles container-side ownership; we don't try to second-guess it.
      - `--conf-dir` / `--plugins-dir` mounts. Less commonly used in local dev; defer.
      - Re-mounting a volume on an existing container via `docker start`. Docker doesn't support this — volumes are baked at create time. Don't try.
    status: pending
    dependencies:
      - task-015
    acceptance_criteria:
      - "`docker create --data-dir <path>` produces argv containing `-v <abs-path>:/data`; same for `--logs-dir` → `/logs` and `--import-dir` → `/import`"
      - "All three flags default empty — no `-v` arg appears in argv when no flag is set"
      - "Path expansion handles `~` (HOME) and env vars via a reusable helper; resolved path is absolute"
      - "mkdir-if-missing creates the host dir at mode 0o755 and logs `info: created host directory <path>` to stderr"
      - "Any of the three flags combined with `--ephemeral` → `clierr.NewUsageError` mentioning both flag names; no docker call observed"
      - "Tests cover: each flag individually, combination of all three, ~ expansion, mkdir-if-missing, each --ephemeral incompatibility"
      - "README + additions.md document the persist flow and the chown caveat; AGENTS.md gains a one-line subsystem note; skill bundle regenerated"
      - "Live verification: bin/neo4j-cli docker create --name htest --data-dir /tmp/htest-data --rw; ls /tmp/htest-data shows files written by the container; delete + recreate against the same path reuses the existing DB"
      - "make fmt-check, make lint, make test, make license-check all pass"
