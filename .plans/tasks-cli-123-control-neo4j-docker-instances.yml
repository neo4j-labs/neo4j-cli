  - id: task-018
    title: "Replace parsePsOutput and parseInspectOutput stubs (BLOCKER — feature non-functional against real docker without this)"
    description: |
      `neo4j-cli/internal/subcommands/docker/client.go:193-202` defines `parsePsOutput` and `parseInspectOutput` as stubs that return empty values. They were placeholders in task-001 with TODO comments naming task-008 / task-009 as the landing tasks; neither task replaced them. Every docker-package test passes because the `fakeDockerClient` (helpers_test.go) bypasses the stubs entirely. Against a real `docker` binary the feature is non-functional:

      - `docker list` always renders empty (PsAll returns nil entries).
      - `docker get <any>` returns "no managed container named X" (parseInspectOutput returns `Container{Name: name}` with `Managed: false`; the managed-gate refuses it).
      - `docker start / stop / delete` likewise refuse with unknown-name for the same reason.
      - `docker create`'s name-collision detection silently skips the docker-side of the collision set; collisions go straight to docker, which rejects with a daemon error.
      Surfaced by the golang-security review of the branch. This is FUNCTIONAL not security per se (the feature fails closed: no info disclosure, no privilege escalation), but ship-blocking — no end-to-end live-docker run was ever attempted during the implementation loop. Must land before task-016 and task-017 (both updated to depend on task-018) because their behaviour is only observable once Inspect returns real data.
      Implementation:
      1. Replace `parsePsOutput(stdout string) ([]PsEntry, error)`:
         - `docker ps --format '{{json .}}'` emits ONE JSON object per line, separated by newlines. Empty stdout → empty slice + nil error.
         - For each non-empty line, `json.Unmarshal` into a `PsEntry` (the existing struct in client.go already has the right tags).
         - **Fail loud** on the user's decision: any malformed line returns `fmt.Errorf("docker: parse ps output: line %d: %w", lineNo, err)` so version drift surfaces immediately rather than silently empties the list.
         - Use `bufio.Scanner` with an increased buffer (some labels can push lines beyond the default 64KB) — set `scanner.Buffer(make([]byte, 0, 64*1024), 4*1024*1024)`.
      2. Replace `parseInspectOutput(name, stdout string) (Container, error)`:
         - `docker inspect <name>` emits a JSON ARRAY with one element (even for a single container). Decode into a small partial struct with only the fields we need:
           ```go
           type inspectShape struct {
               Name   string `json:"Name"`           // leading "/", strip it
               State  struct {
                   Status  string `json:"Status"`
                   Running bool   `json:"Running"`
               } `json:"State"`
               Config struct {
                   Image  string            `json:"Image"`
                   Labels map[string]string `json:"Labels"`
               } `json:"Config"`
           }
           ```
         - `json.Unmarshal` the stdout as `[]inspectShape`; require exactly one element (`len(shapes) != 1` → fail loud with a parse error mentioning the actual count).
         - Build `Container`: `Name` = `strings.TrimPrefix(shape.Name, "/")` (docker prepends `/`); `Status` = `State.Status`; `Running` = `State.Running`; `Image` = `Config.Image`; `Edition` / `Version` / `BoltPort` / `HTTPPort` from the matching `org.neo4j.cli.*` labels; `Ephemeral` = `labels[LabelEphemeral] == "true"`; `Managed` = `labels[LabelManaged] == "true"`. Do NOT populate `URI` here — that's the leaf's job (REQ-F-031).
         - Fail loud on any json.Unmarshal error: `fmt.Errorf("docker: parse inspect output for %q: %w", name, err)`.
      3. Test fixtures (`client_test.go` or new `parsers_test.go`):
         - Hand-craft realistic JSON fixtures matching Docker's documented shape — DO NOT capture from a live daemon in this task (we'd need docker on CI). Use the JSON from Docker's own engine API docs as the canonical source. Strive for one fixture per parser plus malformed-input cases.
         - `parsePsOutput` cases: empty stdout → empty + nil; one managed container line → one PsEntry; two lines (managed + unmanaged) → two entries; trailing newline tolerated; malformed JSON on second line → parse error mentioning line 2; absurdly large label list (>64KB) handled.
         - `parseInspectOutput` cases: single-element array with full label set → Container populated correctly (assert every field, including Managed=true); empty array → fail-loud parse error; two-element array → fail-loud parse error; missing labels → empty strings + Managed=false (NOT an error — Docker can emit containers without our labels); `Name` with leading `/` is stripped; `State.Running=false` flows through; malformed JSON → parse error with the field name.
      4. Optional follow-up (NOT this task): a smoke test under a build tag matching `query/query_bolt_smoke_test.go` that does `exec.LookPath("docker")` + `docker run` against a real `neo4j:latest-enterprise` image and asserts list/get round-trip. Track as a separate follow-up issue if wanted.
      5. Wire-up: nothing changes in the leaves. `client.go`'s `PsAll` and `Inspect` already call the parsers; replacing the stubs makes the call chain real.
      6. Regenerate skill bundle if any `Long:`/`Example:` text is edited (likely not — this task touches client.go and tests only).
    status: completed
