  - id: task-016
    title: "Distinguish docker Inspect not-found from daemon/permission errors"
    description: |
      Today every `client.Inspect` error is funneled into the unknown-name `clierr.NewUsageError` (REQ-F-032 wording) by `docker get`, `docker start`, `docker stop`, and `docker delete`. That hides genuine operational failures (Docker daemon stopped, socket permission denied, rootless misconfig, daemon timeout) behind a misleading "no managed container named X" message — users chase ghosts instead of starting Docker.
      Fix by adding a typed sentinel error in `neo4j-cli/internal/subcommands/docker/client.go`:
      ```go
      // ErrNotFound signals that docker inspect reported the container does not exist.
      // All other docker errors (daemon down, permission denied, timeout, etc.) are
      // returned with their underlying stderr/exit-code information preserved.
      var ErrNotFound = errors.New("docker: container not found")
      ```
      In `execClient.Inspect`: when `docker inspect` exits non-zero, scan captured stderr for the substring `"No such "` (covers both "No such object" and "No such container" — stable across Docker versions for ≥7 years). On match, wrap and return `fmt.Errorf("%w: %s", ErrNotFound, name)`. Otherwise return a wrapped error that surfaces the docker stderr verbatim (already redacted via `redactArgs` for the argv portion if applicable) so the user can see "Cannot connect to the Docker daemon" etc.
      Update each leaf's check to switch on `errors.Is(err, docker.ErrNotFound)`:
      - `get.go`, `start.go`, `stop.go`, `delete.go`: `if errors.Is(err, docker.ErrNotFound) { return unknownNameError(name) }; if err != nil { return err }`. Same `unknownNameError` helper they already share (or inline construction matching the existing wording).
      - Non-managed (Managed == false) path stays unchanged — that's a separate branch that returns the same unknown-name error.
      Update `helpers_test.go` so `fakeDockerClient` can return either `docker.ErrNotFound` or any other error per call (an `InspectErr` field plus an optional sentinel toggle is the lightest seam). Update existing missing-container test cases across `get_test.go`, `start_test.go`, `stop_test.go`, `delete_test.go` to use `ErrNotFound` specifically; add at least one case per leaf where a daemon-down style error propagates through (verify the user sees the original message, not unknown-name).
      Add a unit test in `client_test.go` (or a new test file) that constructs a fake `*exec.Cmd` failure with stderr `"Error: No such object: foo"` and asserts `Inspect` returns an error matching `errors.Is(err, ErrNotFound)`. Add a second case where stderr is `"Cannot connect to the Docker daemon"` and assert `errors.Is(err, ErrNotFound)` is FALSE.
      Update the `Long:` strings on `get`/`start`/`stop`/`delete` to mention what happens on a daemon error vs an unknown name (one short sentence; bundle regen required).
      No PRD requirement changes — this is a UX refinement to REQ-F-032 / REQ-F-043 / REQ-F-053.
    status: completed
    dependencies:
      - task-015
      - task-018
    acceptance_criteria:
      - "neo4j-cli/internal/subcommands/docker/client.go exports an ErrNotFound sentinel; execClient.Inspect wraps it only when docker stderr contains 'No such '"
      - "get/start/stop/delete each use errors.Is(err, ErrNotFound) → unknown-name; any other Inspect error propagates with the original docker stderr visible"
