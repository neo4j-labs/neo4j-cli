  - id: task-012
    title: "docker delete <name> with TTY confirmation prompt"
    description: |
      Add `delete.go` with `newDeleteCmd(cfg)`. `Annotations: write:true`; `cobra.ExactArgs(1)`; `--force` boolean flag.
      Logic: refuse non-managed containers (REQ-F-053). TTY check via `term.IsTerminal(int(os.Stdin.Fd()))` (or reuse an existing common/ helper — search before adding): on TTY without `--force`, prompt `Delete container <name> and its dbms credential? [y/N]` (default N); on non-TTY without `--force`, return `clierr.NewUsageError("non-TTY caller must pass --force to confirm deletion")` (REQ-F-052).
      On confirmation: shell `docker rm -f <name>` via `dockerClient.RemoveForce`; then call `credentials.DbmsCredentials.Remove(name)` best-effort (missing credential is not an error) per REQ-F-050 and REQ-F-054.
      Add `delete_test.go` table-driven: TTY + y → both removed; TTY + N → neither touched; non-TTY + no --force → usage error; --force → both removed without prompt; missing credential → still succeeds.
      Flush-left `Example:` block with `--rw`.
    status: pending
    dependencies:
      - task-001
    acceptance_criteria:
      - "TTY caller without --force is prompted; 'y' confirms, 'N'/default cancels"
      - "Non-TTY caller without --force exits non-zero with the REQ-F-052 message"
      - "--force skips the prompt regardless of TTY"
      - "Successful delete removes both container (docker rm -f) and matching dbms credential; missing credential is not an error"
      - "Non-managed container refused with unknown-name error; no docker rm call observed"
      - "delete.go has Annotations write:true, Example block, copyright header"
