  - id: task-002
    title: "Bolt readiness probe (bolt_ready.go) reusing the vendored neo4j-go-driver"
    description: |
      Add `bolt_ready.go` exporting `WaitForBolt(ctx context.Context, uri, user, pass string, timeout time.Duration) error`.
      Use the neo4j-go-driver already vendored by `neo4j-cli/query/` (REQ-F-018, REQ-NF-001) — open a session, run `RETURN 1`, close.
      Poll every 500ms until the handshake succeeds or `timeout` elapses; on timeout return `clierr.NewUsageError("container started but Bolt did not become ready within %s; check 'docker logs <name>'", timeout)`.
      Add `bolt_ready_test.go` with a unit test using a closed listener (immediate refusal → poll continues → timeout fires) and a fake-listener that accepts after N polls.
      If the import introduces a cycle with `clicfg`, fall back to `net.Dial` + a raw Bolt v5 hello frame and document the choice in a comment.
    status: completed
    dependencies:
      - task-001
    acceptance_criteria:
      - "WaitForBolt(ctx, uri, user, pass, timeout) returns nil once a Bolt handshake succeeds"
      - "On timeout returns a clierr.UsageError naming the duration and pointing at 'docker logs <name>'"
      - "Reuses the neo4j-go-driver from query/ (or falls back to net.Dial + Bolt v5 hello with an inline comment explaining why)"
      - "bolt_ready_test.go covers: immediate success, success after N retries, timeout"
      - "go test ./neo4j-cli/internal/subcommands/docker/... passes"
    completed_at: 2026-05-15T13:05:00Z

