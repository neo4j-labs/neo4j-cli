  - id: task-017
    title: "TCP fallback for 'docker start --wait' when no stored credential"
    description: |
      Today `docker start <name> --wait` requires a stored dbms credential to authenticate the Bolt handshake; without one it returns `clierr.NewUsageError("--wait on 'docker start' requires a stored dbms credential for %q ...")`. That makes `--wait` unusable for anyone who ran `--no-store-credential` at create time (or who manages credentials externally). Fall back to a TCP-only probe instead of erroring.
      Add a new probe in `neo4j-cli/internal/subcommands/docker/bolt_ready.go`:
      ```go
      // WaitForBoltTCP polls a TCP connection to host:port until it accepts (server is
      // listening) or timeout elapses. This is a weaker readiness check than
      // WaitForBolt — Neo4j may bind the port briefly before it is ready to handle
      // Bolt handshakes — but it is the best we can do without credentials.
      func WaitForBoltTCP(ctx context.Context, host string, port int, timeout time.Duration) error
      ```
      Implementation: same poll cadence as `WaitForBolt` (use the existing `pollInterval` seam). On each poll attempt `net.Dial("tcp", host:port)` with a short per-attempt timeout (~500ms); on success close the conn immediately and return nil. On the overall `timeout` deadline return `clierr.NewUsageError("container started but TCP port %d did not open within %s; check 'docker logs <name>'", port, timeout)`. Add a `tcpDialFn` package var seam matching the existing `probeBoltFn` pattern so tests can simulate success-after-N or always-fail without a real socket.
      In `neo4j-cli/internal/subcommands/docker/start.go`, change the `--wait` flow:
      1. Inspect (already happens) → get bolt port from labels.
      2. Look up credential via `cfg.Credentials.Dbms.Get(name)`.
      3. If credential exists: use `WaitForBolt(...)` as today (authenticated handshake, strongest signal).
      4. If credential is missing (the `clierr.UsageError` "could not find credential" from credentials/dbms.go — match by `errors.As` on the typed error, OR by the existence check `cfg.Credentials.Dbms.Get` returns `nil, err`): write `info: no stored credential for <name>; falling back to TCP probe (not authenticated)\n` to `cmd.ErrOrStderr()`, then call `WaitForBoltTCP(ctx, "localhost", boltPort, waitTimeout)`.
      Remove the hard `--wait requires stored credential` error path. Keep the "container is non-managed" and other Inspect errors unchanged (those still error out via task-016's funnel).
      Update `start_test.go`:
      - Existing `--wait happy / --wait timeout / --wait without credential` cases get reshuffled. Keep authenticated happy/timeout cases. Replace the no-credential-error case with a no-credential-TCP-fallback case: fake `tcpDialFn` returns nil on first call → success; stderr contains the "falling back to TCP probe" info line; `probeBoltFn` is NOT called (assert via a counter).
      - Add a no-credential-TCP-timeout case: fake `tcpDialFn` always errors → timeout error; container is NOT torn down.
      Add `bolt_ready_test.go` cases for `WaitForBoltTCP`: immediate success, success after N retries, timeout, ctx cancelled.
      Update `Long:`/`Example:` on `start` to mention the fallback ("--wait uses the stored dbms credential when present, otherwise falls back to a TCP-only readiness probe"). Bundle regen required.
      No PRD requirement changes — this is a UX refinement to REQ-F-018 (carry the auth-optional behavior over from `create --wait`-style guarantees to `start --wait`).
    status: completed
    dependencies:
