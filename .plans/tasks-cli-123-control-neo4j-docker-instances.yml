      - "dockerClient interface defines Run/Start/Stop/RemoveForce/PsAll/Inspect; execClient lazily calls exec.LookPath(\"docker\") once and caches"
      - "Missing docker returns clierr.NewUsageError(\"docker not found in PATH — install Docker Desktop ... or the docker CLI\")"
