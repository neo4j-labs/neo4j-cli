tasks:
  - id: task-001
    title: "Scaffold docker package: dockerClient interface, labels, parent cmd, app mount"
    description: |
      Create `neo4j-cli/internal/subcommands/docker/` with the package skeleton.
      `client.go` defines a `dockerClient` interface (Run, Start, Stop, RemoveForce, PsAll, Inspect) with a default `execClient` that shells out via `os/exec` and caches the result of `exec.LookPath("docker")`; missing docker returns a `clierr.NewUsageError` with the install hint (REQ-F-060, REQ-F-061).
      `labels.go` exports label key constants (`org.neo4j.cli.managed`, `...edition`, `...version`, `...bolt-port`, `...http-port`, `...ephemeral`) and a `Container` metadata struct with an `Inspect(name)` helper that returns it.
      `docker.go` defines `NewCmd(cfg *clicfg.Config) *cobra.Command` with `Use: "docker"`, `Short`, and `Long` (≤80 lines per AGENTS.md "Cobra Command Layout"); leaves are added in later tasks.
      Mount in `neo4j-cli/app/app.go` via `cmd.AddCommand(docker.NewCmd(cfg))` between the existing `query` and `skill` lines.
      Add `helpers_test.go` with a `fakeDockerClient` implementing the interface for use by all leaf tests.
      Every new `.go` file carries the Neo4j copyright header.
    status: completed
    dependencies: []
    acceptance_criteria:
      - "neo4j-cli/internal/subcommands/docker/{client.go,labels.go,docker.go,helpers_test.go} exist"
      - "dockerClient interface defines Run/Start/Stop/RemoveForce/PsAll/Inspect; execClient lazily calls exec.LookPath(\"docker\") once and caches"
      - "Missing docker returns clierr.NewUsageError(\"docker not found in PATH — install Docker Desktop ... or the docker CLI\")"
      - "label key constants live in labels.go with the org.neo4j.cli.* keys; Container struct + Inspect(name) implemented against the interface"
      - "docker.NewCmd is mounted in neo4j-cli/app/app.go alongside the existing root subcommands"
      - "All new files carry the Neo4j copyright header; make license-check is clean"
      - "go build ./... succeeds; go test ./neo4j-cli/internal/subcommands/docker/... passes (interface-level smoke test only)"
    completed_at: 2026-05-15T08:46:41Z

  - id: task-002
    title: "Bolt readiness probe (bolt_ready.go) reusing the vendored neo4j-go-driver"
    description: |
      Add `bolt_ready.go` exporting `WaitForBolt(ctx context.Context, uri, user, pass string, timeout time.Duration) error`.
      Use the neo4j-go-driver already vendored by `neo4j-cli/query/` (REQ-F-018, REQ-NF-001) — open a session, run `RETURN 1`, close.
      Poll every 500ms until the handshake succeeds or `timeout` elapses; on timeout return `clierr.NewUsageError("container started but Bolt did not become ready within %s; check 'docker logs <name>'", timeout)`.
      Add `bolt_ready_test.go` with a unit test using a closed listener (immediate refusal → poll continues → timeout fires) and a fake-listener that accepts after N polls.
      If the import introduces a cycle with `clicfg`, fall back to `net.Dial` + a raw Bolt v5 hello frame and document the choice in a comment.
    status: completed
    dependencies:
      - task-001
    acceptance_criteria:
      - "WaitForBolt(ctx, uri, user, pass, timeout) returns nil once a Bolt handshake succeeds"
      - "On timeout returns a clierr.UsageError naming the duration and pointing at 'docker logs <name>'"
      - "Reuses the neo4j-go-driver from query/ (or falls back to net.Dial + Bolt v5 hello with an inline comment explaining why)"
      - "bolt_ready_test.go covers: immediate success, success after N retries, timeout"
      - "go test ./neo4j-cli/internal/subcommands/docker/... passes"
    completed_at: 2026-05-15T13:05:00Z

  - id: task-003
    title: "docker create — basic happy path (no ephemeral, no collision, no port-conflict, no wait)"
    description: |
      Add `create.go` with `newCreateCmd(cfg) *cobra.Command`. Register flags: `--name` (required), `--version` (default `latest`), `--edition` (default `enterprise`), `--accept-license`, `--bolt-port` (default 7687), `--http-port` (default 7474), `--password`, `--no-store-credential`. Defer `--ephemeral`, `--env-file`, `--wait` to later tasks.
      `RunE` invokes `dockerClient.Run` with the right `-p`/`-e`/labels per REQ-F-011 and REQ-F-012, then (unless `--no-store-credential`) calls `credentials.DbmsCredentials.Add(name, "neo4j", password, "neo4j", "neo4j://localhost:<bolt-port>")`.
      Generate the password with `crypto/rand` (16 bytes → base64 URL-safe, no padding) when `--password` is unset (REQ-F-015). Surface it as a column / JSON field in the rendered output (no extra stderr echo).
      Annotations include `"write": "true"`; register `--format` via `flags.RegisterOutputFlag`.
      Provide a flush-left `Example:` block (≥3 invocations, `--rw` on each, `--format json` on at least one) per REQ-F-005.
      Add `create_test.go` covering: happy path stores credential; `--no-store-credential` skips persistence; `--edition community` omits the license env var; `--edition enterprise` passes `eval`; `--accept-license` upgrades to `yes`; `--password` is honored when set; `crypto/rand` is used when unset (assert via injectable randSource).
    status: pending
    dependencies:
      - task-001
    acceptance_criteria:
      - "docker create with no flags except --name --rw runs an enterprise container, stores a dbms credential, emits password in rendered output"
      - "--edition community → no NEO4J_ACCEPT_LICENSE_AGREEMENT env var; --edition enterprise → 'eval'; --edition enterprise --accept-license → 'yes'"
      - "--no-store-credential skips credential persistence; container still runs with the generated password"
      - "Generated password is 16 bytes from crypto/rand, base64 URL-safe; surfaced in --format json output"
      - "create.go and create_test.go carry copyright headers; go test ./neo4j-cli/internal/subcommands/docker/... passes"
      - "create has Annotations write:true, supports --rw, registers --format, and has a flush-left Example block satisfying TestAllLeafCommands_HaveExamples"
    completed_at: null

  - id: task-004
    title: "docker create — port-conflict pre-flight"
    description: |
      Before calling `dockerClient.Run`, attempt `net.Listen("tcp", fmt.Sprintf(":%d", port))` on each of `--bolt-port` and `--http-port`; close immediately if it binds (REQ-F-013).
      On bind failure return `clierr.NewUsageError("port %d is in use on the host. Pass --%s <other> to pick a free port.", port, flagName)` — flag name is `bolt-port` or `http-port` depending on which one conflicted.
      Make the listener factory injectable so tests can simulate conflicts deterministically.
      Extend `create_test.go` with cases: 7687 occupied → error names --bolt-port; 7474 occupied → error names --http-port; both free → succeeds; same port for bolt and http → error.
    status: pending
    dependencies:
      - task-003
    acceptance_criteria:
      - "Occupying 7687 before create → clierr.UsageError mentions 'port 7687' and '--bolt-port'"
      - "Occupying 7474 before create → clierr.UsageError mentions 'port 7474' and '--http-port'"
      - "--bolt-port and --http-port set to the same value → usage error"
      - "Pre-flight uses net.Listen on tcp; test harness injects a fake listener factory"
      - "go test ./neo4j-cli/internal/subcommands/docker/... passes including the new cases"
    completed_at: null

  - id: task-005
    title: "docker create — name-collision auto-suffix"
    description: |
      After flag parsing but before any side effect, enumerate existing names from (a) `dockerClient.PsAll` (all containers, managed or not) and (b) `credentials.DbmsCredentials.List()`.
      If `<name>` exists in either set, try `<name>-1`, `<name>-2`, … up to `<name>-99`; if all 99 are taken, return `clierr.NewUsageError` (REQ-F-014).
      On a successful suffix, write `info: name "dev" already in use; using "dev-1"` to stderr (use `cmd.ErrOrStderr()`); use the chosen name for the container, the credential, the env-file header, and the rendered output.
      Extend `create_test.go` with cases: no collision → uses given name; one collision → uses `-1`; cascading collisions (`dev`, `dev-1`, `dev-2` all taken) → uses `dev-3`; 99 collisions → error.
    status: pending
    dependencies:
      - task-003
    acceptance_criteria:
      - "Container name collides with existing docker ps → auto-suffixed; info message on stderr names both the requested and chosen name"
      - "Credential collision (no docker collision) also triggers auto-suffix"
      - "Cascading collisions resolved by incrementing the suffix"
      - "All 99 suffixes taken → clierr.UsageError; no side effects"
      - "Chosen name is used for container, credential, and output; verified in create_test.go"
    completed_at: null

  - id: task-006
    title: "docker create — --wait integration"
    description: |
      Add `--wait` to `create` via `flags.RegisterWait(cmd, &wait, "Wait until Bolt is reachable before returning.")` so it matches `aura instance` conventions (per AGENTS.md and the `flags.RegisterWait` helper introduced in CLI-87).
      When `--wait` is set, after `docker run` succeeds call `WaitForBolt(ctx, "neo4j://localhost:<bolt-port>", "neo4j", password, 60*time.Second)` (REQ-F-018). On timeout, return the error but leave the container running.
      Print a single `info: waiting for Bolt on localhost:<port>...` line to stderr before polling.
      Extend `create_test.go` with cases: `--wait` happy path (fake bolt readiness returns nil immediately); `--wait` timeout (fake returns context deadline) → error returned, container not torn down.
    status: pending
    dependencies:
      - task-002
      - task-003
    acceptance_criteria:
      - "--wait registered via flags.RegisterWait; --await alias is inherited from the helper"
      - "create --wait succeeds when Bolt becomes ready within 60s; error on timeout"
      - "On timeout, the container is left running (no rm/stop call observed by fake client)"
      - "Stderr shows 'info: waiting for Bolt on localhost:<port>...' before polling"
      - "Bolt timeout fixed at 60s; no --wait-timeout flag in v1"
    completed_at: null

  - id: task-007
    title: "docker create — --ephemeral and --env-file"
    description: |
      Add `--ephemeral` and `--env-file <path>` flags.
      When `--ephemeral`: pass `--rm` to `docker run`; set label `org.neo4j.cli.ephemeral=true`; skip credential persistence; build the `.env` blob per REQ-F-017 (header `# neo4j-cli docker — <name> @ <image>` + `NEO4J_URI`, `NEO4J_USERNAME`, `NEO4J_PASSWORD`, `NEO4J_DATABASE`).
      If `--env-file <path>` is set, write the blob via `os.OpenFile(path, O_WRONLY|O_CREATE|O_TRUNC, 0600)` through `cfg.Aura.Fs()` and stay silent on stdout. Otherwise emit the blob to stdout.
      `--env-file` without `--ephemeral` → `clierr.NewUsageError("--env-file requires --ephemeral")`.
      `--no-store-credential` is incompatible with `--ephemeral` (ephemeral already skips persistence) → usage error.
      Extend `create_test.go` with cases: ephemeral happy path (no credential stored, label ephemeral=true, stdout = env blob); ephemeral + env-file (file written with 0600, stdout silent); env-file without ephemeral → error; ephemeral + no-store-credential → error.
    status: pending
    dependencies:
      - task-003
    acceptance_criteria:
      - "--ephemeral adds --rm to docker run, labels container ephemeral=true, skips DbmsCredentials.Add"
      - ".env blob has the comment header and exactly four NEO4J_* lines, in the documented order"
      - "--env-file <path> writes 0600 file via cfg.Aura.Fs() and produces empty stdout"
      - "--env-file without --ephemeral and --ephemeral with --no-store-credential both return usage errors"
      - "Env var names match query --env consumers (NEO4J_URI/USERNAME/PASSWORD/DATABASE)"
    completed_at: null

