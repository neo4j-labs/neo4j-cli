      - task-005
    acceptance_criteria:
      - 'Long documents the --rw implication rule and that an explicit --allow-* overrides it'
      - 'Long names all three flags and the capability each unlocks'
      - 'Long states that the display name and settings screen are bundle-only, not available in config mode'
      - 'The stale fallback sentence now matches the implemented behaviour'
      - 'Example is flush-left with >=2 invocations, a # comment each, and one subset-form example'
      - 'TestAllLeafCommands_HaveExamples passes'
    completed_at: null

