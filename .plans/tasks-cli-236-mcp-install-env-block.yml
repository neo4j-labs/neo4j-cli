  - id: task-010
    title: 'Verify end-to-end against real Claude Desktop'
    description: |
      Unit tests cannot prove this feature works - every link in the chain from the
      written env to server.Gates can break with the suite still green. This is the
      only check that matters.

      Back up the real config first; it holds a genuine neo4j-data-modeling entry that
      must survive the surgical merge:

        make build
        cp ~/Library/Application\ Support/Claude/claude_desktop_config.json /tmp/cdc.bak
        ./bin/neo4j-cli mcp install --agent claude-desktop --rw
        # inspect: neo4j-cli entry has the 5-key env block; neo4j-data-modeling intact
        ./bin/neo4j-cli mcp check --format json     # expect status ok

      Then restart Claude Desktop and confirm a write tool call actually succeeds - it
      cannot today, which is the whole point of the feature. Also confirm the
      connector appears and starts, proving NEO4J_CLI_FLAG_MCP_SERVER=1 in the env
      block does its job.

      Finally check `./bin/neo4j-cli mcp remove --agent claude-desktop --rw` cleans up.
      Restore from /tmp/cdc.bak if anything looks wrong.
    status: pending
    dependencies:
      - task-009
    acceptance_criteria:
      - 'The written entry has all five env keys with gates "true" after a typed --rw'
      - 'The pre-existing neo4j-data-modeling entry and unrelated top-level keys survive'
      - 'mcp check reports ok for the freshly written entry'
      - 'After a Desktop restart the connector starts and a write tool call SUCCEEDS (it fails today)'
      - 'mcp remove cleans the entry back out and the real config is left intact'
    completed_at: null
