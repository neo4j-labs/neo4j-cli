      signal that anything is wrong. runCheckCmd
      (neo4j-cli/internal/subcommands/mcp/check.go:69-83) currently compares only the
      command path. Also report drift when the installed entry's env block lacks
      NEO4J_CLI_MCP_MANIFEST, so the existing remediation - "run `neo4j-cli mcp
      install` to refresh" - heals it.

      This needs a small read helper alongside readMCPCommandPath
      (common/skill/mcpconfig.go:52), e.g. readMCPConfigEnv, reusing
      readMCPConfigServerEntry. Keep its error-free contract: an absent, unparseable
      or inaccessible file reads as "not installed", not an error. Carry one extra
      field on AgentInstall and, if surfaced, on mcpCheckResultRow.

      Output field names stay snake_case (CLI-127, gate:
      common/output/casing_gate_test.go). The existing remediation message and the
      non-zero exit on drift are unchanged - only the set of conditions that count as
      drift grows.
    status: completed
    dependencies:
      - task-003
    acceptance_criteria:
      - 'An installed entry with no env block, or an env block lacking the manifest marker, reports drift'
      - 'A freshly written entry from the new install path reports ok'
      - 'mcp check still exits non-zero when any drift is detected'
      - 'readMCPConfigEnv reuses readMCPConfigServerEntry and returns no error for absent/unparseable files'
      - 'Any new output field name is snake_case and the casing gate passes'
    completed_at: 2026-08-14T13:14:54Z

  - id: task-007
    title: 'Document the implication rule, the flags, and the config-vs-bundle difference'
    description: |
      Rewrite install.go's Long to tell the truth about both methods. It must cover:
      the --rw implication rule and the per-flag override; each of the three flags and
      the capability it unlocks; that --rw carries two distinct meanings here
      (permission to modify your own config file, and by implication the server's
      capability set); and what each method actually yields.

      Be explicit about the difference config mode CANNOT close: config mode writes
      mcpServers."neo4j-cli" with a hand-editable env block, while --bundle registers
      a Desktop extension named "Neo4j CLI" whose settings screen exposes the same
      gates as toggles. The display name and settings screen are .mcpb-only features a
      mcpServers entry cannot have - state that plainly rather than leaving a user to
      discover it. Also correct the fallback sentence to match what task-005 built.

      Keep the Example block flush-left (skill render.go TrimSpaces only the first
      line) with at least two invocations, a `# comment` per invocation, the
      neo4j-cli prefix, and --rw on writes - including one example of the subset form
      such as `--rw --allow-writes`. Gate: TestAllLeafCommands_HaveExamples.
    status: pending
    dependencies:
