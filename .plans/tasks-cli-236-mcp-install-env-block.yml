  - id: task-004
    title: 'Add the three gate flags to mcp install with value-based --rw resolution'
    description: |
      In neo4j-cli/internal/subcommands/mcp/install.go add three boolean flags, all
      defaulting false: --allow-writes, --allow-aura, --allow-credential-write. Reuse
      the existing constants server.AllowAuraFlag and server.AllowCredentialWriteFlag
      (server/allow.go:35-36) for the latter two rather than inventing new literals -
      this is the same vocabulary `mcp serve` and the manifest user_config already use.

      Resolution rule: if ANY of the three --allow-* flags is explicitly passed
      (cmd.Flags().Changed), use the three literal flag values as-is. Otherwise all
      three take the VALUE of --rw, via ParseBool(cmd.Flag("rw").Value.String()).

      Use the VALUE, not Changed. The source plan said Changed, on the premise that
      EnforceWriteGate auto-SETS --rw in an interactive terminal. It does not:
      RequireWriteAccess (common/flags/flags.go:118-143) only waives the requirement
      by returning nil, and nothing in the repo mutates the flag (grep for Set("rw")
      outside tests returns nothing). Changed and value agree everywhere EXCEPT an
      explicit --rw=false, where Changed would enable all three gates - the exact
      opposite of what was typed.

      Target matrix:
        --rw                              -> writes Y  aura Y  cred Y
        --rw=false                        -> writes N  aura N  cred N
        interactive, no --rw in argv      -> writes N  aura N  cred N
        --rw --allow-writes               -> writes Y  aura N  cred N
        --rw --allow-aura --allow-writes  -> writes Y  aura Y  cred N
        --allow-aura (no --rw)            -> writes N  aura Y  cred N

      Thread the resolved gates through runInstallCmd -> runInstallOne ->
      runInstallConfig -> InstallMCPConfig. In --bundle mode the three flags have no
      effect (the manifest wires the Desktop toggles instead); say so in each flag
      usage string.

      Add a table-driven test with one row per matrix line, asserting the env values
      actually written to the fixture config. The --rw=false and interactive rows are
      the ones that fail if someone reverts to Changed - do not omit them. Use
      newMCPInstallFixture (mcp_helpers_test.go:106), which already seeds HOME and the
      derived detect dir over a MemMapFs; derive the config path via
      skill.FindAgent("claude-desktop").MCPConfigPath(), never a hardcoded darwin path
      ($APP_SUPPORT differs per GOOS).
    status: completed
    dependencies:
      - task-003
    acceptance_criteria:
      - 'Three flags exist on mcp install, default false, reusing server.AllowAuraFlag and server.AllowCredentialWriteFlag'
      - 'Gate resolution reads the --rw flag VALUE via ParseBool, never cmd.Flags().Changed("rw")'
      - 'An explicit --allow-* flag overrides the --rw implication for all three gates'
      - 'A table-driven test covers all six matrix rows and asserts the written env values'
      - 'The --rw=false row and the interactive no---rw row both assert all three gates are "false"'
      - 'TestInstall_HasAgentAndBundleFlags is extended to cover the three new flags'
    completed_at: 2026-08-14T12:44:27Z

  - id: task-005
    title: 'Make the documented open-failure fallback real and report the actual method'
    description: |
      install.go's Long already promises that install "falls back to config write on
      other platforms when the open command is unavailable" (lines 49-51), but
      runInstallBundle returns a fatal error when openFile fails (lines 162-164). The
      documented behaviour does not exist. Make it exist.

      runInstallOne currently returns only error, and both callers DERIVE method from
      the useBundle flag (`method := "config"; if useBundle { method = "mcpb" }` at
      install.go:108-111 and 128-131) - so a fallback could not be reported truthfully
      even if it happened. Change runInstallOne to return the method actually used
      alongside its error, and delete both derivations.

      In runInstallBundle, when openFile fails: fall back to runInstallConfig with the
      same gates, return method "config", and surface the generated .mcpb path so the
      user can open it by hand. If the fallback ALSO fails, return the original fatal
      error - the open failure is the more useful diagnosis.
    status: completed
    dependencies:
      - task-004
    acceptance_criteria:
      - 'runInstallOne returns the method actually used, not a value derived from useBundle'
      - 'Both `method := "config"; if useBundle` derivations are removed from install.go'
      - 'openFile failure falls back to the config write with the same gates and reports method config'
      - 'The .mcpb path is surfaced to the user on fallback'
      - 'When the fallback also fails, the original open error is returned'
      - 'A test covers the fallback path with a stubbed openFile failure'
    completed_at: 2026-08-14T13:05:00Z

  - id: task-006
