# CORE INVARIANT, referenced by several tasks below.
#
# The whole chain must stay intact or the gates stay dead:
#
#   mcp install writes env
#     -> Claude Desktop spawns `neo4j-cli mcp serve` with that env
#     -> serveRun reads envBool(envManifestMarker)            (serve.go:161)
#     -> resolveGates consults the 3 gate vars ONLY if marker  (serve.go:117-135)
#     -> server.Gates reaches allow.go, which is what
#        neo4j_cli_run_write and the gated:* policies check
#
# Break any link and the current dead-gate behaviour is restored, silently and
# with every unit test still green. task-010 is the only proof that matters.
#
# SUPERSEDED PLAN DETAIL: the source plan said to key the --rw implication off
# cmd.Flags().Changed("rw"). That is WRONG and the PRD corrects it.
# RequireWriteAccess (common/flags/flags.go:118-143) only WAIVES the write gate
# by returning nil - it never mutates the flag. With Changed, an explicit
# --rw=false would enable all three gates. Use the flag VALUE. See task-004.

tasks:
  - id: task-001
    title: 'Add common/skill/mcpenv.go with shared env constants and MCPServerEnv'
    description: |
      Create common/skill/mcpenv.go defining the five MCP env var names as exported
      constants: EnvMCPFeatureFlag (NEO4J_CLI_FLAG_MCP_SERVER), EnvMCPManifest
      (NEO4J_CLI_MCP_MANIFEST), EnvMCPAllowWrites (NEO4J_CLI_MCP_ALLOW_WRITES),
      EnvMCPAllowAura (NEO4J_CLI_MCP_ALLOW_AURA) and EnvMCPAllowCredentialWrite
      (NEO4J_CLI_MCP_ALLOW_CREDENTIAL_WRITE). Also export
      `type MCPGates struct{ AllowWrites, AllowAura, AllowCredentialWrite bool }`
      and `func MCPServerEnv(g MCPGates) map[string]string`.

      Today these five names exist twice - as consts in mcp/serve.go:59-64 and as
      string literals in mcp/manifest.go:158-164. Adding a third copy in mcpconfig.go
      would guarantee drift, which is why this file comes first. It mirrors how
      common/clicfg/credentials/env_spec.go single-sources the credential env names.

      The file MUST live under common/ - the internal-package rule forbids common/*
      importing neo4j-cli/internal/*, and both serve.go and manifest.go already
      import common/skill.

      MCPServerEnv always emits ALL FIVE keys. EnvMCPFeatureFlag and EnvMCPManifest
      are always "1"; the three gates are the literal strings "true" or "false".
      Writing a gate explicitly as "false" instead of omitting it is load-bearing,
      not stylistic: the config env block overrides the environment Desktop
      inherited, so an explicit "false" neutralises a stale
      NEO4J_CLI_MCP_ALLOW_WRITES=true left in a login shell rc - exposure that
      setting NEO4J_CLI_MCP_MANIFEST=1 would otherwise newly create. Document that
      reasoning on MCPServerEnv so nobody later "tidies" it into omitempty.

      Add common/skill/mcpenv_test.go covering every gate combination.
    status: completed
    dependencies: []
    acceptance_criteria:
      - 'common/skill/mcpenv.go exists with the five exported constants, MCPGates and MCPServerEnv'
      - 'MCPServerEnv returns exactly 5 keys for every one of the 8 gate combinations'
      - 'Feature-flag and manifest keys are always "1"; gates are literal "true"/"false"'
      - 'A doc comment on MCPServerEnv explains why gates-off emits "false" rather than omitting the key'
      - 'The file carries the Neo4j copyright header and go test ./common/skill/... passes'
    completed_at: 2026-08-14T12:20:25Z

