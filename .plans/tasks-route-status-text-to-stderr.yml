tasks:
  - id: task-001
    title: "Add AssertErrContainsStrings and AssertOutIsValidJSON helpers to AuraTestHelper"
    description: |
      In `neo4j-cli/aura/internal/test/testutils/auratesthelper.go`, add two methods on
      `AuraTestHelper`: `AssertErrContainsStrings(expected []string)` mirroring the
      existing `AssertOutContainsStrings` at line 146, and `AssertOutIsValidJSON()` which
      reads stdout, calls `json.Unmarshal(out, &v)` into `var v any`, and asserts
      `err == nil` with the offending stdout quoted in the failure message. These
      helpers are the foundation for the CLI-82 regression-pinning tests — pre-fix,
      `AssertOutIsValidJSON` fails for affected commands because stdout has narration
      mixed with the JSON body; post-fix it passes.
    status: completed
    completed_at: 2026-05-12T15:45:00Z
    dependencies: []
    acceptance_criteria:
      - "AssertErrContainsStrings exists on AuraTestHelper, reads helper.err via io.ReadAll, and asserts each expected substring is present via assert.Contains"
      - "AssertOutIsValidJSON exists on AuraTestHelper, reads helper.out, calls json.Unmarshal into a var, and asserts err is nil with the stdout content quoted in the failure message"
      - "encoding/json import added if not already present"
      - "Both helpers follow the existing pattern (io.ReadAll error checked via assert.Nil)"
      - "make fmt-check, make lint, make test all pass with no existing tests broken"

  - id: task-002
    title: "Pattern A — route --await polling narration to stderr across 13 commands"
    description: |
      Replace `cmd.Println("Waiting for ... to be ready...")` and `cmd.Println("<Resource> Status:", ...)`
      with `fmt.Fprintln(cmd.ErrOrStderr(), ...)` in the 13 await-supporting commands
      listed under "Pattern A" in the PRD. Wording is preserved verbatim — only the
      destination changes. Update each colocated `*_test.go` to (a) drop the moved
      lines from `AssertOut(...)` expected text and (b) add an
      `AssertErrContainsStrings(...)` assertion for the narration. Add ONE regression
      test (e.g. `TestCreateFreeInstanceWithAwait_StdoutIsValidJSON` in
      `instance/create_test.go`) that runs the await command with `--format json` and
      calls `AssertOutIsValidJSON()` — this test MUST fail if any of the 13 fmt.Fprintln
      replacements is reverted to cmd.Println.
    status: completed
    completed_at: 2026-05-12T16:15:00Z
    dependencies:
      - task-001
    acceptance_criteria:
      - "All 13 source files (instance/create.go, instance/resume.go, instance/snapshot/create.go, instance/overwrite.go, dataapi/graphql/create.go, dataapi/graphql/resume.go, dataapi/graphql/update.go, dataapi/graphql/pause.go, dataapi/graphql/authprovider/create.go, dataapi/graphql/corspolicy/allowedorigin/add.go, dataapi/graphql/corspolicy/allowedorigin/remove.go, customermanagedkey/create.go, graphanalytics/session/create.go) write polling narration via fmt.Fprintln(cmd.ErrOrStderr(), ...) instead of cmd.Println"
      - "Narration wording is unchanged (verbatim 'Waiting for ... to be ready...' and '<Resource> Status: ...')"
      - "Each colocated *_test.go that asserts await text via AssertOut is updated to drop those lines and add AssertErrContainsStrings for them"
      - "A new regression test (e.g. TestCreateFreeInstanceWithAwait_StdoutIsValidJSON) uses AssertOutIsValidJSON to pin that stdout is parseable JSON for at least one await command under --format json"
      - "Manual sanity: reverting one fmt.Fprintln back to cmd.Println causes the regression test to fail with a clear message"
      - "make fmt-check, make lint, make test all pass; make generate-check shows no bundle drift"

  - id: task-003
    title: "Pattern B — convert 3 delete commands to structured JSON stdout + human stderr line"
    description: |
      In `customermanagedkey/delete.go:35`, `deployment/delete.go:55`, and
      `deployment/token/delete.go:57`, replace the bare `cmd.Println("Operation Successful")`
      / `cmd.Println("... deleted successfully ...")` with two calls: (1) a stderr
      `fmt.Fprintf(cmd.ErrOrStderr(), "<resource> %s deleted\n", id)` human line, and
      (2) a stdout structured confirmation via
      `output.PrintBodyMap(cmd, cfg, api.NewSingleValueResponseData(map[string]any{"deleted": true, "<key>": <value>}), []string{"deleted", "<key>"})`.
      The identifier key matches each resource's existing list/get/create convention:
      `"id"` for customermanagedkey and deployment, `"deployment_id"` for
      deployment-token (per PRD "Delete-confirmation field keys"). Update colocated
      delete tests to switch `AssertOut("Operation Successful\n")` →
      `AssertOutJson(...)` and add `AssertErrContainsStrings([]string{...})` for the
      human line. Add one regression test using `AssertOutIsValidJSON()` on a delete
      command under `--format json`.
    status: completed
    completed_at: 2026-05-12T17:00:00Z
    dependencies:
      - task-001
    acceptance_criteria:
      - "customermanagedkey/delete.go emits stderr 'customer-managed-key <id> deleted\\n' and stdout JSON {\"data\":{\"deleted\":true,\"id\":\"<id>\"}} via output.PrintBodyMap"
      - "deployment/delete.go emits stderr 'deployment <id> deleted\\n' and stdout JSON {\"data\":{\"deleted\":true,\"id\":\"<id>\"}}"
      - "deployment/token/delete.go emits stderr 'deployment-token for deployment <id> deleted\\n' and stdout JSON {\"data\":{\"deleted\":true,\"deployment_id\":\"<id>\"}}"
      - "TestDeleteCustomerManagedKey, TestDeleteDeployment (and its org/project-from-config variant), and the deployment-token delete test are updated to assert stdout JSON via AssertOutJson and stderr text via AssertErrContainsStrings"
      - "At least one regression test calls AssertOutIsValidJSON after a delete with --format json"
      - "Output respects --format table and --format toon (table renders deleted/id columns, toon renders correspondingly); verify by adding or extending one --format table assertion in a delete test"
      - "make fmt-check, make lint, make test all pass; make generate-check shows no bundle drift"

