    title: 'Regression tests: wrapped-stdout wiring guard + agent->toon default'
    description: |
      Add the regression test that would have caught CLI-109: in
      common/output/output_test.go, build a command, apply the real main.go
      wrapping cmd.SetOut(io.MultiWriter(os.Stdout, &tee.LimitedBuffer{})) (and
      SetErr), force StdoutIsTerminal=true and IsAgent=false with a default format,
      and assert ResolveOutput == "table". Add a positive test asserting
      IsAgent()==true + default format -> "toon", and confirm explicit --format
      still overrides both.
    status: completed
    dependencies:
      - task-001
      - task-002
    acceptance_criteria:
      - 'Wiring-guard test wraps stdout with io.MultiWriter(os.Stdout, &tee.LimitedBuffer{}) and asserts default resolves to "table" for a TTY'
      - 'Wiring-guard test fails when run against the pre-fix StdoutIsTerminal implementation (verified mentally/by toggling)'
      - 'Agent-default test asserts IsAgent()==true + default format -> "toon"'
      - 'A test asserts explicit --format json/table/toon overrides both agent and TTY branches'
      - 'go test ./common/output/... passes in the agent environment'
    completed_at: 2026-06-05T10:15:00Z

