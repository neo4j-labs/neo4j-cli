tasks:
  - id: task-001
    title: 'Parameterless StdoutIsTerminal + IsAgent seam + ResolveOutput precedence'
    description: |
      Fix the core regression in common/output/output.go. Change StdoutIsTerminal
      from func(w io.Writer) bool (which type-asserts *os.File and breaks on the
      tee MultiWriter) to a parameterless func() bool that reads the real
      os.Stdout FD directly, mirroring common/flags.stdoutIsTerminal. Add an
      IsAgent seam defaulting to common/agent.Detect. Update ResolveOutput's
      non-explicit-format branch to precedence: agent -> "toon", else TTY ->
      "table", else "json". Keep ResolveOutput's now-unused cmd param. Also update
      the only other non-test caller, printSchemaTables in
      neo4j-cli/query/schema.go (~line 340), to call StdoutIsTerminal() with no arg.
    status: completed
    dependencies: []
    acceptance_criteria:
      - 'StdoutIsTerminal is `var ... = func() bool { return term.IsTerminal(int(os.Stdout.Fd())) }`'
      - 'IsAgent var added, defaulting to common/agent.Detect; common/agent imported with no import cycle'
      - 'ResolveOutput returns "toon" when IsAgent() and format is non-explicit, before the TTY check; explicit json/table/toon still wins'
      - 'neo4j-cli/query/schema.go printSchemaTables calls commonoutput.StdoutIsTerminal() with no argument'
      - 'go build ./... succeeds; license header preserved on edited files'
    completed_at: 2026-06-05T08:58:14Z

  - id: task-002
    title: 'Migrate test stubs and seed IsAgent=false in default-resolution test packages'
    description: |
      Update every test stub of the seam from func(_ io.Writer) bool to func()
      bool and drop now-unused io imports. Because agent.Detect() reads CLAUDECODE
      (set in the dev/agent environment), seed IsAgent = func() bool { return false }
      so default-resolution tests stay deterministic: add a new TestMain in
      common/output, extend the existing TestMain in
      neo4j-cli/query/testseam_test.go, and seed in the desktop doctor_render
      tests. Sites also include query/output_test.go (withStdoutIsTerminal helper)
      and the desktop doctor_render_test stubs.
    status: completed
    dependencies:
      - task-001
    acceptance_criteria:
      - 'All StdoutIsTerminal stubs/closures are func() bool; no leftover io.Writer params; unused io imports removed'
      - 'common/output has a TestMain seeding IsAgent=func() bool { return false }'
      - 'neo4j-cli/query TestMain (testseam_test.go) also seeds commonoutput.IsAgent=false'
      - 'desktop doctor_render tests seed IsAgent=false (per-test cleanup or TestMain)'
      - 'go vet ./... clean for touched packages'
    completed_at: 2026-06-05T09:30:00Z

