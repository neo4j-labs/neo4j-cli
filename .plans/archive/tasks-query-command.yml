  - id: task-011
    title: "Change array truncation to empty array; add reliable end-to-end tests"
    description: |
      `--truncate-arrays-over` currently replaces an over-limit array with a single-element placeholder slice `[]any{"<truncated: K items>"}`. Change this to an EMPTY slice `[]any{}` — when an array exceeds the limit, drop its contents entirely. Motivation: the placeholder string pollutes JSON output (e.g. `"xs": ["<truncated: 10 items>"]` is unreadable to downstream tools and misrepresents the value's type to consumers). An empty array is a clean, type-safe signal that data was elided.

      Update `neo4j-cli/query/truncate.go::truncate` so the over-limit branch returns `[]any{}` instead of the formatted placeholder. Drop the now-unused `fmt` import.

      Update tests:
      - Rewrite `neo4j-cli/query/truncate_test.go` cases that asserted the placeholder string. Each long-array case must now assert exactly `[]any{}` (length 0). Keep the table-driven structure.
      - Add an end-to-end test that drives the full CLI pipeline (via `httptest.NewServer` + the existing test seam pattern in `run_test.go`) and asserts the JSON output literally contains `"xs": []` for a 10-item server response with `--truncate-arrays-over 3`. This is the reliability gap the bug exposed: the unit test verified the in-memory shape but no test verified what actually appears in `--output json`. Same shape of test should also exercise nested arrays (array inside a map value) and `--output table` (cell renders as `[]`).

      Update `.plans/prd-query-command.md` REQ-F-009 wording to drop the placeholder language and document the empty-array behavior.

      No new changelog entry needed — this feature has not shipped yet (still on a feature branch with one unreleased changie YAML).
    status: completed
    dependencies:
      - task-010
    acceptance_criteria:
      - "`truncateArrays` returns `[]any{}` (length 0) for any input array whose length exceeds `max`; nested arrays follow the same rule recursively"
      - "All existing `truncate_test.go` table cases that asserted the placeholder string are updated to assert empty-slice equality; tests still run via `go test ./neo4j-cli/query/...`"
      - "A new end-to-end test in `run_test.go` (or a sibling `*_test.go`) drives `runQuery` against an `httptest.NewServer` returning a 10-item array, runs with `--truncate-arrays-over 3` and `--output json`, and asserts the rendered JSON contains `\"xs\": []` (no placeholder string anywhere in the output buffer)"
      - "A second end-to-end case covers a nested array (array inside a map value) and asserts the same empty-array behavior end-to-end"
      - "A third end-to-end case covers `--output table` and asserts the cell content is `[]` (not the placeholder)"
      - "PRD REQ-F-009 wording is updated to describe the empty-array behavior; no other PRD section references the placeholder string"
      - "`fmt` import is removed from `truncate.go` (no longer needed); `make test` and `make fmt-check` pass"
    completed_at: 2026-05-04T20:15:00Z

  - id: task-012
    title: "Add aggregate stderr warning + JSON flag for --truncate-arrays-over"
    description: |
      Task-011 made array truncation silent (the placeholder string is gone, replaced by `[]`). That removed an in-band signal: scripts and humans currently can't tell an empty array (server returned `[]`) from a truncated array (server returned >N items, dropped to `[]` by `--truncate-arrays-over`). Add an aggregate signal in both surfaces:

      - **Stderr (always)**: at end-of-run, if at least one array was truncated, print exactly one line — `warning: truncated N arrays larger than M items (use --truncate-arrays-over 0 to disable)` — to `cmd.ErrOrStderr()`. Where `N` is the count of arrays truncated and `M` is the configured threshold. Suppressed when `--truncate-arrays-over 0` (truncation off) and when `N == 0`.
      - **JSON output**: extend the JSON envelope with an `arrays_truncated: <int>` field carrying the same count `N`. Always emit the field (zero value when nothing was truncated) so downstream JSON consumers can treat it as a stable schema. Order: `{columns, rows, truncated, arrays_truncated}`.
      - **Table output**: no change to the table body. The stderr line is the signal.

      Implementation: `truncateArrays` (or a new `truncateArraysCount`) needs to return the count alongside the truncated value. Plumb the count through `runQuery` (call site is in `run.go` per task-006) so it can both render into the JSON envelope and drive the stderr warning. Update the `renderRows` signature in `output.go` to accept `arraysTruncated int` and serialize it.

      Tests: add three end-to-end cases driving `runQuery` against `httptest.NewServer`:
      1. JSON with truncation: assert stderr contains the exact warning line AND assert the JSON contains `"arrays_truncated": 1` (or higher) AND no `truncated:true` row-cap signal (separate concern).
      2. Table with truncation: assert stderr contains the warning line; table body unchanged.
      3. No truncation (short arrays): assert stderr is silent and JSON `arrays_truncated` is `0`.
      Plus a unit test on the count return from `truncateArrays` covering scalar passthrough (count 0), single long top-level array (count 1), nested long arrays at multiple levels (count = number of distinct slices truncated), and `max == 0` (count always 0).

      Update PRD REQ-F-009 to document the dual-signal aggregate warning + JSON field. No changelog entry — feature unreleased.
    status: completed
    dependencies:
      - task-011
    acceptance_criteria:
      - "When at least one array is truncated, stderr contains exactly one line: `warning: truncated N arrays larger than M items (use --truncate-arrays-over 0 to disable)`"
      - "When zero arrays are truncated (no over-limit arrays in the result, OR `--truncate-arrays-over 0`), stderr is silent for array-truncation"
      - "JSON output envelope includes an `arrays_truncated: <int>` field; the field is always present with zero value when nothing was truncated"
      - "Table output body is unchanged; the only signal in table mode is the stderr warning"
      - "`truncateArrays` (or a new helper) returns the count of distinct slices that were truncated; nested truncations count separately"
      - "Three new end-to-end tests cover JSON-with-truncation, table-with-truncation, and no-truncation; one unit test covers the count return on scalar/single/nested/max=0 inputs"
      - "PRD REQ-F-009 documents the stderr warning and the `arrays_truncated` JSON field"
      - "`make test` and `make fmt-check` pass"
    completed_at: 2026-05-04T20:45:00Z

  - id: task-013
    title: "Add real-Neo4j HTTPS smoke test for --insecure (shell script + env-gated Go test)"
    status: completed
    description: |
      The `--insecure` flag is currently covered only by `httptest.NewTLSServer` unit tests in `connect_test.go`. Add a real-world smoke test that boots a Neo4j 5 container with HTTPS enabled on port 7473, exercises the CLI binary against it, and asserts both the positive (`--insecure` succeeds) and negative (default TLS verification fails on a self-signed cert) paths.

      Out of scope: making this run on every CI matrix entry. Docker is not available on GHA macOS runners. Keep this as a local / docker-equipped-CI verification.

      **Implementation:**

      1. **Shell script `scripts/test-https.sh`** (executable; bash; `set -euo pipefail`):
         - Generate a self-signed cert into a temp dir using `openssl req -x509 -newkey rsa:2048 -nodes -keyout key.pem -out cert.pem -days 30 -subj "/CN=localhost"`. Neo4j expects `private.key` (no password) and `public.crt` in `https/` plus `trusted/` and `revoked/` directories — lay them out per the docs.
         - Build the binary via `make build` (or assume `bin/neo4j-cli` exists if `SKIP_BUILD=1`).
         - `docker run -d --rm --name neo4j-https-test -p 7473:7473 -p 7474:7474 -e NEO4J_AUTH=neo4j/testtest -e NEO4J_server_https_enabled=true -e NEO4J_dbms_ssl_policy_https_enabled=true -e NEO4J_dbms_ssl_policy_https_base__directory=/ssl -e NEO4J_dbms_ssl_policy_https_private__key=private.key -e NEO4J_dbms_ssl_policy_https_public__certificate=public.crt -e NEO4J_dbms_ssl_policy_https_client__auth=NONE -v <tempdir>:/ssl:ro neo4j:5` (verify the exact env-var spellings against current Neo4j 5 docs — single-underscore for `.`s, double for `_`s in nested keys; `dbms.ssl.policy.https.*` is the right namespace).
         - Wait for HTTPS readiness: poll `curl -sf -k https://localhost:7473` until 200 (cap at ~60s; fail with a clear message if the deadline elapses).
         - Positive: `bin/neo4j-cli query --uri https://localhost:7473 --insecure -u neo4j -p testtest "RETURN 1 AS n"` must exit 0 and stdout must contain `1`.
         - Negative: `bin/neo4j-cli query --uri https://localhost:7473 -u neo4j -p testtest "RETURN 1"` (no `--insecure`) must exit non-zero and stderr must mention TLS / x509 / certificate. Use `set +e` around this single invocation so the script can assert non-zero without aborting.
         - Always tear down: `trap 'docker rm -f neo4j-https-test >/dev/null 2>&1; rm -rf "$tempdir"' EXIT`.
         - Print a final `OK: --insecure verified end-to-end` line on success.

      2. **Env-gated Go smoke test `neo4j-cli/query/query_https_smoke_test.go`**:
         - `func TestHTTPS_Smoke(t *testing.T)` — `if os.Getenv("NEO4J_HTTPS_TEST") != "1" { t.Skip("set NEO4J_HTTPS_TEST=1 to run; needs docker + scripts/test-https.sh") }`.
         - Resolve the script path via `runtime.Caller(0)` → repo root → `scripts/test-https.sh` (cross-platform-ish, though this whole test is Unix-only by design — gate with `//go:build !windows` if needed).
         - `cmd := exec.Command("bash", scriptPath); cmd.Stdout = os.Stdout; cmd.Stderr = os.Stderr` and assert `cmd.Run() == nil`.
         - The Go test exists so `go test ./...` discovers it (and skips by default), and so devs can run `NEO4J_HTTPS_TEST=1 go test ./neo4j-cli/query/ -run TestHTTPS_Smoke -v` without remembering the script path.

      3. **Documentation**: add a one-line note to AGENTS.md (or a new "Local verification scripts" subsection if no existing home) pointing at `scripts/test-https.sh` and the env-gated Go wrapper. Be terse.

      4. **No changelog entry** — this is a test-only addition, not user-facing.

      5. **Defensive checks in the script**: bail with a clear message if `docker` or `openssl` are not on PATH, or if port 7473/7474 is already in use. The user-facing error message matters because this script will be run by humans, not CI.
    dependencies:
      - task-012
    acceptance_criteria:
      - "`scripts/test-https.sh` exists, is executable, and uses `set -euo pipefail`"
      - "Running the script locally (with docker + openssl on PATH) generates a self-signed cert, boots Neo4j with HTTPS on 7473, runs both positive and negative CLI invocations, and exits 0 on success"
