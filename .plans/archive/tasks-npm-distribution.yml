      old-scope reference remains via `grep -rn 'at-sign + neo4j/cli' --include='*.md'
      --include='*.tmpl' --include='*.sh' .` after the rename (run with the literal scope token).
      Confirms `make npm-publish-dry` still renders 9 valid package.jsons with the new scope
      before the first real publish under the new name.
    status: completed
    dependencies:
      - task-010
    acceptance_criteria:
