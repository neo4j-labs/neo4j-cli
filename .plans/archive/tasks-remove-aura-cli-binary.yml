    dependencies:
      - task-001
    acceptance_criteria:
      - "`builds:` contains exactly one entry with `id: neo4j-cli`"
      - "`archives:` contains exactly one entry referencing only the `neo4j-cli` build id"
      - "`release.extra_files:` contains only `CHANGELOG-neo4j.md` (no `CHANGELOG-aura.md`)"
      - "`notarize.macos[0].ids:` equals `[neo4j-cli]`"
