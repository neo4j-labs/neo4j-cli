  - id: task-009
    title: "Fix `query -c desktop`: status field is empty on `GET /dbmss`"
    description: |
      `bin/neo4j-cli query -c desktop "RETURN 1"` reports "no running DBMS"
      even when one is started. Root cause: in
      `neo4j-cli/query/desktop.go:82` the filter is
      `if list[i].Status == "started"` against the result of
      `client.ListDbmss(ctx)`. `ListDbmss` calls `GET /dbmss` which returns
      the lightweight `Dbms` shape WITHOUT a `status` field (see
      `packages/web/src/fastify/routes/dbms.routes.ts:7-17`). Status lives
      on `DbmsInfo` from `GET /dbmss/info` (with optional `dbmsIds` /
      `onlineCheck` query params) or per-id `GET /dbmss/:id`. So
      `list[i].Status` is always empty and the filter never matches.

      Fix: add a `ListDbmssInfo(ctx) ([]DbmsInfo, error)` method on
      `desktopclient.Client` that hits `GET /dbmss/info` (no query params —
      empty list returns all), and switch
      `resolveDesktopActiveDbmsCredential` to use it. The DBMS list code
      path in `desktop list` already enriches by issuing per-id
      `GetDbms(id)` calls; consider whether to leave that as-is or
      refactor to use the same `/dbmss/info` endpoint — keep this task
      scoped to the query bug fix (one endpoint addition + one filter
      site), refactor of `desktop list` enrichment is out of scope.

      Add a regression test that exercises the running-DBMS path against
      a mock relate server returning `status: "started"` on
      `/dbmss/info`. Update any existing `DesktopActive_*` tests that
      mocked `/dbmss` to mock `/dbmss/info` instead. Manual verify with a
      live Desktop:
      `bin/neo4j-cli query -c desktop "RETURN 1"` against the running
      DBMS connects successfully.
    status: completed
    dependencies:
      - task-008
    acceptance_criteria:
      - "`bin/neo4j-cli query -c desktop \"RETURN 1\"` succeeds against a live Desktop with one running DBMS (manual verify)"
      - "New `ListDbmssInfo` method on `desktopclient.Client` hits `GET /dbmss/info` and returns `[]DbmsInfo`"
      - "`resolveDesktopActiveDbmsCredential` filters that result by `status == \"started\"`"
      - "All `TestResolveConn_DesktopActive_*` tests mock `/dbmss/info` (not `/dbmss`) and pass, including the previously-broken `_OneRunningUsesIt` case"
      - "`desktop list` behavior unchanged (still uses `ListDbmss` + per-id enrichment)"
      - "`make test && make fmt-check && make lint && make license-check` all pass"
    completed_at: 2026-05-21T08:00:00Z

