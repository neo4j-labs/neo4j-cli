  - id: task-016
    title: "Fix Windows path resolution: `defaultDataDir()` + `EnvConfigDir()` per-OS"
    status: completed
    description: |
      `neo4j-cli desktop` tree breaks on a fresh Windows Desktop-2 install
      because two hardcoded path fallbacks in `desktopclient` don't match
      what Desktop-2 actually writes. macOS works by accident; Linux mostly
      works because the default kicks in; Windows is broken end-to-end
      (salt file not found → all `desktop` commands hit REQ-F-008
      "Desktop unreachable" despite Desktop running).

      Source of truth (read these once for context):
      - `../neo4j-desktop-2/packages/electron/src/app-paths.ts:42-52`
      - `../neo4j-desktop-2/packages/common/src/utils/env-paths.ts`
      - `../neo4j-desktop-2/packages/electron/src/api/relate-env-setup.ts:56-67`
        (the electron override INTENTIONALLY omits `config` so env JSONs
        fall back to the deprecated `env-paths.ts` locations)

      ## Bug 1 — `defaultDataDir()` Windows branch

      `neo4j-cli/internal/desktopclient/discovery.go:225`

      Current (wrong):
      ```go
      case "windows":
          return filepath.Join(home, ".Neo4jDesktop2", "Application", "Data"), nil
      ```

      Fix:
      ```go
      case "windows":
          return filepath.Join(home, ".Neo4jDesktop2", "Data"), nil
      ```

      Why: on Windows, Desktop-2's `applicationPath` is just
      `<home>\.Neo4jDesktop2` (no `\Application` suffix — special case in
      `app-paths.ts:42-52`). Then `data` = `applicationPath + \Data`. So
      the real on-disk salt path is `<home>\.Neo4jDesktop2\Data\relate.secret.key`.

      ## Bug 2 — `EnvConfigDir()` per-OS

      `neo4j-cli/internal/desktopclient/envconfig.go:34-40`

      Current (wrong — only macOS matches):
      ```go
      func EnvConfigDir() (string, error) {
          base, err := userConfigDirFn()
          if err != nil {
              return "", err
          }
          return filepath.Join(base, "com.Neo4j.Relate", "Config", "environments"), nil
      }
      ```

      Replace with a GOOS switch mirroring `defaultDataDir()`. The legacy
      relate name + base differ per OS (see `env-paths.ts`):
      - macOS: `<home>/Library/Application Support/com.Neo4j.Relate/Config/environments`
        (= `userConfigDir() + com.Neo4j.Relate/Config/environments`)
      - Windows: `%APPDATA%\Neo4j\Relate\Config\environments`
        (= `userConfigDir() + Neo4j\Relate\Config\environments`)
      - Linux: `<home>/.config/neo4j-relate/environments`
        (= `userConfigDir() + neo4j-relate/environments` — note: no
        `Config` segment on Linux per `env-paths.ts:112-128`)

      Use `goosFn()` (existing seam at `discovery.go:54`) so tests on
      any host can drive every branch.

      ## Fallout

      `ResolveDataDir` precedence is unchanged: env var
      (`NEO4J_DESKTOP_DATA_PATH`) → env JSON `relateDataPath` (now
      discoverable on Windows + Linux after bug 2) → per-OS default
      (now correct on Windows after bug 1).

      ## Tests to update

      Existing seam-mocked tests (run on every OS, both branches via
      `SetGOOSFnForTest`):
      - `neo4j-cli/internal/desktopclient/discovery_test.go:269-271` —
        change the `windows` expectation from
        `<home>/.Neo4jDesktop2/Application/Data` to
        `<home>/.Neo4jDesktop2/Data`.
      - Add `TestEnvConfigDir_PerOS` exercising all three branches via
        `SetGOOSFnForTest` + `SetUserConfigDirFnForTest`.
      - Keep existing `discovery_test.go` env-walk tests; they exercise
        `LoadEnvs` against the (now per-OS) `EnvConfigDir` and should
        still pass because they wire `userConfigDirFn` directly.

      New native-OS tests (defense-in-depth — each test runs on ALL
      runners but assertion branches on `runtime.GOOS` directly, so each
      CI matrix entry exercises only its own native path. Catches drift
      in `os.UserHomeDir` / `os.UserConfigDir` shape that the mocked
      seam tests can't see):
      - `TestDefaultDataDir_NativeOS` — call `defaultDataDir()` WITHOUT
        overriding `goosFn`/`homeDirFn`. Switch on `runtime.GOOS`:
        - darwin: assert path has suffix
          `Library/Application Support/neo4j-desktop/Application/Data`
        - linux: assert suffix `.config/neo4j-desktop/Application/Data`
        - windows: assert suffix `\.Neo4jDesktop2\Data` (NOT
          `\Application\Data`)
        Use `strings.HasSuffix` + `filepath.FromSlash` so the suffix
        literal stays portable.
      - `TestEnvConfigDir_NativeOS` — same pattern against
        `EnvConfigDir()`. Suffix per OS:
        - darwin: `com.Neo4j.Relate/Config/environments`
        - windows: `Neo4j\Relate\Config\environments`
        - linux: `neo4j-relate/environments`

      Both native tests are pure: no afero, no FS writes, no Desktop
      install required. They run inside the existing
      `neo4j-cli/internal/desktopclient/...` test target, so the CI
      matrix (`.github/workflows/test.yml` — ubuntu/macos/windows)
      picks them up with no workflow edits.

      ## Out of scope

      - Live Windows verification — no Windows dev machine available.
        Rely on CI matrix (ubuntu/macos/windows) + e2e seams (which
        short-circuit prod paths via `NEO4J_CLI_DESKTOP_E2E_*` and
        are unaffected).
      - Renaming `EnvConfigDir` or restructuring envconfig.go.
      - Adding new env vars or flags.

      ## Verification

      Hone gate (mandatory):
      - `make test && make fmt-check && make lint && make license-check && make generate-check`

      No live Windows verification possible.
    dependencies: []
    acceptance_criteria:
      - "`defaultDataDir()` Windows branch returns `<home>/.Neo4jDesktop2/Data` (no `Application` segment)"
      - "`EnvConfigDir()` returns per-OS paths matching `env-paths.ts` (deprecated-but-canonical relate config locations)"
      - "Existing `discovery_test.go` Windows expectation updated and passing"
      - "New `TestEnvConfigDir_PerOS` covers macOS, windows, and linux branches via `SetGOOSFnForTest`"
      - "New `TestDefaultDataDir_NativeOS` + `TestEnvConfigDir_NativeOS` exercise the unmocked `runtime.GOOS` branch — each CI runner (ubuntu/macos/windows) asserts its own native path shape"
      - "All gates green on full OS matrix (`make test && make fmt-check && make lint && make license-check && make generate-check`)"
      - "No changes to seams build tag / e2e fixture behavior"
      - "No changes to the prod `ResolveDataDir` precedence"
      - "No new CI workflow steps needed (existing matrix picks up the new tests)"
    completed_at: 2026-05-21T18:00:00Z
