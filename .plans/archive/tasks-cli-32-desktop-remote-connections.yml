tasks:
  - id: task-001
    title: "`desktopclient`: Connection type + CRUD endpoints + GetCredentialsByKey rename"
    description: |
      Extend `neo4j-cli/internal/desktopclient/` with the wire surface for
      saved DB connections and generalise the credentials call. In `types.go`
      add `Connection` mirroring relate's shape (id, name, description, tags,
      project, metadata, connectionUri, createdAt?, manifestPath? — omitempty
      on optionals) plus `ConnectionCreateArgs` (name, connectionUri, username,
      password, description?) and `ConnectionUpdateArgs` (all five optional).
      In `client.go` add `ListConnections`, `CreateConnection`,
      `UpdateConnection`, `DeleteConnection` (GET /connections, POST
      /connections, PATCH /connections/:id, DELETE /connections/:id). Rename
      `GetCredentials(ctx, dbmsId)` to `GetCredentialsByKey(ctx, key string)`
      and update its single existing call site in `neo4j-cli/query/desktop.go`
      to pass `"dbms:<id>"`. `UpdateConnection` body must contain only the
      keys the caller set (build a `map[string]any`) so empty-string is a
      legitimate update for `description`. Hermetic tests with
      `httptest.NewServer` mirroring the existing `desktopclient` test
      patterns. See REQ-F-108, REQ-F-109.
    status: completed
    dependencies: []
    acceptance_criteria:
      - "`ListConnections`, `CreateConnection`, `UpdateConnection`, `DeleteConnection` all round-trip against a mock relate server"
      - "`GetCredentialsByKey` accepts both `dbms:<uuid>` and `connection:<uuid>` shapes; the renamed call site in `query/desktop.go` compiles and existing dbms-creds tests still pass"
      - "`UpdateConnection` PATCH body contains ONLY fields the caller supplied; empty-string description is preserved (covered by a dedicated test)"
      - "REQ-F-008 / REQ-F-010 / REQ-F-024 transport error mapping applies uniformly to the new endpoints (probe miss, 401, 5xx)"
      - "Every new `.go` file carries the Neo4j copyright header"
      - "`make test && make fmt-check && make lint && make license-check` all pass"
    completed_at: 2026-05-21T00:00:00Z

  - id: task-002
    title: "`query --credential` prefix dispatch + drop implicit Desktop fallthrough"
    description: |
      Rewrite `resolveConn` in `neo4j-cli/query/connect.go` and the resolvers in
      `neo4j-cli/query/desktop.go`. Sniff `--credential` for two prefixes
      BEFORE the persisted-store lookup: `desktop` (exact) routes to
      `resolveDesktopActiveDbmsCredential` (filter `/dbmss` by `status ==
      "started"`, 0/>1 yield REQ-F-101 errors); `desktop-connection:<uuid>`
      routes to `resolveDesktopConnectionCredential(uuid)` (validate UUID via
      `github.com/google/uuid.Parse`, list connections, match by id only,
      fetch creds via `GetCredentialsByKey("connection:<uuid>")`, URI from
      `connection.connectionUri`). Anything else continues into the existing
      persisted-store-only path — DELETE the implicit Desktop fallthrough
      (REQ-F-026) and the no-`-c` single-DBMS auto-select (REQ-F-027); remove
      `resolveDesktopCredentialFn`, the `Set...ForTest` seam if no longer
      needed, and the corresponding tests. Both new resolvers share the probe
      + client setup via a private helper and route null-creds through the
      existing REQ-F-028 prompt path unchanged. Update the `--credential`
      flag description in `neo4j-cli/query/query.go` to document the new
      forms. See REQ-F-101, REQ-F-102, REQ-F-103, REQ-F-110, REQ-F-111.
    status: completed
    dependencies:
      - task-001
    acceptance_criteria:
      - "`-c desktop` resolves the single status==started DBMS; 0 running and defensive >1 produce the REQ-F-101 messages"
      - "`-c desktop-connection:<valid-uuid>` resolves the matching connection; malformed UUID yields a usage error pointing at `desktop list`; unknown UUID yields a fatal error"
      - "Unprefixed `-c <name>` NEVER instantiates the desktop client — covered by `TestResolveConn_UnprefixedCredName_NoDesktopFallthrough`"
      - "Old REQ-F-026 implicit-fallthrough and REQ-F-027 auto-select tests are removed; new tests cover all matrices listed in the plan (`DesktopActive_*`, `DesktopConnection_*`)"
      - "Null-creds path still prompts on TTY and fatals on non-TTY for both resolvers (REQ-F-028 unchanged)"
      - "`--credential` flag help text mentions both prefix forms"
      - "`make test && make fmt-check && make lint` pass"
    completed_at: 2026-05-21T01:00:00Z

