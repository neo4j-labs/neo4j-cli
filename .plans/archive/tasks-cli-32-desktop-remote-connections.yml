  - id: task-012
    title: "Build a relate-shaped fixture HTTP server for desktop e2e"
    status: completed
    description: |
      Add `test/e2e/desktop_fixture/main.go` — a standalone Go HTTP server
      that mimics Neo4j Desktop 2's relate API surface so CI runners can
      exercise `bin/neo4j-cli desktop ...` and `query -c desktop[-connection]`
      end-to-end without installing the real Desktop app. Mirrors the
      pattern of `test/e2e/release_fixture/` (single PID, prints
      `listening on http://127.0.0.1:<port>` to first stdout line, graceful
      SIGTERM cleanup).

      Endpoints (must match relate's real route shapes per
      `packages/web/src/fastify/routes/{dbms,connections}.routes.ts` and
      `packages/electron/src/api/credentials.routes.ts`):
      - `GET /fastify/api-docs` — probe target; respond 200 with any body
      - `GET /fastify/api/dbmss` → lightweight `[]Dbms` (NO status field —
        critical: the task-009 bug rode in via tests that put status here)
      - `GET /fastify/api/dbmss/info` → `[]DbmsInfo` WITH status
      - `GET /fastify/api/dbmss/:id` → single `DbmsInfo` with status
      - `GET /fastify/api/dbmss/versions` → version catalogue
      - `POST /fastify/api/dbmss` → create
      - `DELETE /fastify/api/dbmss/:id`
      - `POST /fastify/api/dbmss/:id/start`
      - `POST /fastify/api/dbmss/:id/stop`
      - `GET /fastify/api/connections` → `[]Connection`
      - `POST /fastify/api/connections`
      - `PATCH /fastify/api/connections/:id`
      - `DELETE /fastify/api/connections/:id`
      - `GET /fastify/api/credentials/:key` → `{username, password}` or
        `null` (key shape `dbms:<id>` or `connection:<id>`)

      Auth middleware: validate `X-Client-Id` + HS256 `X-API-Token` (same
      composite-key signing as Desktop). Use a FIXED test salt — the e2e
      binary (task-013) signs with the same value. Reject with 401 only
      when the scenario admin (below) flips `auth_mode=reject`.

      Scenario admin (in-process state machine):
      - `POST /_scenario/reset` — clear all state to defaults (empty
        lists, default salt)
      - `POST /_scenario/dbms` body
        `{id?, name, status, connectionUri, version, edition, creds?}` —
        add/replace a DBMS row; `creds: null` means "Desktop has no
        stored creds" (REQ-F-028 path)
      - `POST /_scenario/connection` body
        `{id?, name, connectionUri, description?, creds?}` — add/replace
      - `POST /_scenario/auth_mode` body `{mode: "accept"|"reject"|"500"}`
        — make all subsequent requests 401 or 500 for transport-error tests
      - `POST /_scenario/transition` body
        `{id, from_status, to_status, after_calls?}` — used to simulate
        `start --wait` polling (e.g. "after 2 `/dbmss/:id` reads, flip to
        started")
      - Admin endpoints are unauthenticated (out-of-band control plane)

      CLI flags: `--port 0` (default — pick free port), `--salt
      "testsalt"` (default fixed value matching the e2e seam), `--client-id
      <uuid>` (default any). Log every authed request to stderr so test
      failures are diagnosable.

      Build standalone with `go build ./test/e2e/desktop_fixture`; CI
      builds it once per matrix entry and spawns it from the e2e Go test
      harness.
    dependencies:
