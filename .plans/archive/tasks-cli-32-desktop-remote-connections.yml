  - id: task-013
    title: "Add `e2e_desktop_seams` build-tagged overrides to desktopclient"
    description: |
      The production `bin/neo4j-cli` probes ports 44222..44232, reads the
      salt from `<dataDir>/relate.secret.key`, and resolves the data dir
      from env walk / per-OS defaults. None of that works against the
      fixture in task-012. Add a build-tag-gated seam:

      `neo4j-cli/internal/desktopclient/seams_e2e.go` with
      `//go:build e2e_desktop_seams`:
      - When `NEO4J_CLI_DESKTOP_E2E_PORT` is set, `ProbePort` returns it
        verbatim without scanning or `/api-docs` validation.
      - When `NEO4J_CLI_DESKTOP_E2E_SALT` is set, the salt loader returns
        its value instead of reading the keyfile.
      - When `NEO4J_CLI_DESKTOP_E2E_DATA_DIR` is set, `ResolveDataDir`
        returns it; the env-discovery walk is skipped.
      - Same seam wraps the HTTP-origin lookup (used in JWT signing) —
        env override `NEO4J_CLI_DESKTOP_E2E_HTTP_ORIGIN`.

      `neo4j-cli/internal/desktopclient/seams_default.go` with
      `//go:build !e2e_desktop_seams` — no-op shims so production keeps
      the original behaviour. Mirror the layout of
      `neo4j-cli/internal/subcommands/update/seams_e2e.go` and its
      `seams_default.go` counterpart.

      `seams_default_test.go` adds `TestDesktopE2ESeams_NotCompiledByDefault`
      asserting that the e2e file does not contribute symbols when built
      without the tag — copy the exact assertion the update package uses
      (env vars are ignored, ProbePort still scans).

      Build verification: `go build -tags e2e_desktop_seams -o
      bin/neo4j-cli-desktop-e2e ./neo4j-cli` succeeds; running the
      resulting binary with the four env vars set causes ALL relate
      calls to go to the fixture URL with the fixture salt.
