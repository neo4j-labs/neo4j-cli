  - id: task-014
    title: "Desktop e2e test suite: scenarios covering every endpoint we use"
    description: |
      Add `test/e2e/desktop/desktop_test.go` with `//go:build e2e_desktop`,
      mirroring `test/e2e/exitcodes/exitcodes_test.go`. Helpers spawn the
      task-012 fixture, set the task-013 env vars to point at it, and
      drive `bin/neo4j-cli-desktop-e2e <args>` as a subprocess. Each
      scenario calls `/_scenario/reset` first so cases are order-independent
      and can run in parallel.

      **Happy-path coverage** (assert exit 0, stdout JSON shape, fixture
      received the expected HTTP request shape):
      - `desktop list` — empty, dbmss-only (status=started + stopped),
        connections-only, both populated; verify `{dbmss, connections}`
        JSON shape
      - `desktop create --name X --version Y --password Z --rw` — POST,
        then start, then poll `/dbmss/:id` until status=started (use
        `/_scenario/transition` to flip status after N reads)
      - `desktop create --rw` (no --version) — fixture serves multiple
        versions, asserts the latest stable enterprise version is picked
      - `desktop start <id> --wait --rw` — POST + poll loop
      - `desktop stop <id> --wait --rw` — same
      - `desktop delete <id> --yes --rw`
      - `desktop connection create --name --uri --username --password --rw`
      - `desktop connection create --name --uri --username --description --rw`
        (no --password, non-TTY → asserts the non-TTY usage error fires
        BEFORE any HTTP call)
      - `desktop connection update <id> --description X --rw` — partial
        PATCH; fixture asserts only `description` key in body
      - `desktop connection update <id> --name Y --uri Z --username W
        --password V --rw` — full PATCH
      - `desktop connection delete <id> --yes --rw`
      - `query -c desktop "RETURN 1"` against a fixture-served DBMS with
        `connectionUri=bolt://127.0.0.1:1` — asserts exit code is NOT 1
        with "no running DBMS"; asserts stderr DOES surface a Bolt-level
        connect-refused error. (We're not running real Neo4j on CI;
        proving credential resolution dispatched correctly is the goal.)
      - `query -c desktop-connection:<uuid> "RETURN 1"` — same shape

      **DBMS-status matrix** (every status value the filter sees, against
      `-c desktop`):
      - 1 started → exit 0 (Bolt connect-refused class, see above)
      - 0 started (only stopped/starting/stopping DBMSes present) →
        exit 1, message `No running DBMS in Neo4j Desktop 2. Start one
        with 'neo4j-cli desktop start <id>'.`
      - 2 started (defensive, shouldn't happen per Desktop UI) → exit 1,
        message lists both ids
      - 0 DBMSes at all → exit 1, same "no running DBMS" message
      - The status filter must NOT match `starting` or `stopping` (cover
        each explicitly)

      **Connection-prefix sad paths:**
      - `desktop-connection:not-a-uuid` → exit 2, usage error mentioning
        `desktop list`
      - `desktop-connection:<unknown-but-valid-uuid>` → exit 1, "no
        connection with id" fatal
      - `desktop-connection:<known-uuid>` but creds endpoint returns
        `null`, stdin closed → REQ-F-028 non-TTY fatal

      **Transport sad paths:**
      - Fixture down (kill before invocation) → REQ-F-008 canonical
        "doesn't appear to be running" message + exit 1
      - Fixture mid-request EOF (slam-close mid-stream via
        `/_scenario/auth_mode=close`) → same REQ-F-008 message
      - Fixture `/_scenario/auth_mode=reject` → 401 → REQ-F-010 auth
        restart hint
      - Fixture `/_scenario/auth_mode=500` → REQ-F-024 truncated-body
        message, exit 1

      **Resource sad paths:**
      - `desktop create --name duplicate --rw` against fixture returning
        400 → surfaces error, exit 1
      - `desktop delete <unknown-id>` → 404 surfaces, exit 3
      - `desktop start <unknown-id>` / `desktop stop <unknown-id>` → same
      - `desktop connection create` duplicate name → 400 surfaces
      - `desktop connection update <unknown-id>` → 404 surfaces
      - `desktop connection delete <unknown-id>` → 404 surfaces

      Use `test/e2e/check_json` (already exists) for shape assertions
      where possible; for stderr-message assertions, do plain
      `strings.Contains` against the captured stderr buffer.

      Build verification: `go test -tags=e2e_desktop -count=1
      ./test/e2e/desktop/...` passes locally on Linux + macOS (Windows
      coverage validated by CI in task-015).
    status: completed
    dependencies:
      - task-013
    acceptance_criteria:
      - "Test file uses `//go:build e2e_desktop` and is NOT picked up by `go test ./...` without the tag"
      - "Each test resets fixture state via `/_scenario/reset` so cases are independent and `t.Parallel()`-safe"
      - "Every endpoint exercised by the production binary has at least one happy-path AND one sad-path scenario"
      - "DBMS status matrix covers `started` (match), `starting` (no match), `stopping` (no match), `stopped` (no match)"
      - "REQ-F-008 (unreachable), REQ-F-010 (401), REQ-F-024 (5xx), REQ-F-028 (null-creds non-TTY) each have a dedicated test"
      - "All exit-code categories surfaced by desktop / query are asserted: 0 success, 1 fatal, 2 usage, 3 not_found, 4 auth_error"
      - "Test failures print the fixture's stderr log (request trace) so CI logs are debuggable"
      - "Total wall time under 60s on a Linux CI runner"
    completed_at: 2026-05-21T16:00:00Z

