feature: db-credential-storage
prd: ./prd-db-credential-storage.md
created_at: 2026-05-06T00:00:00Z
updated_at: 2026-05-06T00:00:00Z

tasks:
  - id: task-001
    title: "Add DatabaseCredentials storage layer to common/clicfg/credentials/"
    description: |
      Create common/clicfg/credentials/database.go defining DatabaseCredentials and
      DatabaseCredential structs, mirroring the structure of aura.go. Implement methods
      Add, Remove, SetDefault, GetDefault, Get, and List, each calling the onUpdate
      callback on mutation. Update CredentialsFile in credentials.go to include a
      Database *DatabaseCredentials field (JSON key "database", omitempty). Add
      database_test.go with table-driven tests covering all methods and edge cases
      (duplicate add, unknown remove, clear default on remove).
    status: completed
    dependencies: []
    acceptance_criteria:
      - "DatabaseCredential struct stores name, username, password, database-name, uri, insecure (bool) with correct JSON tags"
      - "CredentialsFile.Database field is present with json:\"database,omitempty\""
      - "Add returns error when a credential with the same name already exists"
      - "Remove clears DefaultCredential when the removed credential was the default"
      - "GetDefault returns nil/empty when no default is set"
      - "All methods call onUpdate and persist changes via the existing save mechanism"
      - "make test passes with new tests covering all methods"
    completed_at: 2026-05-06T00:00:00Z

  - id: task-002
    title: "Add neo4j-cli credential database parent command and add leaf"
    description: |
      Create the directory neo4j-cli/internal/subcommands/credential/database/ with
      database.go defining NewCmd that registers the four leaf commands. Implement
      add.go with required flags --name, --username, --password, --uri and optional
      --database-name (default "neo4j") and --insecure (default false). Mount the
      database parent in neo4j-cli/internal/subcommands/credential/credential.go via
      cmd.AddCommand(database.NewCmd(cfg)). All new Go files must carry the Neo4j
      copyright header.
    status: completed
    dependencies:
      - task-001
    acceptance_criteria:
      - "neo4j-cli credential database add --name x --username u --password p --uri http://localhost:7474 succeeds and persists to credentials.json"
      - "--database-name defaults to \"neo4j\" when omitted"
      - "--insecure defaults to false when omitted; stored as insecure: false in JSON"
      - "Omitting any required flag (--name, --username, --password, --uri) produces a usage error"
      - "Adding a duplicate name returns a descriptive error"
      - "add_test.go uses table-driven tests covering required-flag validation and success path"
      - "make test and make fmt-check pass"
    completed_at: 2026-05-06T01:00:00Z

  - id: task-003
    title: "Add credential database list leaf command"
    description: |
      Create neo4j-cli/internal/subcommands/credential/database/list.go implementing
      the list subcommand. Use output.PrintBodyMap with fields ["name", "username",
      "database-name", "uri", "insecure", "default"] in that order. Password must
      never appear in any output format. The AsArray / MarshalJSON pattern should
      follow the existing credential list conventions so --format json|table|toon
      all work correctly.
    status: completed
    dependencies:
      - task-002
    acceptance_criteria:
      - "list output includes columns NAME, USERNAME, DATABASE-NAME, URI, INSECURE, DEFAULT"
      - "Password is absent from both table and json output"
      - "DEFAULT column shows true for the active default credential and false/empty for others"
      - "list_test.go covers empty list, single credential, multiple credentials, and JSON format"
      - "make test and make fmt-check pass"
    completed_at: 2026-05-06T02:00:00Z

  - id: task-004
    title: "Add credential database use leaf command"
    description: |
      Create neo4j-cli/internal/subcommands/credential/database/use.go implementing
      the use subcommand. It takes a single positional argument <name> and calls
      DatabaseCredentials.SetDefault. An unknown name must produce a descriptive
      error. Follow the existing aura credential use command pattern.
    status: completed
    dependencies:
      - task-002
    acceptance_criteria:
      - "neo4j-cli credential database use <name> sets default-credential in credentials.json"
      - "Passing an unknown name returns an error with the unknown name in the message"
      - "use_test.go covers the success path and the unknown-name error path"
      - "make test and make fmt-check pass"
    completed_at: 2026-05-06T03:00:00Z

  - id: task-005
    title: "Add credential database remove leaf command"
    description: |
      Create neo4j-cli/internal/subcommands/credential/database/remove.go implementing
      the remove subcommand. It takes a single positional argument <name> and calls
      DatabaseCredentials.Remove. If the removed credential is the current default,
      default-credential is cleared (handled in the storage layer per task-001). An
      unknown name must produce a descriptive error.
    status: completed
    dependencies:
      - task-002
    acceptance_criteria:
      - "neo4j-cli credential database remove <name> deletes the entry from credentials.json"
      - "Removing the default credential clears default-credential in credentials.json"
      - "Passing an unknown name returns an error with the unknown name in the message"
      - "remove_test.go covers success, default-cleared, and unknown-name paths"
      - "make test and make fmt-check pass"
    completed_at: 2026-05-06T04:00:00Z

  - id: task-006
    title: "Integrate default database credential into neo4j-cli query connection resolution"
    description: |
      Update resolveConn() in neo4j-cli/query/connect.go to apply the stored default
      database credential when no connection flags or env vars are set. Add all-or-nothing
      validation: if any of --username/NEO4J_USERNAME, --password/NEO4J_PASSWORD,
      --uri/NEO4J_URI, --database/NEO4J_DATABASE is explicitly provided (flag Changed
      or env var non-empty), all four must be present or the command errors. Thread
      cfg *clicfg.Config into resolveConn (or access it in RunE) so the credential
      store is reachable. When a stored credential supplies insecure: true, TLS
      verification is skipped without --insecure on the command line.
    status: completed
    dependencies:
      - task-001
    acceptance_criteria:
      - "With a default credential set and no flags/env vars, query uses the stored uri/username/password/database-name/insecure"
      - "With no default credential and no flags/env vars, existing behaviour is preserved (defaults + TTY password prompt)"
      - "Setting only one of the four connection params errors with a message naming all four required params"
      - "Setting all four connection params explicitly bypasses stored credentials entirely"
      - "A credential with insecure:true causes TLS verification to be skipped without --insecure flag"
      - "Tests in connect_test.go (or equivalent) cover: stored-credential path, all-or-nothing error, no-credential fallback"
      - "make test and make fmt-check pass"
    completed_at: 2026-05-06T05:00:00Z

