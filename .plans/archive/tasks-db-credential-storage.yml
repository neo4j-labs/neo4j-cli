      - "make test passes with no failures"
      - "make fmt-check exits 0 (no unformatted files)"
      - "make license-check passes (all new files have copyright header)"
      - "make generate-check exits 0 (no stale skill bundles)"
    completed_at: 2026-05-06T07:00:00Z
