tasks:
  - id: task-001
    title: "Bash installer: case-dispatch with TTY prompt via /dev/tty"
    description: |
      Replace lines 170-173 of distribution/installation-scripts/install-neo4j-cli.sh
      (the current `if [ "${NEO4J_CLI_AUTO_INSTALL_SKILL:-}" = "1" ]` block) with a
      three-arm case on the env var: "1" -> install, "0" -> skip, default -> prompt
      only if both `[ -t 1 ]` and `[ -r /dev/tty ]` are true, reading the answer via
      `read -r answer < /dev/tty`. Default-yes (Enter installs). Preserve the
      `|| true` suppression so a failed `skill install` never breaks the installer.
    status: completed
    dependencies: []
    acceptance_criteria:
      - "Env var =1 still triggers `neo4j-cli skill install --rw` with no prompt"
      - "Env var =0 skips the skill install with no prompt"
      - "Env var unset + interactive TTY prompts [Y/n], Enter/y/yes installs, n/no skips"
      - "Env var unset + non-interactive (no /dev/tty or stdout not TTY) skips silently"
      - "A non-zero exit from skill install does not propagate (installer still exits 0)"
      - "Existing four bats tests in tests/install-neo4j-cli.bats pass unchanged"
    completed_at: 2026-05-25T08:43:28Z

