feature: aura-credential-flag
prd: ./prd-aura-credential-flag.md
created_at: 2026-05-06T00:00:00Z
updated_at: 2026-05-06T00:00:00Z

tasks:
  - id: task-001
    title: "Add SetActiveCredential/ActiveCredential to AuraConfig"
    description: |
      Add an unexported runtime field `activeCredential *credentials.AuraCredential` to the
      `AuraConfig` struct in `common/clicfg/clicfg.go`, along with two methods:
      `SetActiveCredential(cred *credentials.AuraCredential)` and
      `ActiveCredential() *credentials.AuraCredential`. The field is never persisted to viper
      or disk — it is a pure per-invocation override, analogous to how `BindBaseUrl` works.
      Add unit tests in `common/clicfg/` covering both methods.
    status: completed
    dependencies: []
    acceptance_criteria:
      - "AuraConfig has an unexported `activeCredential` field of type `*credentials.AuraCredential`"
      - "SetActiveCredential stores the pointer; ActiveCredential returns it (nil when unset)"
      - "Field is not serialized to or read from viper / disk"
      - "Unit tests pass for both set and get paths, including the nil/unset case"
    completed_at: 2026-05-06T00:00:00Z

  - id: task-002
    title: "Update MakeRequest() to use ActiveCredential with GetDefault() fallback"
    description: |
      In `neo4j-cli/aura/internal/api/api.go`, replace the hardcoded `cfg.Credentials.Aura.GetDefault()`
      call with a branch: if `cfg.Aura.ActiveCredential()` is non-nil, use it directly; otherwise
      fall back to `GetDefault()`. No error handling is needed in the active-credential branch because
      validation already happened in `PersistentPreRunE`. Add unit tests for both resolution paths
      (active credential set, and no active credential falling back to default).
    status: completed
    dependencies:
      - task-001
    acceptance_criteria:
      - "MakeRequest uses cfg.Aura.ActiveCredential() when non-nil, skipping GetDefault()"
      - "MakeRequest falls back to cfg.Credentials.Aura.GetDefault() when ActiveCredential() returns nil"
      - "Existing behaviour (no --credential flag) is unchanged"
      - "Unit tests cover both branches"
    completed_at: 2026-05-06T00:00:00Z

  - id: task-003
    title: "Implement RegisterAuraCredentialFlag() helper in common/flags"
    description: |
      Add `RegisterAuraCredentialFlag(cmd *cobra.Command, cfg *clicfg.Config)` to
      `common/flags/flags.go` alongside the existing `RegisterOutputFlag`. The helper adds
      `--credential` / `-c` as a persistent string flag, then wraps any existing
      `cmd.PersistentPreRunE` with a new hook that: runs the captured hook first; if the flag
      was changed, calls `cfg.Credentials.Aura.Get(name)` and on failure returns a context-aware
      error using `cmd.Root().Use` to pick the right hint (`aura-cli credential list` vs
      `neo4j-cli aura credential list`); on success calls `cfg.Aura.SetActiveCredential(cred)`.
      Add unit tests for all hook paths including both binary-name hints.
    status: completed
    dependencies:
      - task-001
    acceptance_criteria:
      - "RegisterAuraCredentialFlag adds --credential / -c as a persistent flag with empty default"
      - "Hook runs any pre-existing PersistentPreRunE before credential resolution"
      - "Named credential found: credential stored via SetActiveCredential, no error"
      - "Named credential not found, root is aura-cli: error hints `aura-cli credential list`"
      - "Named credential not found, root is neo4j-cli: error hints `neo4j-cli aura credential list`"
      - "Flag not set: SetActiveCredential is not called, cfg unchanged"
      - "Unit tests cover all paths above"
    completed_at: 2026-05-06T00:00:00Z

  - id: task-004
    title: "Wire RegisterAuraCredentialFlag into all seven resource parent commands"
    description: |
      Call `RegisterAuraCredentialFlag(cmd, cfg)` at the end of `NewCmd()` in each of the seven
      resource parent files: `instance/instance.go`, `tenant/tenant.go`, `deployment/deployment.go`,
      the dataapi parent, `graphanalytics/graphanalytics.go`, `customermanagedkey/customermanagedkey.go`,
      and `import/import.go`. `credential/` and `config/` are deliberately excluded. Add or extend at
      least one leaf command test per resource parent (e.g. `instance list`, `tenant list`) asserting
      that `--credential myname` and `-c myname` are accepted and result in the correct credential
      being used for the API call, using the existing mock HTTP server pattern from `testutils`.
    status: completed
    dependencies:
      - task-002
      - task-003
    acceptance_criteria:
      - "All seven resource parents call RegisterAuraCredentialFlag at the end of NewCmd()"
      - "credential/ and config/ subcommands do NOT have the --credential flag"
      - "Each resource parent has at least one test asserting --credential/-c is accepted"
      - "Test verifies the named credential (not the default) is used for the API call"
      - "`make test` passes for all affected packages"
    completed_at: 2026-05-06T00:00:00Z

  - id: task-005
    title: "Add -c shorthand to neo4j-cli query --credential flag"
    description: |
      In `neo4j-cli/query/query.go`, change the existing
      `cmd.PersistentFlags().String("credential", "", ...)` call to
      `cmd.PersistentFlags().StringP("credential", "c", "", ...)`. No other changes to the
      query package are needed. Verify that existing query credential tests still pass and
      that `-c` is accepted as a shorthand in the query command.
    status: completed
    dependencies: []
    acceptance_criteria:
      - "query --credential flag is defined with StringP using shorthand 'c'"
      - "`neo4j-cli query \"RETURN 1\" -c mydb` is accepted without error"
      - "Existing query credential tests pass unchanged"
      - "`make test` passes for the query package"
    completed_at: 2026-05-06T00:00:00Z

  - id: task-006
    title: "Regenerate skill bundles and add changelog entries"
    description: |
      Run `go generate ./neo4j-cli/internal/skill/... ./neo4j-cli/aura/internal/skill/...` to
      regenerate skill bundles reflecting the new `--credential`/`-c` flags on Aura resource
      commands and the updated shorthand on `neo4j-cli query`. Then create dual-project changelog
      entries using `changie new --projects aura-cli --projects neo4j-cli --kind Minor --body
      "<message>"`. Verify `make generate-check` exits 0 and the unreleased directory contains
      entries for both projects.
    status: completed
    dependencies:
      - task-004
      - task-005
    acceptance_criteria:
      - "`go generate ./neo4j-cli/internal/skill/... ./neo4j-cli/aura/internal/skill/...` runs without error"
      - "`make generate-check` exits 0 (no uncommitted bundle drift)"
      - "`.changes/unreleased/` contains changelog entries for both `aura-cli` and `neo4j-cli`"
      - "`make test`, `make lint`, and `make fmt-check` all pass"
    completed_at: 2026-05-06T00:00:00Z
