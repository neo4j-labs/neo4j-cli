tasks:
  - id: task-001
    title: "Add `FetchAppInfo` + `AppInfo` to desktopclient"
    description: |
      Add an exported `desktopclient.FetchAppInfo(ctx, probe) (AppInfo, error)`
      that issues an UNAUTHENTICATED `GET <probe.Origin>/fastify/api/info/app`,
      JSON-decodes the reply into a new `AppInfo` struct, and returns it. No
      `X-Client-Id` / `X-API-Token` headers. Reuse the existing `httpDoFn`
      seam, `requestTimeout` constant, `maxResponseBodyBytes` cap, and the
      same transport-error mapping pattern as `Client.doRaw` in `client.go`
      (deadline-exceeded → canonical timeout, everything else → canonical
      unreachable). `AppInfo` exposes all seven Desktop fields: `Platform`,
      `Version`, `AppPath`, `LogsPath`, `DataPath`, `CachePath`, `ConfigPath`
      (unknown future fields ignored by default). Colocated unit tests in
      `discovery_test.go` cover: 200 happy path with full payload; 401
      (older Desktop) returning a typed error; 5xx; transport failure
      (httpDoFn returns error); decode error (malformed JSON); empty body.
    status: completed
    dependencies: []
    acceptance_criteria:
      - "`desktopclient.FetchAppInfo(ctx, probe)` exists and is exported"
      - "`desktopclient.AppInfo` struct exposes all seven fields (Platform, Version, AppPath, LogsPath, DataPath, CachePath, ConfigPath)"
      - "No `X-Client-Id` / `X-API-Token` headers are sent — asserted by mock httpDoFn"
      - "Hermetic tests cover 200, 401, 5xx, transport error, decode error, empty body"
      - "`make test`, `make fmt-check`, `make lint`, `make license-check` are clean"
    completed_at: 2026-05-22T13:30:00Z

  - id: task-002
    title: "Rework `ResolveDataDir` precedence to consult `/info/app`"
    description: |
      Change `ResolveDataDir(ctx, fs)` to `ResolveDataDir(ctx, fs, probe)` in
      `neo4j-cli/internal/desktopclient/discovery.go`. New precedence:
      (1) `NEO4J_DESKTOP_DATA_PATH` env var (unchanged); (2)
      `FetchAppInfo(ctx, probe).DataPath` — primary; (3) env-JSON
      `relateDataPath` via `LoadEnvs(fs)` + `ActiveEnv(envs, nameOverride)`
      (unchanged); (4) `defaultDataDir()` per-OS hardcoded path (unchanged
      as last-resort). Any non-200 from `/info/app` (401, 5xx, timeout,
      transport, decode error, empty `DataPath`) falls through to step 3
      without surfacing. Empty/zero `ProbeResult` skips step 2 entirely so
      callers that don't probe (none today, future-proofing) still work.
      Update doc comments on `ResolveDataDir` to describe the new order.
      Update every caller of `ResolveDataDir` to pass `probe`: search for
      callers via `grep -rn "ResolveDataDir(" neo4j-cli/`. Add
      table-driven cases to `discovery_test.go`: /info/app 200 wins;
      /info/app 401 → env-JSON; /info/app 401 + no env-JSON → OS default;
      /info/app 5xx → fallback; /info/app transport error → fallback;
      /info/app decode error → fallback; empty DataPath → fallback;
      NEO4J_DESKTOP_DATA_PATH set ⇒ /info/app is NOT called (mock
      httpDoFn asserts zero invocations).
    status: completed
    dependencies:
      - task-001
    acceptance_criteria:
      - "`ResolveDataDir` signature is `(ctx, fs, probe)` and applies the four-step precedence in REQ-F-203"
      - "All callers in `neo4j-cli/` are updated to pass `ProbeResult`; `grep ResolveDataDir` shows no stale call sites"
      - "Eight table-driven precedence cases pass, including the `NEO4J_DESKTOP_DATA_PATH` short-circuit verified by zero httpDoFn invocations"
      - "Doc comment on `ResolveDataDir` reflects the new order"
      - "`make test`, `make fmt-check`, `make lint`, `make license-check` are clean"
    completed_at: 2026-05-22T14:30:00Z

  - id: task-003
    title: "Surface `/info/app` fields inline in `desktop doctor`"
    description: |
      Update `neo4j-cli/internal/subcommands/desktop/doctor.go` to call
      `desktopclient.FetchAppInfo` once after the port probe and BEFORE
      the data-dir resolution check. On success, render three inline
      detail lines (`version`, `appPath`, `dataPath`) on the existing
      info_app check row (PASS status). On failure (401, 5xx, transport,
      decode, empty), render the row with detail `"unavailable (older
      Desktop)"` at INFO status — never FAIL — and proceed; the
      subsequent data-dir / salt / auth-probe checks must still run. Keep
      the existing skip-on-dependency-fail semantics from the doctor
      orchestrator (`tasks-desktop-doctor` task-003); the new check
      depends only on the port probe. Update `doctor_test.go` with two
      new table cases (success + failure) using the existing httpDoFn
      seam and a golden block for the rendered table row. If any `Long`
      or `Example` text on the doctor leaf shifts, run
      `go generate ./neo4j-cli/internal/skill/...` and commit the
      regenerated bundle so `TestGenerator_RoundTrip` passes.
    status: completed
    dependencies:
      - task-002
    acceptance_criteria:
      - "`desktop doctor` emits a new row between the port probe and data-dir check; success row shows `version`, `appPath`, `dataPath`"
      - "Failure row (401 / 5xx / transport / decode / empty) renders at INFO status, never FAIL, and subsequent checks still execute"
      - "`doctor_test.go` covers both success and failure branches with golden expectations"
      - "If bundle drift occurred, `make generate-check` is clean after the regenerated bundle is committed"
      - "`make test`, `make fmt-check`, `make lint`, `make license-check`, `make generate-check` are all clean"
    completed_at: 2026-05-22T15:30:00Z

  - id: task-004
    title: "E2E smoke against live Desktop + changelog + final gate sweep"
    description: |
      Build `bin/neo4j-cli` and run the three live scenarios from the
      PRD acceptance criteria against a running Desktop 2 dev build:
      (1) no `NEO4J_DESKTOP_DATA_PATH`, no `--port` — `desktop list`
      succeeds purely via `/info/app`-derived `dataPath`; (2)
      `desktop doctor` is green with the `/info/app` row showing the
      expected `version` / `appPath` / `dataPath`; (3) temporarily move
      `~/Library/Application Support/com.Neo4j.Relate/Config/environments/*.json`
      aside and confirm `desktop list` still works (env-JSON is no
      longer load-bearing on current Desktop). Restore the moved files
      after the test. File a changelog entry via
      `changie new --projects neo4j-cli --kind Minor --body "desktop: discover relate data dir via /info/app instead of OS-specific hardcoded paths"`.
      Final gate sweep — `make test`, `make fmt-check`, `make lint`,
      `make license-check`, `make generate-check` — all clean.
    status: completed
    dependencies:
      - task-003
    acceptance_criteria:
      - "Scenario 1: `desktop list` returns the running DBMSes with no env override and no env-JSON involvement"
      - "Scenario 2: `desktop doctor` shows the /info/app row with the actual Desktop version/appPath/dataPath; all other checks PASS"
      - "Scenario 3: with env-JSONs moved aside, `desktop list` still works; env-JSONs restored afterwards"
      - "Changelog entry created under `.changes/unreleased/` with the documented body"
      - "All five gates (`make test`, `make fmt-check`, `make lint`, `make license-check`, `make generate-check`) pass on macOS"
    completed_at: 2026-05-22T16:00:00Z
