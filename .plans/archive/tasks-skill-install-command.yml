  - id: task-016
    title: "Fix bundle root mismatch + add end-to-end install regression test"
    description: |
      Bug discovered in real-world dogfooding: `./bin/neo4j-cli skill install
      claude-code` reports success but writes to
      `~/.claude/skills/neo4j-cli/bundle/SKILL.md` instead of
      `~/.claude/skills/neo4j-cli/SKILL.md`, and `{{VERSION}}` is never
      substituted. Root cause: `//go:embed bundle` exposes an fs.FS rooted
      ABOVE the bundle/ directory, so WalkDir(".") sees `bundle/SKILL.md`.
      The installer's `p == "SKILL.md"` substitution check and the
      destination path both assume the bundle is flat. Existing unit tests
      use `fstest.MapFS{"SKILL.md": ...}` (already flat) so the bug never
      surfaced.

      Fix: change both per-binary embed packages
      (`neo4j-cli/internal/skill/embed.go` and
      `neo4j-cli/aura/internal/skill/embed.go`) to expose `Bundle` as an
      `fs.FS` derived from `fs.Sub(rawBundle, "bundle")`. Keep the raw
      `//go:embed bundle` directive unexported.

      Add a regression test that catches THIS specific class of bug — i.e.
      that uses the actual exported `Bundle` (not a hand-rolled fixture) to
      drive `Install` against `afero.NewMemMapFs` and asserts:
      (a) SKILL.md lands at `<skillsDir>/<skillName>/SKILL.md` (no stray
          `bundle/` segment),
      (b) `{{VERSION}}` placeholder is replaced with the supplied version,
      (c) at least one `references/<sub>.md` file is also written, and
      (d) the bundle's WalkDir(".") yields `SKILL.md` at the root.

      Place the test in each per-binary skill package (e.g.
      `neo4j-cli/internal/skill/install_e2e_test.go` and the aura
      counterpart) so it exercises the real embed.FS + the installer
      together. Use `t.Setenv("HOME", t.TempDir())` so detection finds the
      Claude Code agent without touching the user's real ~/.claude.
    status: completed
    dependencies:
      - task-009
    acceptance_criteria:
      - "Both `<bin>/internal/skill/embed.go` files expose `Bundle fs.FS` rooted at the bundle/ contents (WalkDir at root yields `SKILL.md`, not `bundle/SKILL.md`)"
      - "Real-world repro is fixed: `./bin/neo4j-cli skill install claude-code` writes `~/.claude/skills/neo4j-cli/SKILL.md` (not `bundle/SKILL.md`) and the version frontmatter is substituted"
      - "End-to-end regression test in each per-binary skill package uses the exported Bundle, runs Install on afero.MemMapFs, asserts SKILL.md path, version substitution, and at least one references/* file"
      - "An additional test in common/skill (or per-binary) confirms that WalkDir(Bundle, \".\") yields `SKILL.md` (not `bundle/SKILL.md`) — locks the contract for future binaries"
      - "Existing tests still pass; coverage of common/skill stays ≥80%"
      - "make build / make test / make generate-check all green"
    completed_at: 2026-05-04T20:30:00Z

  - id: task-017
    title: "Fix Windows CI failures (path separators + CRLF golden files)"
    status: completed
    description: |
      Two Windows-only failures surfaced on the PR #12 CI run
      (https://github.com/neo4j-labs/neo4j-cli/actions/runs/25311172924):

      1. `common/skill TestExpandPath/XDG_unset_falls_back_to_HOME/.config`
         and `XDG_empty_string_falls_back_to_HOME/.config`. Root cause:
         `expandPath` (common/skill/agents.go:120) does
         `strings.ReplaceAll(path, "$XDG_CONFIG_HOME", xdg)`. The OpenCode
         catalog entry uses forward slashes (`$XDG_CONFIG_HOME/opencode`)
         but on Windows `xdg` resolves to a backslash path
         (`C:\…\.config`), producing mixed separators
         (`C:\…\.config/opencode`). Test expects all-backslash. Fix: pass
         the post-replacement result through `filepath.FromSlash` so the
         whole path is OS-native. Catalog entries can keep forward slashes
         (portable convention).

      2. `common/skill/render TestBundle_GoldenFiles` (3 sub-failures —
         SKILL.md and both references). Root cause: golden `.md` files in
         `testdata/` get LF→CRLF converted by Git autocrlf on Windows
         checkout (default on windows-latest runners), but the renderer
         emits LF. Byte-equal compare fails. Same risk applies to every
         committed `internal/skill/bundle/*.md`, `additions.md`, and
         `description.txt`. `make generate-check` on Windows would also
         fail because regenerating writes LF while Git diff sees CRLF.
         Fix: add a top-level `.gitattributes` pinning LF for the file
         types byte-compared in tests or by `make generate-check`:

         ```
         common/skill/render/testdata/** text eol=lf
         **/internal/skill/bundle/** text eol=lf
         **/internal/skill/additions.md text eol=lf
         **/internal/skill/description.txt text eol=lf
         ```

      Add a regression test for #1 that exercises `expandPath` with
      mixed-slash input and asserts the result is fully OS-native (so a
      future contributor adding a similar catalog entry won't reintroduce
      the bug). For #2, add a small assertion (e.g. in render_test.go or
      bundles_test.go) that no committed testdata/bundle file contains
      `\r\n` — `.gitattributes` is the primary defence; the assertion
      catches the case where someone removes or weakens the attribute.
    dependencies:
      - task-016
    acceptance_criteria:
      - "expandPath returns OS-native separators on Windows for the OpenCode XDG_CONFIG_HOME entries (existing 2 failing TestExpandPath subtests pass on Windows)"
      - "A new test case exercises expandPath with the OpenCode-style mixed-slash input and asserts the result is fully OS-native (so the same bug can't regress)"
      - ".gitattributes exists at repo root pinning LF for testdata, bundle/, additions.md, description.txt under any internal/skill/ tree"
      - "TestBundle_GoldenFiles passes on Windows CI (verified by re-running CI on PR #12 after the fix)"
      - "make generate-check is green on Windows (no spurious CRLF/LF diffs)"
      - "make build / make test green on the full ubuntu/windows/macos matrix in PR #12 CI"
      - "No regression on ubuntu/macos coverage or test counts"
    completed_at: 2026-05-04T21:15:00Z

  - id: task-018
    title: "Restructure common/skill cobra files to match one-file-per-leaf convention"
    status: completed
    description: |
      Audit (post-PR-#12) found two cobra-layout deviations from the
      dominant codebase pattern. The dominant style — used by
      `aura/internal/subcommands/instance/`, `tenant/`, `credential/`,
      `config/`, etc. — is: parent file named after the resource, one
      file per leaf, tests colocated. Skill currently has all four leaves
      (install/remove/list/check) inline in a single 311-line
      `common/skill/command.go`, with a generic filename. A separate PR
      is in flight that addresses the package-location concern (the "B"
      option from the audit); this task only fixes the file-granularity
      issue ("A" option) and stays within `common/skill/`.

      Refactor:
      - Rename `common/skill/command.go` → `common/skill/skill.go`. Keep
        ONLY the parent `NewCmd(cfg, bundle, skillName)` factory and any
        small persistent-flag wiring there.
      - Extract each leaf into its own file:
          common/skill/install.go      newInstallCmd(cfg, bundle, skillName)
          common/skill/remove.go       newRemoveCmd(cfg, skillName)
          common/skill/list.go         newListCmd(cfg, skillName)
          common/skill/check.go        newCheckCmd(cfg, skillName, version)
      - Split `command_test.go` into `install_test.go`, `remove_test.go`,
        `list_test.go`, `check_test.go`, colocated with their leaves.
        Existing test cases all stay; just move them. If shared test
        helpers exist, lift them into a small unexported helper file
        (e.g. `cmd_helpers_test.go`) at package level.
      - Keep all exported names stable. NewCmd signature unchanged. No
        behaviour changes — pure code reorganisation.
      - Verify the cobra command tree is byte-identical before and
        after by exec'ing `<bin> skill --help` and per-leaf `--help` and
        diff'ing — useful sanity check during development.

      Rationale: matches the dominant in-repo pattern; makes
      `grep skill.go` discover the parent; lets future contributors
      copy the `instance/<action>.go` template when adding a new leaf
      (e.g. `skill update`).
    dependencies:
      - task-006
    acceptance_criteria:
      - "common/skill/skill.go contains ONLY the NewCmd parent factory and persistent-flag wiring; ≤80 lines"
      - "Each of install / remove / list / check has its own .go and _test.go file at common/skill/ with the leaf cobra factory + tests; existing test cases preserved (no test deletions)"
      - "command.go and command_test.go no longer exist"
      - "<bin> skill --help and each <bin> skill <leaf> --help output is byte-identical to the pre-refactor branch (manual diff or scripted)"
      - "make test green; coverage of common/skill stays ≥80%; no behaviour change"
      - "make fmt-check, make lint, make license-check, make generate-check all green"
      - "Public API of common/skill is unchanged (verified: only NewCmd, Install, Remove, List, Check, AGENTS, FindAgent, etc. remain exported with same signatures)"
    completed_at: 2026-05-04T22:00:00Z
