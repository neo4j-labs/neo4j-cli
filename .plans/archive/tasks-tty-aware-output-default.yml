    title: "Document TTY-aware default in README and add changelog entry"
    description: |
      Add a one-line note to README.md's query section explaining the new
      auto-detect behaviour, and create a Minor changelog entry for
      neo4j-cli via changie. This is the final user-visible documentation
      step.
    status: completed
    dependencies:
