        a path that exists in the fixture's tmpdir).
      - 120s tolerance — no artificial delay; the fixture responds
        immediately. Long-timeout coverage stays in `desktopclient` unit
        tests.

      `state.go`:
      - Add per-DBMS plugin state:
        ```go
        type dbms struct {
            // ... existing fields ...
            availablePlugins []DbmsPlugin // catalog the fixture exposes
            installedPlugins []DbmsPlugin // current installed list
        }
        ```
      - `install(dbmsID, pluginName)`: look up the plugin in
        `availablePlugins` (or treat as path → noop file copy in tmpdir);
        if it's already in `installedPlugins`, return the existing entry
        (idempotent). Otherwise append with `pendingRestart` set to
        match the DBMS state: `true` if the DBMS is currently `started`,
        `false` if `stopped`.
      - `uninstall(dbmsID, pluginName)`: remove from `installedPlugins`
        if present; always return `{name: pluginName}` (idempotent).
      - `restart(dbmsID)`: on every `start`/`stop` cycle, flip
        `pendingRestart: false` for ALL installed plugins on that DBMS.
        This is the fixture's stand-in for relate's JAR-vs-PID mtime
        comparison.

      `scenario.go`:
      - Add `scenarioPutPlugin(s, w, r)` injector (mirrors
        `scenarioPutDbms` and `scenarioPutConnection`) — lets e2e tests
        seed available + installed plugin lists into the fixture's
        state for a specific DBMS before invoking the CLI.
