      - POST install adds to installed list with `pendingRestart` matching DBMS state.
      - POST install of already-installed plugin is idempotent.
      - POST uninstall removes from list; idempotent on missing plugin.
      - DBMS state change (start/stop) flips `pendingRestart` on installed plugins.
      - 404 disambiguation: unknown DBMS vs unknown plugin produce different message bodies.
