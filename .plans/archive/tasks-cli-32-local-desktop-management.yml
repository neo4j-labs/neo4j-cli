  - id: task-015
    title: "Enrich `desktop list` with concurrent `GetDbms` fan-out for status/version"
    description: |
      Live smoke-test against Desktop 2.1.4 showed `GET /dbmss` returns a
      slimmed shape — `id, name, metadata, connectionUri, rootPath` — without
      `status`, `version`, `edition`, `serverStatus`, even for a freshly-started
      DBMS. Desktop's per-DBMS endpoint `GET /dbmss/:id` returns the full
      `DbmsInfo` (we already rely on this in `desktop start --wait` polling
      via `GetDbms`). Fix `desktop list` to fan-out one `GetDbms` per entry
      after the initial `ListDbmss` call, populating `status` / `version` /
      `edition` for the default table columns + JSON payload.

      Implementation in `neo4j-cli/internal/subcommands/desktop/list.go`:
      - After `client.ListDbmss(ctx)`, fan-out `client.GetDbms(ctx, item.ID)`
        for each entry concurrently (errgroup with a small bounded
        concurrency, e.g. 8 in flight at once).
      - Per-entry failure should NOT abort the whole list. Fall back to the
        slimmed list entry with a stderr-only warning naming the id, so the
        table still renders for the rest.
      - Preserve the order from `ListDbmss` so users see a stable column
        ordering on re-runs.
      - Tests: extend `list_test.go` with httptest cases covering
        (i) list + per-DBMS enrichment populates `status`/`version`,
        (ii) one-entry-fails leaves a slim row + emits stderr warning,
        (iii) concurrency bound respected (counter on the httptest handler).
      - No skill-bundle regen needed (no cobra-tree change).
    status: completed
    dependencies:
      - task-005
    acceptance_criteria:
      - "`desktop list --format json` includes `status`, `version`, `edition` for every entry when Desktop returns them on `GET /dbmss/:id`"
      - "`desktop list` table shows the populated `version` and `status` columns instead of blanks"
      - "If a per-DBMS `GetDbms` call fails for one entry, the rest of the list still renders and a stderr-only warning names the failing id"
      - "List entry order matches the order returned by `ListDbmss` (no goroutine-induced shuffling)"
      - "Concurrency is bounded (≤8 in-flight `GetDbms` calls) so 50+ DBMSes don't open 50+ sockets"
      - "All gates green: `make test && make fmt-check && make lint && make license-check`"
    completed_at: 2026-05-18T17:30:00Z

  - id: task-016
    title: "Enrich `desktop start` / `desktop stop` output via post-call `GetDbms`"
    description: |
      Live smoke surfaced a UX bug: `desktop start <id>` (no `--wait`) renders a
      one-column row — only `id` populated. Cause: Desktop's `POST
      /dbmss/:id/start` returns a stringified shell output, not a `DbmsInfo`,
      so `start.go:37-62` falls back to a slim `{"id": ...}` envelope when
      `--wait` is not set. `stop.go:25-62` mirrors the same bug.

      Fix: after a successful `client.StartDbms` / `client.StopDbms`, ALWAYS
      issue one `client.GetDbms(ctx, id)` and render that. When `--wait` is
      set, the existing `pollUntilStatus` loop (`helpers.go:80-102`) takes
      over and supersedes this — leave the `--wait` path alone. If the
      post-call `GetDbms` itself fails (Desktop quit between calls; rare),
      emit a stderr warning naming the id and fall back to the current slim
      envelope so the command still exits 0 (lifecycle call already succeeded).

      Extract `fetchForRender(ctx, client, id, warnOut) (*DbmsInfo, bool)`
      into `helpers.go` so both leaves share the wording. Return `(*DbmsInfo,
      true)` on success, `(nil, false)` on fetch failure.

      Files:
      - `neo4j-cli/internal/subcommands/desktop/start.go` — call
        `fetchForRender` after `StartDbms` when `!wait`.
      - `neo4j-cli/internal/subcommands/desktop/stop.go` — mirror.
      - `neo4j-cli/internal/subcommands/desktop/helpers.go` — new helper.
      - `neo4j-cli/internal/subcommands/desktop/start_test.go` — new cases:
        enriched-without-wait, GetDbms-fails-warns-and-falls-back; update
        existing `TestStart_NoWait_DoesNotPoll` (currently asserts slim
        shape — should now assert enriched output + zero poll calls).
      - `neo4j-cli/internal/subcommands/desktop/stop_test.go` — mirror.

      No new cobra flags. No skill-bundle regen required.
    status: completed
    dependencies:
