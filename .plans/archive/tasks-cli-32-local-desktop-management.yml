      - "`desktop start <A>` when `<A>` is already started is idempotent (no error)"
      - "`desktop start <B>` when nothing is running proceeds normally"
      - "`desktop start <B> --force` skips the pre-flight (no list call) and proceeds even when `<A>` is running"
      - "`desktop create --name X --version 5 --password foo` while a DBMS is running exits non-zero BEFORE issuing `CreateDbms` (verified by httptest call counter)"
      - "`desktop create ... --force` skips the pre-flight"
