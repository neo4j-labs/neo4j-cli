  - id: task-017
    title: "Pre-flight conflict detection in `desktop start` + `desktop create` (+ `--force` bypass)"
    description: |
      Live smoke verified: Desktop's relate API runs at most ONE DBMS at a time
      on port 7687 and SILENTLY REFUSES to start a second one. Today, starting
      DBMS B while A is running issues `POST /dbmss/B/start` (returns success),
      B never reaches `started`, `--wait` times out after 30s with a confusing
      "last status: stopped" error. `desktop create` (which chains
      create→start→poll) has the identical hazard.

      Fix: before issuing the lifecycle call, run a pre-flight that lists
      DBMSes and enriches via per-DBMS `GetDbms` (reuse the task-015 pattern
      from `list.go:146-178` — bounded errgroup, 8 in flight). If any entry
      has `Status == "started"` AND its `ID != <self>`, return
      `clierr.NewFatalError`:

      > Cannot start DBMS '<self-name>' (<self-id>): DBMS '<other-name>'
      > (<other-id>) is currently running. Neo4j Desktop 2 runs one DBMS at
      > a time on port 7687. Stop the other first with 'neo4j-cli desktop
      > stop <other-id>', or pass --force to skip this check.

      `create` uses an analogous phrasing ("Cannot create+start DBMS
      '<requested-name>': ..."). Pre-flight runs BEFORE the create POST so
      no orphan DBMS is left behind on the system.

      Add a `--force` boolean flag to both leaves that skips the pre-flight
      (escape hatch). `--force` is independent of `--rw`.

      Extract `assertNoOtherRunning(ctx, client, selfID string) error` into
      `helpers.go`; reuse the enrichment fan-out pattern (either by promoting
      `list.go`'s `enrichDbmsList` to `helpers.go` or by inlining a parallel
      implementation — implementer's choice; either is fine).

      Files:
      - `neo4j-cli/internal/subcommands/desktop/start.go` — `--force` flag,
        call `assertNoOtherRunning(ctx, client, id)` unless `--force`.
      - `neo4j-cli/internal/subcommands/desktop/create.go` — `--force` flag,
        call `assertNoOtherRunning(ctx, client, "")` before `CreateDbms`.
      - `neo4j-cli/internal/subcommands/desktop/helpers.go` —
        `assertNoOtherRunning` helper.
      - `neo4j-cli/internal/subcommands/desktop/start_test.go` — cases:
        another-running-blocks-start, same-id-already-running-no-op,
        no-others-proceeds-as-today, `--force`-bypasses.
      - `neo4j-cli/internal/subcommands/desktop/create_test.go` — cases:
        another-running-blocks-create (no `CreateDbms` call made),
        `--force`-bypasses.
      - Skill bundle regen: `go generate ./neo4j-cli/internal/skill/...` —
        `--force` adds a flag visible in the rendered references docs.
        `TestGenerator_RoundTrip` is the gate.
