      hint; 5xx → REQ-F-024 truncated-body message. Methods: `ListDbmss`,
      `GetDbms`, `CreateDbms` (POST body OMITS `edition` entirely),
      `DeleteDbms`, `StartDbms`, `StopDbms`. Hermetic tests with
      `httptest.NewServer`. See REQ-F-008, REQ-F-010, REQ-F-023, REQ-F-024,
      REQ-NF-006, and `cli-32-local-desktop-management-impl.md` "Auth" + "DBMS endpoints".
    status: completed
    completed_at: 2026-05-18T10:30:00Z
    dependencies:
