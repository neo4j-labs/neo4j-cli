  - id: task-018
    title: "Redefine `--force` on `desktop start` / `create` to stop the conflicting DBMS first"
    description: |
      Today, task-017's `--force` skips the pre-flight and lets Desktop's
      relate API silently no-op the start (port 7687 collision). The user
      observes a Desktop UI flicker (new DBMS briefly starts, then Desktop
      kills it and reinstates the original). From the CLI's perspective
      `--force` is currently useless — it just bypasses the friendly error.

      Fix: change `--force` semantics from "skip the check" to "resolve the
      conflict for me." When `--force` is set AND another DBMS is currently
      running, the CLI must first stop the running DBMS (await
      `status=stopped`, 30s ceiling), then proceed with the start / create.
      This actually delivers what the user asked for — no UI flap, no silent
      no-op.

      Implementation in `neo4j-cli/internal/subcommands/desktop/helpers.go`:
      - Add a sibling helper alongside `assertNoOtherRunning`:
        `resolveConflicting(ctx, client, selfID string, warnOut io.Writer) (stoppedID string, err error)`:
        - Lists + enriches DBMSes via the existing task-015 fan-out.
        - If no `Status == "started"` entry with `ID != selfID`: returns `("", nil)`, no side effects.
        - If exactly one conflicting entry: emits a stderr breadcrumb like
          `Stopping DBMS '<name>' (<id>) to free port 7687…`, calls
          `client.StopDbms`, polls `pollUntilStatus(..., dbmsStatusStopped)`
          (30s), returns the stopped id.
        - If stop or poll fails: `clierr.NewFatalError` naming the DBMS,
          start/create aborted (no orphan side effects).

      In `start.go`:
      - `if !force`: call `assertNoOtherRunning(...)` as today (returns error on conflict).
      - `if force`: call `resolveConflicting(...)`, then proceed to `StartDbms`. After successful start, the existing `fetchForRender` / `pollUntilStatus(..., online)` paths render the enriched row.

      In `create.go`:
      - Same split. `force` path calls `resolveConflicting(ctx, client, "", warnOut)` BEFORE `CreateDbms`. selfID is empty because the new DBMS doesn't exist yet.

      Update the `--force` flag Usage string on both leaves so it reflects the new semantics, e.g.:
      `Stop any other running Desktop DBMS first to free port 7687, then proceed. Without --force, the command refuses when another DBMS is running.`

      Tests:
      - `start_test.go`: NEW cases
        (a) `--force` with running A → exactly one StopDbms(A) call, polled to stopped, then StartDbms(B), then GetDbms(B). Assert call ordering via a recording handler.
        (b) `--force` with NO running other → no StopDbms call (just StartDbms+GetDbms).
        (c) `--force` where StopDbms returns error → start NOT called; canonical error names A.
        (d) `--force` where stop poll times out → start NOT called; canonical timeout error names A.
      - `create_test.go`: mirror (a)+(b)+(c). Create-specific: verify the stop happens BEFORE CreateDbms.

      Skill bundle regen: `go generate ./neo4j-cli/internal/skill/...` to pick up the new `--force` Usage description in `references/desktop.md`. `TestGenerator_RoundTrip` is the gate.
    status: completed
    dependencies:
      - task-017
    acceptance_criteria:
      - "`desktop start B --rw --force` while A is running: StopDbms(A) called, polled until stopped, THEN StartDbms(B); A.status=stopped + B.status=started afterwards"
      - "`desktop start B --rw --force` with no other running DBMS: no StopDbms call (verified by httptest counter)"
      - "`desktop create --name X ... --rw --force` while A is running: StopDbms(A) called BEFORE CreateDbms (verified by recording handler order)"
      - "Stderr breadcrumb naming the DBMS being stopped is emitted exactly once per --force invocation that actually stops something"
      - "If StopDbms or the stop-poll fails, the subsequent StartDbms / CreateDbms is NOT called; error message names the DBMS we tried to stop"
      - "`--force` Usage string on both leaves describes the new stop-then-start semantics (no longer 'skip the check')"
      - "Skill bundle regenerated; `TestGenerator_RoundTrip` passes"
      - "All gates green: `make test && make fmt-check && make lint && make license-check`"
    completed_at: 2026-05-18T19:00:00Z

  - id: task-019
    title: "Fix wire-format mismatch: poll for `started`/`stopped`, not `online`/`offline`"
    description: |
      Live smoke after task-018 revealed a latent bug from task-007:
      `pollUntilStatus` waits for `DbmsInfo.Status == "online"` /
      `"offline"`, but Desktop's relate API actually reports `"started"` /
      `"stopped"` on `GET /dbmss/:id` (see `desktop list --format table`
      output — the live values are `started`/`stopped`). The bug was hidden
      because every `httptest` handler in `start_test.go` / `stop_test.go` /
      `create_test.go` returns the fictional `"online"`/`"offline"` strings,
      so the mock and the constants agree but real Desktop never matches.

      Symptoms in production:
      - `desktop start <id> --wait` always times out at 30s even on a
        successful start (Desktop reports `started`, we wait for `online`).
      - `desktop stop <id> --wait` always times out at 30s (same root cause).
      - task-018's `resolveConflicting` stop-poll always times out — the
        stop call succeeds on Desktop's side but our poll waits for
        `offline` and bails after 30s, so the subsequent `StartDbms` is
        never issued. Net effect: `--force` stops the running DBMS but
        never starts the requested one.

      Fix in `neo4j-cli/internal/subcommands/desktop/`:
      - `create.go`: change `const dbmsStatusOnline = "online"` →
        `"started"`. Update the comment to point at the live value (cross-
        reference helpers.go `dbmsStatusStarted` for symmetry — these two
        constants should actually be the SAME, so consolidate into one
        `dbmsStatusStarted = "started"` in helpers.go and delete the
        duplicate in create.go; update all references).
      - `helpers.go` / wherever `dbmsStatusOffline = "offline"` lives:
        change to `"stopped"`. Rename to `dbmsStatusStopped` for symmetry
        if the renaming is cheap; otherwise leave the name and just fix the
        value.
      - Update every httptest handler in `start_test.go`, `stop_test.go`,
        `create_test.go` that returns `"status":"online"` →
        `"status":"started"`, and `"status":"offline"` →
        `"status":"stopped"`. Same for any error-message assertion that
        checks the substring `"online"` / `"offline"`.
      - No production-call-site rename needed if you keep
        `dbmsStatusOnline` / `dbmsStatusOffline` as identifier names — just
        flip the string values. The cleaner change is to consolidate the
        identifiers too (one constant per state, matching live wire
        format), but that's a refactor; the minimum fix is two string
        literal edits + the test fixture updates.

      Skill bundle: no regen needed (no help text touched).
    status: completed
    dependencies:
      - task-018
    acceptance_criteria:
      - "Only ONE constant per status value across the desktop package (consolidated `dbmsStatusStarted` + `dbmsStatusStopped`, no `online`/`offline` aliases left over)"
      - "`bin/neo4j-cli desktop start <id> --rw --wait` against the live Desktop returns within seconds (≤5s typical) when the DBMS is already started, instead of timing out at 30s"
      - "`bin/neo4j-cli desktop start <B> --rw --force --wait` against the live Desktop stops the running DBMS, starts B, polls B until `started`, returns within ~30s with B's enriched row"
      - "All existing tests still pass after the fixture update (search for `\"online\"` / `\"offline\"` in `desktop/*_test.go` should return 0 matches)"
      - "All gates green: `make test && make fmt-check && make lint && make license-check`"
      - "PR description includes a manual smoke-test note: 'start --wait against live Desktop tested; succeeds within Xs'"
    completed_at: 2026-05-18T19:30:00Z

  - id: task-020
    title: "Make `desktop create --version` optional; default to latest stable enterprise via versions endpoint"
    status: completed
    description: |
      `--version` on `desktop create` is currently required. Live probe of
      `GET /fastify/api/dbmss/versions` (see
      `cli-32-local-desktop-management-impl.md` "Versions endpoint" for the
      observed shape) confirms Desktop exposes a full catalog of enterprise
      versions — both cached (already on disk) and online (would be pulled
      from `dist.neo4j.org` during create). Reusing that endpoint lets the
      CLI auto-pick "latest stable" when the user doesn't care.

      Implementation:

      1. **Add `ListDbmsVersions(ctx) ([]DbmsVersion, error)` to `desktopclient`** (`client.go` + `types.go`). Hits `GET /dbmss/versions` (no query string — empirically returns the full catalog). `DbmsVersion` struct mirrors the wire shape: `{Edition, Version, Origin, Dist string}`. Hermetic tests via httptest with both populated and empty responses + the standard 401/5xx error mapping.

      2. **Add `pickLatestStableEnterprise([]DbmsVersion) (DbmsVersion, error)` helper** in `create.go` (or `helpers.go`). Uses `golang.org/x/mod/semver`:
         - Filter to `edition == "enterprise"` (defensive — all are enterprise today)
         - Filter to entries where `semver.Prerelease("v"+version) == ""` (drop alphas/RCs/etc.)
         - Sort by `semver.Compare`, descending
         - Among entries tied on version (unlikely in practice), prefer `origin == "cached"`
         - Return error if the filtered list is empty

      3. **Make `--version` optional in `create.go`**:
         - Drop the existing `if version == "" return UsageError(...)` check.
         - When `version == ""`: call `client.ListDbmsVersions(ctx)`, run `pickLatestStableEnterprise`, set `version` to the picked entry's `Version`, emit a stderr breadcrumb: `Using Neo4j enterprise <version> (<origin>)`.
         - When the versions endpoint returns empty/all-prerelease: `clierr.NewFatalError("Desktop has no stable enterprise versions to choose from. Pass --version <vX> explicitly. See 'neo4j-cli desktop ...' or Desktop's UI for the catalog.")`.
         - Update the `--version` flag Usage string to: `Neo4j version (e.g. 2026.04.0 or 5.26.1). When omitted, picks the latest stable enterprise version Desktop knows about.`

      4. **Update PRD acceptance**: REQ-F-002 already updated to mark `--version` optional; REQ-F-030 already added. No further PRD changes needed in this task.

      5. **Add a new dependency**: `golang.org/x/mod` to `go.mod`. (`go get golang.org/x/mod` + `go mod tidy`.)

      6. **Tests in `create_test.go`**:
         - `--version` omitted → ListDbmsVersions called → picks highest stable → POST body has the picked version + stderr breadcrumb present (verify via httptest recording).
         - `--version 5.26.0` supplied → ListDbmsVersions NOT called (counter assertion) → POST body has `"5.26.0"`.
         - Empty versions response → fatal error, no POST.
         - Only prerelease versions response (e.g. `["2026.05.0-alpha"]`) → fatal error, no POST.
         - Tie-break: two `2026.04.0` entries, one cached one online → cached wins.

      7. **Skill bundle regen**: `go generate ./neo4j-cli/internal/skill/...` — `--version` Usage description changed, so `references/desktop.md` will diff. `TestGenerator_RoundTrip` is the gate.
    dependencies:
      - task-006
      - task-019
    acceptance_criteria:
      - "`bin/neo4j-cli desktop create --name x --password foo --rw` (no `--version`) succeeds against live Desktop, prints `Using Neo4j enterprise <picked> (<cached|online>)` to stderr"
      - "`desktopclient.ListDbmsVersions(ctx)` parses `[{edition, version, origin, dist}]` and surfaces 401/5xx through the existing error mapping"
      - "`pickLatestStableEnterprise` picks `2026.04.0` over `5.26.1` (semver compare, not lexical)"
      - "Pre-release versions (any non-empty `semver.Prerelease`) are excluded from the candidate set"
      - "When `--version` is supplied explicitly, no `GET /dbmss/versions` call is made (verified via httptest counter)"
      - "Empty / all-prerelease versions response → fatal error pointing at `--version <vX>`; no `POST /dbmss` call"
      - "`go.mod` gains `golang.org/x/mod` as a direct dep; no other unrelated bumps"
      - "Skill bundle regenerated; `TestGenerator_RoundTrip` passes"
      - "All gates green: `make test && make fmt-check && make lint && make license-check`"
    completed_at: 2026-05-18T20:00:00Z

  - id: task-021
    title: "Fix misleading `desktop delete` output (shows status=stopped on deleted DBMS)"
    description: |
      `bin/neo4j-cli desktop delete <id>` currently renders the
      `DELETE /dbmss/:id` response as a `dbmsDeleteResult` table with the
      same columns as `list` — `id, name, version, status, connectionUri`.
      The wire response is a snapshot of the DBMS taken at deletion time,
      so the `STATUS` column reads `"stopped"` (or whatever the DBMS was
      before deletion). For a row that no longer exists, that's confusing
      and arguably wrong — looks like the command failed.

      Fix in `neo4j-cli/internal/subcommands/desktop/delete.go`:

      - Drop the table render of `DbmsInfo` after delete. Replace with:
        - **Table / toon / default**: a single confirmation line to stdout:
          `Deleted DBMS "<name>" (<id>).` (use the name from the response;
          fall back to `<id>` if the name is empty).
        - **`--format json`**: emit a small, explicit shape like
          `{"id": "<id>", "name": "<name>", "deleted": true}` — drops the
          misleading `status` field while keeping enough for scripts to
          confirm the deletion.
        - Drop `dbmsDeleteResult` and `dbmsDeleteFields` if they become
          unused after the rewrite.

      - Keep the existing TTY-prompt + `--yes` / `--rw` semantics intact
        (REQ-F-003). Don't touch the `GetDbms`-for-prompt-name path; that's
        already correct.

      Tests in `delete_test.go`:
      - Confirm table/toon/default output is the one-line confirmation
        with the correct `<name>` and `<id>`.
      - Confirm `--format json` emits `{"id","name","deleted":true}` with
        no `status` key.
      - Confirm exit code 0 on the happy path.
      - Existing TTY/non-TTY/`--yes` cases still pass (no behaviour change
        in the lifecycle).

      No PRD requirement change needed — REQ-F-003 already only specifies
      the prompt/yes/non-TTY semantics, not the output shape.

      Skill bundle regen: only if the `Example:` text or `Long:` references
      the old output shape (probably not — current examples don't mention
      output columns). Run `go generate ./neo4j-cli/internal/skill/...` and
      let `TestGenerator_RoundTrip` decide.
    status: completed
    dependencies:
      - task-008
    acceptance_criteria:
      - "`bin/neo4j-cli desktop delete <id> --yes --rw` (default format) prints `Deleted DBMS \"<name>\" (<id>).` and exits 0"
      - "`bin/neo4j-cli desktop delete <id> --yes --rw --format json` emits exactly `{\"id\":\"...\",\"name\":\"...\",\"deleted\":true}` with NO `status` key"
      - "Output no longer renders a `STATUS` column at all on the delete path"
      - "TTY prompt + `--yes` bypass + non-TTY usage error semantics unchanged"
      - "If the response `name` field is empty, the confirmation line falls back to `<id>` in both positions"
      - "All gates green: `make test && make fmt-check && make lint && make license-check`; bundle round-trip passes"
    completed_at: 2026-05-18T20:30:00Z

