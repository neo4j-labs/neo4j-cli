  - id: task-026
    title: "`desktop dbms plugin install` leaf — POST /plugins/install + auto-restart helper"
    description: |
      Add `neo4j-cli/internal/subcommands/desktop/dbms/plugin/install.go`
      + `install_test.go` + `helpers.go` (shared autoRestart helper used
      by both install and uninstall).

      `install.go`:
      - Positionals `<dbms-id> <plugin>` (both required).
      - Flags: `--no-restart` (bool, default false), `--rw`.
      - Write command (Annotations write=true), requires `--rw`.
      - `RunE`:
        1. Construct client (`newDesktopClientFn`).
        2. `GetDbms(ctx, dbmsID)` to capture pre-op `status`. Use the
           result's `name` + `id` for the breadcrumbs.
        3. `InstallPlugin(ctx, dbmsID, pluginValue)` — passes `<plugin>`
           verbatim (relate dispatches name-vs-path server-side, REQ-F-037).
        4. Render the returned `DbmsPlugin` via `output.PrintBodyMap`
           with default columns `name, version, pendingRestart, filePath`.
        5. If `pre-op status == "started"` AND `!noRestart`: call
           `autoRestartIfRunning(ctx, client, dbmsName, dbmsID, pluginName, warnOut)`.
        6. If `pre-op status != "started"`: emit `DBMS '<name>' is not
           running; plugin '<plugin>' will be active on next start.` to
           stderr.
        7. If `pre-op status == "started"` AND `noRestart`: emit the
           manual-restart hint to stderr.
      - `ErrPluginNotFound` → REQ-F-041; `ErrDbmsNotFound` → REQ-F-042.

      `helpers.go` (`neo4j-cli/internal/subcommands/desktop/dbms/plugin/helpers.go`):
      - `autoRestartIfRunning(ctx, client, dbmsName, dbmsID, pluginName, warnOut io.Writer) error`:
        - Emit stderr: `Plugin change pending — restarting DBMS '<name>' (<id>) to apply…`
        - `client.StopDbms(ctx, dbmsID)` + `pollUntilStatus(ctx, client, dbmsID, dbmsStatusStopped, 30s)`.
        - `client.StartDbms(ctx, dbmsID)` + `pollUntilStatus(ctx, client, dbmsID, dbmsStatusStarted, 30s)`.
        - On success emit stderr: `DBMS restarted; plugin '<plugin>' is now active.`
        - On stop or start failure: return a non-fatal warning wrapper
          (the leaf's `RunE` SHOULD log to stderr and exit 0 — plugin
          op already succeeded, REQ-F-039).
      - Reuse the existing `pollUntilStatus` from
        `subcommands/desktop/helpers.go` if accessible; otherwise extract
        it into a shared `internal/subcommands/desktop/internal/lifecycle/`
        package so both the dbms parent and the plugin sub-subtree can
        use it without an import cycle.

      Hermetic tests:
      - Happy path, DBMS started, default (no --no-restart): asserts
        the call sequence GetDbms → Install → StopDbms → poll(stopped)
        → StartDbms → poll(started) via a recording handler. Asserts
        both stderr breadcrumbs appear.
      - Happy path, DBMS stopped: no restart called; "will be active on
        next start" hint emitted.
      - Happy path, DBMS started, `--no-restart`: no restart called;
        manual-restart hint emitted.
      - Plugin not found (relate 404 with plugin message): REQ-F-041.
      - DBMS not found (relate 404 with DBMS message): REQ-F-042.
      - Auto-restart Stop failure: warning emitted, exit 0, plugin
        change NOT rolled back.
      - Auto-restart Start failure: same.
      - `--rw` required (annotated write=true).
      - `--port` propagation.

      `Example:` field flush-left, ≥3 invocations, all `--rw`.
    status: completed
    completed_at: 2026-05-21T17:30:00Z
    dependencies:
      - task-024
    acceptance_criteria:
      - "Positional `<dbms-id> <plugin>` both required; `--no-restart` flag present; `--rw` required"
      - "Pre-op GetDbms captures status; auto-restart triggers iff status == started AND !no-restart"
      - "Auto-restart sequence: Stop → poll(stopped) → Start → poll(started); both stderr breadcrumbs emitted"
      - "Stopped-DBMS path emits the `will be active on next start` breadcrumb and skips restart"
      - "`--no-restart` on a running DBMS emits the manual-restart hint, skips restart"
      - "Auto-restart Stop/Start failures emit stderr warnings, exit 0 (plugin op already succeeded — no rollback)"
      - "Plugin-not-found yields REQ-F-041; DBMS-not-found yields REQ-F-042"
      - "Hermetic tests cover all 8+ scenarios above via httptest recording"
      - "`Example:` field flush-left, ≥3 invocations, all carry `--rw`"

