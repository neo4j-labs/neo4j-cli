tasks:
  - id: task-001
    title: "Extend databaseInfo + iterate dbms.components() rows in :schema"
    description: |
      In `neo4j-cli/query/schema.go`, add a new nested `graphEngine` struct
      (`Name string`, `Versions []string`) and extend `databaseInfo` with two
      `omitempty` fields: `CypherVersions []string` (json `cypher_versions`) and
      `GraphEngine *graphEngine` (json `graph_engine`). Rewrite
      `fetchDatabaseInfo` so it iterates every row from `CALL dbms.components()`
      and switches on the row's `name` field: `"Neo4j Kernel"` populates
      `Versions` + `Edition`, `"Cypher"` populates `CypherVersions`, any other
      name populates `GraphEngine` (first non-kernel / non-Cypher wins). Preserve
      existing warn-and-continue behaviour: a failed `dbms.components()` call
      still leaves the fields empty and returns nil when nothing populated.
      Update `happySchemaSeam` in `schema_test.go` to emit both `Neo4j Kernel`
      and `Cypher` rows; extend `TestSchema_HappyPath_JSON` to assert
      `CypherVersions == ["5","25"]` and `GraphEngine == nil`. Add two new tests:
      `TestSchema_DetectsGraphEngine` (VG row appended) and
      `TestSchema_GraphEngine_KernelRowOrderInsensitive` (VG row first).
    dependencies: []
    acceptance_criteria:
      - "`databaseInfo` has new `CypherVersions []string` (json `cypher_versions,omitempty`) and `GraphEngine *graphEngine` (json `graph_engine,omitempty`) fields"
      - "`graphEngine` struct has `Name string` (json `name`) and `Versions []string` (json `versions,omitempty`)"
      - "`fetchDatabaseInfo` iterates ALL rows and matches by literal `name` (not row index)"
      - "Existing `TestSchema_HappyPath_JSON` updated with multi-row fixture and asserts the two new fields"
      - "New tests `TestSchema_DetectsGraphEngine` and `TestSchema_GraphEngine_KernelRowOrderInsensitive` both pass"
      - "Plain-Neo4j payload shape is byte-identical to today when no Cypher / VG row is present (omitempty)"
      - "`go test ./neo4j-cli/query/...` is green"
    status: completed
    completed_at: 2026-05-25T08:05:11Z

  - id: task-002
    title: "Update query-additions.md with graph_engine bullet + Virtual Graphs section"
    description: |
      Edit `neo4j-cli/internal/skill/query-additions.md`. In the "What `:schema`
      returns" bullet for `database` (around line 26), mention the new
      `cypher_versions` (e.g. `["5","25"]` — which dialects the server
      understands; `default_language` is the default) and `graph_engine` fields,
      with a forward link to the new section. Add a new H2 section
      "Virtual Graphs / Graph Engine" after "Cypher 25 vs Cypher 5 syntax" that
      teaches agents: (a) detection rule
      `database.graph_engine.name == "Virtual Graph"`, (b) the current forbidden
      constructs (`WITH`, `CALL`, `UNWIND`, `range()`, var-length /
      Quantified Path Patterns, subquery expressions like `EXISTS { ... }`, all
      writes — `CREATE`/`MERGE`/`SET`/`INSERT`/`DELETE`/`REMOVE`/`DROP`/`ALTER`/`START`/`STOP`/`GRANT`/`REVOKE`,
      `apoc.*`), (c) guidance to simplify rather than retry verbatim, (d) note
      that the restriction set will shrink over time.
    status: completed
    dependencies: []
    acceptance_criteria:
      - "`database` bullet mentions both `cypher_versions` and `graph_engine`"
      - "New H2 'Virtual Graphs / Graph Engine' section placed after the Cypher 25 vs 5 section"
      - "Forbidden constructs listed verbatim per GAIAGT-768"
      - "Detection rule (`graph_engine.name == \"Virtual Graph\"`) is explicit"
      - "Tone matches existing additions.md (agent-friendly, terse, code-fenced examples where useful)"
    completed_at: 2026-05-25T08:08:25Z

