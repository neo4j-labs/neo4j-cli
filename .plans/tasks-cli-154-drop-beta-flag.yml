tasks:
  - id: task-001
    title: "Remove flag.aura-beta registry entry, BetaPath methods, and simplify getVersionPath"
    description: |
      Delete the "flag.aura-beta" entry from var Registry in common/clicfg/flags.go.
      Remove the BetaPathV1() and BetaPathV2() methods from common/clicfg/clicfg.go (lines ~317-321).
      Simplify getVersionPath in neo4j-cli/aura/internal/api/api.go: drop the cfg parameter,
      remove the cfg.Flags.Enabled("flag.aura-beta") branch from the AuraApiVersion1 case
      (so it always returns "v1"), and inline "v1beta5" and "v2beta1" as literal strings in the
      AuraApiVersionBeta1 and AuraApiVersion2 cases respectively. Update all call sites of
      getVersionPath to drop the cfg argument.
    status: completed
    dependencies: []
    acceptance_criteria:
      - "var Registry in common/clicfg/flags.go contains no \"flag.aura-beta\" entry"
      - "BetaPathV1() and BetaPathV2() methods no longer exist in clicfg.go"
      - "getVersionPath takes only an AuraApiVersion parameter (no *clicfg.Config)"
      - "getVersionPath contains no reference to Flags.Enabled or flag.aura-beta"
      - "AuraApiVersion1 case returns \"v1\" unconditionally; AuraApiVersionBeta1 returns \"v1beta5\"; AuraApiVersion2 returns \"v2beta1\""
      - "Code compiles: go build ./... succeeds"
    completed_at: "2026-06-11T00:00:00Z"

  - id: task-002
    title: "Add config migration v1 to delete retired flag.aura-beta and aura.beta-enabled keys"
    description: |
      Append the first Migration entry to the empty migrations slice in
      common/configmigrate/migrations.go. The Apply function must use sjson.DeleteBytes
      to delete "flag\.aura-beta" (dot-escaped so sjson treats the dot as literal) and
      "aura.beta-enabled" (which sjson interprets as nested path aura -> beta-enabled,
      matching the {"aura": {"beta-enabled": true}} shape). Add the tidwall/sjson import
      if it is not already present in the file. The migration must be a no-op (no error,
      unchanged bytes) when neither key is present in the input.
    status: completed
    dependencies: []
    acceptance_criteria:
      - "migrations slice has exactly one entry with Version=1"
      - "Apply deletes flag.aura-beta from a config JSON that contains it"
      - "Apply deletes aura.beta-enabled from a config JSON that contains {\"aura\":{\"beta-enabled\":true}}"
      - "Apply is a no-op (returns same bytes, no error) when neither key is present"
      - "go test ./common/configmigrate/... passes"
    completed_at: "2026-06-11T00:00:00Z"

