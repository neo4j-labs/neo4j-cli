    title: "Write .agents/feature-flags.md convention doc"
    description: |
      Create `/Users/oskarhane/Development/neo4j-cli-2/.agents/feature-flags.md`
      capturing the feature-flag convention exactly as scoped in REQ-F-002 and
      REQ-F-003 of the PRD. The file must open with a single `# Feature Flags`
      H1 plus a one-line intro, then contain these seven `##` sections in
      order: Key naming; Defaults & lifecycle; Override surface; Testing;
      Unknown / removed keys; Migrating aura.beta-enabled; See also. Match the
      density and tone of `.agents/cobra.md`, `.agents/credentials.md`, and
      `.agents/windows-ci.md` — terse bullets, code refs in `path:LINE` form,
      no preamble. Use the dotted prefix `flag.<area>-<feature>` everywhere;
      no `flag:` colon form leaks through from the original Linear comment.
      Include the touch points for the existing `aura.beta-enabled` flag
      (`common/clicfg/clicfg.go:32`, `clicfg.go:281`, `clicfg.go:371-377`,
      `common/clicfg/auratesthelper.go:68-70`) and cite Linear CLI-125 and
      CLI-134 in "See also". Keep the rendered doc ≤60 lines.
    status: completed
    dependencies: []
    acceptance_criteria:
      - "`.agents/feature-flags.md` exists and `wc -l` reports ≤60 lines"
      - "File contains the seven `##` sections from REQ-F-002 in the prescribed order, with a single `# Feature Flags` H1 and one-line intro per REQ-F-003"
      - "`grep -n 'flag:' .agents/feature-flags.md` returns no matches"
      - "`grep -nE 'flag\\.(aura-beta|docker-command|secrets-os-keystore)' .agents/feature-flags.md` returns at least one hit per example"
      - "`grep -n 'common/clicfg/clicfg.go:32' .agents/feature-flags.md` and `grep -n 'auratesthelper.go:68-70' .agents/feature-flags.md` both match; `grep -n 'CLI-125' .agents/feature-flags.md` and `grep -n 'CLI-134' .agents/feature-flags.md` both match"
