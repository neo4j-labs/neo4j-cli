      - "`--user <name>` flag filters rows where `member == name`; rows for other users are excluded"
      - "JSON output shows `\"member\": \"\"` (not `null`) for roles with a nil member value"
      - "`TestList_HappyPath_FormatJson` parses output as `[]map[string]any` and asserts role/member values"
