tasks:
  - id: task-001
    title: "Scaffold role package: helpers.go, skeleton role.go, role_helpers_test.go"
    description: |
      Create the foundational files for the `neo4j-cli/internal/subcommands/admin/role/` package.
      `helpers.go` defines the `roleExecFn` package-level seam var (`adminutil.ExecFn`), `roleFields`,
      `normalizeRoleRow` (member nil→""), `outputRoleMembers` (SHOW ROLES WITH USERS WHERE role=$name),
      and `outputUserAfterRoleChange` (SHOW USERS WHERE user=$name with snake_case fields including
      `password_change_required`). `role.go` defines a skeleton `NewCmd` that sets `roleExecFn = execFn`
      and returns the parent `*cobra.Command` with NO `AddCommand` calls — leaf wiring is added
      incrementally by tasks 002–007 as each leaf compiles. `role_helpers_test.go` provides ONLY
      the seam infrastructure shared across all leaf tests: `testConn()`, `withFakeExecFn`, and
      `withSequencedExecFn`. Each leaf task owns its own `runXxx` builder in its `*_test.go` file.
    status: completed
    dependencies: []
    acceptance_criteria:
      - "`helpers.go` compiles with all five symbols: `roleExecFn`, `roleFields`, `normalizeRoleRow`, `outputRoleMembers`, `outputUserAfterRoleChange`"
      - "`outputUserAfterRoleChange` uses snake_case field names: `[\"user\", \"roles\", \"password_change_required\", \"suspended\"]`"
      - "`normalizeRoleRow` converts nil `member` to `\"\"` and leaves non-nil values unchanged"
      - "`role.go` skeleton compiles with `NewCmd` that sets `roleExecFn = execFn` and has zero `AddCommand` calls"
      - "`role_helpers_test.go` provides `withSequencedExecFn` that returns responses in order and fails the test if called more times than expected; does NOT define any `runXxx` helpers"
