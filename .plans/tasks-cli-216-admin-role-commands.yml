  - id: task-003
    title: "Implement role get + tests"
    description: |
      Create `get.go` and `get_test.go`, and add `cmd.AddCommand(newGetCmd(cfg, conn))` to `role.go`.
      The command performs two Cypher calls: first `SHOW ROLES WITH USERS WHERE role = $name` (column
      is `role`, NOT `name` — using `name` causes a Neo4j syntax error) to check existence; zero rows
      returns `clierr.NewNotFoundError`. If the role exists, executes `SHOW ROLE $name PRIVILEGES`;
      zero privilege rows returns an empty list (exit 0, not not_found). Output fields are dynamic:
      sort keys of `rows[0]` and pass to `PrintBodyMap`. `get_test.go` defines `runGet`,
      `existsResponse`, and `notFoundResponse` helpers; uses `withSequencedExecFn` for two-call tests.
    status: completed
    dependencies:
      - task-001
    acceptance_criteria:
      - "`get.go` existence check Cypher is exactly `SHOW ROLES WITH USERS WHERE role = $name` (not `SHOW ROLES WHERE name = $name`)"
      - "`cmd.AddCommand(newGetCmd(cfg, conn))` added to `role.go`"
      - "Zero rows on existence check → `clierr.NewNotFoundError` (exit code 3)"
      - "Zero privilege rows on second call → empty list returned (exit 0, no error)"
      - "`TestGet_ExistingRole_NoPrivileges_ReturnsEmptyList` asserts `[]` output and no error"
      - "`TestGet_NotFound_ReturnsNotFoundError` asserts exit code 3 and role name in message"
    completed_at: "2026-06-16T03:00:00Z"

