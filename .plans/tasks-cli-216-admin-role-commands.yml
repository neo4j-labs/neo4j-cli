    description: |
      Create `list.go` and `list_test.go`, and add `cmd.AddCommand(newListCmd(cfg, conn))` to
      `role.go`. The command executes `SHOW ROLES WITH USERS`, applies `normalizeRoleRow` to every
      row, and calls `PrintBodyMap` with `roleFields`. An optional `--user <name>` flag filters rows
      in-process to those where `member == name` — this is the only command that answers "what roles
      does user X belong to". `list_test.go` defines its own `runList` helper (builds `NewCmd`,
      sets args to `["list", ...]`, executes). Tests cover: happy-path JSON, `--user` filter, null
      member normalization, exec error propagation.
