  - id: task-009
    title: "Fix runGrant/runRevoke helper signature and add follow-up-error tests"
    description: |
      The `runGrant(t, args, execErr)` and `runRevoke(t, args, execErr)` helpers hardcode the
      follow-up response as always-empty success, making it impossible to test a non-empty follow-up
      through the helper. As a result, `TestGrant_HappyPath_EmitsUpdatedUserRecord` and
      `TestRevoke_HappyPath_EmitsUpdatedUserRecord` bypass the helper entirely and rebuild the full
      cmd setup inline — 30+ lines of boilerplate that duplicates what the helper already does.

      Fix: change both helpers to accept full `responses []struct{ rows []map[string]any; err error }`
      (matching `runCreate`'s signature). Remove the hardcoded two-element response. Update all
      existing call sites to pass their own response slice. The inline cmd blocks in the
      EmitsUpdatedUserRecord tests can then collapse to single helper calls.

      After fixing the helpers, add:
      - `TestGrant_FollowUpExecError_PropagatesError` — mutation succeeds, follow-up returns error;
        assert the error propagates (mirrors `TestCreate_FollowUpExecError_PropagatesError` in
        `database/create_test.go`).
      - `TestRevoke_FollowUpExecError_PropagatesError` — same for revoke.
    status: completed
    dependencies:
      - task-007
    acceptance_criteria:
      - "`runGrant` and `runRevoke` accept `responses []struct{ rows []map[string]any; err error }` matching `runCreate`'s signature"
      - "`TestGrant_HappyPath_EmitsUpdatedUserRecord` uses `runGrant` directly (no inline cmd setup)"
      - "`TestRevoke_HappyPath_EmitsUpdatedUserRecord` uses `runRevoke` directly (no inline cmd setup)"
      - "`TestGrant_FollowUpExecError_PropagatesError` exists and asserts the follow-up error propagates"
      - "`TestRevoke_FollowUpExecError_PropagatesError` exists and asserts the follow-up error propagates"
      - "`make test` passes after the refactor"
    source: review
    completed_at: "2026-06-16T15:30:00Z"

