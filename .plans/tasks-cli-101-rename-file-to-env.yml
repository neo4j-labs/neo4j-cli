  - id: task-002
    title: "Add Minor changie entry for the --file → --env rename"
    description: |
      Create one new file under `.changes/unreleased/` named `neo4j-cli-Minor-<YYYYMMDD>-<HHMMSS>.yaml` documenting the rename. Single entry covers all three command surfaces (the standalone aura binary is no longer built; everything ships from the `neo4j-cli` project key per AGENTS.md "Changie Notes").

      File contents:

          project: neo4j-cli
          kind: Minor
          body: 'Renamed --file to --env on ''credential dbms add'' and ''credential aura-client add'' for consistency with ''query --env'' (CLI-101).'
          time: <RFC3339 timestamp at write time>

      Use `changie new --projects neo4j-cli --kind Minor --body '...'` if changie is installed locally; otherwise hand-author the YAML at the path above (filename pattern: `neo4j-cli-Minor-<YYYYMMDD>-<HHMMSS>.yaml`, single-quoted body, RFC3339 time). Kind = Minor (visible CLI surface change in alpha; matches the precedent for the `--output` → `--format` rename in v0.1.0-alpha.2).

      Implements PRD REQ-F-008.
