      The check MUST run before `f.mu.Lock()` so the panic does not unwind through a held
      mutex. Add `"fmt"` to the stdlib import group above `"log/slog"`. Update the doc
      comment to state the precondition and drop the stale trailing sentence referencing
      `AuraConfig.SetBetaEnabled`.

      In the same change, add `TestFlagSet_SetForTest_PanicsOnUnregisteredKey` to
      `common/clicfg/flags_test.go`, reusing the existing `registerTestFlag(t)`
      (flags_test.go:33) and `newFlagSetForTest(t)` (flags_test.go:25) helpers.
      `registerTestFlag` already restores Registry via `t.Cleanup` — no extra teardown.

      Do NOT change `Enabled`'s resolution order; registry-as-source-of-truth is
      deliberate and pinned by two existing tests. (REQ-F-002, REQ-F-003, REQ-F-004)
    status: pending
    dependencies:
