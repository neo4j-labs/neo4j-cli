  - id: task-011
    title: 'Implement neo4j_cli_run_write behind three independent write gates'
    description: |
      Add the destructive execution tool, accepting only write-classified commands.
      Gate it three ways: mcp serve without --rw rejects every call before building a
      tree; the policy table classifies the path; and the CLI''s own
      flags.EnforceWriteGate fires inside Execute() off cmd.Annotations["write"].
      Layer three is authoritative and must not be bypassed or reimplemented, so a
      bug in the MCP layer cannot produce an unflagged write. Annotate the tool
      destructiveHint and openWorldHint.
    status: pending
