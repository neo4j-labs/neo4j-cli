  - id: task-009
    title: 'Implement neo4j_cli_read_docs as a skill-bundle heading slicer'
    description: |
      Resolve a space-separated CLI path against the embedded skill bundle
      (`skill.Bundle`, `references/<tree>.md`) by matching the heading whose text is
      the full command path and returning until the next heading of level at most the
      matched level. This works because render.go walkRender already emits headings
      like `## neo4j-cli docker load`. A tree name alone returns that file''s
      `## Contents` TOC plus the tree''s own prose and never its children, giving a
      roughly 3 KB menu for the 92 KB aura file. Support offset and max_chars
      (default 6000, max 20000) with a continuation hint and next_offset. Filter the
      `completion` entry, which agentcontext includes but the bundle does not.
    status: pending
    dependencies:
      - task-008
    acceptance_criteria:
      - 'read_docs("docker load") returns that leaf''s prose, flag table and example invocations'
      - 'read_docs("aura") returns the Contents TOC and tree prose only, never child sections'
      - 'Results never exceed max_chars; truncated results end with a continuation hint and carry next_offset in structuredContent'
      - 'A test asserts every entry list_commands can emit resolves to a reference file, with completion explicitly filtered'
      - 'No second documentation corpus is introduced; the committed bundle remains the only source'
    completed_at: null

  - id: task-010
