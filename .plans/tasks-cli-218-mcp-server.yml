  - id: task-019
    title: 'Validate discovery convergence end to end in Claude Desktop'
    description: |
      Install the generated bundle in Claude Desktop and run the real task: "find my
      local Neo4j and load the movies dataset". Measure round trips and tokens against
      REQ-NF-002 (at most 4 round trips and 2k tokens from a cold session, 1 round trip
