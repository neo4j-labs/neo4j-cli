      the same commit as the first importing package — an unimported require line is
      stripped by tidy AND by GoReleaser's `before.hooks`. Pin v1.4.1 stable; do not
      take a pre-release. (Observed 2026-08-04: v1.5.0, v1.6.1 and v1.7.0 stable now
      exist; v1.7.0 is no longer a pre-release as the PRD assumed, but v1.4.1 remains
      the conservative choice since nothing in the design needs a newer spec feature.
