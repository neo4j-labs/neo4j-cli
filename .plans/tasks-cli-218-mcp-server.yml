  - id: task-029
    title: 'instructions field must state the Aura org/project pairing invariant'
    description: |
      Live Claude Desktop testing exposed a misdiagnosis loop. Verified from tee
      logs (~/Library/Preferences/neo4j/cli/tee/2026-08-05T12-16-59Z_aura-instance-list.log
      plus the two 12-17-1x siblings), the real errors were:
        could not find project fbe8a2fc-... in organization 9f4683a0-...
        The tenant you specified could not be found
      The model had cross-paired a project ID belonging to one organization with a
      DIFFERENT organization's ID, received a legitimate not-found, and concluded
      the auth token was "clearing" / failing to refresh. It then looped —
      retrying and switching workspaces across 5 workspaces x 2 orgs — burning
      round trips on a problem that no retry could fix. There is nothing wrong
      with Aura token refresh.

      The fix belongs in the server `instructions` field (built in server.go, sent
      once at initialize inside the cached prompt prefix, currently ~918 bytes).
      It must state the invariant explicitly: an Aura project ID is only valid
      within its own organization, so --organization-id and --project-id must
      always be paired from the same org; and a not-found on either is a SCOPING
      error, not an auth error, so retrying or re-authenticating will not help.
      This is the cheapest available fix — instructions cost nothing per call.

      Keep the addition tight. The instructions field is deliberately outside the
      4000-byte tool-definition budget (task-014) but it is the one thing sent to
      every client on every session, so it should not balloon; aim to stay well
      under ~1500 bytes total.
    status: completed
    dependencies: []
    acceptance_criteria:
      - 'The instructions field states that an Aura project ID is only valid within its own organization and that --organization-id / --project-id must be paired from the same org'
      - 'The instructions field states that a project/tenant not-found is a scoping error, not an auth error, and that retrying will not help'
      - 'The instructions field stays under 1500 bytes total'
      - 'A test asserts both statements are present so the guidance cannot be silently dropped'
      - 'make test, make fmt-check, make lint pass'
    source: review
    completed_at: "2026-08-05T13:07:04Z"

