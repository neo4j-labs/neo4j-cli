  - id: task-005
    title: 'Implement the command policy table with a full-tree classification gate'
    description: |
      Add `mcp/allow.go` classifying every command path as deny, gated:allow-aura,
      gated:allow-credential-write, write, or allow, defaulting to deny for anything
      unclassified. Deny `update`, `mcp`, `completion`, `history clear` and
      `config set credential-storage`. Gate Aura provisioning (it costs real money)
      and credential mutation (it mints keyring entries). Classify write as anything
      carrying Annotations["write"]="true". Add the corresponding --allow-aura and
      --allow-credential-write opt-in flags, both default false.
    status: pending
    dependencies:
      - task-004
    acceptance_criteria:
      - 'Classify() returns the documented policy for a representative path in every category'
      - 'A gate test walks the live cobra tree and fails on any command path the table does not classify'
      - 'Unclassified paths default to deny rather than allow'
      - 'aura instance create and credential dbms add are refused unless the matching --allow-* flag is set'
      - 'make test, make fmt-check, make lint pass'
    completed_at: null

  - id: task-006
    title: 'Build the in-process executor with stdio fd swap and per-call isolation'
    description: |
      Execute commands in-process against a freshly built cobra tree per call rather
      than re-executing the binary, so model-supplied secrets never reach a child
      argv and typed *clierr.CLIError survives. After the transport captures stdout,
      redirect the process os.Stdout to os.Stderr and os.Stdin to os.DevNull so no
      stray read or write can corrupt or consume the JSON-RPC frame. Per call: fresh
      clicfg.NewConfig and root, SetOut/SetErr to bounded buffers,
      SetIn(bytes.NewReader(nil)) so confirm reads EOF, mutex serialisation, and a
      recover() wrapper mirroring main.go recoverPanic.
    status: pending
    dependencies:
      - task-005
    acceptance_criteria:
      - 'Running a command through the executor leaves the JSON-RPC frame intact even when the command writes directly to os.Stdout'
      - 'A command that would read os.Stdin returns promptly instead of hanging; confirm prompts cancel cleanly on EOF'
      - 'Global state does not leak between calls (viper, desktopclient debug, clievents, output.IsAgent)'
      - 'A panicking command yields an error result rather than killing the server'
      - 'Concurrent tool calls are serialised; make test, make fmt-check, make lint pass'
    completed_at: null

  - id: task-007
    title: 'Map results and errors to CallToolResult with redaction and truncation'
    description: |
      Mirror main.go: errors.As into *clierr.CLIError with a clierr.NewFatalError
      fallback, and return CallToolResult{isError: true} as a tool error rather than
      a JSON-RPC error. Put ce.BuildEnvelope() verbatim into structuredContent
      alongside stdout, stderr and redacted argv, reusing an already-documented
      contract. Never call clierr.Render, which writes to streams. Pass every result
      and error string through clievents.RedactText then output.StripControl, since
      under MCP these strings are uploaded into the model context. Truncate output
      at --max-output-chars (default 8000) and surface tee_path.
    status: pending
    dependencies:
      - task-006
    acceptance_criteria:
      - 'A failing command returns isError true with code, exit_code, message, suggestion, retryable and tee_path in structuredContent'
      - 'JSON-RPC errors are reserved for unknown tool and malformed params; command failures never surface as protocol errors'
      - 'docker create driven against the fake docker client produces a CallToolResult that does not contain the generated password'
      - 'Control and ANSI bytes are neutralised in returned text'
      - 'Output beyond max-output-chars is truncated with tee_path surfaced for the remainder'
    completed_at: null

