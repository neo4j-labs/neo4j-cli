  - id: task-031
    title: 'SECURITY: bound args length in injectFlag before allocation (CodeQL high)'
    description: |
      CodeQL flagged `go/allocation-size-overflow` (HIGH severity, blocks merge on
      PR #232) at neo4j-cli/internal/subcommands/mcp/server.go:166. In `injectFlag`,
      `existing, _ := args["args"].([]any)` is unmarshalled from
      `req.Params.Arguments` — i.e. model/client-supplied JSON — and then
      `make([]any, 0, len(existing)+len(flagItems))` uses that length directly as an
      allocation capacity. A client sending a very large `args` array drives a
      potentially overflowing size computation into an allocation.

      This is genuinely reachable, not theoretical: `injectFlag` runs on the request
      BEFORE the per-tool handlers apply their 64-item `args` cap, so the existing
      cap does not protect this path. The gap is the ordering.

      Fix by bounding the length before it reaches `make` — reject or truncate an
      oversized `args` array inside `injectFlag`. The handlers' existing 64-item cap
      is the obvious source of truth; share a single constant rather than
      introducing a second magic number. Add a test proving a huge `args` array is
      refused rather than allocated.
    dependencies: []
    acceptance_criteria:
      - 'injectFlag bounds the args length before it is used as a make() capacity; an oversized args array is rejected or truncated, not allocated'
      - 'The bound is a single shared constant with the handlers 64-item cap, not a second magic number'
      - 'A test asserts a huge args array is refused rather than allocated'
      - 'gh api repos/neo4j-labs/neo4j-cli/code-scanning/alerts?pr=232 reports no open high-severity alerts afterwards'
      - 'make test, make fmt-check, make lint pass'
    source: review
    status: completed
    completed_at: 2026-08-05T17:00:00Z

