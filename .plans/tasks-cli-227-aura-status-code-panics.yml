tasks:
  - id: task-001
    title: 'Extract scrubbedBodyTrunc helper in raw.go'
    description: |
      In `neo4j-cli/aura/internal/api/raw.go`, split the body-rendering half out of
      `rawErrorDetail` (lines 181-196) into a package-private `scrubbedBodyTrunc(body []byte) string`
      so `response.go` can reuse it verbatim in later tasks. It applies `scrub` (RedactText +
      StripControl) between two `truncateBytes` bounds — outer `rawErrorBodyLimit*16`, inner
      `rawErrorBodyLimit` — and returns "" when the body has no printable content.

      Pure refactor, no behaviour change. `rawErrorDetail` must keep producing byte-identical
      output; the existing `raw_status_test.go` assertions (10KB and 500KB truncation, multibyte
      UTF-8 boundary, C0 control stripping, body redaction) are the regression guard and must pass
      untouched. Do not modify `truncateBytes` (line 200) or the `rawErrorBodyLimit` const
      (line 117). Carry the doc comment from the PRD, including the note that the generous outer
      cut keeps redaction safe because a secret split by it is dropped by the final cut.
      (REQ-F-001)
    status: completed
    dependencies: []
    acceptance_criteria:
      - '`scrubbedBodyTrunc` exists in `raw.go` and is called by `rawErrorDetail`'
      - '`truncateBytes` and `rawErrorBodyLimit` are unchanged'
      - '`go test ./neo4j-cli/aura/internal/api/... -run RawStatus` passes with zero edits to `raw_status_test.go`'
      - 'The new function carries a doc comment explaining the double bound and its redaction rationale'
    completed_at: '2026-08-13T10:49:32Z'

  - id: task-002
    title: 'Make handleResponseError panic-free with class-based status fallback'
    description: |
      The core change. In `neo4j-cli/aura/internal/api/response.go`, rewrite `handleResponseError`
      (line 79) so every status returns a typed `*clierr.CLIError` and no arm panics.

      Add two helpers: `upstreamDetail(statusCode int, resBody []byte) string`, which renders
      `upstream error [status N]: <body>` via `scrubbedBodyTrunc` (or `... with no response body`
      when empty); and `errorMessages(resBody []byte, withField bool) []string`, which returns nil
      when the body either failed to parse OR parsed to an empty `errors[]` — any valid JSON object
      unmarshals into `ErrorResponse`, and rendering that as the empty bracketed `[\n\t\n]` tells
      the user nothing. `withField` selects the 400 branch shape (`<field>: <message>` prefix).

      Apply the PRD REQ-F-003 status table. Branches that yield at least one message keep their
      current output byte-for-byte, including `formatBracketedMessages`, the 400 field prefix and
      help suggestion, `WithResource` + `suggestionForResource` on 404, `suggestionForPaymentRequired`
      on 402, `authSuggestion` on 401/403, and the 429 Retry-After message plus `RetryAfter` field.
      Only the fallback arms and the missing statuses change: 400 -> 6, 403 -> 4 (with
      `authSuggestion`), 402/409 -> 5, 404 -> 3 (still tagged with resource type/id from the request
      URL), 405 and 5xx -> 8, 413/415/422 -> 6, 307 and other 3xx -> 8, unmodelled 4xx -> 6,
      everything else -> 8. The `io.ReadAll` failure at line 83 returns an upstream error (8)
      instead of panicking.

      Give 413/415/422 a named `case` even though it equals the unmodelled-4xx fallback, purely so a
      doc comment can name the spec operations that return them, and record the spec-audit result
      there (GDSError and InvokeAgentError are 2xx-only; BillingErrorResponse covers two endpoints
      the CLI has no commands for) so it is not re-litigated. The `default:` arm splits on class and
      should mirror the comment at `raw.go:167-174` about unmodelled transient 4xx (408, 425) being
      reported as permanent because class is the only available signal.

      Delete `reportIssueFatal` (lines 70-77) — it has callers only inside this function. Keep the
      `os` and `clievents` imports; `formatAuthorizationError` still uses both. Leave
      `formatAuthorizationError` alone: it always appends a clear-token message so its slice is
      never empty, and it already avoids panicking. Leave `extractEmbeddedErrors` (line 41) alone
      too — on the 2xx path an empty `errors[]` means the happy path, the opposite of what it means
      here.

      IMPORTANT: this task must also update the two existing tests that pin the old panic behaviour,
      or the tree goes red between commits. Rewrite `TestHandleResponseError_RedactsSecretArgs`
      (`response_test.go:27-107`) as `TestHandleResponseError_RedactsBodySecrets`: drop the
      `os.Args` save/restore and the `defer recover()` machinery, put the secret in the response
      BODY instead, keep the 415/307/400-malformed/599 statuses plus 413 and 422, and assert the
      returned error message contains `***` and not the raw secret. Model it on
      `TestRawStatusError_BodyRedacted` (`raw_status_test.go:189`). Then retarget three
      `TestHandleResponseError_ExitCodeMapping` entries and drop their now-wrong
      `wantMsgContain: "unexpected error [status N]"`: 402-malformed 1 -> 5, 404-malformed 1 -> 3,
      502-malformed 1 -> 8. (REQ-F-002, REQ-F-003, REQ-F-004, REQ-F-005, REQ-F-006, REQ-F-007,
      REQ-NF-001, REQ-NF-002)
    status: completed
    completed_at: '2026-08-13T11:00:34Z'
    dependencies:
      - task-001
    acceptance_criteria:
      - '`grep -n panic neo4j-cli/aura/internal/api/response.go` returns exactly two hits, both in `ParseBody` / `ParseRawBody`'
      - '`reportIssueFatal` no longer exists; the `os` and `clievents` imports are retained'
      - 'No `resBody` or `string(resBody)` reaches a format string without passing through `scrubbedBodyTrunc`'
      - 'No test asserts a panic from `handleResponseError`; `TestHandleResponseError_RedactsBodySecrets` passes'
      - '`TestHandleResponseError_NotFound_TagsResource`, `TestParseResourceFromRequest`, `TestSuggestionForResource` and `TestSuggestionForPaymentRequired` pass with zero edits'
      - '`make test` passes — the tree is green at this commit, not just at the end of the feature'
    completed_at: null

  - id: task-003
    title: 'Extend the exit-code mapping table with new statuses and empty-errors bodies'
    description: |
      Additive test work on `TestHandleResponseError_ExitCodeMapping` (`response_test.go:113`),
      building on the three entries task-002 retargeted.

      Add the previously-panicking and previously-unmodelled statuses: 400 malformed -> 6;
      403 malformed -> 4 asserting `wantSuggestion` equals `authSuggestion`; 307 -> 8;
      413 with an empty schema-less body -> 6; 413 with a parseable `errors[]` -> 6; 415
      schema-less -> 6; 422 with a parseable `errors[]` -> 6 asserting the upstream message text is
      actually surfaced; 422 with a schema-less plain-text body -> 6; 405 malformed -> 8; 409
      malformed -> 5; unmodelled 599 -> 8; unmodelled 451 -> 6. The 413/415/422 schema-less cases
      are load-bearing — that is the shape the spec actually documents.

      Then add the empty-`errors[]` cases proving REQ-F-004: for each of 400, 402, 404, 409 and a
      5xx, one entry with body `{}` and one with `{"errors":[]}`, asserting the status-class exit
      code and that the message carries the raw body rather than an empty bracket pair. The 404
      variants must still assert `ResourceType`, `ResourceID` and `Suggestion` are populated, since
      those come from the request URL and survive an uninformative body. If the table grows
      unwieldy, splitting the status matrix into a concern-named `response_status_test.go` is
      acceptable and precedented per AGENTS.md. (REQ-F-004, REQ-F-008)
    status: completed
    dependencies:
      - task-002
    acceptance_criteria:
      - 'The table covers 307, 413, 415, 422, unmodelled 4xx (451), unmodelled 5xx (599), and a malformed-body variant for each of 400/402/403/404/405/409/5xx'
      - 'Empty-errors bodies (`{}` and `{"errors":[]}`) on 400/402/404/409/5xx return the status-class exit code'
      - 'No empty-errors case renders the empty bracketed message; each carries the raw body instead'
      - 'The 404 empty-errors cases still assert ResourceType, ResourceID and Suggestion'
      - 'The 422 parseable case asserts the upstream message text reaches the error, not just the exit code'
    completed_at: '2026-08-13T11:12:00Z'

  - id: task-004
    title: 'Add TestHandleResponseError_NoPanic invariant matrix'
    description: |
      Add `TestHandleResponseError_NoPanic` to the internal `package api` test file. Cross every
      status from the REQ-F-003 table plus unmapped samples (302, 408, 418, 451, 507, 599) with a
      handful of body shapes — empty string, plain text, an HTML error page, and a valid
      `{"errors":[...]}` envelope — and for each combination assert three things: no panic, a
      non-nil error, and that `errors.As` extracts a `*clierr.CLIError` whose `Code` is a key in
      `clierr.Codes`.

      This is the invariant CLI-227 is actually about, expressed independently of any specific
      status mapping, so it fails loudly if someone reintroduces a `panic` arm or invents an
      out-of-enum code. Keep it in the internal test package — it calls the unexported
      `handleResponseError`, unlike the external `package api_test` in `api_test.go`. Pass nil
      credential and nil cfg; the 401/403 fixture is only needed for paths that reach
      `ClearAccessToken`, so exclude 401 or supply the `newAuthFixture` helper for it. (REQ-F-009)
    status: pending
