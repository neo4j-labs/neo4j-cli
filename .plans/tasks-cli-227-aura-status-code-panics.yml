  - id: task-005
    title: 'Add process-level e2e exit-code scenarios for 422/415/413/307'
    description: |
      The exit-0 symptom lives in `main.go`s recover, so no unit test can observe it. Extend
      `test/e2e/exitcodes/exitcodes_test.go` (build tag `e2e_exitcodes`) with four scenarios that
      drive the built binary against the existing fixture server: `unprocessable_422_exit_6`
      (status 422, schema-less body), `unsupported_media_415_exit_6` (empty body),
      `payload_too_large_413_exit_6` (empty body), and `permanent_redirect_307_exit_8` (empty body).

      Reuse the existing `fixtureServer`, `runCLI` and `scopeFlags` helpers and add the entries to
      the `scenarios` slice around line 313 — do not build a parallel harness. Each scenario must
      also assert the phrase `please report an issue` is ABSENT from stderr; the `scenario` struct
      (line 278) has `wantStderrContains` but no negative form, so add a `wantStderrOmits` field and
      wire it into the assertion block. Update the package doc comment (lines 6-30), which currently
      enumerates the exit codes by their original triggers only.

      Note on 307: `fixtureServer` writes no `Location` header, so Go's `http.Client` is expected to
      surface the 307 to the caller rather than following it. Verify that empirically while
      implementing. If the client behaves otherwise, assert on the observed status instead of
      forcing 307 through, and record what you found in a comment — the unit-level 307 case from
      task-003 is unaffected either way because it builds an `*http.Response` directly.

      This suite is not wired into CI or the Makefile, so it will not run under `make test`. Run it
      explicitly with `go test -tags=e2e_exitcodes ./test/e2e/exitcodes/...` and report the result;
      wiring it into CI is out of scope. (REQ-F-010)
    status: completed
    dependencies:
      - task-002
    acceptance_criteria:
      - '`go test -tags=e2e_exitcodes ./test/e2e/exitcodes/...` passes with 422, 415 and 413 exiting 6'
      - 'The 307 scenario passes, or documents in a comment why the observed status differs and asserts that instead'
      - 'Every new scenario asserts `please report an issue` is absent from stderr via a `wantStderrOmits` field'
      - 'The new scenarios reuse `fixtureServer` / `runCLI` / `scopeFlags` — no parallel harness'
      - 'The package doc comment reflects the added status coverage'
    completed_at: 2026-08-13T11:20:15Z

