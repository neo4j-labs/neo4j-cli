  - id: task-007
    title: "Fold ScrubbedBodyTrunc identity wrapper + empty-body guard"
    description: |
      Review finding (blocker, missed code-judo): api.ScrubbedBodyTrunc in neo4j-cli/aura/internal/api/raw.go is a pure passthrough wrapper around the unexported scrubbedBodyTrunc — two names for one function, one identity-wrapper layer. The task deliberately kept the two internal call sites (response.go:~505, raw.go:~206) on scrubbedBodyTrunc, so the exported surface is an alias the reader must discover is identical. There is no load-bearing distinction (the 'bounded twice' doc applies to both) and no internal-package-rule constraint forcing an unexported twin. Fix: rename scrubbedBodyTrunc → ScrubbedBodyTrunc, fold the behavior doc ('bounded twice', RedactText + StripControl) onto the exported name, update the two internal call sites to call ScrubbedBodyTrunc directly, and delete the wrapper. The exported surface stays identical; concept count drops by one. While in this pass, also fix the related nit at response.go:~505 (formatAuthorizationError unparseable branch): the new format 'unexpected error [status %d]: %s' has no empty-body guard, so a body that scrubs/truncates to empty yields a dangling ': '. Mirror rawErrorDetail (raw.go:~206-210) which appends ': %s' only when the body is non-empty. Build a small inline guard (compute the scrubbed body once; format with the ': %s' suffix only when non-empty) rather than calling ScrubbedBodyTrunc twice. Verify the existing formatAuthorizationError tests still pass; add/adjust a test case for the empty-body 401 path if none covers it.
    status: completed
    completed_at: 2026-08-17T10:03:03Z
    dependencies: []
    acceptance_criteria:
      - "scrubbedBodyTrunc renamed to ScrubbedBodyTrunc (exported) in raw.go with the behavior doc folded onto it; the identity wrapper deleted"
      - "Both internal call sites (response.go upstreamDetail, raw.go rawErrorDetail) call ScrubbedBodyTrunc directly; no scrubbedBodyTrunc symbol remains"
      - "formatAuthorizationError unparseable branch (response.go ~505) no longer emits a dangling ': ' when the body scrubs to empty; mirrors rawErrorDetail's non-empty guard"
      - "go build ./... and go test ./neo4j-cli/aura/internal/api/... pass"
      - "make fmt-check and make lint pass"
    source: review

