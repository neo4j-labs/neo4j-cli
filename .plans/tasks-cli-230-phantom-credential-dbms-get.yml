# Canonical verification grep, referenced by several tasks below.
# Scoped to SHIPPED surfaces only. A bare `grep -rn "credential dbms get" .`
# is self-defeating: the PRD, this task file, and any progress log legitimately
# quote the phantom command while describing its removal.
#
#   grep -rn 'credential dbms get' --include='*.go' --include='*.md' . \
#     | grep -v -e '^\./\.plans/' -e '^\./\.changes/' -e '^\./CHANGELOG\.md'
#
# Must return zero results when the feature is complete.

tasks:
  - id: task-001
    title: 'Replace the phantom command in docker create Long and flag usage'
    description: |
      In neo4j-cli/internal/subcommands/docker/create.go, rewrite the two sites that
      promise `neo4j-cli credential dbms get <name>`: the final sentence of the `Long`
      field (around line 145-146) and the `--no-print-password` flag usage string
      (around line 436). Locate both by grepping for the phantom string rather than
      trusting line numbers.

      The `Long` site is the longest-form home and must carry all three facts: the
      stored credential still connects via `--credential <name>`; the password itself is
      not readable through the CLI; and to set a known password run
      `admin user set-password neo4j --new-password <s> --credential <name> --rw` and
      then resync the stored credential with `credential dbms remove <name>` plus
      `credential dbms add`. The resync clause is mandatory - `admin user set-password`
      only issues ALTER USER against the database and leaves the stored credential
      holding the old password, so the reset advice alone would break
      `--credential <name>`.

      The flag usage string must stay to ONE short clause because it renders inline in
      the `docker create --help` flag table and is mirrored into a markdown table cell
      in the generated bundle. It should name `--credential <name>` and state the
      password is not CLI-readable; it must NOT try to fit the reset procedure.

      Word the prose so no secret word (password, token, secret, key, auth) sits
      immediately before a `:` or `=`. The tee redactor treats `password: <word>` as a
      secret assignment and would scrub the following word to `***`.
    status: pending
    dependencies: []
    acceptance_criteria:
      - 'create.go contains no occurrence of the string `credential dbms get`'
      - 'The `Long` field states all three facts: credential still connects via `--credential <name>`, password is not CLI-readable, and reset-then-resync'
      - 'The `--no-print-password` flag usage string is a single short clause naming `--credential <name>` and does not contain the reset procedure'
      - 'No line of new prose places a secret word (password/token/secret/key/auth) immediately before a `:` or `=`'
      - 'The existing string-concatenation style and the trailing comma on the `Long` field are preserved'
      - 'git diff shows no change to the `--no-print-password` plus `--no-store-credential` guard near line 210'
    completed_at: null

  - id: task-002
    title: 'Correct the Heads up paragraph in README.md'
    description: |
      In README.md (the "Heads up" paragraph about the generated password, around line
      322 - the PRD notes CLI-230 wrongly cites line 271, so grep for it), replace the
      parenthetical that promises `neo4j-cli credential dbms get <name>`.

      README has room for the full three facts. Prefer a short fenced `sh` block showing
      the concrete reset plus resync sequence over a long inline parenthetical. The
      concrete commands are derivable because docker create stores username `neo4j`,
      database `neo4j`, and URI `neo4j://localhost:<bolt-port>` (create.go:351,362), so
      the re-add is
      `credential dbms add --name <name> --uri neo4j://localhost:<port> --username neo4j --password <s> --rw`.

      Match the wording established in task-001 so the shipped surfaces agree.
    status: pending
    dependencies:
      - task-001
    acceptance_criteria:
      - 'README.md contains no occurrence of the string `credential dbms get`'
      - 'The Heads up paragraph conveys all three facts including the resync step'
      - 'Any command shown is a real invocation whose flags exist on the named command'
      - 'Wording is consistent with the create.go `Long` text from task-001'
    completed_at: null

