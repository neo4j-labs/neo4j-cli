  - id: task-004
    title: 'Reword the recovery-contract prose in create_test.go'
    description: |
      In neo4j-cli/internal/subcommands/docker/create_test.go, reword the doc comment on
      TestCreate_NoPrintPassword_StoresCredentialForRecovery (around line 1637) and the
