tasks:
  - id: task-001
    title: "Add silenceUsageOnError helper and wrap PreRunE return sites in common/flags/flags.go"
    description: |
      Introduce a private helper `silenceUsageOnError(cmd *cobra.Command, err error) error`
      that sets `cmd.SilenceUsage = true` when err is non-nil and returns err unchanged.
      Wrap all three PreRunE return sites in `common/flags/flags.go` so any error returned
      from `RegisterOutputFlag`'s PreRunE, `ComposeRootPersistentPreRunE`, or
      `RegisterAuraCredentialFlag`'s PreRunE silences cobra's usage-block print. Keep the
      leaf functions (`BindFormatFromFlag`, `EnforceWriteGate`) pure — no SilenceUsage
      writes inside them — so direct-call tests stay semantically unchanged.
    status: completed
    dependencies: []
    acceptance_criteria:
      - "silenceUsageOnError helper exists in common/flags/flags.go with the documented signature and no exported visibility"
      - "RegisterOutputFlag's PersistentPreRunE wraps BindFormatFromFlag via silenceUsageOnError"
      - "ComposeRootPersistentPreRunE wraps both BindFormatFromFlag and EnforceWriteGate via silenceUsageOnError on their error branches"
      - "RegisterAuraCredentialFlag's PersistentPreRunE wraps the prior-hook error and the credential-not-found error via silenceUsageOnError"
      - "BindFormatFromFlag and EnforceWriteGate bodies are unchanged — no SilenceUsage mutations inside them"
      - "make fmt-check, make lint, and make test all pass with no other tests broken"
    completed_at: 2026-05-12T14:35:00Z

  - id: task-002
    title: "Add unit tests for silenceUsageOnError wrappers in common/flags/flags_test.go"
    description: |
      Add table-driven unit tests proving each of the three PreRunE wrappers sets
      `cmd.SilenceUsage = true` exactly when they return an error, and leaves it false
      on the happy path. Cover the write-gate error, invalid --format error, and missing
      --credential error. Extend the existing `TestRegisterAuraCredentialFlag_CredentialNotFound`
      table rather than duplicating its fixture.
    status: completed
    dependencies:
      - task-001
    acceptance_criteria:
      - "New test TestComposeRootPersistentPreRunE_SilencesUsageOnError covers: write+no-rw → err + SilenceUsage true; invalid --format → err + SilenceUsage true; happy path → no err + SilenceUsage false"
      - "New test TestRegisterOutputFlag_SilencesUsageOnError covers: invalid --format → err + SilenceUsage true; valid --format → no err + SilenceUsage false"
      - "TestRegisterAuraCredentialFlag_CredentialNotFound rows additionally assert cmd.SilenceUsage == true on the credential-not-found row"
      - "Existing TestEnforceWriteGate stays unchanged (direct calls do not mutate SilenceUsage)"
      - "Tests use the existing buildConfig and executeWithArgs helpers from flags_test.go where applicable"
      - "make test passes"
    completed_at: 2026-05-12T14:45:00Z

