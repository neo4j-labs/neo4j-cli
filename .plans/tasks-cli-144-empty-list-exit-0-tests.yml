    description: |
      Append a new flat TestXxx function to neo4j-cli/query/run_test.go
      that locks the runQuery exit-0 path when the underlying Cypher
      returns zero rows. Use the existing newSeamRouter to register both
      the EXPLAIN preflight (makeQueryResponse + QueryType =
