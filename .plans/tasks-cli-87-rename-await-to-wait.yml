    title: "Create flags.RegisterWait helper and tests"
    description: |
      Add `neo4j-cli/aura/internal/flags/wait.go` exporting `WaitFlag`, `AwaitFlagAlias`, and `RegisterWait(cmd, *bool, helpText)`.
      The helper registers `--wait` and binds `--await` to the same `*bool`, then calls `cmd.Flags().MarkDeprecated(AwaitFlagAlias, "use --wait instead")`.
      Add `wait_test.go` with table-driven coverage for the four behavioural cases listed in REQ-F-002.
      Include the Neo4j copyright header on `wait.go` so `make license-check` passes.
    status: pending
    dependencies: []
    acceptance_criteria:
      - "wait.go exports WaitFlag = \"wait\", AwaitFlagAlias = \"await\", and RegisterWait(cmd *cobra.Command, wait *bool, helpText string)"
      - "RegisterWait registers both flags binding to the same *bool and marks --await deprecated via cobra MarkDeprecated"
      - "wait_test.go covers: --wait sets bool / no deprecation marker on stderr; --await sets bool AND stderr contains 'Flag --await has been deprecated, use --wait instead'; neither flag → false, no marker; both flags → true + marker"
      - "wait.go carries the Neo4j copyright header"
      - "go test ./neo4j-cli/aura/internal/flags/... passes"
    completed_at: null

