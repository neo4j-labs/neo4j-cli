tasks:
  - id: task-001
    title: "Update graphql create: replace username/password with --service-account"
    description: |
      In `neo4j-cli/aura/internal/subcommands/graphql/create.go`, remove the
      `--instance-username` and `--instance-password` flags (constants, variables,
      StringVar registrations, MarkFlagRequired calls) and replace them with a single
      `--service-account` flag (optional, default `"read_write"`). Add enum validation
      in RunE before SilenceUsage=true that rejects any value other than `read_only` or
      `read_write`. Update the request body to send
      `"aura_instance": {"service_account": serviceAccount}` instead of username/password.
      Update all Example strings to remove username/password and show --service-account.
    status: pending
    dependencies: []
    acceptance_criteria:
      - "create.go has no reference to instanceUsernameFlag, instancePasswordFlag, instanceUsername, or instancePassword"
      - "create.go registers --service-account with default read_write"
      - "RunE validates --service-account is read_only or read_write before making any API call"
      - "Request body contains aura_instance.service_account, not username/password"
      - "Example strings contain no --instance-username or --instance-password"
    completed_at: null

  - id: task-002
    title: "Update graphql update: replace username/password with --service-account"
    description: |
      In `neo4j-cli/aura/internal/subcommands/graphql/update.go`, remove
      `--instance-username` and `--instance-password` (constants, variables, StringVar
      registrations, and the if-block that built the aura_instance map from them).
      Add `--service-account` (optional, empty default). When the flag is non-empty,
      validate it is `read_only` or `read_write`, then set
      `body["aura_instance"] = map[string]string{"service_account": serviceAccount}`.
      When omitted, `aura_instance` must be absent from the PATCH body entirely.
      Update all Example strings accordingly.
    status: pending
    dependencies: []
    acceptance_criteria:
      - "update.go has no reference to instanceUsernameFlag, instancePasswordFlag, instanceUsername, or instancePassword"
      - "update.go registers --service-account with empty default"
      - "When --service-account is provided, body contains aura_instance.service_account"
      - "When --service-account is omitted, body does not contain an aura_instance key"
      - "Providing an invalid --service-account value returns a validation error before the API call"
    completed_at: null

