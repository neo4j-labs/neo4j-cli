  - id: task-018
    title: "Repair migration — config set credential-storage keyring is idempotent (REQ-F-017)"
    description: |
      Update the `config set credential-storage keyring` RunE in
      `neo4j-cli/internal/subcommands/config/set.go` to implement REQ-F-017:

      Remove the early-exit "same value → no-op" guard specifically for
      `credential-storage keyring → keyring`. Instead, always run
      `MigrateToKeyring()` when the target value is `keyring`, regardless of
      the current stored value.

      Because `load()` now silently populates in-memory fields from JSON
      (REQ-F-016), the migration pass has access to JSON-resident secrets and
      can write them into the keyring and scrub them from `credentials.json`.
      Credentials already in the keyring are unaffected (their values are read
      from the keyring by `load()` and written back to the keyring by
      `MigrateToKeyring()` — idempotent).

      The same-value no-op behaviour is preserved for `insecure → insecure` to
      avoid spurious `MigrateToInsecure()` calls. Only `keyring` target needs
      the repair-pass treatment.

      Add tests:
        - `neo4j-cli/internal/subcommands/config/set_test.go`: table case
          "credential-storage keyring → keyring (repair): runs MigrateToKeyring"
          where the mock credentials have a JSON-resident value. Assert the
          keyring is written and JSON is scrubbed after the command.
    status: completed
