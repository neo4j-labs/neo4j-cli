      Step 1 — No-daemon smoke:
      ```yaml
      - name: Keyring smoke (no daemon)
        if: matrix.os == 'ubuntu-latest'
        run: go test -tags=keyring_smoke -count=1 -v ./test/e2e/keyring/...
      ```
      (No special setup needed; with-daemon tests self-skip.)

      Step 2 — Install gnome-keyring:
      ```yaml
      - name: Install gnome-keyring
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get install -y gnome-keyring libsecret-tools
      ```

      Step 3 — With-daemon smoke:
      ```yaml
      - name: Keyring smoke (with daemon)
        if: matrix.os == 'ubuntu-latest'
        run: |
          dbus-run-session -- sh -c \
            'echo "" | gnome-keyring-daemon --unlock --components=secrets --daemonize
             go test -tags=keyring_smoke -count=1 -v ./test/e2e/keyring/...'
      ```
      Note: the `gnome-keyring-daemon --unlock --daemonize` line starts the
      daemon with an empty passphrase inside the dbus session so it's ready to
      serve secrets when the tests make their first keyring call. Validate the
      exact invocation during implementation — the unlock step may need to
      precede the `go test` invocation with a short sleep or a readiness check.

      Place the Linux steps after the existing docker smoke step, inside the
      `ubuntu-latest` matrix gate. The Windows step (task-015) will be added
      separately under `windows-latest`.
    status: completed
