  - id: task-014
    title: "Wire keyring_smoke tests into CI"
    description: |
      Add two keyring smoke steps to `.github/workflows/test.yml` under
      `ubuntu-latest` (following the existing docker smoke pattern).

      Prerequisite: `make build` must have already run in the job to produce
      `bin/neo4j-cli`. Check if an earlier step already builds the binary; if
