  - id: task-004
    title: "Update credentials load/save to read/write keyring in keyring mode"
    description: |
      Pass the storage mode (from `GlobalConfig.CredentialStorage()`) into
      `NewCredentials()` or expose it as a settable field on `Credentials`.
      Update `load()` to populate sensitive fields from the keyring when mode
      is `"keyring"`: call `keyring.Get()` for each sensitive field after
      JSON unmarshal; if `ErrNotFound` and the JSON value is also absent,
      return a `clierr.UsageError` naming the credential (REQ-NF-004); if
      `ErrNotFound` but the JSON still holds the value (pre-migration state),
      use the JSON value silently so first-run works without errors. Update
      `save()` to zero sensitive fields before writing JSON and call
      `keyring.Set()` for each non-empty sensitive field when mode is
      `"keyring"`. Use `MockInit()` via the task-002 test seam in all tests.
      Sensitive fields: Aura `ClientSecret`+`AccessToken`, Dbms `Password`,
      Embed `APIKey`.
    status: pending
    dependencies:
      - task-002
      - task-003
    acceptance_criteria:
      - "In keyring mode, `save()` writes empty strings for sensitive fields to credentials.json"
      - "In keyring mode, `load()` populates sensitive fields from the keyring"
      - "In insecure mode, load/save behaviour is identical to today"
      - "REQ-NF-004: missing keyring entry with no JSON fallback returns a named error"
      - "Pre-migration fallback: missing keyring entry with JSON value present succeeds silently"
      - "All existing credential tests pass using the mock keyring provider"
    completed_at: null

  - id: task-005
    title: "Implement Credentials.MigrateToKeyring() with atomic rollback"
    description: |
      Add `MigrateToKeyring() error` to the `Credentials` struct in
      `common/clicfg/credentials/credentials.go`. Iterate all three
      credential types. For each credential: treat `ClientSecret` and
      `Password` as required (empty value → hard error, roll back all entries
      written so far via `keyring.Delete()`, return error naming the
      credential and suggesting `credential <type> remove <name>`); treat
      `AccessToken` and `APIKey` as optional (skip if empty). On full
      success, zero sensitive fields in the in-memory structs and call
      `save()`. Any `keyring.Set()` failure triggers full rollback.
    status: pending
    dependencies:
      - task-004
    acceptance_criteria:
      - "All credential secrets successfully written to keyring and scrubbed from JSON on success"
      - "Empty required field (`ClientSecret`, `Password`) aborts migration with a named error"
      - "Empty optional field (`AccessToken`, `APIKey`) is silently skipped"
      - "Partial failure rolls back all keyring entries written so far"
      - "Config value is NOT written by this method (caller's responsibility)"
      - "Tested with mock keyring provider"
    completed_at: null

  - id: task-006
    title: "Implement Credentials.MigrateToInsecure() with atomic rollback"
    description: |
      Add `MigrateToInsecure() error` to the `Credentials` struct. Iterate
      all three credential types and call `keyring.Get()` for each sensitive
      field. For required fields (`ClientSecret`, `Password`), treat
      `ErrNotFound` as a hard error — re-zero in-memory fields already
      populated and return a named error suggesting `credential <type> remove
      <name>`. For optional fields (`AccessToken`, `APIKey`), treat
      `ErrNotFound` as a silent skip (write empty value to JSON). Any
      non-`ErrNotFound` keyring error is a hard error for all field types. On
      full success call `save()` to persist secrets to JSON, then call
      `keyring.Delete()` for all non-empty entries.
    status: pending
    dependencies:
      - task-004
    acceptance_criteria:
      - "All credential secrets read from keyring and written to JSON on success"
      - "Keyring entries deleted after successful JSON write"
      - "`ErrNotFound` on required field aborts migration with a named error"
      - "`ErrNotFound` on optional field is silently skipped"
      - "Non-`ErrNotFound` error on any field aborts migration with rollback"
      - "Tested with mock keyring provider"
    completed_at: null

  - id: task-007
    title: "Wire migration into config set credential-storage RunE"
    description: |
      Update the `config set` `RunE` in
      `neo4j-cli/internal/subcommands/config/set.go` to detect when the key
      is `"credential-storage"`. If the new value differs from the current
      value, call `cfg.Credentials.MigrateToKeyring()` (for `"keyring"`) or
      `cfg.Credentials.MigrateToInsecure()` (for `"insecure"`) before
      calling `GlobalConfig.Set(...)`. Return the migration error directly if
      it fails — the config value must NOT be persisted on failure. If the
      values are identical or there are no credentials, skip migration and
      proceed normally.
    status: pending
    dependencies:
      - task-005
      - task-006
      - task-003
    acceptance_criteria:
      - "Switching to `keyring` calls `MigrateToKeyring()` before saving config"
      - "Switching to `insecure` calls `MigrateToInsecure()` before saving config"
      - "Migration failure returns error and leaves config.json unchanged"
      - "Setting the same value that is already set is a no-op (no migration triggered)"
      - "Setting with no existing credentials succeeds without migration"
    completed_at: null

