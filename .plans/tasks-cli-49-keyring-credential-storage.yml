      Same scenarios as the Windows happy-path group.

      **Locked-Keychain tests** (graceful degradation via temp custom Keychain):
      Use `t.Helper` setup/cleanup to:
      1. Record the current default keychain path:
         `security default-keychain` (parse quoted path from output).
      2. Create a temp keychain: `security create-keychain -p ""
         <t.TempDir()>/smoke.keychain-db`
