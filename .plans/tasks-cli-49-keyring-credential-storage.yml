  - id: task-017
    title: "Silent JSON fallback + auto-migration on load (REQ-F-016, REQ-F-018, REQ-F-019)"
    description: |
      Update `load()` in `common/clicfg/credentials/credentials.go` (or the
      per-type credential loaders) to implement REQ-F-016 and REQ-F-019:

      When `credential-storage: keyring` and `keyring.Get()` returns
      `ErrNotFound` for a sensitive field:
        - If the JSON value for that field is non-empty (REQ-F-016):
          1. Use it silently (no warning, no error).
          2. Immediately attempt auto-migration (REQ-F-019): call `keyring.Set()`
             with the JSON value. If it succeeds, zero the field in the JSON
             struct. After processing all fields for all credentials, call
             `save()` to persist any JSON scrubs. If `keyring.Set()` fails,
             silently skip the scrub for that field this invocation — do not
             abort or warn. Retry happens automatically on next command.
        - If the JSON value is also empty/absent: keep existing REQ-NF-004
          behavior — hard error naming the credential (required fields) or
          silent skip (optional fields).

      Auto-migration does not require `--rw`; it is transparent internal
      housekeeping. Track which fields were successfully migrated so `save()` is
      only called when at least one scrub occurred (avoid unnecessary writes).

      Also update `MigrateToInsecure()` to implement REQ-F-018:

      During reverse migration, if `keyring.Get()` returns `ErrNotFound` for a
      required field but the in-memory value is non-empty (populated via the
      REQ-F-016 JSON fallback), treat that field as "already in JSON" — skip
      the keyring read, keep the in-memory value, do not error. The `save()`
      call at the end persists all in-memory values to JSON.

      Add tests (mock keyring provider throughout):
        - `load()` table cases:
          (1) keyring ErrNotFound + JSON has value → succeeds, auto-migration
              attempt fires (keyring.Set called), JSON scrubbed on success.
          (2) keyring ErrNotFound + JSON has value + keyring.Set fails →
              succeeds, JSON unchanged (no abort).
          (3) keyring ErrNotFound + JSON empty → hard error for required fields.
        - `MigrateToInsecure()` table cases:
          (4) keyring ErrNotFound for required field + in-memory value non-empty
              → succeeds (field already in JSON).
          (5) keyring ErrNotFound + in-memory also empty → hard error (unchanged).
    status: completed
    completed_at: 2026-05-22T10:00:00Z
    dependencies:
      - task-004
      - task-006
    acceptance_criteria:
      - "In keyring mode, `load()` succeeds silently when keyring returns ErrNotFound but JSON has the value"
      - "After a successful auto-migration, `credentials.json` no longer contains the secret and the keyring holds it"
      - "If auto-migration keyring write fails, the command still succeeds using the JSON value and credentials.json is unchanged"
      - "In keyring mode, `load()` hard-errors when both keyring and JSON are absent/empty for a required field"
      - "`MigrateToInsecure()` succeeds when required fields are in JSON only (no keyring entries)"
      - "`MigrateToInsecure()` still hard-errors when both keyring and JSON are absent/empty for a required field"
