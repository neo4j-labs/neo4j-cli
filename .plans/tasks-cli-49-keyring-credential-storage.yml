      `defaultKeyring.Get(ServiceName, "__neo4j-cli-probe__")` and returns nil
      if the result is nil or `ErrNotFound` (daemon is reachable); any other
      error is returned as-is (daemon unavailable).

      Wire the probe into two places:

      1. `MigrateToKeyring()` in `common/clicfg/credentials/credentials.go`:
         call `ProbeKeyringAvailability()` at the very start of the function,
         before iterating credentials. On failure, return a
         `clierr.NewUsageError` with the keyring error and a hint to run
         `neo4j-cli config set credential-storage insecure --rw`. This covers
         both the has-creds case (improved error surfacing) and the no-creds
         case (no `keyring.Set()` would have fired otherwise).

      2. `initCredentialStorageDefault` in `neo4j-cli/app/app.go`: in the
         no-credentials branch (where `credential-storage: keyring` would be
         written), call `ProbeKeyringAvailability()` first. On failure, print a
         warning to stderr noting that the keyring is unavailable plus the
         command to retry after fixing it, then write `credential-storage:
         insecure` and call `SetStorageMode(insecure)` instead.

      Add tests:
      - `common/clicfg/credentials/keyring_test.go`: two cases for
        `ProbeKeyringAvailability()` — mock returns ErrNotFound (probe succeeds)
