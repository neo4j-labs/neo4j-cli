  - id: task-009
    title: "First-run default detection and one-time upgrade notice"
    description: |
      Implement `initCredentialStorageDefault` (or equivalent) called from
      `PersistentPreRunE` on the root cobra command in
      `neo4j-cli/app/app.go`. The function checks if `"credential-storage"`
      is present in config.json via `GlobalConfig`; if already present it
      returns immediately (no-op). If absent: check whether any credentials
      exist across all three types in `credentials.json`; if yes, write
      `"insecure"` to config via `GlobalConfig.Set()` and print the one-time
      upgrade notice to stderr (telling the user their credentials remain in
      plaintext and providing the migration command); if no credentials exist,
      write `"keyring"` silently. Handle the ordering constraint: this must
      run before any command `RunE` accesses credentials with the mode, so
      ensure the Credentials struct reflects the written mode after detection.
    status: pending
    dependencies:
      - task-003
      - task-004
    acceptance_criteria:
      - "First run with existing credentials writes `credential-storage: insecure` and emits upgrade notice to stderr"
      - "First run with no credentials writes `credential-storage: keyring` with no output"
      - "All subsequent runs are a no-op (key already present, no notice)"
      - "Upgrade notice names the migration command exactly"
      - "Credentials loaded after detection reflect the written storage mode"
