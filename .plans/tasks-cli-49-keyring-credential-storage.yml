  - id: task-022
    title: "Fix Ubuntu smoke test CI failures (requireDaemon fatal + DBUS propagation)"
    description: |
      Two bugs cause both Ubuntu smoke CI steps to fail:

      **Bug 1 — `requireDaemon` fatals in no-daemon CI step**

      `requireDaemon` in `test/e2e/keyring/keyring_linux_test.go` calls
      `t.Fatal` when `DBUS_SESSION_BUS_ADDRESS == ""` AND `CI == "true"`.
      GitHub Actions always sets `CI=true`, so the no-daemon step (which
      intentionally has no daemon) fatals on all four with-daemon tests instead
      of skipping.

      Fix:
      1. In `requireDaemon`, replace `os.Getenv("CI") == "true"` with
         `os.Getenv("KEYRING_WITH_DAEMON") == "true"`.
      2. In `.github/workflows/test.yml`, add `KEYRING_WITH_DAEMON=true` to
         the with-daemon step's shell command so the fatal path still fires
         when `dbus-run-session` genuinely fails:
         ```yaml
         - name: Keyring smoke (with daemon)
           if: matrix.os == 'ubuntu-latest'
           run: |
               dbus-run-session -- sh -c \
                 'echo "" | gnome-keyring-daemon --unlock --components=secrets --daemonize && \
                  sleep 1 && \
                  KEYRING_WITH_DAEMON=true go test -tags=keyring_smoke -count=1 -v ./test/e2e/keyring/...'
         ```

      **Bug 2 — `baseChildEnv` doesn't propagate `DBUS_SESSION_BUS_ADDRESS`**

      `baseChildEnv` in `test/e2e/keyring/helpers_test.go` builds a minimal
      subprocess env that omits `DBUS_SESSION_BUS_ADDRESS`. The neo4j-cli
      subprocess therefore can't connect to gnome-keyring, causing all keyring
      calls to fail with a D-Bus error.

      Fix: in `baseChildEnv`, add `DBUS_SESSION_BUS_ADDRESS` when set in the
      parent process:
      ```go
      if v := os.Getenv("DBUS_SESSION_BUS_ADDRESS"); v != "" {
          env = append(env, "DBUS_SESSION_BUS_ADDRESS="+v)
      }
      ```
      The no-daemon tests call `stripDBUS(baseChildEnv(...))` which already
      strips this variable — no changes to the no-daemon tests are needed.

      After both fixes: run `make fmt-check` and `make lint` to verify the
      changed files, and confirm the no-daemon step can be simulated locally
      by running `DBUS_SESSION_BUS_ADDRESS="" go test -tags=keyring_smoke ...`
      (should see t.Skip on with-daemon tests, not t.Fatal).
    status: completed
    completed_at: 2026-05-22T18:30:00Z
    dependencies:
      - task-013
      - task-014
    acceptance_criteria:
      - "`requireDaemon` checks `KEYRING_WITH_DAEMON == \"true\"` (not `CI == \"true\"`) for the fatal path"
      - "`KEYRING_WITH_DAEMON=true` is set in the with-daemon CI step's shell command in test.yml"
      - "With-daemon tests call `t.Skip` when `DBUS_SESSION_BUS_ADDRESS` is absent and `KEYRING_WITH_DAEMON` is not set"
      - "With-daemon tests call `t.Fatal` when `DBUS_SESSION_BUS_ADDRESS` is absent and `KEYRING_WITH_DAEMON=true`"
      - "`baseChildEnv` propagates `DBUS_SESSION_BUS_ADDRESS` from the test process to subprocesses when it is set"
      - "`stripDBUS(baseChildEnv(...))` still produces an env without `DBUS_SESSION_BUS_ADDRESS` (no-daemon test isolation preserved)"
      - "`make fmt-check` and `make lint` pass on the changed files"
      - "Ubuntu no-daemon CI step passes (with-daemon tests skip, no fatal)"
      - "Ubuntu with-daemon CI step passes (neo4j-cli subprocess can connect to gnome-keyring)"
