  - id: task-003
    title: "Add agentcontext.go cobra command with --format dispatch"
    description: |
      Create agentcontext.go with NewCmd(cfg *clicfg.Config, version
      string) *cobra.Command. Use="agent-context", Short ~"Emit the full
      CLI shape as JSON for AI-agent discovery", Long explaining the v1
      schema honestly (no aspirational fields) and pointing to AGENTS.md
      "Agent Context Notes". Example field flush-left with three lines
      per REQ-F-016: bare invocation, --format json piped to jq for
      command keys, --format json piped to jq -e for a 3-level-deep flag
      reach. RunE reads cfg.Aura.Output() (the existing root --format
      accessor wired at app.go:38) and dispatches: json/default →
      json.NewEncoder(out).Encode(ctx); toon → existing project toon
      path; table → flat command-list table with columns path | aliases
      | short, sorted by cmd.CommandPath() lexicographically, plus
      footer block of cli_version / schema_version / async_flag. Body
      ≤80 lines per the one-file-per-leaf rule. Neo4j copyright header.
    status: completed
    dependencies:
      - task-001
    acceptance_criteria:
      - "agentcontext.go exists with Neo4j copyright header and is ≤80 lines"
      - "NewCmd(cfg, version) returns a cobra.Command with Use=\"agent-context\", non-empty Short/Long/Example"
      - "Example field is flush-left (no leading 2-space indent) and contains ≥3 realistic invocations"
      - "RunE dispatches on cfg.Aura.Output() — json (default piped), toon, table — each path writes non-empty output"
      - "Table mode renders a flat command-list (path | aliases | short) sorted by CommandPath, plus footer with cli_version/schema_version/async_flag"
      - "`go build ./neo4j-cli/internal/subcommands/agentcontext/...` succeeds"
    completed_at: 2026-05-12T14:50:00Z

