tasks:
  - id: task-001
    title: "Add build.go walker and types in agentcontext package"
    description: |
      Create the new package neo4j-cli/internal/subcommands/agentcontext/
      with a pure-function walker in build.go. No cobra side effects.
      Exports BuildContext(root *cobra.Command, cliVersion string) Context
      and the Context / Command / Flag types with snake_case json: tags.
      Includes the closed-set constants schemaVersion=1, exitCodes (only
      "0":"success" and "1":"general error"), errorCodes (the three
      clierr categories: usage_error / upstream_error / fatal_error with
      the wording from REQ-F-009), asyncFlag="--await". output_formats is
      sourced live from clicfg.ValidFormatValues[:] inside BuildContext —
      do NOT duplicate the list. Walker mirrors common/skill/render/
      render.go:281-293: VisitAll over LocalFlags + InheritedFlags, skip
      Hidden, dedupe by name (local wins), sort by name. Inherited flags
      carry "inherited": true. Recurse via cmd.Commands() filtering on
      IsAvailableCommand() (cobra's own visibility predicate). Cap
      recursion depth at 10 defensively. Map keys for commands and
      subcommands are the first-Use-token (lowercased). File must start
      with the Neo4j copyright header (license-check gate).
    status: completed
    dependencies: []
    acceptance_criteria:
      - "neo4j-cli/internal/subcommands/agentcontext/build.go exists with Neo4j copyright header"
      - "Exports Context, Command, Flag structs with snake_case json: tags matching REQ-F-001/F-004/F-005"
      - "BuildContext(root, cliVersion) sets schema_version=1, binary=\"neo4j-cli\", output_formats=clicfg.ValidFormatValues[:], async_flag=\"--await\""
      - "exitCodes equals {\"0\":\"success\",\"1\":\"general error\"} and errorCodes equals the three clierr categories per REQ-F-009"
      - "Walker visits LocalFlags + InheritedFlags, skips Hidden, dedupes by name (local wins), sorts by name, marks inherited flags with inherited:true"
      - "Recursion uses cmd.IsAvailableCommand() filter; map keys are first-Use-token lowercased"
      - "`go build ./neo4j-cli/internal/subcommands/agentcontext/...` succeeds"
    completed_at: 2026-05-12T14:20:00Z

