  - id: task-005
    title: "Add agentcontext_test.go end-to-end tests via app.NewCmd"
    description: |
      Write agentcontext_test.go colocated with the source. Tests build
      the full app via app.NewCmd(cfg) with a testfs-backed config and
      invoke cmd.SetArgs([]string{"agent-context", "--format", "json"}).
      Cover REQ-V-001 through V-004 + V-006:
      - TestAgentContext_Envelope: decode stdout into Context, assert
        schema_version==1, cli_version!="", binary=="neo4j-cli",
        len(commands)>0, len(exit_codes)==2, len(error_codes)==3,
        output_formats==clicfg.ValidFormatValues[:],
        async_flag=="--await".
      - TestAgentContext_OutputFormatsParity: assert emitted
        output_formats slice is reflect.DeepEqual to
        clicfg.ValidFormatValues[:].
      - TestAgentContext_TreeCoverage: walk app.NewCmd(cfg) live in the
        test collecting every IsAvailableCommand path; walk the emitted
        JSON commands tree collecting the same; assert set equality.
        Failure msg names missing/extra paths.
      - TestAgentContext_FormatRoundTrip: table-driven over
        {json,toon,table}. Each path exits without error and stdout is
        non-empty; for json round-trip back to Context via
        json.Unmarshal.
      - TestAgentContext_HelpExamples: assert leaf cmd.Example is
        non-empty and the first line has no leading two-space indent.
      Use clicfg.NewConfig(testfs.GetTestFs(...), version) per AGENTS.md
      "Hermetic Test Notes" (lightweight cobra tests don't need the
      heavier aura test helper). Neo4j copyright header.
    status: completed
    dependencies:
      - task-004
    acceptance_criteria:
      - "agentcontext_test.go exists with Neo4j copyright header, uses testfs-backed clicfg"
      - "All five tests (Envelope, OutputFormatsParity, TreeCoverage, FormatRoundTrip, HelpExamples) exist and pass"
      - "TreeCoverage walks the live cobra tree and asserts set equality with the JSON tree; failure mode names missing/extra paths"
      - "FormatRoundTrip covers json, toon, table — none panic, all write non-empty stdout"
      - "`make test` passes including all new agentcontext tests"
    completed_at: 2026-05-12T15:15:00Z

