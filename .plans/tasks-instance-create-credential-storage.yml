feature: instance-create-credential-storage
prd: ./prd-instance-create-credential-storage.md
created_at: 2026-05-07T00:00:00Z
updated_at: 2026-05-07T00:00:00Z

tasks:
  - id: task-001
    title: "Add --credential-name, --no-credential-storage, --no-credential-print flags"
    description: |
      Register the three new flags on the `instance create` cobra command in
      `neo4j-cli/aura/internal/subcommands/instance/create.go`. Declare local
      variables for each flag value, bind them via `cmd.Flags()`, and thread
      them into `RunE`/`PreRunE` as captures. No behaviour changes yet—just
      flag wiring so subsequent tasks can read them.
    status: completed
    dependencies: []
    acceptance_criteria:
      - "`neo4j aura instance create --help` shows `--credential-name`, `--no-credential-storage`, and `--no-credential-print` in the flag list"
      - "Flags compile cleanly; `make build` succeeds"
      - "No existing tests are broken by the addition"
    completed_at: 2026-05-07T00:00:00Z

  - id: task-002
    title: "Implement PreRunE validation for new flag combinations"
    description: |
      Add a `PreRunE` (or extend any existing one) on `newCreateCmd` that
      validates: (a) `--credential-name` may not be combined with
      `--no-credential-storage`; (b) an explicit `--credential-name ""`
      (empty string) is rejected; (c) when `--no-credential-storage` is not
      set, `cfg.Credentials.Dbms` must be non-nil. Return clear `fmt.Errorf`
      messages for each case. Use `cmd.Flags().Changed("credential-name")`
      for (a) and (b) to distinguish user-supplied values from defaults.
    status: completed
    dependencies:
      - task-001
    acceptance_criteria:
      - "`--credential-name foo --no-credential-storage` returns an error before any HTTP call is made"
      - "`--credential-name \"\"` (explicit empty) returns an error in PreRunE"
      - "A nil `cfg.Credentials.Dbms` (without `--no-credential-storage`) returns a clear error in PreRunE"
      - "Valid flag combinations proceed to RunE without error"
      - "Table-driven unit tests for all three validation branches pass"
    completed_at: 2026-05-07T00:00:00Z

  - id: task-003
    title: "Implement credential name generation and collision resolution helpers"
    description: |
      Add package-level helpers (unexported) in the `instance` subcommand
      package: `baseCredentialName(instanceID, customName string) string`
      returns `<instanceID>-default` when `customName` is empty, else
      `customName`. Add `resolveCredentialName(dbms DbmsGetter, base string) string`
      that increments a suffix counter until `dbms.Get(candidate)` returns an
      error (not found). Co-locate unit tests in a new `create_test.go` helper
      section or a dedicated helper file.
    status: completed
    dependencies: []
    acceptance_criteria:
      - "`baseCredentialName(\"abc\", \"\")` returns `\"abc-default\"`"
      - "`baseCredentialName(\"abc\", \"myname\")` returns `\"myname\"`"
      - "Collision resolution returns `<base>-1`, `<base>-2`, etc. when earlier names are taken"
      - "Unit tests for base name and at least two collision steps pass"
    completed_at: 2026-05-07T01:00:00Z

  - id: task-004
    title: "Refactor RunE to use ParseBody flow with conditional field list"
    description: |
      Replace the existing `output.PrintBody(cmd, cfg, resBody, fields)` call
      in `create.go` with the `ParseBody` → `GetSingleOrError` →
      `api.NewSingleValueResponseData` pattern (as used in `tenant/get.go`).
      Build the `fields []string` slice dynamically: always include
      `id, name, tenant_id, connection_url, username`; append `password` only
      when `--no-credential-print` is not set; append `credential_name` only
      when `--no-credential-storage` is not set; always append
      `cloud_provider, region, type`. Do not inject `credential_name` into
      the data map yet—that happens in task-005.
    status: pending
    dependencies:
      - task-001
    acceptance_criteria:
      - "Default run (no new flags) produces the same field order and output as before, minus `credential_name` (not yet injected)"
      - "`--no-credential-print` omits `password` from output"
      - "`--no-credential-storage` omits `credential_name` from output"
      - "Both flags together omit both fields"
      - "All pre-existing `create` tests continue to pass"
    completed_at: null

  - id: task-005
    title: "Wire credential storage and context-aware failure warnings into RunE"
    description: |
      After a successful create response and before any `--await` polling, call
      `resolveCredentialName` then `cfg.Dbms.Add(name, username, password,
      "neo4j", uri)` (skipped when `--no-credential-storage` is set). Inject
      `data["credential_name"] = resolvedName` into the response map before
      rendering. If `cfg.Dbms.Add` returns an error, emit a context-aware
      warning to stderr (two variants: one when `--no-credential-print` is not
      set advising to save the printed password; one when it is set advising to
      reset via the Aura console), then continue with exit 0.
    status: pending
    dependencies:
      - task-003
      - task-004
    acceptance_criteria:
      - "Default run: credential saved as `<id>-default`; `credential_name` field present in output with correct value"
      - "Storage failure (without `--no-credential-print`): stderr warning mentions saving the printed password; exit code 0"
      - "Storage failure (with `--no-credential-print`): stderr warning mentions resetting via Aura console; exit code 0"
      - "`--no-credential-storage`: `cfg.Dbms.Add` is never called"
      - "Credential storage occurs before `--await` polling begins"
    completed_at: null

  - id: task-006
    title: "Write comprehensive table-driven tests for all new create behaviours"
    description: |
      Add or extend table-driven tests in `create_test.go` covering every
      acceptance criterion from the PRD: default name, collision resolution,
      `--credential-name`, `--no-credential-storage`, `--no-credential-print`,
      both flags combined, storage failure (both warning variants), `--await`
      ordering, and the three `PreRunE` validation error cases. Use an
      in-memory FS via `testfs.GetTestFs` to avoid touching real credentials.
      Verify stored credentials via `helper.Config.Dbms.Get(name)`.
    status: pending
    dependencies:
      - task-002
      - task-005
    acceptance_criteria:
      - "All scenarios listed in PRD Acceptance Criteria section have a corresponding test case"
      - "Tests use table-driven form (`for _, tc := range []struct{...}{...}`)"
      - "No test touches the real credentials file on the developer's machine (in-memory FS only)"
      - "`make test` passes with all new and existing tests green"
    completed_at: null

  - id: task-007
    title: "Add changelog entry for auto-save credential feature"
    description: |
      Hand-author (or use `changie new`) a changelog YAML entry under
      `.changes/unreleased/` tagged `project: neo4j-cli` with kind `Minor`
      describing the new auto-save behaviour and the three new flags. The body
      should be a single, user-facing sentence suitable for a public changelog.
      Run `make fmt-check` and `make lint` to confirm all gates are green.
    status: pending
    dependencies:
      - task-006
    acceptance_criteria:
      - "A `.changes/unreleased/neo4j-cli-Minor-*.yaml` file exists with `project: neo4j-cli` and `kind: Minor`"
      - "`make test`, `make fmt-check`, and `make lint` all pass on the final branch state"
    completed_at: null
