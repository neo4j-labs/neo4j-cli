tasks:
  - id: task-001
    title: "Add redactString helper, refactor redactArgs, redact stderr at call site"
    description: |
      Edit neo4j-cli/internal/subcommands/docker/client.go. Add the
      "regexp" import. Add a package-level precompiled regex
      `sensitiveAssignmentRe = regexp.MustCompile(`(?i)(\w*(?:AUTH|PASSWORD)\w*\s*=\s*)(\S+)`)`
      near the existing `lookPathFn` / `ErrNotFound` seams. Add a
      package-private helper
      `redactString(s string) string` that calls
      `sensitiveAssignmentRe.ReplaceAllString(s, "${1}<redacted>")`.
      Rewrite `redactArgs` to delegate per-element to `redactString`
      while preserving the nil/empty short-circuit and the
      non-mutation contract. At the existing call site (client.go:151)
      change the `msg` argument from `msg` to `redactString(msg)`.
      Update the comment block on `redactArgs` to note the
      regex-driven, case-insensitive delegation. Add an inline
      comment on `redactString` describing the regex shape and the
      multi-match property used for stderr blobs.
    status: completed
    dependencies: []
    acceptance_criteria:
      - "Package-level `sensitiveAssignmentRe` regex exists with the exact RE2 pattern from REQ-F-001."
      - "`redactString(s string) string` exists and is implemented via `sensitiveAssignmentRe.ReplaceAllString` with the `${1}<redacted>` replacement template."
      - "`redactArgs` body delegates to `redactString` per element; nil input returns nil; empty input returns an empty slice; the input slice is not mutated."
      - "`client.go:151` call site interpolates `redactString(msg)` in place of bare `msg`; argv echo branch (`strings.Join(redactArgs(args), \" \")`) shape is unchanged."
      - "Argv passed to `exec.CommandContext` is unchanged — redaction is only applied to the user-facing error string."
      - "Comment on `redactArgs` notes regex-driven delegation; comment on `redactString` documents the pattern shape and multi-match property."
    completed_at: 2026-05-20T07:35:00Z

  - id: task-002
