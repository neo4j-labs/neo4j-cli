tasks:
  - id: task-001
    title: 'Add splitStatements with line-end semicolon splitting'
    description: |
      Add splitStatements(cypher string) []string to the query package
      (neo4j-cli/query/run.go or a new split.go). Split only on a semicolon at
      end of line (";" + optional trailing whitespace then "\n", or ";" at end
      of input); a mid-line ";" is kept verbatim. Use a line-walk implementation
      that handles CRLF, strips the terminating ";", TrimSpaces each statement,
      and drops empty fragments. Non-empty input always yields at least one
      statement.
    status: completed
    dependencies: []
    acceptance_criteria:
      - "splitStatements splits on ; at end of line only; a mid-line ; is not a split point"
      - "Each returned statement has its terminating ; stripped and is whitespace-trimmed"
      - "Empty/whitespace-only fragments dropped; non-empty input yields >=1 statement; CRLF handled like LF"
      - "Table-driven tests in split_test.go cover: single, two/three statements, trailing ;, mid-line ;, blank lines, CRLF, whitespace-only fragments"
      - "New file (if any) carries the Neo4j copyright header"
    completed_at: 2026-05-29T09:30:00Z

  - id: task-002
    title: 'Add single-transaction batch execution path in connect.go'
    description: |
      Add a batch execution path mirroring the single-statement seam pattern in
      neo4j-cli/query/connect.go: a runStatementsResponseFn test seam defaulting
      to runStatementsResponseImpl, a runStatementsResponse dispatcher that wraps
      errors via categorizeBoltError, and runStatementsWithMode unwrapping into
      []*queryResult. runStatementsResponseImpl opens one session and runs one
      ExecuteRead/ExecuteWrite whose work callback loops tx.Run -> Collect ->
      Consume per statement (reusing coerceDriverValue); any error aborts so the
      managed transaction rolls back automatically.
    status: completed
    dependencies: []
    acceptance_criteria:
      - "runStatementsResponse/runStatementsResponseImpl/runStatementsWithMode added, mirroring the single-statement helpers"
      - "All statements run inside one managed transaction (ExecuteRead when readOnly, ExecuteWrite otherwise); one *queryResponse collected per statement in order"
      - "Errors are categorised once via categorizeBoltError at the dispatch boundary"
      - "runStatementsResponseFn package var exists as a test seam"
      - "Unit tests assert batch ordering and that an error from one statement surfaces (rollback is driver-side)"
    completed_at: 2026-05-29T10:05:00Z

  - id: task-003
    title: 'Add multi-result rendering (PrintBodyMaps + renderResults)'
    description: |
      Add commonoutput.PrintBodyMaps(cmd, cfg, items []ResponseData, fields
      [][]string) to common/output/output.go reusing ResolveOutput/printTable/
      printToon: json -> MarshalIndent of the slice (array of envelopes), toon ->
      marshal the slice, table -> loop printTable with a blank line between
      blocks. Add renderResults(cmd, cfg, results []renderResult) to
      neo4j-cli/query/output.go: len==1 uses the existing PrintBodyMap path
      (byte-identical to today), len>1 delegates to PrintBodyMaps.
    status: completed
    dependencies: []
    acceptance_criteria:
      - "PrintBodyMaps renders json as an array of envelopes, toon as the array form, table as stacked blocks separated by a blank line"
      - "renderResults len==1 produces output byte-identical to the current single-statement output"
      - "renderResults len>1 delegates to PrintBodyMaps with per-result columns"
      - "Tests in common/output/output_test.go and neo4j-cli/query/output_test.go cover json/table/toon for multiple results"
      - "make fmt-check and make lint clean for touched files"
    completed_at: 2026-05-29T10:40:00Z

  - id: task-004
    title: 'Register --atomic flag and refactor runQuery for multi-statement'
    description: |
      Register a persistent --atomic bool flag (default false) on the query
      command in neo4j-cli/query/query.go. Refactor runQuery to split the
      resolved Cypher via splitStatements, keep one-time setup (params, embeds,
      conn, password, openDriver) unchanged, then branch: default mode loops
      statements (per-statement EXPLAIN preflight when !--rw, then runStatement/
      runStatementWrite, fail-fast); --atomic mode runs the preflight loop first
      when !--rw then executes the whole batch via runStatementsWithMode. Apply
      per-statement truncation, prefix warnings with "statement N:" only when >1
      statement ran, and render via renderResults.
    status: completed
    dependencies:
      - task-001
      - task-002
      - task-003
    acceptance_criteria:
      - "--atomic persistent bool flag registered with help text describing single-transaction/rollback semantics; allowed with and without --rw"
      - "Default mode: statements run in order, each in its own transaction, fail-fast on first error"
      - "Non---rw mode blocks a write statement via per-statement EXPLAIN preflight with the existing --rw usage error"
      - "--atomic runs all statements through the single-transaction batch path; --param/:embed resolved once and shared"
      - "Single statement (with/without trailing ;) output unchanged; truncation warnings prefixed 'statement N:' only when >1 statement"
      - "run_test.go covers default multi, fail-fast, non-rw write block, --rw multi, --atomic happy path/error, and single-statement-with-trailing-; cases"
    completed_at: 2026-05-29T11:20:00Z

