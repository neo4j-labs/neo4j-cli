    description: |
      PR #187 review (jexp): a local build ran a 41-statement movies.cypher with
      --rw, all data inserted correctly, but the command "outputs 41 empty lines
      (one per input line)". Write statements return no rows so each renders as an
      empty table. Reviewer asks for write statistics (nodes/rels/props
      created/deleted/updated, indexes/constraints created/deleted) per statement,
      cypher-shell style. Root cause: runStatementsResponseImpl (connect.go:657-659)
      captures only summary.QueryType() and discards summary.Counters(). Capture the
      counters and surface a per-statement summary line, ONLY when the statement
      mutates state (Counters.ContainsUpdates()), so pure reads stay byte-identical.
      Thread end-to-end through the BATCH path (single-statement delegates to it):
      add Counters neo4j.Counters to queryResponse; a driver-free writeStats struct +
      nil-safe statsFromCounters(neo4j.Counters) *writeStats; Stats *writeStats on
      queryResult set in runStatementWithMode + runStatementsWithMode; stats *writeStats
      on renderResult threaded via truncateResult. Render: a formatStatsLine printing
      only non-zero counters, emitted ONLY in table mode (commonoutput.ResolveOutput
      == "table") after the table, multi-statement prefixed "statement N: " matching
      the existing truncateResult convention. JSON: add a fifth field
      Stats *jsonStats `json:"stats,omitempty"` (snake_case tags) to renderResult.MarshalJSON,
      nil when stats==nil || !ContainsUpdates — omitempty on a nil pointer keeps the
      existing {columns,rows,truncated,arrays_truncated} read envelope byte-identical.
      Keep stats out of cobra help text so no skill-bundle regeneration is needed.
    status: completed
    dependencies: []
    acceptance_criteria:
      - "runStatementsResponseImpl captures summary.Counters() into queryResponse; single-statement path inherits it via delegation"
