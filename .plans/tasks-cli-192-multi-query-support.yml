      - "JSON output adds a 'stats' object only when the statement ContainsUpdates; read JSON stays exactly {columns,rows,truncated,arrays_truncated} (regression-locked in output_test.go)"
      - "Tests cover statsFromCounters (nil-safe), formatStatsLine wording, write vs read seam responses (fakeCounters helper)"
      - "make test, make fmt-check, make lint all clean"
