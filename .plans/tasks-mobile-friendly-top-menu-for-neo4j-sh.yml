# IMPORTANT — this branch is a feature branch off `gh-pages`. It contains only
# website files (index.html at repo root, install.sh, install.ps1, etc.) plus
# this `.plans/` directory. There is NO `AGENTS.md`, no Go code, no Makefile,
# no `make test` / `make lint` / `make fmt-check` here. The "feedback loop" for
# every task in this file is VISUAL: open `index.html` in a browser and verify
# the acceptance criteria. The hone-run iteration prompt's reference to
# "AGENTS.md feedback commands" does NOT apply here — skip that step and rely
# on the visual checks described in each task's acceptance_criteria.
#
# All implementer edits target a single file: `index.html` at the worktree
# root (NOT `gh-pages/index.html` — the worktree's working directory IS the
# gh-pages branch layout).

tasks:
  - id: task-001
    title: "Add hamburger button HTML and nav id wiring to header"
    description: |
      Edit `index.html` (worktree root) to add the hamburger button and the
      `id="topNav"` attribute on the existing `<nav class="top-nav">`. Locate
      the nav by grepping for `<nav class="top-nav">` (not by line number —
      line numbers drift). The new
      `<button class="icon-btn nav-toggle" id="navToggle">` MUST be inserted
      immediately after the existing theme toggle button's closing `</button>`
      (find by `id="themeToggle"`) and before the closing `</div>` of
      `.container.inner`. Document order after the edit: brand -> nav ->
      theme toggle -> hamburger. The button uses two SVG glyphs
      (`.open` three-line hamburger, `.close` X) and ARIA attributes
      (`aria-controls="topNav"`, `aria-expanded="false"`,
      `aria-label="Open menu"`). Do not touch any other markup.

      Use the exact HTML from the PRD's "Concrete HTML to add" section.
    status: completed
    dependencies: []
    acceptance_criteria:
      - "`index.html` opens cleanly in a browser with no console errors"
      - "`<nav class=\"top-nav\" id=\"topNav\">` carries the id attribute on its opening tag"
      - "A new `<button class=\"icon-btn nav-toggle\" id=\"navToggle\">` exists immediately after the theme toggle button's closing tag, before the closing `</div>` of `.container.inner`"
      - "The new button has `aria-label=\"Open menu\"`, `aria-controls=\"topNav\"`, `aria-expanded=\"false\"`, and contains two SVGs with classes `open` (three horizontal lines) and `close` (X)"
      - "`git diff` shows changes confined to the `<header class=\"top\">` block of `index.html` (no edits elsewhere)"
    completed_at: 2026-05-15T10:30:00Z

  - id: task-002
    title: "Add responsive mobile-nav CSS block to index.html"
    description: |
      Append the responsive header CSS block inside the existing `<style>`
      tag, after the existing header rules end. Locate the insertion point by
      grepping for the comment `/* ---------- Hero ---------- */` — insert the
      new block immediately BEFORE that comment, so it sits next to the other
      header rules. The block contains: (a) default rules hiding
      `.nav-toggle` and toggling its open/close SVGs via `aria-expanded`,
      and (b) a `@media (max-width: 640px)` block that shrinks header
      `.inner` gap to 8px, hides `.brand-tag`, shows `.nav-toggle`, and turns
      `nav.top-nav` into a `position: absolute` full-width dropdown bar
      (`left: 16px; right: 16px`) that is hidden by default and shown when
      `.open` is present. Use the exact CSS from the PRD's "Concrete CSS to
      add" section verbatim. Reuse existing CSS variables (`--bg`, `--border`,
      `--shadow-overlay`) — no new variables.
    status: completed
    dependencies:
      - task-001
    acceptance_criteria:
      - "New CSS block is inserted immediately before the `/* ---------- Hero ---------- */` comment in `index.html`"
      - "The block contains exactly one `@media (max-width: 640px)` rule"
      - "Mobile dropdown is positioned `top: 56px; left: 16px; right: 16px` (full-width bar, NOT right-aligned with a fixed min-width)"
      - "`.brand-tag` is hidden under the 640px breakpoint via `display: none`"
      - "At 1024px viewport the header renders with four inline nav links and `labs` tag visible, no hamburger — pixel-identical to current production"
      - "At 375px viewport the hamburger button is visible, the four nav links are hidden, the `labs` tag is hidden, and there is no horizontal scrollbar"
    completed_at: 2026-05-15T10:45:00Z

  - id: task-003
    title: "Add mobile-nav toggle JS to existing script block"
    description: |
      Append the mobile-nav toggle JS to the existing `<script>` block in
      `index.html`, immediately after the "Sticky header shadow" section.
      Locate the insertion point by grepping for the `onScroll();` call that
      follows the sticky-header listener — insert the new block immediately
      after that line and before the `// ---------- Toast ----------` comment.
      Use the exact JS from the PRD's "Concrete JS to add" section verbatim.
      The JS wires the hamburger click to toggle `.open` on `#topNav` and
      `aria-expanded` / `aria-label` on `#navToggle`; closes on link click,
      outside click, and Escape. Guard with `if (navToggle && topNav)` so the
      script still loads safely if the markup ever drifts. No IIFE wrapper —
      match the flat style of the existing theme-toggle and sticky-header
      blocks above it.
    status: completed
    dependencies:
      - task-002
    acceptance_criteria:
      - "New JS block is appended after the `onScroll();` call (immediately after the Sticky-header-shadow section) and before the `// ---------- Toast ----------` comment"
      - "The block starts with `// ---------- Mobile nav toggle ----------` and uses the same flat (no-IIFE) style as the theme-toggle block above it"
      - "Clicking the hamburger toggles `.open` on `#topNav` and updates `aria-expanded` + `aria-label` on `#navToggle`"
      - "Clicking a link inside the dropdown closes the dropdown"
      - "Clicking outside both `#topNav` and `#navToggle` closes the dropdown"
      - "Pressing Escape closes the dropdown"
      - "No console errors when the page loads (verified in Chrome DevTools console)"
    completed_at: 2026-05-15T11:00:00Z

