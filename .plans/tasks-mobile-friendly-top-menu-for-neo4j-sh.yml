  - id: task-005
    title: "Reflow installer bar into two-row grid on mobile"
    description: |
      Make the install-tabs bar (`<div class="install-tabs" role="tablist">`)
      mobile-friendly by reflowing the six tabs into two full-width rows of
      three on viewports ≤640px (`macOS / Linux / Windows` on row 1,
      `Homebrew / pipx / npm` on row 2). Add the rules INSIDE the existing
      `@media (max-width: 640px)` block in `index.html` (the block introduced
      in task-002), after the `nav.top-nav a { … }` rule, so the header
      rules and installer rules live in the same breakpoint.

      Use the exact CSS from the PRD's "Concrete CSS to add (installer bar)"
      section verbatim. Concretely, add inside the existing `@media (max-width: 640px)` block:

      ```css
        .install-tabs {
          display: flex;
          width: 100%;
          flex-wrap: wrap;
          margin: 0 0 14px;
        }
        .install-tab {
          flex: 1 1 calc(33.333% - 2px);
          justify-content: center;
          padding: 8px 12px;
        }
      ```

      Do NOT add a new @media query, do NOT touch the markup, do NOT touch
      the `data-os` JS handler. Source-of-truth: the document order of the
      six `<button class="install-tab">` elements is already
      `macos, linux, windows, homebrew, pipx, npm` — wrap order falls out
      naturally.
    status: pending
    dependencies:
      - task-004
    acceptance_criteria:
      - "New rules `.install-tabs { … }` and `.install-tab { … }` are appended INSIDE the existing `@media (max-width: 640px)` block (no new @media query added)"
      - "Rules sit AFTER the `nav.top-nav a { padding: 10px 12px; font-size: 14px; }` rule, before the closing brace of the @media block"
      - "`.install-tabs` mobile rule sets `display: flex`, `width: 100%`, `flex-wrap: wrap`, and `margin: 0 0 14px`"
      - "`.install-tab` mobile rule sets `flex: 1 1 calc(33.333% - 2px)`, `justify-content: center`, and `padding: 8px 12px`"
      - "At 375px width the installer bar wraps to two rows of three tabs in order `macOS / Linux / Windows` then `Homebrew / pipx / npm`, both rows visible, no horizontal scrollbar"
      - "At 1024px width the installer bar renders as a single centered `inline-flex` row exactly as today (pixel-identical)"
      - "`git diff` shows changes confined to the existing mobile-nav @media block in `<style>`. No HTML or JS edits."
    completed_at: null

