  - id: task-005
    title: "Implement the gemini embedding provider"
    description: |
      Create `neo4j-cli/query/embed/gemini.go` mirroring `openai.go` in
      shape: unexported `geminiProvider` struct (`cfg Config`,
      `*http.Client`), `newGeminiProvider(cfg) *geminiProvider`, and
      `Embed(ctx, text) ([]float32, error)`. Default base URL is
      `https://generativelanguage.googleapis.com/v1beta`; URL pattern is
      `{base}/models/{model}:embedContent`. Auth header is
      `x-goog-api-key`. Request body shape per REQ-F-024. Always send
      `taskType: "RETRIEVAL_QUERY"`. Response decode reads
      `{embedding:{values:[...]}}`. When `cfg.Dimensions > 0 &&
      cfg.Dimensions != 3072`, L2-normalize the returned vector
      unconditionally before returning. Missing API key returns
      `clierr.NewAuthError` listing `GEMINI_API_KEY`, `GOOGLE_API_KEY`,
      `NEO4J_EMBED_API_KEY`, and the `credential embed add` path. Validate
      base URL via `urlcheck.ValidateRemoteURL`. Non-2xx returns a wrapped
      `gemini: HTTP <code>: <snippet>` error reading up to 4 KiB of body.
      Add the `case ProviderGemini: return newGeminiProvider(cfg), nil`
      branch to `New` in `embed.go`. Create `gemini_test.go` with
      `httptest.NewServer` table-driven cases (happy path, dimensions
      omitted when 0, missing key, non-2xx, normalization triggers when
      dims != 3072).
    status: completed
    dependencies:
      - task-003
    acceptance_criteria:
      - "`gemini.go` exists with `geminiProvider`, `newGeminiProvider`, and `Embed`"
      - "URL, header, and request body match REQ-F-022/023/024"
      - "`taskType` is always `RETRIEVAL_QUERY`"
      - "Response is decoded from `{embedding:{values:[...]}}`"
      - "L2-normalization fires only when `Dimensions > 0 && Dimensions != 3072`"
      - "Missing API key returns `clierr.AuthError` listing the env chain"
      - "Non-2xx returns a wrapped error with up-to-4KiB body snippet and no key leakage"
      - "`New` has a `case ProviderGemini` that returns `newGeminiProvider(cfg)`"
      - "`gemini_test.go` exercises the listed cases via `httptest`"
      - "License header present; `make test`, `make fmt-check`, `make lint`, `make license-check` pass"
    completed_at: 2026-05-28T00:00:00Z

  - id: task-006
    title: "Implement the vertex embedding provider"
    description: |
      Create `neo4j-cli/query/embed/vertex.go` for the Vertex AI provider.
      Validation in `Embed` (not `newVertexProvider`) returns
      `clierr.NewUsageError` for empty `VertexProject` or `VertexLocation`,
      naming the corresponding flags and `credential embed add`. URL:
      `https://{location}-aiplatform.googleapis.com/v1/projects/{project}/locations/{location}/publishers/google/models/{model}:predict`.
      `cfg.BaseURL` is intentionally ignored. Request body shape per
      REQ-F-043 (note `task_type` snake_case here, `parameters` omitted
      when `Dimensions == 0`). Auth via `oauth2.TokenSource` from
      `google.FindDefaultCredentials(ctx, "https://www.googleapis.com/auth/cloud-platform")`,
      initialised lazily on first `Embed`. ADC failure returns
      `clierr.NewAuthError` mentioning
      `gcloud auth application-default login` and
      `GOOGLE_APPLICATION_CREDENTIALS`. Add two package-level test seams:
      one to override the token source, one to override the URL host
      prefix (default builds the canonical URL). Response decode reads
      `{predictions:[{embeddings:{values:[...]}}]}`. Do NOT normalize
      output. Add the `case ProviderVertex: return newVertexProvider(cfg),
      nil` branch to `New`. Create `vertex_test.go` with `httptest` +
      stubbed token source covering: missing project, missing location,
      missing ADC, happy path, dim-overlay sent in `parameters`, non-2xx,
      no token in error messages.
    status: completed
    dependencies:
      - task-001
      - task-003
    acceptance_criteria:
