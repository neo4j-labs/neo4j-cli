  - id: task-010
    title: "Fix gemini/vertex example model in `credential embed add`"
    description: |
      Both the Gemini and Vertex examples in
      `neo4j-cli/internal/subcommands/credential/embed/add.go` (currently
      around lines 58 and 61) use `--model text-embedding-004`. CLI-193's
      whole point is unblocking users on Document Intelligence graphs that
      embed with `gemini-embedding-001`, and the PRD's acceptance criteria
      name that exact model. These examples ship into `--help` output AND
      into the regenerated skill bundle at
      `neo4j-cli/internal/skill/bundle/references/credential.md:312-315`,
      so they're what every human user and every agent will copy. The
      legacy `text-embedding-004` model won't match the vectors a DI graph
      already stores, so following the example today produces broken
      results. Change both examples to use
      `--model gemini-embedding-001 --dimensions 3072`. Regenerate the
      skill bundle via `go generate ./neo4j-cli/internal/skill/...` so
      `references/credential.md` matches. `TestGenerator_RoundTrip` is
      the gate.
    status: pending
