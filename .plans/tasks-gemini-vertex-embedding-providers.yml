  - id: task-017
    title: "Document gemini env chain + vertex ADC in README API-key section"
    description: |
      `README.md:298-300` describes API-key configuration but only
      references the legacy env vars. Specifically:

      Line 298 (the API-key table row):
      ```
      | API key | (none — see below) | `NEO4J_EMBED_API_KEY`, `OPENAI_API_KEY`, `HF_TOKEN` |
      ```
      Missing: `GEMINI_API_KEY`, `GOOGLE_API_KEY`. Also doesn't note
      that vertex doesn't take an API key at all (uses ADC).

      Line 300 (the precedence prose):
      ```
      API-key precedence (highest first): per-provider OS env
      (`OPENAI_API_KEY` / `HF_TOKEN`) → generic OS env
      (`NEO4J_EMBED_API_KEY`) → per-provider `.env` value → generic
      `.env` value → stored credential `api-key`. Ollama needs no
      API key.
      ```
      Missing: the gemini-specific chain (`GEMINI_API_KEY` →
      `GOOGLE_API_KEY` → `NEO4J_EMBED_API_KEY` → stored). Also missing
      a sentence on Vertex: it does NOT participate in the API-key
      precedence — it authenticates via Application Default
      Credentials (`gcloud auth application-default login` or a
      service-account JSON via `GOOGLE_APPLICATION_CREDENTIALS`).

      A user or agent reading this section today and trying to set up
      Gemini via env-var would not see `GEMINI_API_KEY` documented.

      Fix:

      1. Extend the API-key table row's "Env var" cell to include
         `GEMINI_API_KEY` and `GOOGLE_API_KEY`. Suggested wording:
         ```
         | API key | (none — see below) | `NEO4J_EMBED_API_KEY`,
         `OPENAI_API_KEY`, `HF_TOKEN`, `GEMINI_API_KEY`,
         `GOOGLE_API_KEY` |
         ```

      2. Rewrite the precedence prose so it explicitly covers gemini
         and notes vertex's ADC path. Suggested:
         ```
         API-key precedence (highest first): per-provider OS env
         (`OPENAI_API_KEY` for openai; `HF_TOKEN` for huggingface;
         `GEMINI_API_KEY` then `GOOGLE_API_KEY` for gemini) →
         generic OS env (`NEO4J_EMBED_API_KEY`) → per-provider `.env`
         value → generic `.env` value → stored credential `api-key`.
         Ollama needs no API key. Vertex AI does not use an API key
         at all — it authenticates via Application Default
         Credentials (`gcloud auth application-default login` or
         `GOOGLE_APPLICATION_CREDENTIALS` pointing at a service-
         account JSON), so the API-key precedence rules above do not
         apply when `--embed-provider vertex`.
         ```

      Match the existing tone and concision. This is the
      authoritative reference for env-var setup; agents and humans
      both look at this section first.
