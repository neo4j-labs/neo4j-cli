      - "Token source is lazy; ADC failure returns `clierr.AuthError` with the documented copy"
      - "Token source and URL host prefix are overridable via package-level test seams"
      - "Response decoded from `{predictions:[{embeddings:{values:[...]}}]}`"
      - "No L2-normalization on the response"
      - "`New` has a `case ProviderVertex` that returns `newVertexProvider(cfg)`"
      - "`vertex_test.go` covers the listed cases without touching real ADC"
      - "License header present; full test/lint/fmt/license gates pass"
    completed_at: 2026-05-28T00:00:00Z

