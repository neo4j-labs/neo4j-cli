tasks:
  - id: task-001
    title: "Add telemetry as a valid global config key with bool-value validation"
    description: |
      Wire telemetry into the global config so the documented command
      `neo4j-cli config set telemetry false --rw` stops erroring with
      "invalid config key". Three edits in `common/clicfg/clicfg.go`:
      extend `globalConfig.ValidConfigKeys` to include `"telemetry"`,
      add `Viper.SetDefault("telemetry", true)` in `setDefaultValues`,
      and add a `key == "telemetry"` branch in `GlobalConfig.Set` that
      rejects anything other than `"true"`/`"false"` with
      `clierr.NewUsageError("invalid value for 'telemetry': %s (valid values: true, false)", value)`.
      Update `set_test.go` table with the new rows (true, false, invalid,
      no-rw) and patch the two exact-match JSON `wantOut` blocks in
      `list_test.go` to include `"telemetry": true`.
    status: completed
    dependencies: []
    acceptance_criteria:
      - "`config set --rw telemetry false` persists `telemetry` to config.json and exits 0"
      - "`config set --rw telemetry maybe` returns the usage error and does not mutate config.json"
      - "`config set telemetry false` (no `--rw`) returns the existing write-gate error"
      - "`config get telemetry` returns `true` by default"
      - "`config list` (both default and `--format json` cases in list_test.go) includes `\"telemetry\": true` and the table-format `wantContains` case still passes"
      - "`make test` is green for the touched packages"
    completed_at: 2026-05-12T12:05:00Z

  - id: task-002
    title: "Disable analytics in NewConfig when telemetry is opted out"
    description: |
      Make the persisted `telemetry` value and the `DO_NOT_TRACK=1` env
      var actually disable Mixpanel emission. Extract an unexported
      helper `shouldDisableTelemetry(v *viper.Viper, getenv func(string) string) bool`
      in `common/clicfg/` that returns true when `v.GetBool("telemetry")`
      is false OR `getenv("DO_NOT_TRACK") == "1"` (literal `"1"` only).
      In `clicfg.NewConfig`, immediately after
      `events := analytics.NewAnalytics(...)`, call `events.Disable()` when
      the helper returns true — synchronous, before the `*Config` is
      returned, so the `STARTUP` event fired from `neo4j-cli/main.go` is
      already gated. Add a table-driven `TestShouldDisableTelemetry` in
      `common/clicfg/clicfg_test.go` (or a sibling `telemetry_test.go`)
      covering: default, telemetry=false, DO_NOT_TRACK=1, DO_NOT_TRACK=0,
      DO_NOT_TRACK="", DO_NOT_TRACK=true (only literal "1" disables).
    status: completed
    dependencies:
      - task-001
    acceptance_criteria:
      - "shouldDisableTelemetry returns true for telemetry=false (env unset)"
      - "shouldDisableTelemetry returns true for DO_NOT_TRACK=1 even when telemetry=true"
      - "shouldDisableTelemetry returns false for DO_NOT_TRACK values other than literal `\"1\"` (e.g. `\"0\"`, `\"\"`, `\"true\"`)"
      - "NewConfig calls events.Disable() synchronously before returning when the helper signals disable"
      - "Default install (no telemetry key, no DO_NOT_TRACK) keeps events enabled — no regression in existing event-emission tests"
      - "All `common/clicfg` package tests pass"
    completed_at: 2026-05-12T12:18:00Z

