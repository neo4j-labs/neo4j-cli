    title: "Enrich skill install --help with supported-agents list and Example"
    description: |
      Edit common/skill/install.go to extend the Long field with a trailing
      "Supported agents: " line built from strings.Join(agentNames(), ", ")
      so the help text and the existing formatAgentErr output share a single
      source. Add an Example block (flush-left per the render note in
      CLAUDE.md) showing the no-arg form and the single-agent form. Keep
      Args: cobra.MaximumNArgs(1) untouched; do NOT add ValidArgs. Then add
      TestInstallCmd_HelpListsAgents to common/skill/install_test.go that
      runs --help via the existing newFixture harness and asserts the
      output contains "Supported agents:" plus every name iterated from the
      skill.AGENTS slice.
    status: completed
    dependencies: []
    acceptance_criteria:
      - "install.go Long appends '\\n\\nSupported agents: ' + strings.Join(agentNames(), ', ')"
      - "install.go Example field is set with two flush-left lines (no-arg and 'claude-code') and renders under 'Examples:' in cobra help"
      - "Args stays cobra.MaximumNArgs(1); no ValidArgs field added"
      - "TestInstallCmd_HelpListsAgents exists, runs '--help' through newFixture, asserts 'Supported agents:' substring AND iterates skill.AGENTS asserting each Name appears"
      - "Existing TestInstallCmd_UnknownAgent still passes unchanged"
    completed_at: 2026-05-12T00:00:00Z

