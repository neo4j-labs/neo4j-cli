feature: homebrew-distribution
prd: ./prd-homebrew-distribution.md
created_at: 2026-05-05T00:00:00Z
updated_at: 2026-05-05T00:00:00Z

tasks:
  - id: task-001
    title: "Add brews: block to .goreleaser.yaml"
    description: |
      Append a `brews:` entry to `.goreleaser.yaml` that generates `Formula/neo4j-cli.rb`
      from the existing `neo4j-cli-archive` archives only. Configure `skip_upload: auto`
      so prereleases don't push, set `homepage` / `description` / `license`, and add the
      `install` + `test` blocks required by `brew audit`. Point the repository at
      `neo4j-labs/homebrew-tap` with a token templated from `HOMEBREW_TAP_GITHUB_TOKEN`.
      Verify by running `make snapshot` and inspecting the generated formula.
    status: completed
    dependencies: []
    acceptance_criteria:
      - "`.goreleaser.yaml` has a single `brews:` entry with `name: neo4j-cli` and `ids: [neo4j-cli-archive]` (aura archive excluded)"
      - "`skip_upload: auto`, `directory: Formula`, and a templated `repository.token: \"{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}\"` are all set"
      - "`install` block runs `bin.install \"neo4j-cli\"`; `test` block asserts `neo4j-cli --version` matches the formula version"
      - "`homepage`, `description`, and `license: Apache-2.0` populated on the brew block"
      - "`make snapshot` produces `dist/homebrew/Formula/neo4j-cli.rb` with populated url + sha256 for the four *nix archs (darwin/linux × amd64/arm64)"
    completed_at: 2026-05-05T00:00:00Z

  - id: task-002
    title: "Mint GitHub App token in release.yml for tap push"
    description: |
      Add a new step to `.github/workflows/release.yml` (before `Run GoReleaser`) that
      mints a short-lived GitHub App installation token via `actions/create-github-app-token`,
      scoped to `neo4j-labs/homebrew-tap`. Pass the resulting token into the existing
      `Run GoReleaser` step as `HOMEBREW_TAP_GITHUB_TOKEN` env so the brews block can
      push the formula. The action must be SHA-pinned with a `# v<major>` trailing
      comment per repo convention.
    status: completed
    dependencies:
      - task-001
    acceptance_criteria:
      - "New step `Mint Homebrew tap token` (id: brew-token) sits before `Run GoReleaser` in release.yml"
      - "Step uses SHA-pinned `actions/create-github-app-token@<sha> # v<major>`, with `app-id`, `private-key`, `owner: neo4j-labs`, and `repositories: homebrew-tap`"
      - "Inputs reference new secrets `HOMEBREW_TAP_APP_ID` and `HOMEBREW_TAP_APP_PRIVATE_KEY`"
      - "`Run GoReleaser` step env block exposes `HOMEBREW_TAP_GITHUB_TOKEN: ${{ steps.brew-token.outputs.token }}`"
      - "Workflow YAML still parses; existing macOS signing/notarization env vars on the GoReleaser step are untouched"
    completed_at: 2026-05-05T00:00:00Z

  - id: task-003
    title: "Create distribution/homebrew/README.md"
    description: |
      Add the channel-specific README at `distribution/homebrew/README.md` covering:
      tap repo location (`neo4j-labs/homebrew-tap`), the `brew install
      neo4j-labs/tap/neo4j-cli` user command, that the formula is auto-generated by
      GoReleaser on stable tags only (alphas remain on npm `@alpha`), the local
      dry-run flow via `make snapshot`, and manual recovery (hand-edit the formula
      in the tap; next release overwrites). Also list the prerequisite GitHub App
      + secrets so a future maintainer can rebuild the auth path.
    status: completed
    dependencies: []
    acceptance_criteria:
      - "File `distribution/homebrew/README.md` exists with sections for: tap location, user install, release cadence (stable-only), local dry-run, manual recovery, auth prerequisites"
      - "Documents that prereleases don't push (skip_upload: auto) and links to npm @alpha for opt-in alpha access"
      - "Lists the `HOMEBREW_TAP_APP_ID` + `HOMEBREW_TAP_APP_PRIVATE_KEY` secrets and the App's required scope (`contents: write` on `neo4j-labs/homebrew-tap`)"
      - "Cross-links back to `RELEASING.md` and `.goreleaser.yaml` so readers can trace the wiring"
    completed_at: 2026-05-05T00:00:00Z

  - id: task-004
    title: "Update RELEASING.md to reflect Homebrew shipping"
    description: |
      Drop Homebrew from the "Future channels (pip, Homebrew)" sentence in
      `RELEASING.md`. Add a row to the "What gets released" table for the
      `neo4j-cli` Homebrew formula (channel: `neo4j-labs/homebrew-tap`, driven by
      GoReleaser, gated on stable). Add `HOMEBREW_TAP_APP_ID` and
      `HOMEBREW_TAP_APP_PRIVATE_KEY` to the "Required secrets" table with their
      consumer (`release.yml`) and purpose (mint tap-push token).
    status: completed
    dependencies:
      - task-001
      - task-002
      - task-003
    acceptance_criteria:
      - "`Future channels` line no longer mentions Homebrew (only `pip` remains, or the line is removed if pip alone)"
      - "`What gets released` table has a row for the `neo4j-cli` Homebrew formula → tap → GoReleaser"
      - "`Required secrets` table lists `HOMEBREW_TAP_APP_ID` and `HOMEBREW_TAP_APP_PRIVATE_KEY` with `release.yml` as the consumer"
      - "Cross-link to `distribution/homebrew/README.md` from the See also / channel section"
    completed_at: 2026-05-05T00:00:00Z

  - id: task-005
    title: "Refresh Homebrew callout in distribution/npm/README.md"
    description: |
      Update `distribution/npm/README.md` lines 228–231 (currently framing Homebrew
      as a future channel that should use GoReleaser's `brews:` block) to reflect
      that Homebrew is now shipping. Replace the placeholder with a one-liner
      pointing at `distribution/homebrew/README.md`.
    status: completed
    dependencies:
      - task-003
    acceptance_criteria:
      - "Lines 228–231 (or their post-edit equivalent) no longer say Homebrew is future / not implemented"
      - "Callout links to `distribution/homebrew/README.md`"
      - "No other distribution-channel content in the npm README is altered (scoped diff)"
    completed_at: 2026-05-05T00:00:00Z

  - id: task-006
    title: "Add neo4j-cli changelog entry for Homebrew install path"
    description: |
      Add an unreleased changelog entry under `.changes/unreleased/` for project
      `neo4j-cli` only (Homebrew distributes the super-CLI; `aura-cli` is unaffected),
      kind `Minor`, body covering the new `brew install neo4j-labs/tap/neo4j-cli`
      install path. Use `make changelog` if available, otherwise hand-author per the
      `<project>-<Kind>-<YYYYMMDD>-<HHMMSS>.yaml` convention documented in CLAUDE.md.
    status: completed
    dependencies:
      - task-001
    acceptance_criteria:
      - "One YAML file in `.changes/unreleased/` with `project: neo4j-cli`, `kind: Minor`, and an RFC3339 `time:` field"
      - "Body mentions the install command (`brew install neo4j-labs/tap/neo4j-cli`) so users see it in the release notes"
      - "No `aura-cli` entry created (Homebrew is a neo4j-cli-only channel)"
      - "Filename matches `neo4j-cli-Minor-<YYYYMMDD>-<HHMMSS>.yaml`"
    completed_at: 2026-05-05T14:16:57Z
