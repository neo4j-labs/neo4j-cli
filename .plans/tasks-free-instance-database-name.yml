tasks:
  - id: task-001
    title: "Add databaseName helper to instance create"
    description: |
      Add a private helper function `databaseName(instanceType, username string) string`
      in the instance subcommand package. It returns `username` when `instanceType == "free-db"`
      AND `username != "neo4j"`, and returns `"neo4j"` in all other cases. This encapsulates
      the detection logic cleanly and makes it independently testable.
    status: completed
    dependencies: []
    acceptance_criteria:
      - "Helper returns the username when instanceType is \"free-db\" and username is not \"neo4j\""
      - "Helper returns \"neo4j\" when instanceType is \"free-db\" and username is \"neo4j\""
      - "Helper returns \"neo4j\" for any non-free instance type regardless of username"
      - "Function is private and lives in the instance subcommand package (credential_helpers.go or a new helper file)"
    completed_at: 2026-05-08T00:00:00Z

  - id: task-002
    title: "Use databaseName helper in create.go credential storage"
    description: |
      Replace the hardcoded `"neo4j"` database name argument in the `cfg.Credentials.Dbms.Add`
      call in `create.go` with a call to the new `databaseName` helper. Pass the instance type
      (from the CLI flag or the API response map) and the username extracted from the API response.
      No other logic in create.go should change.
    status: completed
    dependencies:
      - task-001
    acceptance_criteria:
      - "The hardcoded string \"neo4j\" is replaced with databaseName(...) at the Add call site"
      - "instanceType and username are both sourced from values already available at the call site (no new API calls)"
      - "No other credential storage logic is modified"
      - "make build produces a working binary"
    completed_at: 2026-05-08T00:05:00Z

  - id: task-003
    title: "Update and extend tests for database name logic"
    description: |
      Update the existing free-db test fixture in `create_test.go` to use a non-`"neo4j"` username
      in the mocked API response, and add `helper.AssertCredentialsValue` assertions for the stored
      database name. Add table-driven test cases covering: free-db with non-"neo4j" username (uses
      username), free-db with "neo4j" username (uses "neo4j"), and a non-free type (always "neo4j").
    status: completed
    dependencies:
      - task-002
    acceptance_criteria:
      - "Existing TestCreateFreeInstance (or equivalent) asserts stored databaseName equals the non-\"neo4j\" username"
      - "A test case covers free-db where the API returns username \"neo4j\" and asserts databaseName is \"neo4j\""
      - "A test case covers a non-free type (e.g. professional-db) and asserts databaseName is always \"neo4j\""
      - "Tests are table-driven where multiple cases are added"
      - "make test passes with no failures"
    completed_at: 2026-05-08T00:15:00Z

