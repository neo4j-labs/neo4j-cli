    title: "Centralize Scrub in common/debug; aura scrub delegates"
    description: |
      Add exported `func Scrub(s string) string { return output.StripControl(clievents.RedactText(s)) }`
      to common/debug/debug.go with imports of common/clievents and common/output.
      Refactor the local `scrub` in neo4j-cli/aura/internal/api/debug.go to a
      one-line delegate `return debug.Scrub(s)`, leaving the debugW seam,
      SetDebugWriterForTest, and [aura-debug] prefixes untouched.
    status: pending
    dependencies: []
    acceptance_criteria:
      - "common/debug.Scrub exists and returns output.StripControl(clievents.RedactText(s))"
      - "No import cycle: package compiles (go build ./common/debug/...)"
      - "aura api scrub delegates to debug.Scrub; aura api tests still pass unchanged"
      - "go test ./common/debug/... ./neo4j-cli/aura/internal/api/... passes"

  - id: task-002
    title: "Docker client: debug field, newClient(bool), debugW seam, emit in runEnv"
    description: |
      In neo4j-cli/internal/subcommands/docker/client.go add a `debug bool` field to
      execClient; change newClient() to newClient(debug bool) setting the field; keep
      NewDeployClient() no-arg returning newClient(false). Add `var debugW io.Writer =
      os.Stderr` plus standalone emit helpers (writing via debug.Scrub) using prefixes
      "[docker-debug] > " and "[docker-debug] < ": invocation line (scrubbed+redacted
      argv) then env var NAMES only (split each KEY=VALUE on first '=', never the value);
      result line "exit <code> elapsed <dur>" with code via errors.As(*exec.ExitError)
      else -1. Capture start time before cmd.Run() and wire the guarded (`if c.debug`)
      emit calls before/after cmd.Run() in runEnv. Add `time` import. Add an
      export_test.go exposing SetDebugWriterForTest(t, w) mirroring aura.
    status: pending
    dependencies:
      - task-001
    acceptance_criteria:
      - "newClient(debug bool) sets execClient.debug; NewDeployClient() -> newClient(false)"
      - "runEnv emits invocation + env-key-names + exit/elapsed only when c.debug is true"
      - "Env VALUES never emitted; only names; argv passes through redactArgs + debug.Scrub"
      - "debugW seam defaults to os.Stderr and is overridable via SetDebugWriterForTest"
      - "Package compiles; off-path (debug=false) emits nothing"

