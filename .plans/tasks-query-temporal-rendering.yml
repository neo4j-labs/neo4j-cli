  - id: task-004
    title: "Code-judo: collapse Node/Relationship/Path branches in coerce.go to delegate to the map case"
    description: |
      Stellar review flagged structural duplication in `neo4j-cli/query/coerce.go`:
      the `dbtype.Node`, `dbtype.Relationship`, and `dbtype.Path` branches each
      open-code the same `for k, v := range props { props[k] = coerce(v) }` loop
      that already exists in the `map[string]any` case. Four inlined copies of
      the same map-walk.

      Refactor the three branches to delegate back to the recursion. Because
      `Props` is a `map[string]any` (reference type), calling
      `coerceDriverValue(val.Props)` routes to the existing map case and
      mutates the same underlying map. Inside `Path`, recurse on each
      `val.Nodes[i]` / `val.Relationships[i]` to delegate to the Node /
      Relationship branches in turn:

      ```go
      case dbtype.Node:
          coerceDriverValue(val.Props)
          return val
      case dbtype.Relationship:
          coerceDriverValue(val.Props)
          return val
      case dbtype.Path:
          for i := range val.Nodes {
              coerceDriverValue(val.Nodes[i])
          }
          for i := range val.Relationships {
              coerceDriverValue(val.Relationships[i])
          }
          return val
      ```

      Existing `coerce_test.go` cases for Node / Relationship / Path Props
      must continue to pass unchanged — this is a pure structural rewrite,
      no behaviour change.

      Also in `coerce_test.go`, fix the type-assertion idiom in the three
      graph-entity subtests (`Node`, `Relationship`, `Path`): replace
      `assert.True(t, ok, ...)` with `require.True(t, ok, ...)` so that a
      failed type assertion short-circuits instead of panicking on the
      subsequent `.Props[...]` access. Add `require` to the import list if
      it isn't already there.
    status: pending
    dependencies:
      - task-001
    acceptance_criteria:
      - "`coerce.go` `Node` and `Relationship` cases each call `coerceDriverValue(val.Props)` instead of inlining a map walk"
      - "`coerce.go` `Path` case recurses on `val.Nodes[i]` and `val.Relationships[i]` instead of inlining map walks"
      - "Behaviour-preserving: every existing test in `coerce_test.go` passes unchanged"
      - "Type assertions in `coerce_test.go` `Node` / `Relationship` / `Path` subtests use `require.True` instead of `assert.True`"
      - "`go test ./neo4j-cli/query/...` green"
      - "`make fmt-check` and `make lint` clean"
    completed_at: null

