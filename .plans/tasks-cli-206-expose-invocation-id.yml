feature: cli-206-expose-invocation-id
prd: ./prd-cli-206-expose-invocation-id.md
created_at: 2026-06-02T00:00:00Z
updated_at: 2026-06-02T00:00:00Z

tasks:
  - id: task-001
    title: 'Add opt-in ResponseHeader capture to api.RequestConfig'
    description: |
      Add a `ResponseHeader *http.Header` field to `RequestConfig` in
      `neo4j-cli/aura/internal/api/api.go`. In `MakeRequest`, right after
      `defer res.Body.Close()` and before the `IsSuccessful` branch, populate
      it (`*config.ResponseHeader = res.Header`) when non-nil so the header is
      available on every return path (success, embedded-error,
      handleResponseError). Do not change the MakeRequest signature.
    status: completed
    dependencies: []
    acceptance_criteria:
      - "RequestConfig has a documented `ResponseHeader *http.Header` field"
      - "MakeRequest assigns res.Header to *config.ResponseHeader when non-nil, above all return paths"
      - "MakeRequest signature is unchanged; the 44 other callers compile and behave identically"
      - "make build succeeds"
    completed_at: 2026-06-02T12:00:00Z

  - id: task-002
    title: 'Add per-response header support to the test mock'
    description: |
      Extend the Aura test mock so responders can set response headers. Add a
      `headers map[string]string` field to the `response` struct in
      `requesthandlermock.go`, add a fluent
      `WithResponseHeader(key, value string) *requestHandlerMock` setter that
      targets the most-recently-added response, and update the handler in
      `auratesthelper.go` (NewRequestHandlerMock) to call `res.Header().Set(k,v)`
      for each header before `res.WriteHeader(...)`.
    status: completed
    dependencies: []
    acceptance_criteria:
      - "response struct carries a headers map; WithResponseHeader sets it on the last response"
      - "NewRequestHandlerMock handler writes configured headers before WriteHeader"
      - "Responses created without headers behave exactly as before"
      - "Existing testutils-dependent tests still pass"
    completed_at: 2026-06-02T13:00:00Z

  - id: task-003
    title: 'Read and surface the invocation id in aura agent invoke'
    description: |
      In `neo4j-cli/aura/internal/subcommands/agent/invoke.go`, pass
      `ResponseHeader: &respHeader` to MakeRequest and read
      `invocationID := respHeader.Get("X-Agent-Invocation-Id")`. Add a
      `withInvocationID(err, id)` helper that wraps as `%w (invocation id: <id>)`
      and is a no-op when err is nil or id is empty. Wrap the 403 forbidden
      error, the generic `return err` path, and the invokeApplicationError
      return at its call site. Give `printInvokeResult` an `invocationID string`
      param: append ` | Invocation ID: <id>` to the text/table stats line when
      id is non-empty, and for `--format json` write `Invocation ID: <id>` to
      stderr (cmd.PrintErrln) while keeping stdout pure JSON.
    status: completed
    dependencies:
      - task-001
    acceptance_criteria:
      - "withInvocationID returns the original error unchanged when err is nil or id is empty"
      - "403, generic-error, and application-error paths append (invocation id: <id>) when present"
      - "text/table success stats line shows | Invocation ID: <id> only when id is non-empty"
      - "--format json keeps stdout valid JSON and prints the id to stderr when present"
      - "No empty (invocation id: ) or stray stderr line when the header is absent"
    completed_at: 2026-06-02T14:00:00Z

  - id: task-004
    title: 'Add and extend invoke_test.go coverage for the invocation id'
    description: |
      In `invoke_test.go`, set `X-Agent-Invocation-Id` on the mock responses and
      assert the id appears in: the 403 forbidden error, the `type:"error"`
      application error, and the success stats line. Add a new regression test
      for the HTTP-200 `status:"SUCCESS"` response that nests a `*_tool_result`
      error block in content[] (the tool-failure case) asserting the id still
      prints. Add a `--format json` success test asserting the id goes to stderr
      while stdout stays valid JSON, and a header-absent test asserting nothing
      extra is printed.
    status: completed
    dependencies:
      - task-002
      - task-003
    acceptance_criteria:
      - "403, application-error, and table-success tests assert the invocation id is present"
      - "New HTTP-200 tool-failure test asserts the id prints on the success path"
      - "JSON success test asserts id on stderr and valid-JSON stdout"
      - "Header-absent test asserts no (invocation id: ) and no stderr id line"
      - "make test passes"
    completed_at: 2026-06-02T15:00:00Z

  - id: task-005
    title: 'Add changelog entry and run final gates'
    description: |
      Add a user-facing changelog entry via
      `changie new --projects neo4j-cli --kind Minor --body "aura agent invoke now prints the agent invocation id on success and failure for support/tracing"`
      (confirm the kind against `.changie.yaml`; hand-author the unreleased YAML
      if changie is unavailable). Then run the final gates.
    status: completed
    dependencies:
      - task-004
    acceptance_criteria:
      - "A changie unreleased entry exists for neo4j-cli describing the change (kind Minor)"
      - "make test passes"
      - "make fmt-check passes"
      - "make lint passes"
    completed_at: 2026-06-02T17:42:00Z
