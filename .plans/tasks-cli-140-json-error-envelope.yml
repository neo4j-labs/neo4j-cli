  - id: task-005
    title: "Seed .WithResource on the 404 path in aura/internal/api/response.go"
    description: |
      In neo4j-cli/aura/internal/api/response.go around lines 79–91 (the http.StatusNotFound branch), chain
      .WithResource(resourceType, resourceID) onto the NewNotFoundError(...) return. Implement a small helper that
      parses res.Request.URL.Path into segments, skips the version segment (`v1`), and treats the next segment as the
      plural resource name (singularised — e.g. "instances" → "instance", "tenants" → "tenant") and the segment after
      that as the resource id. Unrecognised or shorter paths leave both fields empty so omitempty hides them. Add a
      unit test in the same package that exercises a /v1/instances/{id} 404 fixture and asserts the resulting
      *CLIError has ResourceType="instance" and ResourceID="{id}".
    status: completed
    dependencies:
      - task-001
    acceptance_criteria:
      - "404 branch in response.go chains .WithResource(...) onto NewNotFoundError; helper for URL→(type,id) parse exists and is unit-tested"
      - "Recognised paths (instances, tenants, snapshots, dataapi/graphql, etc — at least instances and tenants covered) produce singular ResourceType + correct ResourceID"
      - "Unrecognised paths leave ResourceType and ResourceID empty so omitempty drops them from the envelope"
      - "New table-driven test exercises a /v1/instances/{id} 404 fixture and asserts the typed *CLIError fields"
      - "No other error sites in response.go are modified in this task"
    completed_at: 2026-05-18T16:45:00Z

