tasks:
  - id: task-001
    title: "Extend clierr.CLIError type, constructors, and closed-enum table"
    description: |
      In common/clierr/error.go, add the five new fields to CLIError (CodeName, Retryable, ResourceType, ResourceID, Suggestion).
      Change the eight NewXError constructor return types from error to *CLIError; each constructor populates CodeName and
      Retryable from a single closed-enum lookup table keyed by exit code. Add a canonical exported table (clierr.CodeNames
      map[int]string and a parallel CodeDescriptions map, or a single map[int]struct{Name, Description string}) covering
      exit codes 1–8. Add the two fluent setters WithResource(t, id) and WithSuggestion(s) returning *CLIError. Extend
      common/clierr/error_test.go (create if missing) with table-driven tests per constructor asserting Code + CodeName +
      Retryable; cover the setters and the chain pattern.
    status: completed
    dependencies: []
    acceptance_criteria:
      - "CLIError struct in common/clierr/error.go has the five new fields with documented types"
      - "All eight constructors return *CLIError; existing callers that did `return clierr.NewXError(...)` from error-returning funcs still compile (verified by make test)"
      - "clierr.CodeNames (and descriptions) is exported and contains all eight entries (fatal_error, usage_error, not_found, auth_error, conflict, validation_error, rate_limited, upstream_error)"
      - "WithResource and WithSuggestion mutate the receiver in place and return *CLIError for chaining"
      - "Table-driven tests assert (Code, CodeName, Retryable) for each constructor; setter tests cover chained mutation"
      - "make test passes; no new lint findings"
    completed_at: 2026-05-18T14:30:00Z

  - id: task-002
    title: "Add envelope types and Render function in common/clierr/render.go"
    description: |
      Create common/clierr/render.go exporting: Envelope struct (Error EnvelopeBody json:"error"), EnvelopeBody struct
      (Code, ExitCode, Message, ResourceType omitempty, ResourceID omitempty, Suggestion omitempty, Retryable — all
      snake_case JSON tags), BuildEnvelope method on *CLIError, and Render(err error, stdout, stderr io.Writer,
      format string). Render branches: format=="json" emits JSON envelope to stdout + one-line summary
      `Error: <message> (exit <N>)` to stderr; any other format writes the same one-line summary to stderr plus an
      optional second `<suggestion>` line when set, stdout untouched; untyped err is wrapped as fatal_error / exit 1
      via errors.As; nil err is a no-op. Add common/clierr/render_test.go with table-driven golden tests covering every
      CodeName in both modes, the untyped-error fallback, the empty-format fallback, and the suggestion-line behaviour.
    status: completed
    dependencies:
      - task-001
    acceptance_criteria:
      - "common/clierr/render.go exposes Envelope, EnvelopeBody, (*CLIError).BuildEnvelope(), and Render(err, stdout, stderr, format)"
      - "JSON-mode output is valid JSON with the documented shape; optional fields use omitempty; retryable is always present"
      - "Plaintext mode appends ` (exit <N>)` to the error line and writes suggestion on a second line when set"
      - "Untyped errors render as fatal_error / exit 1 in both modes"
      - "Golden tests cover every CodeName across both modes plus the untyped + empty-format edge cases"
      - "BuildEnvelope has no I/O — verified by being callable in tests without writers"
    completed_at: 2026-05-18T15:00:00Z

  - id: task-003
    title: "Wire clierr.Render in neo4j-cli/main.go and set SilenceErrors on root"
    description: |
      In neo4j-cli/app/app.go (NewCmd), set cmd.SilenceErrors = true on the root command so cobra no longer prints its
      default error line. Leave SilenceUsage alone — the existing silenceUsageOnError hook in common/flags/ handles
      RunE-side usage suppression. In neo4j-cli/main.go, insert clierr.Render(err, os.Stdout, os.Stderr,
      cfg.Global.Format()) between cfg.Events.Flush() (line 67) and os.Exit(exitCodeFor(err)) (line 70). Keep
      exitCodeFor exactly as-is. Extend neo4j-cli/main_test.go with at least one happy-path JSON test and one plaintext
      test driving clierr.Render via bytes.Buffer (mirrors the TestExitCodeFor extraction pattern).
    status: completed
    dependencies:
      - task-002
    acceptance_criteria:
      - "Root cobra command in neo4j-cli/app/app.go has SilenceErrors=true; SilenceUsage unchanged"
      - "main.go calls clierr.Render between Events.Flush() and os.Exit; exitCodeFor signature/logic unchanged"
      - "main_test.go covers JSON-mode and plaintext-mode rendering with byte-exact assertions for at least one CodeName each"
      - "Running ./bin/neo4j-cli (rebuilt) on a failing command no longer produces cobra's double `Error:` print"
      - "make test passes"
    completed_at: 2026-05-18T15:30:00Z

