tasks:
  - id: task-001
    title: "Add common/clicfg/envfile package with exported Parse helper"
    description: |
      Create `common/clicfg/envfile/envfile.go` exporting `Parse(fs afero.Fs, path string) (vals map[string]string, present map[string]bool, err error)`. Opens via `fs.Open`, parses with `github.com/subosito/gotenv`. Returns the raw key/value map AND a per-key presence map so callers can distinguish `KEY=` from missing-key (gotenv collapses both to `""`). Key filtering is the caller's responsibility — the helper is domain-neutral.
      Wrap open errors as `clierr.NewUsageError("--file %q: %s", path, err.Error())` to preserve the user-facing error shape from CLI-75. Apply the Neo4j copyright header to both new files.
      Add `common/clicfg/envfile/envfile_test.go` with table-driven cases: happy path, comments + blank lines, `KEY=` (empty value, presence map true), missing path (wrapped error), unrecognised keys (still returned — caller filters). Use `afero.NewMemMapFs` for the fs.
      Implements PRD REQ-F-006, REQ-NF-003, REQ-NF-007.
    status: completed
    dependencies: []
    acceptance_criteria:
      - "`common/clicfg/envfile/envfile.go` exists with the exported `Parse` signature from REQ-F-006"
      - "Open errors return a `clierr.NewUsageError(\"--file %q: %s\", path, err.Error())` (preserves CLI-75 shape)"
      - "Presence map distinguishes `KEY=` from missing-key (test covers both)"
      - "`common/clicfg/envfile/envfile_test.go` covers happy path, comments/blanks, empty value, missing path, unrecognised keys"
      - "Both new files carry the Neo4j copyright header; `make test`, `make fmt-check`, `make lint`, `make license-check` all green"
    completed_at: 2026-05-13T11:20:00Z

