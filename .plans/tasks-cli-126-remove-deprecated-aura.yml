  - id: task-010
    title: "Clarify changelog body re: tenant get → project get nuance"
    description: |
      The changelog entry at `.changes/unreleased/neo4j-cli-Minor-20260528-112749.yaml`
      currently reads: "Use 'aura project list', 'aura organization get', and
      '--project-id' instead." That phrasing aligns with the historical CLI-99
      deprecation message but misses the nuance we discovered during this
      feature: `aura tenant get` actually hit the `/tenants/{id}` v1 endpoint
      (configuration-list payload), which is the same endpoint `aura project
      get` calls today. `aura organization get` hits a different endpoint
      (`/organizations/{orgID}` v2) and returns only `{id, name}`. The in-code
      prose in `instance/create.go` correctly directs configuration-list users
      at `'project get'`, so the changelog should too. Update the body to name
      `project get` as the replacement (drop or supplement `organization get`).
      One reasonable wording: "Use 'aura project list', 'aura project get'
      (configuration details) or 'aura organization get' (org metadata), and
      '--project-id' instead." Keep the body single-line to match changie's
      output convention.
    status: pending
    dependencies: []
    source: review
    acceptance_criteria:
      - "`.changes/unreleased/neo4j-cli-Minor-20260528-112749.yaml` body names `project get` as the (primary) replacement for `tenant get`."
      - "Body remains single-line; YAML still parses (no schema regressions)."
      - "`make test` passes."
    completed_at: null

