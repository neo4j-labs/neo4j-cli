  - id: task-008
    title: "Wire security workflow to install vendored plugin + setup-go + govulncheck"
    description: |
      Update `.github/workflows/claude-review-security.yml`:
      (a) Add a `setup-go` step BEFORE the action step. Use
          `actions/setup-go@<pinned-SHA>` and `go-version-file: go.mod`
          so the toolchain tracks repo state.
      (b) Add a step that runs
          `go install golang.org/x/vuln/cmd/govulncheck@latest`. The
          `golang-security` skill requires `govulncheck` on PATH.
      (c) Add to the `anthropics/claude-code-action` step:
          ```
          plugin_marketplaces: |
            ./
          plugins: |
            cc-skills-golang@neo4j-cli-review
          ```
      (d) Extend `--allowed-tools` in `claude_args` with `Skill` and
          `Bash(govulncheck:*)`. No other broadening — do NOT add
          general `Bash`, `Write`, `Edit`, `curl`, or `wget`.
      Do not touch `claude-review-conventions.yml`. Two files stay
      symmetric except for this addition.
    status: completed
