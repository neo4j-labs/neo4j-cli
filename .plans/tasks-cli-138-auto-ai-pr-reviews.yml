      - "Triggers, `if:` author filter, permissions, action SHA, and `claude_args` exactly match `claude-review-security.yml` modulo prompt path and error message"
      - "Prompt body is loaded from `.github/prompts/claude-review-conventions.md`"
      - "Workflow `name:` is `Claude Review — Conventions`"
      - "Enforce-verdict step exits non-zero on `fail` or missing verdict file with a conventions-specific error message"
    completed_at: 2026-05-18T00:00:00Z

  - id: task-005
    title: "Smoke-test on a PR: green path, both red paths, draft skip, bot skip, mention coexistence"
    description: |
      End-to-end smoke test on a real PR after the workflows merge to
      main. Verify: (1) opening a clean non-draft PR from
      `@oskarhane` triggers both checks, posts a summary, finishes
      green ✅ within 5 minutes; (2) opening a draft PR triggers
      neither workflow until `ready_for_review`; (3) opening a PR from
      `dependabot[bot]` / `renovate[bot]` (or any non-allowlisted
      account) shows both workflows skipped (no billable run);
      (4) introducing a deliberate convention violation (e.g. new leaf
      cobra command with no `Example:` field) flips the conventions
      check to red ❌ with an explanatory inline comment;
      (5) introducing a deliberate security smell (e.g.
      `exec.Command("sh", "-c", userInput)`) flips the security check
      to red ❌; (6) pushing a second commit to the same PR produces a
      **new** review comment (not an edit); (7) commenting `@claude
      help` on the test PR still triggers the existing `claude.yml`
      mention workflow. Also run `make test && make fmt-check && make
      lint` locally before merge — should be no-op since no Go code is
      touched.
    status: completed
    dependencies:
      - task-003
      - task-004
    acceptance_criteria:
      - "Clean test PR shows both checks green ✅ with a `✅ no issues found` summary line"
      - "Draft PR shows neither workflow running; promoting to ready-for-review triggers both"
      - "Bot or non-allowlisted-author PR shows both workflows skipped (Actions tab confirms no run)"
      - "Convention-violation PR shows conventions check red ❌ with an inline comment naming the violation"
      - "Security-smell PR shows security check red ❌ with an inline comment naming the smell"
      - "Second push to the test PR produces a second review comment (timeline shows two distinct top-level summaries)"
      - "`@claude help` comment on the test PR still triggers `claude.yml` (existing mention behaviour preserved)"
      - "`make test`, `make fmt-check`, `make lint` pass locally on the branch"
    status_note: |
      Live-PR smoke test deferred to the human — the workflows only fire
      after merge to main, so this iteration cannot legitimately execute
      the 7 acceptance scenarios. Static validation + local gates done;
      runbook at .plans/smoke-test-cli-138.md covers all 7 scenarios.
    completed_at: 2026-05-18T09:21:04Z
