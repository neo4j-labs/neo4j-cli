      flagged issues". Author filter, triggers, permissions, action
      SHA, tool allowlist, and verdict mechanism are identical to
      task-003. Two files are intentional — each is its own check on
      the PR, independently re-runnable.
    status: completed
    dependencies:
      - task-002
      - task-003
    acceptance_criteria:
