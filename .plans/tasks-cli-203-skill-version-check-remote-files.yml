      - task-003
    acceptance_criteria:
      - "All affected skill-package tests updated and passing"
      - "New regression test proves available version comes from SKILL.md, not plugin.json"
      - "TestCheckCmd_AllOk_ExitsZero and TestCheckCmd_CatalogSkillDrift pass under the new sourcing"
      - "make test passes"
    completed_at: 2026-06-03T00:00:00Z
