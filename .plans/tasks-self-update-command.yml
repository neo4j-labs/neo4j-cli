      skip drafts, filter by `--pre-releases` using
      `golang.org/x/mod/semver.Prerelease`, and return the head match. Build
      asset URLs per the GoReleaser pattern (`neo4j-cli_<VER>_<TitleOS>_<unameArch>.<ext>`)
      with OS map (linux→Linux, darwin→Darwin, windows→Windows) and arch map
      (amd64→x86_64, 386→i386, arm64→arm64) mirroring
      `distribution/installation-scripts/install-neo4j-cli.sh`. Honor
      `GH_TOKEN` / `GITHUB_TOKEN` for ratelimit relief — never echo the token
      in errors. Expose package-level test seams (`var apiBaseURL`, `var dlBaseURL`,
      `var goosFn`, `var goarchFn`) per AGENTS.md "Package-level test seams".
    status: pending
    dependencies:
      - task-002
    acceptance_criteria:
      - "Stable-only filter excludes any tag where `semver.Prerelease(tag) != \"\"`"
      - "Returns a clear sentinel/error when stable filter yields zero releases (consumed by REQ-F-006 in RunE)"
      - "Asset URL builder produces correct paths for linux/amd64, darwin/arm64, windows/amd64 (table-driven test)"
      - "`--version <tag>` path validates input via `semver.IsValid` and rejects `..`, `/`, `\\`, NUL, and shell metacharacters before any URL interpolation"
      - "Tests use `httptest.NewServer` with a 2s safety timeout on handlers and a 5s test-side fallback per AGENTS.md"
      - "`GH_TOKEN` / `GITHUB_TOKEN` is never present in any error string (assertion in tests)"
    completed_at: null

  - id: task-004
    title: "Install-method detection + rich passthrough hint message"
    description: |
      Add `install_method.go` (and test) detecting whether the running binary
      lives under a known package-manager prefix. Resolve `os.Executable()`
      via `filepath.EvalSymlinks` and match against Homebrew (`/opt/homebrew/`,
      `/usr/local/Cellar/`, `/home/linuxbrew/.linuxbrew/`), npm
      (`/node_modules/@neo4j-labs/cli/` substring), pipx
      (`~/.local/pipx/venvs/neo4j-cli/`, `~/.local/share/pipx/`,
      `~/.local/bin/neo4j-cli` symlinking into pipx), uv tool
      (`~/.local/share/uv/tools/neo4j-cli/`). Build the rich hint per REQ-F-010a:
      pkg-mgr upgrade command, install-script command
      (`curl -sSfL https://neo4j.sh/install.sh | bash`), and an OPTIONAL
      uninstall command marked with the PATH-order rationale. Expose a test seam
      for `os.Executable()`.
    status: pending
    dependencies:
      - task-002
    acceptance_criteria:
      - "Returns `homebrew` / `npm` / `pipx` / `uv` / `binary` from a table-driven test covering each prefix shape on linux + darwin + windows path forms"
      - "Symlink resolution: a symlink at `~/.local/bin/neo4j-cli` pointing into a pipx venv is detected as `pipx` (not `binary`)"
      - "Hint message includes ALL THREE blocks: pkg-mgr upgrade command, install-script command, AND optional uninstall command with the PATH-order rationale comment"
      - "Detection is hermetic: tests use the `os.Executable()` seam and `t.Setenv(\"HOME\", ...)` per AGENTS.md hermetic-test rules"
      - "Path matching uses OS-native separators (no mixed `/` + `\\` on Windows) per AGENTS.md Windows CI gotchas"
    completed_at: null

  - id: task-005
    title: "Atomic swap: extract, SHA256 verify, rename (with zip-slip guard)"
    description: |
      Add `swap.go` (and test) implementing the download → verify → extract →
      atomic rename flow. Download archive in-memory (or to a temp file in
      the same dir as the running binary), download the matching
      `_checksums.txt` from the same release, compute SHA256 and abort on
      mismatch BEFORE any extraction. Extract `tar.gz` (linux/darwin) or `zip`
      (windows) into the target dir. Reject any entry whose cleaned path
      escapes the destination (zip-slip / tar-slip), reject symlinks /
      hardlinks / devices — only regular files allowed. Write to
      `<current>.new` with mode 0755, then `os.Rename` to `<current>`. On
      Windows: best-effort `os.Remove` of pre-existing `<current>.old`,
      rename current to `.old`, rename new in. On any error after the
      original is renamed away, attempt to restore.
    status: pending
    dependencies:
      - task-002
    acceptance_criteria:
      - "Tampered checksum (a single byte flipped in the test fixture) causes the swap to abort with a clear error, no file written outside the temp dir"
      - "tar / zip entry with `../escape` path is rejected with the offending path in the error; no file written outside the destination"
      - "Symlink / hardlink / device entries in the archive are rejected"
      - "Successful swap leaves the new binary at the original path, mode 0755, with the temp `<current>.new` removed"
      - "Windows code path: pre-existing `<current>.old` is removed at start; rename-current-to-`.old`-then-rename-new dance succeeds (covered via `runtime.GOOS` test seam)"
      - "Restore-on-error: simulated rename failure mid-swap restores the original binary at the original path"
    completed_at: null

  - id: task-006
    title: "Implement RunE flow integrating release / install-method / swap"
    description: |
      Wire the three modules together in `update.go` `RunE`. Order:
      (1) handle `app.Version == \"dev\"` with friendly message + exit 0;
      (2) detect install method, on match (and no `--force`) print the rich
      hint and exit 0;
      (3) resolve target version (release lookup or `--version <tag>`);
      (4) compare via `semver.Compare` — already up-to-date returns 0,
      no-stable-yet returns 0 with the `--pre-releases` hint, downgrade
      requires explicit `--version`;
      (5) `--check` branches: print + exit 1 if newer available, exit 0 if
      up-to-date — never download;
      (6) otherwise: download, verify, swap. Plumb the `channel` and
      `install_method` fields for output (set by upstream modules).
    status: pending
    dependencies:
      - task-003
      - task-004
      - task-005
    acceptance_criteria:
      - "`app.Version == \"dev\"` exits 0 without any HTTP call (assertion via test seam)"
      - "Stable-only filter with zero matching releases prints the `--pre-releases` hint and exits 0"
      - "`--check` with a newer version available exits 1; with equal versions exits 0; never invokes the swap path"
      - "`--version v9.9.9` (semver-valid, but no such tag) surfaces a clear `tag not found` error and exits 1"
      - "Downgrade attempt without `--version` (current > latest) is rejected with a clear error"
      - "`--force` bypasses install-method detection and proceeds to swap (verified via test seam)"
    completed_at: null

