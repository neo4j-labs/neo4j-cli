  - id: task-027
    title: "Single-action categories take no positional; grant/deny/revoke load drops the redundant action token (REQ-F-040, REQ-NF-011)"
    status: completed
    completed_at: 2026-06-24T21:15:00Z
    source: extend-prd
    description: |
      Dogfooding: `grant load load` repeats "load" for no information — the load category has exactly
      one action (LOAD). Make a category whose action set has exactly one member take NO positional;
      the sole action is implied. This is a general, data-driven rule keyed off the action count in
      validActions/categoryMeta (today only `load` qualifies), mirroring how task-023 dropped the
      redundant --on-dbms.

      In `newCategoryCmd` (helpers.go), branch on `len(actionsForCategory(cat)) == 1`:
      - single-action: `Use: meta.name` (no `<action>`), `Args: cobra.NoArgs`, no `ValidArgs`; RunE
        resolves the sole action directly via `actionsForCategory(cat)[0]` instead of reading args[0].
        `grant load --cidr ... --role ... --rw` is the only valid form; `grant load load` must be
        rejected as an unexpected argument (NoArgs), NOT accepted.
      - multi-action: unchanged (`Use: "<name> <action>"`, `cobra.ExactArgs(1)`, `ValidArgs`).

      Knock-on changes (all keyed off the action count, so general):
      - Cross-category hint (REQ-F-030): when the TARGET category is single-action, omit the action
        token so `grant property load` → "load is a LOAD privilege; use 'admin privilege grant load'"
        (not "... grant load load"). Cleanest: a small `categoryInvocation(cat[, action])` helper
        returning `meta.name` for single-action categories and `meta.name + " " + kebabAction(action)`
        otherwise, used by the hint.
      - `actionSummary` (REQ-F-037): return empty for a single-action category so the Short carries no
        redundant `(load)` suffix — `Short` reads "Grant a LOAD privilege to a role".
      - Example renderer (REQ-F-033/renderCategoryExample): do not append the action token for a
        single-action category — emit `grant load --cidr 127.0.0.1/32 --role analyst --credential local
        --rw` (and the deny/revoke variants), not `grant load load ...`. Adjust categoryMeta[load]
        exampleAction/exampleFlags handling accordingly.

      Behavior for the LOAD privilege Cypher itself is unchanged (still `GRANT LOAD ON ALL DATA` /
      `GRANT LOAD ON CIDR "<cidr>"`). Re-run `go generate ./neo4j-cli/internal/skill/...` (the load
      Use/Short/Example change) and commit the regenerated bundle.

      Tests: structure test asserts the single-action (`load`) command has `cobra.NoArgs` and nil
      ValidArgs while multi-action categories keep one positional + ValidArgs (update the REQ-NF-006
      union check so load contributes its action without a positional). Behavioural test asserts
      `grant load --cidr 127.0.0.1/32 --role analyst --rw` and `grant load --role analyst --rw` emit
      the right Cypher with no positional, and `grant load load` errors. Test the cross-category hint
      to `load` omits the trailing action.
    dependencies:
      - task-026
    acceptance_criteria:
      - "A single-action category (load) command sets `Use: \"<name>\"` (no `<action>`), `Args: cobra.NoArgs`, and nil `ValidArgs`; RunE resolves the sole action directly"
      - "`grant load --cidr 127.0.0.1/32 --role analyst --rw` emits `GRANT LOAD ON CIDR \"127.0.0.1/32\" TO analyst`; `grant load --role analyst --rw` emits `GRANT LOAD ON ALL DATA TO analyst`; `grant load load` returns a non-zero usage error"
      - "Multi-action categories are unchanged (one positional + ValidArgs); the rule is data-driven from the action count, not hardcoded to load"
      - "Cross-category hint pointing at load omits the action (`grant property load` → `... use 'admin privilege grant load'`, no trailing `load`)"
      - "The load `Short` has no `(load)` action-summary suffix; the load `Example` (grant/deny/revoke) is `... grant load --cidr ...` with no action token"
      - "Skill bundle regenerated; `make test`, `make fmt-check`, `make lint`, `make license-check`, `TestGenerator_RoundTrip` all pass clean"

  - id: task-028
    title: "Model the single-action-category property once instead of re-deriving len(actionsForCategory)==1 at five call sites"
    status: completed
    completed_at: 2026-06-24T22:15:00Z
    source: review
    description: |
      End-of-feature audit (Priority 3, non-blocking — "missing model" smell). The concept "this
      category's action is implied, not a positional" is a real property of a category, but it
      currently lives as an ad-hoc `len(actionsForCategory(cat)) == 1` count check (and its
      `actions[0]`/`!= 1` variants) re-derived as a special-case branch in five functions in
      helpers.go: newCategoryCmd, categoryLong, categoryInvocation, actionSummary, and
      renderCategoryExample. Each evaluation of actionsForCategory does a full validActions map scan +
      sort, and every new surface that cares about single-action categories must remember to add the
      same branch (task-027 had to touch all five) — debt likely to become permanent.

      Code-judo move: compute the action set (and the single-action property) ONCE per category and
      hang it off the model, so the help/exec paths read it rather than re-deriving it. Preferred shape
      (per the auditor): give categoryInfo a derived field — a resolved `actions []string` (kebab
      and/or canonical) and/or a `singleAction bool` — computed once at package init from validActions
      (e.g. in an init() or a sync.Once-populated map, keeping validActions the single source of
      truth). Then categoryLong / categoryInvocation / actionSummary / renderCategoryExample read
      `meta.singleAction` (and the precomputed actions) instead of each calling
      `len(actionsForCategory(cat))`. newCategoryCmd already resolves it once; have it use the model
      field too. The goal: the "single-action" concept appears in the model exactly once and the other
      sites read it; the four independent recomputations are deleted.

      Constraints: validActions stays the single source of action→category (do not hand-duplicate the
      action lists in categoryMeta); the derived data must be computed from validActions, not
      independently maintained. No behavior change — emitted Cypher, help text, Short/Long/Example, and
      cross-category hints stay byte-identical; existing tests pass unchanged. Pure refactor.
    dependencies:
      - task-027
    acceptance_criteria:
      - "The single-action property (and the resolved per-category action set) is computed once from validActions and stored on the category model (e.g. a derived categoryInfo field populated at init), not re-derived inline"
      - "categoryLong, categoryInvocation, actionSummary, renderCategoryExample, and newCategoryCmd read the modelled property instead of each calling `len(actionsForCategory(cat))`; the redundant recomputations are removed"
      - "validActions remains the single source of action→category; the derived data is computed from it, not hand-maintained"
      - "No behavior change: emitted Cypher, Short/Long/Example, and cross-category hints are byte-identical; all existing privilege tests pass unchanged"
      - "`make test`, `make fmt-check`, `make lint`, `make license-check`, `TestGenerator_RoundTrip` all pass clean (no bundle drift)"

