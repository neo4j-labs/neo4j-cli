      Fix: render the action via `kebabAction(action)` in that message so it reads
      `action set-label requires --node-label` (and `action remove-label requires --node-label`).
      This is the only `requires`-style error that inlines an action keyword today; no other category
      arm needs changing. The cross-category hint (REQ-F-030) and unknown-action enumeration
      (REQ-F-039) already use kebab and stay as-is.

      Tests: update/extend the `buildPrivilegeCypher` unit case for `labelScoped` with no `--node-label`
      to assert the message contains `set-label` (and a `remove-label` case) and does NOT contain
