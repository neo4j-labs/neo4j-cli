  - id: task-025
    title: "Collapse buildPrivilegeCypher to single-layer validation; delete unreachable cross-scope guards and redundant normalizeAction"
    status: completed
    completed_at: 2026-06-24T20:15:00Z
    source: review
    description: |
      End-of-feature audit (BLOCKING, two findings sharing one root). The per-category command tree
      now makes cross-scope flag/action combinations structurally unrepresentable, yet
      buildPrivilegeCypher still re-validates them — leaving a wall of dead guard branches plus a
      redundant re-normalization. Two facts from the current code close the loop: (1)
      resolveCategoryAction returns a canonical action ONLY when validActions[canonical] == cat, so the
      action reaching buildPrivilegeCypher via runPrivilegeMutation is always a member of the invoked
      command's category; (2) each category leaf registers ONLY categoryMeta[cat].flags (newCategoryCmd
      loop → registerPrivilegeFlag, the sole flag-binding site), so no category registers a flag
      outside its own scope.

      Cross-referencing the registered-flag sets against the guards, these branches cannot be hit by
      any real invocation and are dead defensive code: the `--cidr` non-load guard; the
      `--on-graph`/`--on-database` mutual exclusion; graphWhole rejecting label/rel/property
      qualifiers; `hasProperty && category != propertyBearer`; every `if hasDatabase` inside the graph
      cases; `database` rejecting `--on-graph`; and `load` rejecting graph/database/label/rel. Only the
      `--node-label`/`--relationship-type` mutual exclusion and labelScoped requiring `--node-label`
      are genuinely reachable. These guards only LOOK tested because the error-path table in
      privilege_helpers_test.go hand-builds illegal privilegeOpts (e.g. action "read" with cidr, "access"
      with properties, "load" with onGraph) — combinations no user can produce; the tests pin behavior
      of unreachable code and mask the dead-ness.

      Second finding (same root): runPrivilegeMutation passes the already-canonical action from
      resolveCategoryAction into buildPrivilegeCypher, which immediately calls normalizeAction →
      canonicalAction AGAIN on an already-canonical string and re-looks-up validActions. The
      re-normalization is a no-op and the `!ok` error branch is unreachable in production.

      Code-judo move (one move, not two): make buildPrivilegeCypher's contract explicit — it receives a
      canonical action already known to belong to a category (pass the resolved category and/or the
      canonical keyword as a precondition from the caller). Then: delete the cross-scope guards and
      their illegal-opts tests; keep only the two reachable in-category rules (label/rel exclusivity,
      label requires `--node-label`); drop the redundant normalizeAction/canonicalAction re-resolution
