  - id: task-013
    title: "Fix WRITE / ALL GRAPH PRIVILEGES: new graphWhole category with no entity clause (REQ-F-023/024)"
    status: completed
    completed_at: 2026-06-23T00:00:00Z
    description: |
      CLI-217 QA (live against Neo4j 2025.10 Enterprise + Aura Business Critical) found that
      `WRITE` and `ALL GRAPH PRIVILEGES` can NEVER be granted: they are in the `graphOnly`
      category, which unconditionally appends `entityClause(...)` (defaulting to `ELEMENTS *`),
      and Neo4j rejects `GRANT WRITE ON GRAPH * ELEMENTS * TO role` with
      `Neo.ClientError.Statement.SyntaxError (Invalid input 'ELEMENTS')`. The correct forms are
      `GRANT WRITE ON GRAPH * TO role` and `GRANT ALL GRAPH PRIVILEGES ON GRAPH neo4j TO role`
      (both verified live; no `ELEMENTS`/`NODES`/`RELATIONSHIPS` segment allowed).
      Add a new `graphWhole` constant to the `actionCategory` enum in helpers.go and re-map
      `WRITE` and `ALL GRAPH PRIVILEGES` in `validActions` from `graphOnly` to `graphWhole`.
      `TRAVERSE`, `CREATE`, `DELETE` stay on `graphOnly` (they correctly accept the entity clause —
      verified live). Add a `case graphWhole:` arm to `buildPrivilegeCypher` that: rejects
      `--on-database`/`--on-dbms` (same as graphOnly); rejects `--node-label`,
      `--relationship-type`, and `--property` with a usage error like
      `"<ACTION> does not accept node-label, relationship-type, or property qualifiers"`; and emits
      `normalized + " ON GRAPH " + cypherIdentifier(graph)` with NO property clause and NO entity
      clause (default graph `*`). Order the new qualifier check so it fires before the generic
      `--property` guard at the top of the function (or fold it in) to keep messages sensible.
    source: review
    dependencies:
      - task-012
    acceptance_criteria:
      - "`actionCategory` has a `graphWhole` constant; `WRITE` and `ALL GRAPH PRIVILEGES` map to it in `validActions`; `TRAVERSE`/`CREATE`/`DELETE` remain `graphOnly`"
      - "`buildPrivilegeCypher` emits `GRANT WRITE ON GRAPH *` and ``GRANT ALL GRAPH PRIVILEGES ON GRAPH `neo4j` `` with no `ELEMENTS *`/entity/property clause (fragment before the leaf appends ` TO $role`)"
      - "`graphWhole` action with `--node-label`, `--relationship-type`, or `--property` returns a usage error (exit code 2)"
      - "`graphWhole` action with `--on-database` or `--on-dbms` returns a usage error (only `--on-graph` allowed)"
      - "Unit cases for WRITE and ALL GRAPH PRIVILEGES assert the server-valid Cypher (no ELEMENTS); the previously bug-encoding assertion at privilege_helpers_test.go is replaced (REQ-F-028)"
      - "`make test`, `make fmt-check`, `make lint`, `make license-check` pass clean; `TestGenerator_RoundTrip` passes (no bundle drift)"

  - id: task-014
    title: "Re-categorise LOAD to its real ON ALL DATA / ON CIDR syntax with a --cidr flag (REQ-F-025)"
    status: completed
    completed_at: 2026-06-23T00:00:00Z
    description: |
      CLI-217 QA found `LOAD` is fundamentally miscategorised: it is NOT a graph privilege. Its
      grammar is `GRANT LOAD ON ALL DATA TO role` or `GRANT LOAD ON CIDR "<cidr>" TO role` (both
      verified live; `GRANT LOAD ON GRAPH * ... TO role` fails with a SyntaxError). As currently
      classified (`graphOnly` → `ON GRAPH`), LOAD is unreachable.
      Add a `load` constant to the `actionCategory` enum and re-map `LOAD` to it in `validActions`
      (remove it from graphOnly). Add a `--cidr <value>` flag to the shared flag set
      (`addPrivilegeFlags`) and a `cidr string` field to `privilegeOpts`. Add a `case load:` arm to
      `buildPrivilegeCypher` that rejects every scope flag (`--on-graph`/`--on-database`/`--on-dbms`)
      and every qualifier (`--node-label`/`--relationship-type`/`--property`) with a usage error, and
      emits `LOAD ON ALL DATA` when `opts.cidr == ""` or `LOAD ON CIDR "<cidr>"` when set. The CIDR
      value is rendered as a double-quoted Cypher string literal (NOT cypherIdentifier/backticks);
      escape embedded `"` and backslash for safety, consistent with task-011 hardening. Add a guard
      near the top of buildPrivilegeCypher: `opts.cidr != "" && category != load` → usage error
      (`"--cidr is only valid for the LOAD action"`).
    source: review
    dependencies:
      - task-013
    acceptance_criteria:
      - "`actionCategory` has a `load` constant; `LOAD` maps to it; LOAD is removed from `graphOnly`"
      - "A `--cidr` flag exists on grant/deny/revoke and `privilegeOpts` has a `cidr` field"
      - "`buildPrivilegeCypher` emits `LOAD ON ALL DATA` by default and `LOAD ON CIDR \"127.0.0.1/32\"` when `--cidr 127.0.0.1/32` is supplied (CIDR is a double-quoted string literal, not backtick-quoted)"
      - "A `load` action with any of `--on-graph`/`--on-database`/`--on-dbms`/`--node-label`/`--relationship-type`/`--property` returns a usage error (exit code 2)"
