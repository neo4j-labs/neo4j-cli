    description: |
      Second-QA-pass finding 1. The `labelScoped` arm of `buildPrivilegeCypher` in `cypher.go` returns
      `clierr.NewUsageError("action %s requires --node-label", action)` with `action` being the
      canonical `validActions` key (`SET LABEL` / `REMOVE LABEL`). The user typed `set-label` /
      `remove-label`, so the error echoes a Cypher keyword the user never used — the same
      Cypher-vs-CLI mismatch REQ-F-039 fixed for enumerated action lists, here applied to a single
