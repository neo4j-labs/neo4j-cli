  - id: task-015
    title: "Emit all --node-label values for SET LABEL / REMOVE LABEL (REQ-F-026)"
    description: |
      CLI-217 QA found `SET LABEL` / `REMOVE LABEL` silently drop every `--node-label` after the
      first: the `labelScoped` arm inlines only `opts.nodeLabels[0]`. `--node-label` is a repeatable
      (StringArray) flag and Neo4j accepts a comma list — `GRANT SET LABEL Person, Movie ON GRAPH
      neo4j TO role` is valid (verified live) — so additional labels vanish with no error or warning.
      Change the `labelScoped` arm in `buildPrivilegeCypher` to emit every label, comma-joined, each
      backtick-escaped via the existing helper:
      `normalized + " " + strings.Join(escapeIdentifiers(opts.nodeLabels), ", ") + " ON GRAPH " + cypherIdentifier(graph)`.
      The existing `--node-label`/`--relationship-type` mutual-exclusion and the
      "requires --node-label" guard are unchanged; `--relationship-type` and `--property` remain
      invalid for label actions.
    source: review
    dependencies:
      - task-014
    acceptance_criteria:
      - "`labelScoped` emits all `--node-label` values comma-joined, each backtick-escaped (e.g. ``SET LABEL `Person`, `Movie` ``), not just the first"
      - "A single `--node-label` still renders as before (one backtick-quoted label)"
      - "Multi-label unit case asserts ``GRANT SET LABEL `Person`, `Movie` ON GRAPH `neo4j` `` (fragment before ` TO $role`)"
      - "Missing `--node-label` for SET/REMOVE LABEL still returns a usage error; `--relationship-type` with a label action still errors"
