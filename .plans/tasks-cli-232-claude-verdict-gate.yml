tasks:
  - id: task-001
    title: "Baseline shellcheck status of existing .github/scripts/*.sh"
    description: |
      Run `shellcheck -S warning .github/scripts/*.sh` against the two pre-existing
      scripts (`version-to-pep440.sh`, `smoke-test-wheel.sh`), which have never been
      linted. Decide fix-vs-narrow-`# shellcheck disable` for any warning-level finding
      and apply it, so the new `scandir: .github/scripts` CI job does not go red on
      arrival. Resolves the PRD's open question on pre-existing lint status.
    status: completed
    dependencies: []
    acceptance_criteria:
      - "`shellcheck -S warning .github/scripts/*.sh` exits 0 on the existing scripts"
      - "Any suppression is a narrow per-line `# shellcheck disable=SCxxxx` with a reason, never a blanket file-level disable"
      - "No behavioural change to either existing script (verified by reading the diff)"
      - "Findings and the fix-vs-suppress decision are stated in the task notes"
    completed_at: 2026-08-14T12:00:00Z

  - id: task-002
    title: "Add .github/scripts/enforce-claude-verdict.sh with the four-tier gate"
    description: |
      Implement the shared verdict gate per REQ-F-001..REQ-F-009: env-var-only inputs
      (`REVIEW_KIND`, `PR_NUMBER`, `GITHUB_REPOSITORY`, `GH_TOKEN`, optional
      `VERDICT_FILE`), tier 1 verdict file, tier 2 `<!-- claude-verdict: (pass|fail) -->`,
      tier 3 single-marker-line phrase match (fail indicators first), tier 4 fail-closed.
      Comment fetch uses `gh api ... --paginate --slurp` piped to a real `jq` with `--arg`
      (never a shell-interpolated filter), flattening with `.[][]`. Move the workflows'
      long explanatory comments into the script header.
    status: completed
    dependencies: []
    acceptance_criteria:
      - "File committed with mode 100755 (`git ls-files -s` shows 100755), `#!/usr/bin/env bash`, `set -euo pipefail`, `export LC_ALL=C.UTF-8`"
      - "Missing/empty required env var, or missing `gh`/`jq` on PATH, prints a message naming the item and exits 1"
      - "Exit 0 iff resolved verdict is exactly `pass`; every other path emits a `::error::` annotation and exits 1"
      - "Every path logs which tier produced the verdict"
      - "Body handling uses `printf '%s\\n'` (never `echo`), `tr -d '\\r'` before matching, `grep -F` for REVIEW_KIND plus a separate prefix-position check; no `eval`, no unquoted expansion, no regex built from REVIEW_KIND or the body"
      - "`gh api` failure (network, rate limit, 404) yields a clear message and exit 1, not a bare `set -e` abort"
      - "`GH_TOKEN` is never echoed and is passed to `gh` only via the inherited environment"
      - "`shellcheck -S warning` clean; no GNU-only `grep`/`sed` flags (runs under BSD userland on macOS)"
    completed_at: 2026-08-14T12:00:00Z

