    status: completed
    dependencies: []
    acceptance_criteria:
      - "Fixture file(s) exist under `.github/scripts/tests/fixtures/` and contain the real #239 summary body"
      - "The variant used by the regression case has the `✅` removed but the `**Security review:**` marker line otherwise verbatim"
