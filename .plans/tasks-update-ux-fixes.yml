tasks:
  - id: task-001
    title: "Friendly `update check` output + SilenceUsage on update parent"
    description: |
      Implement REQ-F-001..REQ-F-007. Replace the `clierr.NewUsageError(...)` return in the `cmp < 0`
      branch of `runUpdate` (neo4j-cli/internal/subcommands/update/update.go:373-383) with a plain-text
      friendly message and `return nil` so `update check` exits 0 when a newer version is available.
      Add a `buildUpdateCommand(opts runOpts) string` helper that reconstructs the install command from
      opts (`--pre-releases`, `--version <tag>`). Set `cmd.SilenceUsage = true` at the top of
      `runUpdate` after the dev-build short-circuit and `--version` validation so swap-time errors do
      not dump the cobra usage block. Update existing tests in check_test.go (lines 120, 156, 184) and
      update_test.go (lines 183, 213, 553, 995) that currently assert `require.Error` on the
      newer-available branch — flip to `require.NoError` and assert stdout shape.
    status: completed
    dependencies: []
    acceptance_criteria:
      - "`update check --pre-releases` against a newer pre-release prints `New version available: <current> -> <latest>` and `Run \\`neo4j-cli update --pre-releases\\` to install.` and exits 0"
      - "`update check` against latest prints `Already on <version>. No update needed.` and exits 0 (unchanged)"
      - "JSON output for `update check` still emits `check: true`, `updated: false`, etc. (REQ-F-003)"
      - "`update --bogus` still triggers cobra usage (SilenceUsage gate applied AFTER flag validation, per repo convention)"
      - "Existing `require.Error` assertions for newer-available cases flip to `require.NoError` and the new stdout shape is verified"
      - "`make test && make fmt-check && make lint` clean"
    completed_at: 2026-05-10T22:35:00Z

  - id: task-002
    title: "Add 6 test seams, sentinel error types, and dirWritable probe helper"
    description: |
      Plumbing-only task. Add six new test seams to neo4j-cli/internal/subcommands/update/swap.go
      following the existing `var fooFn = realImpl` pattern: `geteuidFn` (`os.Geteuid`), `lookPathFn`
      (`exec.LookPath`), `runCommandFn` (runs an `*exec.Cmd`), `dirWritableFn` (the new probe),
      `tempDirFn` (`os.TempDir`), `stdinIsTTYFn` (uses `golang.org/x/term`). Implement
      `dirWritable(dir string) (bool, error)` that creates a `.neo4j-cli-probe.<rand>` file with
      `O_EXCL | O_CREATE | O_WRONLY` and removes it on success — EACCES/EROFS returns `(false, nil)`,
      other errors propagate. Add two typed sentinel error types: `errSudoUnavailable{dir string}` and
      `errPermissionWindows{dir string}` — both satisfy `error` and expose `Dir()`. Add corresponding
      `withGeteuid`, `withLookPath`, `withRunCommand`, `withDirWritable`, `withTempDir`,
      `withStdinIsTTY` helpers in swap_test.go matching the existing `withSwapGoos` / `withRename`
      shape. No behavior changes yet; the seams and helpers are introduced but not called from any
      production path.
    status: completed
    dependencies: []
    acceptance_criteria:
      - "Six new seam vars compile and have working production impls; `golang.org/x/term` import added"
      - "`dirWritable` returns (true, nil) for a writable `t.TempDir()` and (false, nil) for a non-writable test dir (chmod 0500 in a unit test)"
      - "`errSudoUnavailable` and `errPermissionWindows` implement `error` and carry the directory; `errors.As` recovers them"
      - "Six `withFoo` helpers swap and restore the seam via `t.Cleanup`; no test goroutine leaks"
      - "No production call site invokes the new seams yet (introduction-only step); `make test` still passes"
      - "`make fmt-check && make lint` clean"
    completed_at: 2026-05-10T23:10:00Z

  - id: task-003
    title: "Implement planSwap pre-flight elevation decision"
    description: |
      Implement REQ-F-009 and REQ-F-010 — the planning step that decides whether the swap proceeds
      directly or via sudo. Add `planSwap(abs string) (swapPlan, error)` to
      neo4j-cli/internal/subcommands/update/swap.go where `swapPlan` is `{elevate bool; tmpDir
      string}`. Ordering: probe writability with `dirWritableFn(filepath.Dir(abs))`; if writable
      return `{elevate: false, tmpDir: filepath.Dir(abs)}`. Non-writable + windows → return
      `errPermissionWindows{dir}`. Non-writable + `geteuidFn() == 0` → surface the raw permission
      error (sudo cannot help when already root). Non-writable + (`lookPathFn("sudo")` errors OR
      `lookPathFn("install")` errors OR `stdinIsTTYFn() == false`) → return `errSudoUnavailable{dir}`.
      Otherwise → `{elevate: true, tmpDir: tempDirFn()}`. Unit tests live in swap_test.go and use the
      seams from task-002 to drive every branch without touching the host filesystem.
    status: completed
    dependencies:
      - task-002
    acceptance_criteria:
      - "Writable dir returns `{elevate: false, tmpDir: filepath.Dir(abs)}` — `lookPathFn` / `geteuidFn` / `stdinIsTTYFn` NOT called"
      - "Non-writable + windows returns `errPermissionWindows{dir}` regardless of sudo/TTY"
      - "Non-writable + linux + `geteuidFn → 0` returns a non-sentinel permission error (NOT `errSudoUnavailable`)"
      - "Non-writable + linux + `lookPathFn(\"sudo\") → exec.ErrNotFound` returns `errSudoUnavailable{dir}`"
      - "Non-writable + linux + `stdinIsTTYFn → false` returns `errSudoUnavailable{dir}`"
      - "Non-writable + linux + sudo available + install available + TTY returns `{elevate: true, tmpDir: tempDirFn()}`"
      - "`make test && make fmt-check && make lint` clean"
    completed_at: 2026-05-10T20:44:04Z

  - id: task-004
    title: "Implement elevatedSwap sudo install runner with argv safety"
    description: |
      Implement REQ-F-013 and REQ-NF-001 — the sudo-install execution helper. Add
      `elevatedSwap(ctx context.Context, src, dst string) error` to
      neo4j-cli/internal/subcommands/update/swap.go. Pre-validate `src` and `dst`: both MUST pass
      `filepath.IsAbs`, not start with `-`, and not contain NUL bytes — reject with an error before
      exec. Resolve sudo and install paths via `lookPathFn("sudo")` / `lookPathFn("install")` (these
      were already proven available by planSwap, but lookup again here for safety). Build the argv as
      separate `exec.Cmd` args (NO shell): `[sudoPath, installPath, "-m", "0755", src, dst]`. Inherit
      `os.Stdin` / `os.Stdout` / `os.Stderr` so the sudo prompt is interactive. Wrap non-nil errors as
      `fmt.Errorf("sudo install: %w", err)`. Add focused unit tests covering argv shape (via
      `withRunCommand` capturing args) and rejection of malformed paths (NUL, `-` prefix, non-absolute).
    status: pending
    dependencies:
      - task-002
    acceptance_criteria:
      - "Happy-path test asserts captured argv is exactly `[\"/usr/bin/sudo\", \"/usr/bin/install\", \"-m\", \"0755\", <abs src>, <abs dst>]`"
      - "Rejects `src` or `dst` containing NUL with a clear error; `runCommandFn` not invoked"
      - "Rejects `src` or `dst` starting with `-` with a clear error; `runCommandFn` not invoked"
      - "Rejects non-absolute `src` or `dst` with a clear error; `runCommandFn` not invoked"
      - "Wraps `runCommandFn` non-zero exit as `sudo install: <wrapped>` error"
      - "`make test && make fmt-check && make lint` clean"
    completed_at: null

