      - "`*errPermissionWindows` produces the Administrator-shell hint via `clierr.NewFatalError`"
      - "Re-run hint includes `--pre-releases` iff `opts.preReleases`; includes `--version <tag>` iff `opts.version != \"\"`; includes `--force` iff `opts.force`"
      - "Hint uses `cmd.CommandPath()` for the binary name (not hardcoded `neo4j-cli`)"
