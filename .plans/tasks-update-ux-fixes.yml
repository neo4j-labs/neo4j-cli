      `*errPermissionWindows`, return: `cannot write to <dir> (permission denied).\nRe-run from an
      Administrator shell.`. Add helper `buildReRunCommand(cmd *cobra.Command, opts runOpts) string`
      colocated with the existing `buildUpdateCommand` from task-001. Add table-driven tests covering
      the matrix: bare; `--pre-releases`; `--version v0.1.0-alpha.10`; `--force` — each producing the
      documented hint shape.
    status: pending
