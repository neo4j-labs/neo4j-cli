  - id: task-006
    title: "runUpdate sentinel-error recognition and friendly re-run hint"
    description: |
      Implement REQ-F-014 — recognise the two sentinel error types returned from `Swap` and convert
      them into user-friendly fatal-error messages. In `runUpdate` (neo4j-cli/internal/subcommands/
      update/update.go:416-418), wrap the `swapFn` call in `errors.As` checks. For
      `*errSudoUnavailable`, build a re-run hint using `cmd.CommandPath()` plus the active flags from
      `runOpts` (`--pre-releases`, `--version <tag>`, `--force`) and return as `clierr.NewFatalError`.
      Shape: `cannot write to <dir> (permission denied).\nRe-run with sudo:\n\n    sudo
