  - id: task-001
    title: "Add api.ParseRawBody helper for bare-JSON responses"
    description: |
      Add `ParseRawBody(body []byte) ResponseData` to `neo4j-cli/aura/internal/api/response.go`,
      mirroring the existing `ParseBody` (line 403) shape: try `[]map[string]any` first, then
      `map[string]any`, panic if neither matches. This isolates the agent API's bare-JSON
      response handling (no `{"data":...}` envelope) without touching existing call sites.
    status: completed
    dependencies: []
    acceptance_criteria:
      - "`ParseRawBody` is exported from `neo4j-cli/aura/internal/api/response.go` and returns `ResponseData`."
      - "Array body returns via `NewListResponseData`; object body returns via `NewSingleValueResponseData`."
      - "Failure to parse panics with `\"could not parse raw response body\"` (matches existing `ParseBody` shape)."
      - "No existing call sites of `ParseBody` are modified; `make test` still passes."
      - "Copyright header preserved on the file."
    completed_at: 2026-05-19T10:22:53Z

  - id: task-002
    title: "Add output.PrintRawBody helper for bare-JSON responses"
    description: |
      Add `PrintRawBody(cmd, cfg, body, fields)` to `neo4j-cli/aura/internal/output/output.go`,
      mirroring `PrintBody` (line 21). JSON branch: `json.Indent` then `cmd.Println`. Non-JSON
      branch: `PrintBodyMap(cmd, cfg, api.ParseRawBody(body), fields)`. Early-return when body
      is empty. Respects `cfg.Aura.Output()` like the existing `PrintBody`.
    status: completed
    dependencies:
      - task-001
    acceptance_criteria:
      - "`PrintRawBody` is exported from `neo4j-cli/aura/internal/output/output.go`."
      - "Empty body is a no-op."
      - "`cfg.Aura.Output() == \"json\"` prints `json.Indent`-formatted bytes."
      - "Non-JSON output delegates to `PrintBodyMap` with `api.ParseRawBody`."
      - "No existing call sites of `PrintBody` are modified; `make test` still passes."
    completed_at: 2026-05-19T12:30:00Z

