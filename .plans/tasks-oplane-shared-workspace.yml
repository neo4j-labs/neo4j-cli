    completed_at: null

  - id: task-006
    title: 'Verify the no-change surface and annotate the stale tool-allowlist fallback'
    description: |
      Static verification pass over the finished diff, confirming this stayed a scoped
      `.github/`-only change:

      - `actionlint .github/workflows/claude-review-oplane.yml` clean (binary is at
        `/opt/homebrew/bin/actionlint`).
      - Prompt Step 3 (summary comment discover-then-edit) and Step 4 (MCP-unavailable
        failure mode) are untouched.
      - `claude_args`, `--mcp-config`, `continue-on-error: true`, the `if:` gate, the
        `concurrency` block and `permissions:` are all unmodified.
      - Diff touches nothing outside `.github/` and `.plans/`. No `.changes/unreleased/`
        entry (CI-only, no user-facing CLI impact per the AGENTS.md changie rule). No Go
        source, no `go generate`, no skill-bundle diff.

      Separately, record the stale-fallback hazard. The `--allowed-tools` wildcard
      `mcp__oplane__*` already covers `list_threatmodels`, so no `claude_args` change is
      needed. But the predecessor PRD's REQ-F-016 fallback — "if the wildcard does not match
      at runtime, list all six tools explicitly" — enumerates six names that do NOT include
      `list_threatmodels`. If that fallback is ever adopted it must gain
      `mcp__oplane__list_threatmodels`, otherwise a wildcard failure silently disables dedup
      and every push duplicates. (REQ-F-013, REQ-NF-001..005)
    status: pending
    dependencies:
      - task-002
      - task-004
      - task-005
    acceptance_criteria:
      - '`actionlint .github/workflows/claude-review-oplane.yml` reports no findings'
