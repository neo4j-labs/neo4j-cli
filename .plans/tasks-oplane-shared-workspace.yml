      - '`git diff --name-only` against the base shows only paths under `.github/` and `.plans/`'
      - 'No file added under `.changes/unreleased/`; no diff under `neo4j-cli/internal/skill/bundle/`'
      - 'The stale REQ-F-016 fallback list is annotated as needing `mcp__oplane__list_threatmodels`'
    completed_at: null

  - id: task-007
    title: 'Post-merge live-run verification that models land in workspace 4'
    description: |
      NOT auto-implementable — requires a real PR run and, for the final criterion, a second
      human. Tracked here because the PRD's primary acceptance criteria are runtime, not
      static: a green job does not prove the routing worked.

      Baseline established during authoring: `list_threatmodels` for workspace
      `6a246538-76d1-4857-830e-2aad4681d044` returns `[]`, and the four most recent models
      (PRs #232, #238, #233, #237) all carry `"workspace_type": "personal"`. So ANY result in
      workspace 4 proves the change took effect.

      Known wrinkle when smoke-testing from this PR itself (recorded in commit e241c447):
      Anthropic's token exchange refuses to mint a GitHub App token when the workflow file on
      the PR branch differs from `main` (`workflow_not_found_on_default_branch`). A temporary
      `github_token: ${{ secrets.GITHUB_TOKEN }}` override works around it but MUST be
      reverted before merge — with it set the action posts as `github-actions[bot]` instead
      of `claude[bot]`, which breaks the Step 3 discover-then-edit lookup (it filters on
      `.user.login == "claude[bot]"`) and produces a new comment per push instead of an edit.

      Expect one-time cutover cost: personal-workspace models for currently-open PRs will not
      be found by the new workspace-scoped lookup, so the next push to any open PR creates one
      fresh model in workspace 4. That is intended, not a bug.
    status: pending
    dependencies:
      - task-006
    acceptance_criteria:
      - '`list_threatmodels` with `workspace_id=6a246538-76d1-4857-830e-2aad4681d044` returns the PR''s model (baseline was `[]`)'
      - 'The returned model''s `workspace_type` is not `personal`'
      - 'A second push to the same PR leaves exactly one model for that PR — updated, not duplicated'
      - 'The summary comment is edited on the second push, not re-posted'
      - 'The job exits 0 regardless of findings (advisory preserved)'
      - 'A person who is not the OPLANE_PAT owner opens https://gravity.oplane.io/org/neo4j/workspaces/4 and sees the model'
      - 'Any temporary `github_token` smoke-test override has been reverted before merge'
    completed_at: null
