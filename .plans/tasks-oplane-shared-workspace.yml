    status: pending
    dependencies:
      - task-003
    acceptance_criteria:
      - 'Step 1 distinguishes the skill''s connectivity probe from our Step 2 dedup lookup'
      - 'The sentence still attributes `my_recent_threatmodels` to the skill, not to our prompt'
