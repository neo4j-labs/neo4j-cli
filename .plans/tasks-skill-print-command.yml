    status: completed
    completed_at: 2026-05-06T09:35:00Z
    dependencies:
      - task-003
      - task-004
      - task-005
    acceptance_criteria:
      - "make test passes"
      - "make fmt-check passes"
      - "make lint passes"
      - "make license-check passes"
      - "make generate-check passes"
      - "./bin/neo4j-cli skill print | grep -q '{{VERSION}}' succeeds"
      - "./bin/aura-cli skill print | grep -q '{{VERSION}}' succeeds"
      - "./bin/neo4j-cli skill print extra-arg exits non-zero"
