    title: "Add HTTPS insteadOf step to claude-review-security.yml"
    description: |
      Edit `.github/workflows/claude-review-security.yml` to add a new step that
      rewrites `git@github.com:` URLs to `https://github.com/` via `git config --global
      url."https://github.com/".insteadOf "git@github.com:"`. Place the step after
      `Install govulncheck` and before `Load security prompt into env`. Step name:
      `Force HTTPS for github.com git clones`. Include a comment explaining why
      (plugin installer shells out to git clone, runner has no SSH key, public-repo
      HTTPS needs no auth). Do not touch any other step, the marketplace pin, prompts,
      or tool allowlists. Satisfies REQ-F-001.
    status: completed
    dependencies:
      - task-001
    acceptance_criteria:
      - "The new step exists between `Install govulncheck` and `Load security prompt into env` with name `Force HTTPS for github.com git clones`."
      - "The step's `run:` line is exactly `git config --global url.\"https://github.com/\".insteadOf \"git@github.com:\"`."
      - "A comment above the run command explains the SSH-no-key rationale."
      - "`git diff origin/main -- .github/workflows/claude-review-security.yml` shows ONLY the added step (no other changes)."
      - "YAML still parses (`yq '.jobs.\"security-review\".steps[].name' .github/workflows/claude-review-security.yml` lists the new step name)."
    completed_at: 2026-05-18T12:15:00Z

