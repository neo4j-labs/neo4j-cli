tasks:
  - id: task-001
    title: "Introduce CLIError type and 8 typed constructors in common/clierr"
    description: |
      Replace the three identical `fmt.Errorf` wrappers in
      `common/clierr/error.go` with a `CLIError` struct that carries an exit
      code, plus eight constructors covering the audit §4.1 closed set.
      Existing constructor names (`NewUsageError`, `NewUpstreamError`,
      `NewFatalError`) keep their signatures and start returning `*CLIError`
      with codes 2, 8, 1. Five new constructors (`NewNotFoundError`,
      `NewAuthError`, `NewConflictError`, `NewValidationError`,
      `NewRateLimitError`) cover codes 3-7. `NewRateLimitError` has an extra
      leading `retryAfter string` arg that lands on `CLIError.RetryAfter`.
      Add `common/clierr/error_test.go` with table-driven coverage of each
      constructor's exit code, `errors.As` extraction through one or more
      `fmt.Errorf(": %w", ...)` wraps, and `Error()`/`Unwrap()` semantics.
    status: completed
    dependencies: []
    acceptance_criteria:
      - "`CLIError` struct has fields `Code int`, `Message string`, `Err error`, `RetryAfter string` and implements `Error()` + `Unwrap()`."
      - "Eight constructors return `*CLIError` with codes 1/2/3/4/5/6/7/8 matching the PRD table."
      - "`NewRateLimitError(retryAfter, msg, args...)` populates the struct field; message body still mentions the value."
      - "`common/clierr/error_test.go` exists with table-driven tests asserting code, Error() text, and `errors.As` extraction through `%w` wrapping."
      - "`make test`, `make fmt-check`, `make lint` pass."
    completed_at: 2026-05-13T06:54:16Z

  - id: task-002
    title: "Map HTTP status codes to typed errors in handleResponseError"
    description: |
      Update `neo4j-cli/aura/internal/api/response.go` `handleResponseError`
      so each HTTP branch returns the right typed constructor: 400 →
      `NewValidationError`, 401 → `NewAuthError` (via
      `formatAuthorizationError`), 403 → `NewAuthError` on both branches,
      404 → `NewNotFoundError`, 405 → `NewUpstreamError` (unchanged), 409 →
      `NewConflictError`, 429 → `NewRateLimitError` with the `Retry-After`
      header on the struct field, 5xx → `NewUpstreamError` (unchanged).
      `formatAuthorizationError` returns `NewAuthError` on both success and
      unmarshal-failure paths. Extend or add a table-driven test in
      `neo4j-cli/aura/internal/api/response_test.go` (create if missing)
      that feeds a synthetic `*http.Response` per interesting status code
      and asserts `errors.As(err, &ce)` extracts the right `Code`.
    status: pending
    dependencies:
      - task-001
    acceptance_criteria:
      - "Each HTTP status branch in `handleResponseError` returns the constructor named in REQ-F-004."
      - "429 path puts `res.Header.Get(\"Retry-After\")` on `CLIError.RetryAfter` and still mentions it in the message body."
      - "`formatAuthorizationError` returns `NewAuthError` on both branches."
      - "Table-driven test covers 400/401/403/404/409/429/500/503 and asserts the extracted exit code."
      - "`make test` passes."
    completed_at: null

  - id: task-003
    title: "Categorise Cypher and Bolt errors in query/run.go"
    description: |
      In `neo4j-cli/query/run.go`, identify where Bolt-driver errors are
      returned to the user and split the mapping: `Neo.ClientError.*`
      (cypher syntax/semantic errors) → `NewValidationError` (exit 6);
      transport-level failures and `Neo.TransientError.*` /
      `Neo.DatabaseError.*` → `NewUpstreamError` (exit 8). Mirror the
      pattern used elsewhere in the file for error wrapping. Add a test in
      the existing `query` test setup (real-neo4j integration or a mock,
      whichever fits the surrounding suite) that asserts both branches map
      to the right exit code via `errors.As`.
    status: pending
    dependencies:
      - task-001
    acceptance_criteria:
      - "Cypher `ClientError`-class failures from the Bolt driver surface as `*CLIError` with `Code == 6`."
      - "Bolt transport / `TransientError` / `DatabaseError` failures surface as `*CLIError` with `Code == 8`."
      - "A test in the `query` package locks both mappings via `errors.As`."
      - "`make test` passes, including any neo4j-docker integration tests already wired."
    completed_at: null

  - id: task-004
    title: "Sweep remaining clierr call sites for auth/validation reclassification"
    description: |
      Walk the ~100 existing `clierr.New*` call sites outside
      `response.go` and `run.go` (covered in earlier tasks). Reclassify:
      auth-flow errors in `neo4j-cli/aura/internal/api/token.go` and any
      credential-loading site that means "auth missing/invalid" switch to
      `NewAuthError`; any `NewUpstreamError` that is really a structural
      validation rejection switches to `NewValidationError`. Leave
      everything else as-is — flag validation stays on `NewUsageError`,
      unrecoverable internal failures stay on `NewFatalError`. Run
      `grep -n "clierr.New" -r` after the sweep to confirm nothing
      regressed and the call distribution matches the intent.
    status: pending
    dependencies:
      - task-001
    acceptance_criteria:
      - "All auth-flow sites in `neo4j-cli/aura/internal/api/token.go` use `NewAuthError`."
      - "Validation-style `NewUpstreamError` sites (input rejected, not transient) switch to `NewValidationError`."
      - "Flag/usage and fatal sites remain unchanged."
      - "Sweep documented in the commit message (which sites moved, which stayed)."
      - "`make test`, `make fmt-check`, `make lint` pass."
    completed_at: null

  - id: task-005
    title: "Wrap cobra flag-parse errors via FlagErrorFunc on both root commands"
    description: |
      In `neo4j-cli/app/app.go` and `neo4j-cli/aura/aura.go`, call
      `cmd.SetFlagErrorFunc(func(c *cobra.Command, err error) error {
      return clierr.NewUsageError("%v", err) })` on the root command.
      Cobra walks up to root for `FlagErrorFunc`, so one registration per
      tree covers every subcommand. Add a unit test (in
      `neo4j-cli/app/app_test.go` or similar) that builds the tree, calls
      `Execute` with `--bad-flag`, captures the returned error, and
      asserts it's a `*CLIError` with `Code == 2`.
    status: pending
    dependencies:
      - task-001
    acceptance_criteria:
      - "Root `app.NewCmd` registers a `FlagErrorFunc` that wraps in `NewUsageError`."
      - "Standalone `aura.NewStandaloneCmd` does the same on its root."
      - "A unit test asserts `--bad-flag` returns `*CLIError` with `Code == 2` from `Execute`."
      - "`make test` passes."
    completed_at: null

  - id: task-006
    title: "Propagate typed exit codes from cmd.Execute in both main.go files"
    description: |
      In `neo4j-cli/main.go`, after `cmd.Execute()` and the existing
      `clievents.Emit` + `cfg.Events.Flush()` calls, extract the exit code
      via `errors.As(err, &ce)` and call `os.Exit(ce.Code)`; fall back to
      `os.Exit(1)` if the error is not a `*CLIError`. Preserve the existing
      `recoverPanic` defer. Mirror the same change in
      `neo4j-cli/aura/cmd/main.go`, replacing its bare `os.Exit(1)`. Add a
      tiny unit test for any helper extracted to avoid testing `main`
      directly (or skip if the logic stays inline); the end-to-end
      verification lives in task-008.
    status: pending
    dependencies:
      - task-001
      - task-005
    acceptance_criteria:
      - "`neo4j-cli/main.go` exits with the typed code from `*CLIError` and falls back to 1 for untyped errors."
      - "`neo4j-cli/aura/cmd/main.go` does the same."
      - "`cfg.Events.Flush()` runs before `os.Exit` in both."
      - "`recoverPanic` defers remain intact and panic propagation still produces a non-zero exit."
      - "`make test`, `make fmt-check`, `make lint` pass."
    completed_at: null

