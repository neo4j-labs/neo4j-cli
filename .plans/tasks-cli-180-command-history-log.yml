  - id: task-002
    title: 'Create history store package (Entry, Record, Load, Clear, path)'
    description: |
      Create neo4j-cli/internal/subcommands/history/store.go with the Entry struct
      (time RFC3339 UTC, command, invoker, version, workspace omitempty, credential
      omitempty), a path() helper using clicfg.ConfigPrefix, and Record/Load/Clear
      functions operating on cfg.Aura.Fs(). Record reuses clievents.RedactArgs for the
      command string, detects invoker via a test-seam'd term.IsTerminal(stdin), reads
      metadata from cfg (Version, Aura.DefaultWorkspace, Credentials.Aura.DefaultCredential
      name), then does read-all -> append -> trim-to-history-limit -> atomic write at
      mode 0600. Honors history-enabled / history-limit (no-op when disabled or limit 0).
      Load skips unparseable lines. CRITICAL: must be best-effort / non-fatal — do NOT use
      fileutils.WriteFile (it panics on error). Add an exported error-returning variant
      (e.g. fileutils.WriteFileErr wrapping the existing writeFileAtomic) and have Record
      swallow/ignore write errors so a bad history write can never crash a command. Nil-guard
      cfg.Credentials.Aura before reading the default-credential name (it may be nil pre-load).
    status: completed
    dependencies:
      - task-001
    acceptance_criteria:
      - "Record appends a JSONL entry with redacted command (--password etc. -> ***) and metadata"
      - "Invoker resolves human under TTY and agent otherwise via the test seam"
      - "Trimming keeps the last history-limit entries; disabled or limit 0 writes nothing"
      - "History file is created at the config-prefix path with mode 0600"
      - "Load tolerates and skips corrupt lines; tests use testfs (never real FS)"
    completed_at: 2026-06-01T00:00:00Z

