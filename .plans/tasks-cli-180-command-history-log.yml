  - id: task-007
    title: 'Lock historyRows json/toon normalization invariant with a test'
    description: |
      Review reconsidered: the original finding ("historyRows.MarshalJSON is redundant, remove it")
      was WRONG. MarshalJSON delegates to AsArray() (map[string]any), which normalizes the json/toon
      output in two ways that default []Entry struct-tag marshaling does NOT: (1) keys are emitted
      alphabetically (command, invoker, time, version, [workspace, credential]) instead of struct
      declaration order, and (2) time is formatted with RFC3339 (whole-second) instead of
      time.Time's default RFC3339Nano. So MarshalJSON is load-bearing and must stay. The actual gap
      is that this invariant is NOT locked by a test — existing list_test.go uses substring/Contains
      assertions with whole-minute timestamps, so a future agent could delete MarshalJSON and
      silently regress json/toon output. KEEP MarshalJSON; ADD a regression test that pins the
      normalized output: feed an Entry with a SUB-SECOND timestamp and assert the json output has
      (a) alphabetical key order, (b) RFC3339 time WITHOUT the fractional part, and (c) the empty
      case renders as `[]` not `null`. Use testfs (never real FS). A one-line code comment on
      MarshalJSON explaining WHY it exists (normalizes key order + truncates sub-second) is
      warranted here as a genuine gotcha.
    status: completed
    dependencies:
      - task-004
    acceptance_criteria:
      - "historyRows.MarshalJSON is retained (not removed)"
      - "A test feeds a sub-second timestamp and asserts json key order is alphabetical AND time has no fractional part"
      - "A test asserts empty history renders as [] (not null) in json output"
      - "The new test FAILS if MarshalJSON is removed (i.e. it genuinely locks the invariant)"
      - "make test, make fmt-check, make lint pass"
    source: review
    completed_at: 2026-06-01T09:08:21Z

  - id: task-008
    title: 'Redact -p password shorthand and --uri userinfo in clievents.RedactArgs'
    description: |
      Security finding (HIGH): clievents.RedactArgs (common/clievents/redact.go) is the single
      source of truth for secret scrubbing and now feeds the on-disk command history (default-on),
      in addition to telemetry and panic/error messages. It uses a 4-name allow-list
      (password, client-secret, api-key, instance-password) matched against the bare flag name, and
      two secret-bearing inputs bypass it — confirmed empirically by recording into history.jsonl:
      (1) the `query` password SHORTHAND `-p <pw>` (query.go:67 registers StringP("password","p"))
      — RedactArgs strips dashes to "p", which is not in the list, so `-p SuperSecret123` is stored
      verbatim; (2) `--uri` (query.go:65) accepts Bolt URIs that can embed credentials as
      user:password@host userinfo, and the whole value is stored verbatim. Fix in the canonical
      layer so all three sinks benefit: (a) add the "p" shorthand to secret coverage so `-p value`
      and `-p=value` are redacted (over-redaction is acceptable in a redaction context — fail closed;
      the only -p in the tree is the password shorthand); (b) add userinfo-aware redaction for
      connection-style flags (uri): when the value parses as a URL with a populated password, rewrite
      to user:***@host preserving scheme/host/port, otherwise leave non-URL values alone. Keep the
      existing space-separated / equals shapes working. Add regression tests in the redact test file
      covering `-p value`, `-p=value`, `--uri neo4j://u:pw@h:7687`, and `--uri=neo4j://u:pw@h` (assert
      the password is gone and the host/scheme remain). Do NOT blanket-redact the whole URI (host is
      useful and non-secret).
    status: completed
    dependencies: []
    acceptance_criteria:
      - "RedactArgs scrubs `-p value` and `-p=value` (password shorthand) to ***"
      - "RedactArgs rewrites --uri / --uri= values with embedded user:password@ to user:***@, preserving scheme/host/port"
      - "Non-URL --uri values and credential-free URIs are left unchanged"
      - "New table-driven tests in common/clievents cover both shapes for -p and --uri"
      - "make test, make fmt-check, make lint pass"
    source: review
    completed_at: 2026-06-01T13:00:00Z

