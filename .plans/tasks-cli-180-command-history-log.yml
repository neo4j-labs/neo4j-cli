  - id: task-013
    title: 'Collapse RedactArgs duplicated shape-branches into a flag-name dispatch'
    description: |
      Review finding (priority 2-3, structural): RedactArgs in common/clievents/redact.go now has SIX
      near-identical branches — three flag categories (uri, param, secret) each repeating the same
      `--flag=value` / `--flag value` shape-handling boilerplate. The diff grew from 2 branches to 6 by
      copy-pasting the two-shape handling per category — repeated conditionals signalling a missing
      model. The shape (= vs space) is ORTHOGONAL to the redaction strategy (strip-userinfo /
      scrub-param-value / replace-wholesale). Refactor so shape-handling exists ONCE and dispatches the
      value by flag name. Introduce a single helper, e.g.:
        func redactByFlag(name, value string) (string, bool) {
          switch {
          case isURIFlag(name):    return redactURIUserinfo(value), true
          case isParamFlag(name):  return redactParamValue(value), true
          case isSecretFlag(name): return redactedPlaceholder, true
          }
          return value, false
        }
      Then the RedactArgs loop becomes TWO branches (equals form via splitFlagEq, space form via
      flagName), each delegating to redactByFlag — 6 branches -> 2, precedence (uri/param before generic
      secret) encoded once in the switch, and adding a future sensitive flag is a one-line case. Behavior
      MUST be identical; the existing redact tests (incl. the task-008/009 -p, --uri userinfo, and
      secret-named --param cases) are the regression guard and must stay green unchanged.
    dependencies:
      - task-009
    acceptance_criteria:
      - "RedactArgs handles the =-form and space-form once each, delegating value redaction to a single redactByFlag dispatch"
      - "No category-specific branch duplication remains (the 6 near-identical branches are gone)"
      - "All existing redact tests pass unchanged (behavior identical for -p, --uri userinfo, --param, generic secret flags)"
      - "make test, make fmt-check, make lint pass"
    source: review
    status: completed
    completed_at: 2026-06-01T16:30:00Z

