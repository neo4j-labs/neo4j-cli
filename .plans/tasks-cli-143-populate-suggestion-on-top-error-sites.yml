    title: "Enrich session 404s via WithNotFoundContext in graphanalytics/session/{get,delete}.go"
    description: |
      In graphanalytics/session/get.go and graphanalytics/session/delete.go,
      wrap the direct-session-call error with utils.WithNotFoundContext(err,
      "graph-analytics-session", sessionID, "Run 'neo4j-cli aura graph-analytics
      session list --project-id <id>' to see sessions in this project.").
      Preflight FetchAndVerifySessionInProject already covers the ownership-mismatch
      path (task-005). Add 404 sub-tests to get_test.go and delete_test.go
      asserting the rewritten ResourceType, ResourceID, and Suggestion.
    status: completed
    completed_at: 2026-05-19T00:00:00Z
    dependencies:
      - task-001
      - task-005
    acceptance_criteria:
      - "session/get.go and session/delete.go wrap their direct-call errors with WithNotFoundContext."
      - "On session 404: returned CLIError has Code == 3, ResourceType == \"graph-analytics-session\", ResourceID == <sessionID>, Suggestion per REQ-F-013."
      - "New sub-tests in get_test.go and delete_test.go using testutils.NewAuraTestHelper + NewRequestHandlerMock assert the above via errors.As."
      - "Existing session get/delete tests remain green."

