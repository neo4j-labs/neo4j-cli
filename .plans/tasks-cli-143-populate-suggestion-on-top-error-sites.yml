tasks:
  - id: task-001
    title: "Add WithNotFoundContext helper in aura/internal/subcommands/utils/"
    description: |
      Introduce a private helper that mutates a *clierr.CLIError with Code == 3
      to overwrite ResourceType, ResourceID and Suggestion. Non-matching errors
      pass through unchanged. Used downstream by snapshot and graph-analytics
      session callers where parseResourceFromRequest extracts the wrong path
      segment. Add a colocated test covering both the matching and the
      non-matching error path.
    status: completed
    completed_at: 2026-05-19T00:00:00Z
    dependencies: []
    acceptance_criteria:
      - "New file neo4j-cli/aura/internal/subcommands/utils/notfound.go (or extension of an existing utils file) exports WithNotFoundContext(err error, resourceType, resourceID, suggestion string) error."
      - "Helper uses errors.As to detect *clierr.CLIError; if Code == 3 it mutates ResourceType, ResourceID, Suggestion and returns the same error."
      - "Non-404 errors (Code != 3) and non-CLIError errors pass through unchanged."
      - "Colocated test file covers both branches and verifies that passing nil returns nil."
      - "make fmt-check && make lint clean for the new files."

  - id: task-002
    title: "Wire .WithSuggestion on 400 / 401 / 403 / 429 in aura/internal/api/response.go"
    description: |
      Inline .WithSuggestion(...) on the typed errors already constructed by the
      400, 401, 403 and 429 branches of handleResponseError. The 401/403 path
      goes through formatAuthorizationError; chain WithSuggestion on every
      NewAuthError return there, including the unmarshal-fallback path. The 403
      short-circuit at response.go:67-78 (serverError.Error != "") also gets
      the same suggestion inline. The 429 suggestion uses the Retry-After header
      value via fmt.Sprintf.
    status: completed
    completed_at: 2026-05-19T00:00:00Z
    dependencies: []
    acceptance_criteria:
      - "400 branch returns CLIError.Suggestion == \"See 'neo4j-cli aura <cmd> --help' for valid flags and values.\"."
      - "401 and 403 branches return CLIError.Suggestion == \"Run 'neo4j-cli credential aura-client add' to refresh credentials, then retry.\" (covers both formatAuthorizationError paths and the 403 short-circuit)."
      - "429 branch returns CLIError.Suggestion == \"Retry after <retryAfter> seconds.\" using the Retry-After header value."
      - "Existing 400 / 401 / 403 / 429 tests in response_test.go are extended to assert .Suggestion via errors.As."
      - "Existing 4xx test message-shape assertions remain green (no message-string regressions)."

  - id: task-003
    title: "Add suggestionForResource lookup + wire into 404 envelope in response.go"
    description: |
      Add a private helper suggestionForResource(resourceType string) string
      that returns per-resource suggestion text for instance, project,
      organization, customer-managed-key, tenant. Default returns "". Wire its
      return value into the 404 branch via .WithSuggestion(...) after the
      existing .WithResource(resourceType, resourceID) chain. Tenant text is
      the migration nudge ("tenants are now called projects").
    status: completed
    completed_at: 2026-05-19T00:00:00Z
    dependencies: []
    acceptance_criteria:
      - "suggestionForResource lookup returns the exact strings specified in REQ-F-003 for each of: instance, project, organization, customer-managed-key, tenant; default returns \"\"."
      - "404 branch chain in response.go is clierr.NewNotFoundError(...).WithResource(rt, id).WithSuggestion(suggestionForResource(rt))."
      - "response_test.go has a sub-test per resource-type entry locking the lookup table, plus one default-case test asserting Suggestion is empty when resourceType doesn't match."
      - "Unknown / nested-path 404s (resourceType is empty or unknown) produce no Suggestion line — verified by assertion."
      - "make fmt-check && make lint && go test ./neo4j-cli/aura/internal/api/... clean."

  - id: task-004
    title: "Convert resolveIDs workspace errors to typed CLIError"
    description: |
      In neo4j-cli/aura/internal/subcommands/utils/resolve.go, convert the three
      fmt.Errorf sites inside resolveIDs (lines :55, :57, :68) to
      clierr.NewUsageError(...).WithSuggestion(...). Preserve the existing
      message strings verbatim so resolve_test.go message-shape assertions
      keep passing. Extend resolve_test.go with errors.As + Code + Suggestion
      assertions for each site.
    status: completed
    completed_at: 2026-05-19T00:00:00Z
    dependencies: []
    acceptance_criteria:
      - "Legacy default-tenant migration error (:55) returns CLIError.Code == 2 with Suggestion text per REQ-F-005."
      - "No-organization error (:57) returns CLIError.Code == 2 with Suggestion text per REQ-F-005."
      - "No-project error (:68) returns CLIError.Code == 2 with Suggestion text per REQ-F-005."
      - "Existing err.Error() string assertions in resolve_test.go remain green."
      - "New errors.As-based sub-tests assert Code and Suggestion for each of the three sites."

  - id: task-005
    title: "Convert resolve.go ownership-mismatch + project-not-in-org errors to typed CLIError"
    description: |
      Convert the four remaining fmt.Errorf sites in resolve.go to
      clierr.NewNotFoundError with WithResource and WithSuggestion: validateProjectInOrg
      (:88), FetchAndVerifyInstanceInProject (:119), FetchAndVerifySessionInProject
      (:153), FetchAndVerifyCMKInProject (:187). Preserve the existing message
      strings. Extend resolve_test.go with errors.As + Code + ResourceType +
      ResourceID + Suggestion assertions for each site. Do NOT touch the
      preflight "unexpected status %d" sites at :108, :142, :176.
    status: completed
    completed_at: 2026-05-19T00:00:00Z
    dependencies:
      - task-004
    acceptance_criteria:
      - "Project-not-in-org (:88) returns Code == 3, ResourceType == \"project\", Suggestion per REQ-F-006."
      - "Instance ownership mismatch (:119) returns Code == 3, ResourceType == \"instance\", Suggestion per REQ-F-007."
      - "Session ownership mismatch (:153) returns Code == 3, ResourceType == \"graph-analytics-session\", Suggestion per REQ-F-008."
      - "CMK ownership mismatch (:187) returns Code == 3, ResourceType == \"customer-managed-key\", Suggestion per REQ-F-009."
      - "Preflight non-200 fmt.Errorf at :108, :142, :176 are unchanged."
      - "Existing err.Error() string assertions remain green; new errors.As-based sub-tests cover Code, ResourceType, ResourceID, Suggestion."

  - id: task-006
    title: "Enrich snapshot 404 via WithNotFoundContext in instance/snapshot/get.go"
    description: |
      After the direct snapshot GET in instance/snapshot/get.go, wrap the
      returned error with utils.WithNotFoundContext(err, "snapshot", snapshotID,
      "Run 'neo4j-cli aura instance snapshot list --instance-id <id>' to see
      snapshots for this instance."). The preflight FetchAndVerifyInstanceInProject
      already covers the instance-not-found case (task-005), so this enrichment
      only fires when the snapshot itself 404s. Add a 404 sub-test to
      get_test.go asserting the rewritten ResourceType, ResourceID, and Suggestion.
    status: completed
    completed_at: 2026-05-19T00:00:00Z
    dependencies:
      - task-001
      - task-005
    acceptance_criteria:
      - "instance/snapshot/get.go wraps the snapshot-GET error with WithNotFoundContext exactly once, after the preflight."
      - "On snapshot 404: returned CLIError has Code == 3, ResourceType == \"snapshot\", ResourceID == <snapshotID>, Suggestion per REQ-F-012."
      - "New sub-test in instance/snapshot/get_test.go using testutils.NewAuraTestHelper + NewRequestHandlerMock asserts the above via errors.As."
      - "Existing snapshot get tests remain green."

