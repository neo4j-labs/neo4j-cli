tasks:
  - id: task-001
    title: "Build registry core — common/clicfg/flags.go + flags_test.go"
    description: |
      Create `common/clicfg/flags.go` with the `Flag` struct (Name,
      Default, Owner, Gates, IntroducedIn, RemovalCondition, LegacyKey),
      a `Registry` map seeded with one entry `flag.aura-beta` (Default
      false; LegacyKey `aura.beta-enabled`; Owner `aura-cli team`; Gates
      "aura {dataapi, import, deployment} subcommands; v1beta5 API
      path"; IntroducedIn = next-release semver read from
      `changie latest --project neo4j-cli` then bumped one Minor;
      RemovalCondition "Aura beta features ship to GA"), a `FlagSet`
      type wrapping `*viper.Viper`, an `overrides map[string]bool`, and
      a `legacyLogOnce map[string]*sync.Once`. Implement `Enabled(name)`
      with the documented precedence (override > IsSet(name) >
      IsSet(LegacyKey) with one-shot slog.Debug > Default; unknown name
      returns false + slog.Debug). Implement `SetForTest(name, value)`,
      `SetFromConfigCmd(name, value)` (validates true/false, writes via
      sjson.Set + fileutils.WriteFile, rejects unknown via
      clierr.NewUsageError), and pure `FlagNameToEnv(name)` (strip
      `flag.`, uppercase, `-`→`_`, prepend `NEO4J_CLI_FLAG_`). Add
      `common/clicfg/flags_test.go` covering all five precedence layers,
      one-shot legacy debug log assertion, FlagNameToEnv table, and
      SetFromConfigCmd happy + unhappy paths. Standalone — no caller
      touches it yet, so this task compiles cleanly on its own.
    status: completed
    completed_at: 2026-05-18T14:30:00Z
    dependencies: []
    acceptance_criteria:
      - "`common/clicfg/flags.go` exists with `Flag` struct, exported `Registry` map containing exactly one entry `flag.aura-beta` populated per REQ-F-001, `FlagSet` type, and `FlagNameToEnv` helper"
      - "`FlagSet.Enabled` implements the 5-layer precedence; legacy debug log is gated by a per-LegacyKey `sync.Once` so it fires exactly once per process per legacy key"
      - "`FlagNameToEnv(\"flag.aura-beta\") == \"NEO4J_CLI_FLAG_AURA_BETA\"`, `FlagNameToEnv(\"flag.docker-command\") == \"NEO4J_CLI_FLAG_DOCKER_COMMAND\"`, `FlagNameToEnv(\"flag.secrets-os-keystore\") == \"NEO4J_CLI_FLAG_SECRETS_OS_KEYSTORE\"`"
      - "`common/clicfg/flags_test.go` is table-driven and covers: override > env > config > legacy > default precedence; unknown-name returns false; one-shot legacy debug log; FlagNameToEnv table; SetFromConfigCmd accepted/rejected/invalid-value cases"
      - "`make fmt-check && make lint && go test ./common/clicfg/...` all pass; no other package references `flags.go` yet so the rest of the repo is unaffected"

  - id: task-002
    title: "Wire FlagSet into clicfg.go; delete legacy AuraBetaEnabled wiring; update 2 call sites"
    description: |
      Edit `common/clicfg/clicfg.go`: add `FlagScope ConfigScope =
      "flag"` to the existing enum; add `Flags *FlagSet` field to
      `Config`; init it in `NewConfig` after the viper setup block
      (`Flags: &FlagSet{viper: Viper}`). In `bindEnvironmentVariables`
      iterate `Registry` and call `Viper.BindEnv(name,
      FlagNameToEnv(name))` per entry (errcheck-nolint matching the
      existing two BindEnv calls). In `setDefaultValues` iterate
      `Registry` and call `Viper.SetDefault(name, spec.Default)`; if
      `spec.LegacyKey != ""` also `Viper.SetDefault(spec.LegacyKey,
      spec.Default)` so `IsSet(LegacyKey)` only fires when the legacy
      key is explicitly present in config or env. Extend
      `ResolveConfigKey` to recognise `flag.*` prefix → look up in
      Registry → return `(FlagScope, fullDottedName, nil)` for known,
      `clierr.NewUsageError("invalid config key: %q", key)` for
      unknown. Delete `DefaultAuraBetaEnabled` const, `AuraConfig`'s
      `betaEnabled` field, `SetBetaEnabled`, `AuraBetaEnabled`. Update
      the two production call sites — `neo4j-cli/aura/aura.go:41` and
      `neo4j-cli/aura/internal/api/api.go:117` — to call
      `cfg.Flags.Enabled("flag.aura-beta")`. Delete the test bridge at
      `neo4j-cli/aura/internal/test/testutils/auratesthelper.go:62-66`
      (the gjson read + SetBetaEnabled call); drop the `gjson` import
      if no other reference remains. Add two rows to
      `clicfg_test.go`'s `TestResolveConfigKey`: `flag.aura-beta`
      accepted; `flag.unknown-thing` rejected. Existing aura tests
      keep passing via the legacy alias path — no test renames in
      this task.
    status: completed
    completed_at: 2026-05-18T15:30:00Z
    dependencies:
      - task-001
    acceptance_criteria:
      - "`grep -n 'AuraBetaEnabled\\|SetBetaEnabled\\|DefaultAuraBetaEnabled\\|betaEnabled' common/clicfg/clicfg.go` returns zero matches; `grep -rn 'AuraBetaEnabled\\|SetBetaEnabled' .` only matches removal-context lines (none in source)"
      - "`common/clicfg/clicfg.go` has `FlagScope` constant, `Config.Flags` field initialised in `NewConfig`, registry-driven `BindEnv` and `SetDefault` loops, and `ResolveConfigKey` flag.* branch with rejected/accepted behaviour"
      - "`neo4j-cli/aura/aura.go:41` and `neo4j-cli/aura/internal/api/api.go:117` call `cfg.Flags.Enabled(\"flag.aura-beta\")`; the surrounding logic is otherwise byte-identical"
      - "`neo4j-cli/aura/internal/test/testutils/auratesthelper.go` no longer references `aura.beta-enabled` or `SetBetaEnabled`; `gjson` import removed if unused; existing aura tests still pass unchanged because the registry's legacy fallback handles their `aura.beta-enabled` JSON values"
      - "`make test && make fmt-check && make lint && make license-check && make generate-check` all pass on the branch tip after this task; skill bundle diff is empty"

  - id: task-003
    title: "Wire config set/get to FlagScope; add set/get/list tests for flag.* keys"
    description: |
      Edit `neo4j-cli/internal/subcommands/config/set.go` — add
      `case clicfg.FlagScope:` in the existing switch (around line 44)
      that calls `cfg.Flags.SetFromConfigCmd(bareKey, value)` and
      returns its error (set `cmd.SilenceUsage = true` on error to
      match the GlobalConfig branch). `validSetArgs` is unchanged —
      flags are intentionally excluded from tab-completion. Edit
      `neo4j-cli/internal/subcommands/config/get.go` — add
      `case clicfg.FlagScope:` that builds a `PrintableConfigEntry{Key:
      bareKey, Value: cfg.Flags.Enabled(bareKey)}` and passes it to
      `output.PrintBodyMap`. `validGetArgs` is unchanged. Extend
      `set_test.go` with cases for `config set flag.aura-beta true`
      (accepted, observable via AssertConfigValue), `config set
      flag.aura-beta maybe` (rejected with invalid-value error),
      `config set flag.unknown-thing true` (rejected with invalid
      config key error). Extend `get_test.go` with a case for `config
      get flag.aura-beta` returning the bool, and a `config list`
      regression guard asserting no `flag.*` key appears in the
      output.
    status: completed
    completed_at: 2026-05-18T16:30:00Z
    dependencies:
      - task-002
    acceptance_criteria:
      - "`config/set.go` switch has a `case clicfg.FlagScope` branch routing to `cfg.Flags.SetFromConfigCmd`; `config/get.go` switch has a matching branch reading via `cfg.Flags.Enabled`; neither file extends its `validGetArgs`/`validSetArgs` tab-completion list"
      - "`config/set_test.go` has new rows for the three flag scenarios (accepted set with config-file write, invalid-value rejected, unknown-key rejected); each rejection asserts the exact `clierr.NewUsageError` message shape used elsewhere in the file"
      - "`config/get_test.go` has a new row for `config get flag.aura-beta` returning the bool AND a `config list` regression guard asserting the output does not contain any `flag.` substring"
      - "Manual smoke (run as part of this task's verification): `bin/neo4j-cli config set flag.aura-beta true --rw` writes the key; `bin/neo4j-cli config get flag.aura-beta` reads it back as `true`; `bin/neo4j-cli config list` output contains no `flag.` substring"
      - "`make test && make fmt-check && make lint && make license-check && make generate-check` all pass; skill bundle diff is empty"

  - id: task-004
    title: "Mechanical rename — aura.beta-enabled → flag.aura-beta across 33 test files"
    description: |
      Sweep every `*_test.go` file in the repo that calls
      `helper.SetConfigValue("aura.beta-enabled", ...)` or
      `h.setConfigValue("aura.beta-enabled", ...)` and rename the
      key literal to `"flag.aura-beta"`. Driven by `grep -rn
      'aura\\.beta-enabled' --include='*_test.go' .` — the exact file
      list is whatever the grep returns at branch tip, not hard-coded
      here. Includes (per earlier grep): all
      `neo4j-cli/aura/internal/subcommands/dataapi/graphql/**/_test.go`
      files, `organization/{get,list}_test.go`, import / deployment /
      project / workspace `_test.go` files,
      `neo4j-cli/aura/internal/subcommands/config/*_test.go`, AND
      `neo4j-cli/internal/subcommands/config/project_test.go:148`.
      Use `sed -i` or equivalent; do NOT touch the legacy-alias
      string inside `common/clicfg/flags.go` (Registry's LegacyKey
      value) or any string inside `common/clicfg/flags_test.go` that
      exists specifically to exercise the legacy path. After the
      sweep, run the full test suite — all renamed tests must still
      pass (they now flow through the primary flag.aura-beta path
      rather than the legacy fallback).
    status: pending
    dependencies:
      - task-002
    acceptance_criteria:
      - "`grep -rn 'aura\\.beta-enabled' --include='*_test.go' .` returns matches ONLY in `common/clicfg/flags_test.go` (legacy-path test) and zero matches elsewhere"
      - "`grep -rn 'aura\\.beta-enabled' --include='*.go' .` returns matches ONLY in `common/clicfg/flags.go` (Registry's LegacyKey field) and `common/clicfg/flags_test.go`"
      - "`grep -rn 'flag\\.aura-beta' --include='*_test.go' .` returns the same count of matches that `aura.beta-enabled` had before the sweep (proves no test was accidentally dropped)"
      - "`make test` passes on the full repo; aura tests that previously toggled `aura.beta-enabled` now toggle `flag.aura-beta` and exercise the primary registry path (not the legacy fallback)"
      - "`make fmt-check && make lint && make license-check && make generate-check` all pass; skill bundle diff is empty"

