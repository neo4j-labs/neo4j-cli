tasks:
  - id: task-001
    title: "Add --no-print-password flag, validation, and conditional output in create.go"
    description: |
      Wire the new `--no-print-password` boolean flag into
      `neo4j-cli/internal/subcommands/docker/create.go`. Add the variable to
      the `var (...)` block (around line 95, next to `noStoreCredential`) and
      `noPrintPasswordFlag = "no-print-password"` to the matching `const (...)`
      block (around line 112). Register the flag with `cmd.Flags().BoolVar`
      after `noStoreCredential` (around line 400) with help text "Don't
      include the generated password in stdout output. Retrieve later via
      `neo4j-cli credential dbms get <name>`." Add two validation branches in
      `RunE` immediately after the existing ephemeral/no-store check at
      line 181-183: reject `noPrintPassword && ephemeral` (point operators at
      `--env-out-file`), and reject `noPrintPassword && noStoreCredential &&
      password == ""` (the explicit `--password` exception lets operators who
      know their own password still opt out of stdout rendering). Modify the
      output-construction block at line 375-386 to build `row` and `fields`
      without the password field by default, then conditionally append the
      password when `!noPrintPassword`. Extend the `Long:` description with a
      single short sentence mentioning the new flag so it surfaces in
      `--help`.
    status: completed
    dependencies: []
    acceptance_criteria:
      - "`noPrintPassword` var and `noPrintPasswordFlag = \"no-print-password\"` const declared in `newCreateCmd` alongside the existing `noStoreCredential` declarations."
      - "Flag registered via `cmd.Flags().BoolVar(&noPrintPassword, noPrintPasswordFlag, false, \"Don't include the generated password in stdout output. Retrieve later via `neo4j-cli credential dbms get <name>`.\")`."
      - "`RunE` returns a `clierr.UsageError` for `--no-print-password --ephemeral` whose message names `--env-out-file` as the alternative; the docker client is NOT invoked on this path."
      - "`RunE` returns a `clierr.UsageError` for `--no-print-password --no-store-credential` without `--password`, with a message naming `--password`; the docker client is NOT invoked. The combo IS allowed when `--password` is set."
      - "The output-construction block at the former `create.go:375-386` site builds `row` and `fields` without the `password` key when `noPrintPassword` is true and includes it when false; `commonoutput.PrintBodyMap` call shape is unchanged."
      - "`Long:` description includes a short sentence mentioning `--no-print-password` and the recovery path via `credential dbms get`."
      - "`make fmt-check && make lint && go build ./neo4j-cli/...` all clean (test gate runs in task-002)."
    completed_at: 2026-05-20T00:00:00Z

  - id: task-002
    title: "Add unit tests for --no-print-password in create_test.go"
    description: |
      Add tests in
      `neo4j-cli/internal/subcommands/docker/create_test.go` covering the
      verification cases from the PRD. Prefer table-driven for the
      format-redaction cases (JSON / default / TOON share a single shape).
      Reuse the existing `runCreate` /
      `runCreateWithOccupiedPortsAndStderr` helpers and the
      `constantReader` randSource seam so the resolved password is
      assertable. Use existing patterns from
      `TestCreate_NoStoreCredential_SkipsPersistence` (around line 222) and
      `TestCreate_GeneratedPassword_*` (around line 302). Cover:
      (a) JSON / table / TOON output omit the `password` field when the
      flag is set; (b) default behaviour (flag absent) still renders the
      password verbatim; (c) when `--no-print-password` is set alone the
      stored dbms credential contains the generated password so
      `credential dbms get <name>` would recover it; (d) `--no-print-password
      --no-store-credential` without `--password` errors with no docker
      invocation; (e) the same combo WITH `--password=<value>` succeeds and
      stores nothing; (f) `--no-print-password --ephemeral` errors with no
      docker invocation; (g) stdout AND stderr combined do not contain the
      resolved password substring on the happy path with the flag.
    status: pending
    dependencies:
      - task-001
    acceptance_criteria:
      - "Table-driven test asserts the `password` substring is absent from stdout for `--no-print-password --format json`, `--no-print-password` (default format), and `--no-print-password --format toon`."
      - "Regression test asserts the default invocation (no `--no-print-password`) still renders the password in JSON output."
      - "Test asserts `cfg.Credentials.Dbms.List()` contains the new credential with the generated password when `--no-print-password` is set alone (recovery path is exercisable via `credential dbms get`)."
      - "Test for `--no-print-password --no-store-credential` (no `--password`) asserts a `*clierr.CLIError` with `Code == 2`, error message naming `--password`, AND `fake.RunCalls` is empty."
      - "Test for `--no-print-password --no-store-credential --password=<value>` asserts success, the password is absent from stdout, and `cfg.Credentials.Dbms.List()` is empty."
      - "Test for `--no-print-password --ephemeral` asserts a `*clierr.CLIError` with `Code == 2`, error message naming `--env-out-file`, AND `fake.RunCalls` is empty."
      - "Test asserts the resolved password substring is absent from combined stdout + stderr on the happy path with `--no-print-password`."
      - "`make fmt-check && make lint && go test ./neo4j-cli/internal/subcommands/docker/...` all clean."
    completed_at: null

