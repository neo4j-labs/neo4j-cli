tasks:
  - id: task-001
    title: "Plumb stderr Logger + extend conn struct + driverOpener signature"
    description: |
      Add a package-private `stderrLogger` adapter in `neo4j-cli/query/connect.go`
      that implements the `neo4j/log.Logger` interface and writes all four levels
      (Error / Infof / Warnf / Debugf) to `os.Stderr`. Do NOT use the
      driver-shipped `log.ToConsole`: it routes DEBUG / INFO / WARN to stdout,
      which would corrupt `--format json` output. Add a `debug bool` field to
      the `conn` struct (next to `userAgent`). Extend the `driverOpener` test
      seam from 4 args to 5 args by adding a trailing `debug bool` parameter;
      inside the configurer closure, when `debug == true` set
      `c.Log = newStderrLogger(log.DEBUG)`, otherwise leave `c.Log` untouched
      (nil). Update every in-tree call site and test stub that overrides
      `driverOpener` to the new signature — grep for it before merging. No flag
      or env reading happens in this task; that comes in task-002.
    status: completed
    dependencies: []
    acceptance_criteria:
      - "`neo4j-cli/query/connect.go` defines a package-private logger type implementing `neo4j/log.Logger` with all four methods (Error, Infof, Warnf, Debugf) writing to `os.Stderr`."
      - "`conn` struct has a `debug bool` field; `driverOpener` takes 5 args `(target, username, password, userAgent, debug)`."
      - "Configurer closure inside `driverOpener` branches on `debug`: true → `c.Log = newStderrLogger(log.DEBUG)`; false → `c.Log` left nil."
      - "All in-tree call sites and test seam stubs (`run_test.go`, `connect_test.go`, any others) are migrated to the 5-arg signature; `go build ./...` and `make test` pass with the new signature."
      - "No flag registration and no `os.Getenv` read added yet — the `debug` value is hard-wired to `false` from `resolveConn` for now."
    completed_at: 2026-05-19T00:00:00Z

  - id: task-002
    title: "Register --debug flag + wire flag/env precedence in resolveConn"
    description: |
      Register a boolean persistent flag `--debug` on the `query` parent in
      `neo4j-cli/query/query.go`, default `false`, help text noting
      `[env: NEO4J_DEBUG (set to 1 to enable)]`. In `resolveConn`
      (`neo4j-cli/query/connect.go`), populate `conn.debug` from:
      `(cmd.Flag("debug").Changed && f.Value.String() == "true") ||
      os.Getenv("NEO4J_DEBUG") == "1"`. Strict-`1` rule: any other env value
      (`true`, `yes`, `on`, `0`, empty) leaves debug OFF. Explicit
      `--debug=false` overrides `NEO4J_DEBUG=1` (because the flag's `Changed`
      branch evaluates to true with value `false`, short-circuiting the env
      read). Do not plumb `--debug` through dotenv; `os.Getenv` is the only env
      surface. Persistence means `:schema` inherits the flag; `:embed` inherits
      it too but is a documented no-op (no driver opened in the leaf).
    status: completed
    dependencies:
      - task-001
    acceptance_criteria:
      - "`query` parent registers `cmd.PersistentFlags().Bool(\"debug\", false, ...)` with help text containing `[env: NEO4J_DEBUG (set to 1 to enable)]`."
      - "`resolveConn` sets `conn.debug` per the flag-then-env precedence rule with strict-`1` env acceptance and explicit-flag override."
      - "Running `query :schema --debug ...` results in `conn.debug == true` end-to-end (inheritance works)."
      - "No dotenv lookup is added for `NEO4J_DEBUG`; only `os.Getenv` is consulted."
      - "`make build` and `make test` remain clean."
    completed_at: 2026-05-19T00:00:00Z

  - id: task-003
    title: "Table tests for flag/env precedence, stderr routing, and stdout cleanliness"
    description: |
      Add tests in `neo4j-cli/query/connect_test.go` (and/or `run_test.go` where
      a full RunE pass is required) covering: (a) flag-on / env-on
      (`NEO4J_DEBUG=1`) / both-on / both-off / env-set-but-not-`1`
      (`NEO4J_DEBUG=true` → debug OFF) / explicit `--debug=false` overriding
      `NEO4J_DEBUG=1`; (b) default-off path asserting the resulting
      `config.Config.Log == nil`; (c) debug-on path asserting `c.Log` is the
      stderr adapter and a captured `Debugf` call writes to a buffer wired in
      via the seam; (d) stdout byte-identity between `--debug=false` and
      `--debug=true` runs against the same seam-stubbed response (locks
      REQ-F-009). Use `t.Setenv` to drive env cases; use a stub `driverOpener`
      that captures the `*config.Config` produced by the configurer closure.
    status: completed
    dependencies:
      - task-002
    acceptance_criteria:
      - "Table test covers six precedence cases listed in the description; all pass."
      - "Default-off assertion: `config.Config.Log == nil` after `driverOpener` runs."
      - "Debug-on assertion: `config.Config.Log` is non-nil and a `Debugf` call writes to a stderr-substitute buffer (not stdout)."
      - "Stdout byte-identity test: `--debug=false` vs `--debug=true` produce identical stdout bytes for the same seam-stubbed response."
      - "`go test ./neo4j-cli/query/...` is clean."
    completed_at: 2026-05-19T00:00:00Z

