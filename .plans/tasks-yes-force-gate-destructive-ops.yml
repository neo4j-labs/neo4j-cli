tasks:
  - id: task-001
    title: "Build common/confirm package with Register, Require, ErrCancelled, TTY seam"
    description: |
      Create the shared `common/confirm/` package per PRD §REQ-F-001..F-007. The
      package exposes `Flags{Yes, Force}`, `Register(cmd) *Flags`, `(*Flags).Require(cmd, resourceID) error`,
      sentinel `ErrCancelled`, a package-local `stdinIsTerminal` var, and
      `SetStdinIsTerminalForTest(t, fn)`. `Require` derives the resource type
      from `cmd.Parent().Name()`, prompts on TTY, returns `clierr.NewUsageError`
      (exit 2) on non-TTY when either flag is missing, and returns
      `ErrCancelled` when the TTY prompt is declined. Stdin is read from
      `cmd.InOrStdin()`; prompt is written to `cmd.ErrOrStderr()`. Reuse the
      bufio line-read pattern from `neo4j-cli/internal/subcommands/docker/delete.go:promptForDelete`.
      EOF / read error with zero bytes = cancellation. The package must NOT
      import anything from `neo4j-cli/internal/...` (Go internal-package rule).
    status: completed
    dependencies: []
    acceptance_criteria:
      - "Package compiles at `common/confirm/`; `go build ./common/confirm/...` succeeds."
      - "Table-driven `confirm_test.go` covers all five states: non-TTY+neither, non-TTY+only-yes, non-TTY+only-force, non-TTY+both, TTY+missing-y-answer, TTY+missing-N-answer, TTY+both — and asserts no prompt is written when both flags are set."
      - "Non-TTY missing-flag path returns a `*clierr.CLIError` with exit code 2 whose message contains 'pass both --yes and --force'."
      - "TTY cancellation path returns `confirm.ErrCancelled` and `errors.Is(err, confirm.ErrCancelled)` is true."
      - "Empty `resourceID` renders prompt/error copy without empty quotes (e.g. 'this deployment' rather than 'deployment \"\"')."
      - "Copyright header present; package contains no import of `github.com/neo4j/cli/neo4j-cli/internal/...`."
    completed_at: 2026-05-25T09:00:00Z

