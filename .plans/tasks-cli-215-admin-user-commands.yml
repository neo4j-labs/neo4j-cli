  - id: task-012
    title: 'Collapse to internal test package: delete export_test.go, merge user_helpers_test.go'
    description: |
      The user package chose package user_test (external) for all leaf tests while the
      sibling database package uses package database (internal). This generated ~118 lines
      of pure scaffolding — export_test.go (62 lines exposing 8 private constructors + one
      seam pointer) and user_helpers_test.go (56 lines re-implementing seam helpers that
      already exist in helpers_test.go as internal versions). There is no technical reason
      for the external package choice: no import cycles, no end-to-end harness requirement.

      The fix:
        1. Delete export_test.go entirely.
        2. Convert all leaf *_test.go files from package user_test to package user.
        3. Replace all ExportedUserExecFn / NewXxxCmdForTest references with direct calls
           to the unexported symbols (newListCmd, newGetCmd, etc.) and direct assignment
           to userExecFn.
        4. Merge user_helpers_test.go into helpers_test.go (or delete it and move any
           non-duplicate helpers into helpers_test.go). Remove duplicate seam-override
           helpers — withFakeExecFn/withFakeStdinIsTTY/withFakePasswordReader in
           user_helpers_test.go duplicate setFakeExecFn/setStdinIsTTY/setPasswordReader
           in helpers_test.go; keep the helpers_test.go versions (they're already there),
           discard the external-package duplicates. testConn() can move from
           user_helpers_test.go into helpers_test.go.

      The target state mirrors database/database_helpers_test.go: one internal helper file,
      no export_test.go.
    status: pending
    dependencies: []
    source: review
    acceptance_criteria:
      - "export_test.go is deleted"
      - "all *_test.go files in admin/user/ are package user (internal)"
      - "make test passes with no changes to production code"
      - "the package has a single shared test-helper set (no duplicate seam-override functions)"
    completed_at: null

