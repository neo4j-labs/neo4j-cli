  - id: task-011
    title: 'Add helpers_test.go: direct unit tests for normalizeUserRow, outputUser, promptUserPassword'
    description: |
      Create helpers_test.go in neo4j-cli/internal/subcommands/admin/user/ as an INTERNAL
      test (package user, not package user_test) so it can call unexported functions directly
      without needing export_test.go wrappers.

      Test normalizeUserRow:
        - null roles and null suspended both normalized
        - non-null roles and non-null suspended pass through unchanged
        - mixed (null roles, non-null suspended) and vice versa

      Test outputUser:
        - zero rows returned by fakeExecFn → nil error, no output
        - one row returned → row printed (set userExecFn to a fake, capture stdout via
          cobra cmd.SetOut, verify output contains expected field)
        - fakeExecFn returns error → error propagated

      Test promptUserPassword:
        - non-empty flag value → returned immediately, no TTY/reader called
        - empty flag + StdinIsTTY=true + PasswordReader returns "pw" → "Password: " on
          stderr, "pw" returned
        - empty flag + StdinIsTTY=false → usage error
        - empty flag + StdinIsTTY=true + PasswordReader returns error → wrapped error

      Since this is package user (internal), override the seams directly:
        userExecFn = fakeExecFn(...)    (direct assignment, no ExportedUserExecFn needed)
        dbconn.StdinIsTTY = func() bool { return ... }
        dbconn.PasswordReader = func() (string, error) { ... }
      Restore each via t.Cleanup.

      Do NOT modify export_test.go, helpers.go, or any other existing file.
    status: completed
    dependencies:
      - task-001
    acceptance_criteria:
      - "helpers_test.go is package user (internal), not package user_test"
      - "TestNormalizeUserRow covers null normalization and passthrough cases"
      - "TestOutputUser covers zero-rows, one-row output, and exec error"
      - "TestPromptUserPassword covers explicit value, TTY prompt, non-TTY error, reader error"
      - "make test passes with the new test file"
    completed_at: "2026-06-15T05:00:00Z"

