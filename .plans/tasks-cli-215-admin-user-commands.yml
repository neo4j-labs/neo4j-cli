    title: 'Wire user subtree into admin.go, add Examples, regenerate skill bundle'
    description: |
      Add cmd.AddCommand(user.NewCmd(cfg, &adminConn, RunAdminStatement)) to admin.go,
      mirroring the existing database.NewCmd call. Update admin.go Long description to
      mention user subcommands. Verify every leaf in the user/ package has a flush-left
      Example: field with >= 2 invocations (write commands include --rw; read commands
      include >= 1 --format json). Then run go generate ./neo4j-cli/internal/skill/... to
      regenerate the skill bundle. Verify make test, make fmt-check, and make lint all pass.
    status: pending
    dependencies:
      - task-002
      - task-003
      - task-004
      - task-005
      - task-006
      - task-007
    acceptance_criteria:
      - "admin.go AddCommand line for user.NewCmd is present and compiles"
      - "neo4j-cli admin user --help shows list/get/create/drop/rename/set-password/suspend/activate"
      - "every user leaf has a flush-left Example: with >= 2 invocations; TestAllLeafCommands_HaveExamples passes"
      - "go generate ./neo4j-cli/internal/skill/... produces no diff; TestGenerator_RoundTrip passes"
      - "make test, make fmt-check, make lint all pass clean"
    completed_at: null

