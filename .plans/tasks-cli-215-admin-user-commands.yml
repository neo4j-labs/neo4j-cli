tasks:
  - id: task-001
    title: 'user/ package foundation: helpers.go and user_helpers_test.go only'
    description: |
      Create ONLY the shared foundation files for the admin/user/ package. Do NOT create
      user.go, and do NOT implement any leaf command files. This task is strictly helpers.go
      and the test helper file.

      helpers.go must contain:
        - package user declaration + copyright header
        - var userExecFn adminutil.ExecFn  (package-level test seam; set later by NewCmd)
        - userFields []string{"user", "roles", "password_change_required", "suspended"}
        - normalizeUserRow(m map[string]any) map[string]any  (null roles → []any{}, null suspended → false)
        - outputUser(cmd, cfg, conn, userName) error  (runs SHOW USERS WHERE user = $name via
          userExecFn, normalizes + prints single row; returns nil with no output if zero rows)
        - promptUserPassword(cmd, flagName) (string, error)  (reads flagName flag; if empty
          and dbconn.StdinIsTTY() prompts stderr; if empty and not TTY returns usage error)

      user_helpers_test.go must contain:
        - withFakeExecFn(t, fake) — sets userExecFn for the test and restores on cleanup
        - fakeExecFn type (func matching adminutil.ExecFn signature)
        - helpers to override dbconn.StdinIsTTY and dbconn.PasswordReader and restore them

      STOP after these two files. Do NOT add AddCommand calls, do NOT create any leaf files.
    status: completed
    dependencies: []
    acceptance_criteria:
      - "helpers.go compiles as package user with userExecFn var, userFields, normalizeUserRow, outputUser, and promptUserPassword"
      - "userExecFn is declared in helpers.go (not in any leaf file or user.go)"
      - "promptUserPassword calls dbconn.StdinIsTTY() and dbconn.PasswordReader() — no new local seam vars declared"
      - "user_helpers_test.go provides withFakeExecFn, fakeExecFn, and overrides for dbconn.StdinIsTTY / dbconn.PasswordReader"
      - "NO user.go, NO leaf files created in this task"
      - "make test passes (package compiles; test helpers compile)"
    completed_at: "2026-06-15T00:00:00Z"

  - id: task-002
    title: 'user list and user get commands'
    description: |
      Implement ONLY list.go + list_test.go and get.go + get_test.go.

      list.go: newListCmd(...) *cobra.Command that executes SHOW USERS via userExecFn,
      normalizes each row with normalizeUserRow, and outputs all rows. For table/toon
      format, convert the roles []any to a comma-joined string before calling PrintBodyMap;
      JSON retains the array. Supports --format json|table|toon. No --rw.

      get.go: newGetCmd(...) *cobra.Command that executes SHOW USERS WHERE user = $name via
      userExecFn, applies normalizeUserRow, and outputs the single row. Returns
      clierr.NewNotFoundError if zero rows. No --rw.

      Both leaf constructors must be private (newListCmd / newGetCmd). They are NOT yet
      registered anywhere — NewCmd does not exist yet. The commands will be wired in
      task-008.

      Add flush-left Example: fields with >= 2 invocations each (>= 1 --format json on reads).
    status: completed
    dependencies:
      - task-001
    acceptance_criteria:
      - "list.go and get.go define newListCmd and newGetCmd as private constructors"
      - "roles column renders as comma-joined string in table/toon and as array in JSON"
      - "null roles normalizes to [] and null suspended normalizes to false in all output formats"
      - "get.go returns not_found (exit 3) for zero rows"
      - "list_test.go and get_test.go use table-driven tests with fakeExecFn covering happy path, empty result, and format variants"
      - "both files have flush-left Example: fields with >= 2 invocations"
      - "NO user.go AddCommand calls touched in this task"
    completed_at: "2026-06-15T01:00:00Z"

  - id: task-003
    title: 'user create command'
    description: |
      Implement ONLY create.go + create_test.go.

      create.go: newCreateCmd(...) *cobra.Command that executes CREATE USER $name SET
      PASSWORD $password SET PASSWORD CHANGE [NOT] REQUIRED via userExecFn. Registers:
        - --set-password (string, empty default; NOT --password, which shadows the parent flag)
        - --password-change-required (bool, default true)
      When --set-password is absent, calls promptUserPassword(cmd, "set-password"). On
      success, calls outputUser to emit the created user record. Requires --rw.

      newCreateCmd is a private constructor. It is NOT yet wired into any NewCmd — that
      happens in task-008.

      Add a flush-left Example: with >= 2 invocations (include --rw).
    status: completed
    dependencies:
      - task-001
    acceptance_criteria:
      - "create.go registers --set-password (not --password)"
      - "--password-change-required defaults to true"
      - "absent --set-password on TTY prompts Password: to stderr and reads without echo"
      - "absent --set-password on non-TTY returns a usage error"
      - "successful create emits the new user record via outputUser"
      - "create_test.go covers: explicit password, TTY prompt, non-TTY usage error, password-change-required variants"
      - "flush-left Example: with >= 2 invocations including --rw"
      - "NO user.go AddCommand calls touched in this task"
    completed_at: "2026-06-15T03:00:00Z"

  - id: task-004
    title: 'user drop command'
    description: |
      Implement ONLY drop.go + drop_test.go.

      drop.go: newDropCmd(...) *cobra.Command that executes DROP USER $name via userExecFn.
      Registers confirm.Register (--yes/--force) and calls confirm.Require in RunE, mirroring
      database/drop.go. Translates Neo.ClientError.Statement.ArgumentError with "does not
      exist" in the message to clierr.NewNotFoundError("user %q not found", name). Produces
      no output on success. Requires --rw.

      newDropCmd is a private constructor. It is NOT yet wired into any NewCmd.

      Add a flush-left Example: with >= 2 invocations (include --rw and --yes).
    status: completed
    dependencies:
      - task-001
    acceptance_criteria:
      - "drop.go calls confirm.Register and confirm.Require with the user name as the resource identifier"
      - "successful drop produces no stdout output"
      - "drop of a nonexistent user returns not_found (exit 3), not a raw Neo4jError string"
      - "drop_test.go covers: success (no output), not-found translation, confirm gate"
      - "flush-left Example: with >= 2 invocations including --rw and --yes"
      - "NO user.go AddCommand calls touched in this task"
    completed_at: "2026-06-15T02:00:00Z"

  - id: task-005
    title: 'user rename command'
    description: |
      Implement ONLY rename.go + rename_test.go.

      rename.go: newRenameCmd(...) *cobra.Command that executes RENAME USER $oldName TO
      $newName via userExecFn. One positional arg (<old-name>), cobra.ExactArgs(1); one
      required --new-name string flag. Aura ArgumentError is already translated by
      translateAdminError in run.go — no local error check needed. On success, calls
      outputUser with the new name. Requires --rw.

      newRenameCmd is a private constructor. It is NOT yet wired into any NewCmd.

      Add a flush-left Example: with >= 2 invocations (include --rw).
    status: completed
    dependencies:
      - task-001
    acceptance_criteria:
      - "rename.go uses cobra.ExactArgs(1) and a required --new-name string flag"
      - "passing two positional args returns an ExactArgs error"
      - "successful rename emits the renamed user record (SHOW USERS WHERE user = $newName)"
      - "rename_test.go covers: success with output, two-positional-arg rejection, Aura error passthrough"
      - "flush-left Example: with >= 2 invocations including --rw"
      - "NO user.go AddCommand calls touched in this task"
    completed_at: "2026-06-15T04:00:00Z"

