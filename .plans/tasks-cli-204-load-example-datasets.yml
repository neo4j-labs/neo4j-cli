      - "Copyright header present"
    completed_at: null

  - id: task-007
    title: 'desktop dbms load leaf (existing via --dbms-id, new via --name)'
    description: |
      Add neo4j-cli/internal/subcommands/desktop/dbms/load.go and register 'dbms load'
      in dbms/dbms.go. Existing DBMS (--dbms-id <uuid>, requires --force): stop if
      running, LoadDump into --database, install each manifest plugin via InstallPlugin,
      start. New DBMS (--name): create+load via POST /fastify/api/desktop/dbmss with
      dumpOrBackupPath, install plugins, start, choosing the newest compatible Neo4j
      version when the manifest spans ranges. --dbms-id and --name are mutually
      exclusive and exactly one is required.
    status: pending
    dependencies:
      - task-002
      - task-003
      - task-006
    acceptance_criteria:
      - "--dbms-id and --name are mutually exclusive; exactly one required (usage error otherwise)"
      - "Existing DBMS requires --force; loads via stop -> LoadDump -> InstallPlugin -> start"
      - "New DBMS is created+loaded via dumpOrBackupPath then plugins installed and started"
      - "--database selects the target database; default neo4j"
      - "Tests use the desktop client seam; no afero.NewOsFs in query-adjacent tests"
    completed_at: null

  - id: task-008
    title: 'aura instance load leaf (new instance via ephemeral docker staging)'
    description: |
      Add neo4j-cli/aura/internal/subcommands/instance/load.go and register
      'instance load' in instance.go, reusing the aura instance create flag set
      (--name, --cloud-provider, --region, --memory, --type, org/project). Error early
      (before creating the instance) if no local Docker daemon is available, and
      hard-error before any work if the manifest plugins include graph-data-science.
      Otherwise: create a new Aura instance (create_core.go), stage the dump into an
      ephemeral docker neo4j via docker.LoadDumpIntoNewContainer, docker.PushToAura to
      the new instance, tear down the ephemeral container. Resolve org/project via
      utils/resolve.go.
    status: pending
    dependencies:
