tasks:
  - id: task-001
    title: 'Embedded dataset catalog (suggestions) in internal/dataset'
    description: |
      Create the non-cobra support package neo4j-cli/internal/dataset with
      catalog.go holding an embedded curated list of suggested datasets
      ({slug, title, description, owner/repo}) sourced from the README of
      neo4j-graph-examples/demo.neo4jlabs.com. Expose a List() accessor. The
      list is only a suggestion set; loading is not constrained to it.
    status: completed
    dependencies: []
    acceptance_criteria:
      - "catalog.go exposes List() returning the curated entries with slug/title/description/owner-repo"
      - "Entries match the demo.neo4jlabs.com README slugs (movies, recommendations, northwind, etc.)"
      - "Package has the Neo4j copyright header and a table-driven catalog_test.go"
      - "No network access in List() — data is embedded in the binary"
    completed_at: 2026-06-04T15:19:12Z

  - id: task-002
    title: 'Manifest resolution: fetch + parse relate.project-install.json + version match'
    description: |
      Add resolve.go to neo4j-cli/internal/dataset. Resolve(ctx, owner/repo,
      neo4jVersion) fetches relate.project-install.json from raw.githubusercontent
      (branch main, then master), parses dbms[], and selects the entry whose
      targetNeo4jVersion semver range matches the target version (newest compatible
      on ambiguity). Returns a Spec {DumpPath, Plugins, MatchedVersionRange}. Verify
      the selected dumpFile path exists in the repo and error clearly if not.
    status: completed
    dependencies: []
    acceptance_criteria:
      - "Resolve tries branch main then falls back to master"
      - "Selects the dbms[] entry whose targetNeo4jVersion range matches; picks newest compatible when several match"
      - "Returns Spec with DumpPath, Plugins, MatchedVersionRange"
      - "Errors clearly when no compatible entry exists or the dump path is missing in the repo"
      - "Tests stub the manifest fetch via httptest (no real network)"
    completed_at: 2026-06-04T16:08:00Z

  - id: task-003
    title: 'Secure, LFS-aware dump downloader (streamed, capped, allowlisted)'
    description: |
      Add download.go to neo4j-cli/internal/dataset. Download(ctx, spec, maxSize)
      fetches the dump from the Git-LFS media host
      (media.githubusercontent.com/media/...), HTTPS-only, against a host allowlist
      (media./raw.githubusercontent.com, github.com, codeload.github.com), streamed
      to a 0600 temp file (no io.ReadAll), capped at maxSize (default 2GiB), with a
      cleanup func. Detect an LFS pointer payload and fail loudly. Model on
      update/swap.go (assertAllowedHost, redactURL).
    status: pending
    dependencies:
      - task-002
    acceptance_criteria:
      - "Downloads from media.githubusercontent.com, not raw. (which returns an LFS pointer)"
      - "Rejects non-HTTPS and non-allowlisted hosts; redacts URLs in any error/log"
      - "Streams to a 0600 temp file and returns a cleanup func; never reads the whole dump into memory"
      - "Enforces the size cap and errors when exceeded"
      - "Detects an LFS pointer ('version https://git-lfs...') and fails with a clear error"
      - "Tests stub the media host via httptest and cover pointer-detection + cap paths"
    completed_at: null

  - id: task-004
    title: 'dataset discovery command: parent help signpost + list leaf'
    description: |
      Create the cobra package neo4j-cli/internal/subcommands/dataset (dataset.go,
      list.go, list_test.go) following the one-file-per-leaf layout. The dataset
      parent registers --format and its Long/help signposts the three per-target load
      commands (docker load, desktop dbms load, aura instance load). dataset list
      renders the curated suggestions honoring --format. Mount dataset.NewCmd(cfg) in
      neo4j-cli/app/app.go. No load leaf under dataset.
    status: pending
    dependencies:
      - task-001
    acceptance_criteria:
      - "neo4j-cli dataset --help describes the three per-target load commands"
      - "neo4j-cli dataset list renders slug/title/description/repo in json, table, and toon"
      - "dataset.NewCmd is mounted in app.go and reachable as 'neo4j-cli dataset'"
      - "dataset list has a flush-left Example with >=2 invocations incl. one --format json"
      - "No load leaf exists under dataset"
    completed_at: null

  - id: task-005
    title: 'Docker loader helper + docker load leaf (new/existing container)'
    description: |
      Add neo4j-cli/internal/subcommands/docker/load.go and register 'docker load' in
      docker.go. New container: download dump, run a one-shot loader container on a
      named volume (neo4j-admin database load <db> --from-path=/import
      --overwrite-destination=true), then create the server container reusing that
      volume with NEO4J_PLUGINS from the manifest, image version satisfying the dump's
      targetNeo4jVersion; expose this as a reusable LoadDumpIntoNewContainer helper.
      Existing container (--force required): Bolt STOP DATABASE <db> -> docker exec
      neo4j-admin database load -> START DATABASE <db>; refuse if a manifest-required
      plugin is missing. Shared flags --name, --database (default neo4j), --max-size,
      --force, --wait, --version. Honor --wait via docker.WaitForBolt. Reuse
      NewDeployClient, the dockerClient iface, create.go port/name helpers, renderEnvFile.
    status: pending
    dependencies:
      - task-002
      - task-003
    acceptance_criteria:
      - "New container loads the dump on a named volume and starts with NEO4J_PLUGINS from the manifest"
      - "Image version is chosen to satisfy the dump's targetNeo4jVersion"
      - "Existing container is refused without --force; with --force it overwrites via STOP/load/START"
      - "Existing container missing a manifest plugin is refused with a clear error"
      - "--database overrides the default 'neo4j' target database; --wait uses docker.WaitForBolt"
      - "LoadDumpIntoNewContainer is exported for reuse by the aura loader"
      - "Tests swap the docker client via the clientFactory seam and stub manifest/LFS via httptest"
    completed_at: null

