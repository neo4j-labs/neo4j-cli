      - task-003
      - task-005
    acceptance_criteria:
      - "Errors early (before instance creation) when no local Docker daemon is available"
      - "Hard-errors before any work when manifest plugins include graph-data-science"
      - "Creates a new instance, stages via ephemeral docker, pushes with docker.PushToAura, then tears down"
      - "Reuses the instance create flag set and utils/resolve.go for org/project"
      - "Tests cover the GDS hard-error and docker-absent early-error paths"
    completed_at: null

