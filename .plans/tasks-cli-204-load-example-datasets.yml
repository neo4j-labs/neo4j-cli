  - id: task-003
    title: 'Secure, LFS-aware dump downloader (streamed, capped, allowlisted)'
    description: |
      Add download.go to neo4j-cli/internal/dataset. Download(ctx, spec, maxSize)
      fetches the dump from the Git-LFS media host
      (media.githubusercontent.com/media/...), HTTPS-only, against a host allowlist
      (media./raw.githubusercontent.com, github.com, codeload.github.com), streamed
      to a 0600 temp file (no io.ReadAll), capped at maxSize (default 2GiB), with a
      cleanup func. Detect an LFS pointer payload and fail loudly. Model on
      update/swap.go (assertAllowedHost, redactURL).
    status: completed
    dependencies:
      - task-002
    acceptance_criteria:
      - "Downloads from media.githubusercontent.com, not raw. (which returns an LFS pointer)"
