  - id: task-012
    title: 'Scope docker loader bind-mount to a dedicated temp subdir'
    description: |
      The docker new-container loader in LoadDumpIntoNewContainer
      (neo4j-cli/internal/subcommands/docker/load.go) bind-mounts the dump's parent
      directory into the one-shot loader container via `-v <dumpDir>:/import:ro`, where
      `dumpDir = filepath.Dir(load.DumpPath)`. Because dataset.Download creates the dump
      with os.CreateTemp("", ...), dumpDir is the whole host temp directory (os.TempDir()),
      so the ephemeral loader container can read every file currently in the host temp dir
      (read-only). The exposure is limited (read-only, the user's own ephemeral container,
      the user's own files), hence Low severity, but it is broader than necessary. Fix:
      stage the dump in a dedicated per-load directory (e.g. os.MkdirTemp) and bind-mount
      only that directory, so the loader sees just the one dump file. This likely means
      having Download (or the loader) place the file in an isolated subdir, or copying the
      single dump into a fresh MkdirTemp dir before constructing the mount; ensure the
      dedicated dir is cleaned up alongside the existing cleanup. Keep behavior identical
      otherwise.
    status: completed
    dependencies: []
    source: review
    acceptance_criteria:
      - "The loader container bind-mounts a directory containing only the dump file, not the shared host temp dir"
      - "The dedicated staging directory is removed after the load (no temp leak)"
      - "Existing docker load tests pass; make test, make fmt-check, make lint clean"
    completed_at: 2026-06-04T23:45:00Z

  - id: task-013
    title: 'Downloader must support regular-blob dumps, not just Git-LFS'
    description: |
      The dataset dump downloader (neo4j-cli/internal/dataset/download.go) is broken for
      the common case. It ALWAYS fetches the dump from the Git-LFS media host
      (media.githubusercontent.com/media/<owner>/<repo>/<branch>/<dumpPath>), assuming
      every neo4j-graph-examples dump is Git-LFS-tracked. That assumption is wrong:
      verified live against neo4j-graph-examples/movies, the dump data/movies-50.dump is
      stored as a REGULAR Git blob — raw.githubusercontent.com/.../data/movies-50.dump
      returns HTTP 200 with the real binary dump bytes (NOT an LFS pointer), while
      media.githubusercontent.com/media/.../data/movies-50.dump returns HTTP 404 (the
      media host only serves LFS-tracked files). So `neo4j-cli docker load
      neo4j-graph-examples/movies` fails with: download dataset dump: dump
      "data/movies-50.dump" not found at the media URL. The HEAD existence check in
      resolve.go (assertPathExists) hit raw and got 200, masking the mismatch. FIX: the
      downloader must support BOTH storage shapes. Fetch from raw.githubusercontent.com
      FIRST and sniff the leading bytes; if the body IS a Git-LFS pointer
      ("version https://git-lfs..."), THEN fall back to the media host and stream that;
      otherwise raw already returned the real dump bytes, so stream those directly.
      Preserve all existing protections: HTTPS-only, host allowlist (pre-dispatch and
      post-redirect), size cap (limit+1 idiom), 0600 temp file, URL redaction in errors,
      streaming (no io.ReadAll of the dump).
    status: completed
    dependencies: []
    source: review
    acceptance_criteria:
      - "Download fetches raw.githubusercontent.com first; when raw returns real dump bytes (regular blob) it streams those directly without ever calling the media host"
      - "When raw returns a Git-LFS pointer, Download falls back to media.githubusercontent.com/media/... and streams the real bytes"
      - "When raw returns a pointer AND media also 404s or returns a pointer, Download fails with a clear error"
      - "All existing protections preserved: HTTPS-only, host allowlist pre+post-redirect, size cap, 0600 temp file, URL redaction, streamed (no io.ReadAll)"
      - "download_test.go reworked to wire BOTH raw and media httptest hosts, with cases for blob-on-raw, pointer-then-media, and pointer-then-media-missing; existing cap/0600/redaction/non-https/non-allowlisted cases still pass"
      - "make test, make fmt-check, make lint all clean"
    completed_at: 2026-06-05T00:00:00Z

  - id: task-014
    title: 'Fix docker loader: run neo4j-admin via image entrypoint so loaded DB ownership matches the server'
    description: |
      The new-container path of LoadDumpIntoNewContainer (neo4j-cli/internal/subcommands/docker/load.go)
      runs the one-shot loader with `--entrypoint bash -c "<script>"`, bypassing the neo4j
      image's docker-entrypoint.sh. The neo4j image's default user is root, so the
      bypassed loader runs neo4j-admin as ROOT and writes /data/databases/<db>/* owned by
      root (uid 0). The long-lived server container, however, uses the image's entrypoint
      which drops to the neo4j user (uid 7474) via `su-exec neo4j:neo4j`. The server then
      cannot write the root-owned database files and the database fails to come online:
      `quarantine_marker` AccessDeniedException -> database 'neo4j' stays offline ->
      `docker load ... --wait` times out and queries fail with DatabaseUnavailable, even
      though Bolt/system db are up. Verified live against neo4j-graph-examples/movies.
      FIX: run the loader WITHOUT overriding the entrypoint, so docker-entrypoint.sh runs
      neo4j-admin as the neo4j user (its final dispatch is `exec su-exec neo4j:neo4j "$@"`
      for any non-`neo4j` command) and sets /data ownership consistently with the server.
      Concretely: (1) stage the dump as `<stageDir>/<database>.dump` (the loader needs the
      file named <database>.dump under --from-path); (2) drop `--entrypoint bash` and the
      `-c` shell script entirely — pass the command directly:
      `neo4j-admin database load <database> --from-path=/import --overwrite-destination=true`
      with mounts `-v <stageDir>:/import:ro -v <volume>:/data`; (3) IMPORTANT readability
      gotcha: because the loader now runs as uid 7474 (not root), it must be able to READ
      the mounted dump — the staged copy currently lands 0600 owned by the host uid, which
      uid 7474 inside the container cannot read. Make the staging dir 0755 and the staged
      <database>.dump 0644 (it is a public example dataset, bind-mounted read-only into a
      throwaway container, so world-readable on the staging copy is fine; the original
      0600 download temp in os.TempDir is unaffected). Dropping the bash `-c` script also
      removes the `%q`-is-not-shell-quoting concern the security review flagged. Leave the
      existing-container path (which uses `docker exec` ExecAs as the neo4j user inside an
      already-running container) unchanged. Update docker load_test.go assertions that
      inspect the loader Run args/script to match the new no-entrypoint-override,
      named-dump form.
    status: pending
    dependencies: []
    source: review
    acceptance_criteria:
      - "The loader container runs with the image's default entrypoint (no --entrypoint bash, no -c shell script); the command is neo4j-admin database load <database> --from-path=/import --overwrite-destination=true"
      - "The dump is staged as <stageDir>/<database>.dump; the staging dir is 0755 and the staged dump is 0644 so the in-container neo4j user (7474) can read it"
      - "After load, the server container's neo4j database comes online (loaded data owned by the neo4j uid, not root)"
      - "Existing-container path is unchanged; docker load_test.go updated to the new loader-args shape and passes"
      - "make test, make fmt-check, make lint all clean"
    status: completed
    completed_at: 2026-06-05T00:00:00Z

  - id: task-015
    title: 'Pass NEO4J_ACCEPT_LICENSE_AGREEMENT to the docker loader container'
    description: |
      After task-014 the one-shot loader runs via the neo4j image's DEFAULT entrypoint
      (docker-entrypoint.sh). For the enterprise image that entrypoint enforces the
      license gate: if NEO4J_ACCEPT_LICENSE_AGREEMENT is not set it prints the license
      notice and never execs the requested command — so neo4j-admin database load never
      runs and the resulting database is EMPTY (verified live: `docker load
      neo4j-graph-examples/movies` produced an online but 0-node database). The old
      bash-override loader bypassed the entrypoint, so it never hit this gate (but ran as
      root — the task-014 bug). The server container already passes
      `-e NEO4J_ACCEPT_LICENSE_AGREEMENT=eval`; the loader container must too. FIX: add
      `-e`, `NEO4J_ACCEPT_LICENSE_AGREEMENT=eval` to the loaderArgs in
      LoadDumpIntoNewContainer (neo4j-cli/internal/subcommands/docker/load.go), before the
      image arg. License acceptance is not a secret, so passing it as an argv `-e KEY=VALUE`
      flag (rather than via process env) is acceptable and matches the server container.
      Verified manually end-to-end: with the license env the loader reports `Done: 83
      files, 1.134MiB processed`, the loaded files are owned by uid 7474, and a server on
      that volume returns 171 nodes for the movies dataset. Update the docker load_test.go
      loader-args assertion to require the NEO4J_ACCEPT_LICENSE_AGREEMENT=eval `-e` flag on
      the loader.
    status: pending
    status: completed
    dependencies:
      - task-014
    source: review
    acceptance_criteria:
      - "The loader container args include -e NEO4J_ACCEPT_LICENSE_AGREEMENT=eval (before the image arg)"
      - "docker load_test.go asserts the loader passes the license-acceptance -e flag"
      - "make test, make fmt-check, make lint all clean"
    completed_at: 2026-06-05T08:00:00Z

  - id: task-016
    title: 'Resolver: treat 5.x dumps as compatible with calver (>=2025.0) and "latest" targets'
    description: |
      Neo4j 5 was renamed to calendar versioning (2025.x.y, 2026.x.y) — calver is the
      continuation of the 5.x line. The neo4j-graph-examples manifests still declare 5.x
      dumps with ranges like targetNeo4jVersion ">=5.0.0 <6.0.0". Our resolver matches the
      target Neo4j version against those ranges with pure semver (golang.org/x/mod/semver),
      so a calver target like "2026.05.0" sorts far above "6.0.0" and matches NOTHING ->
      "no dump entry compatible with neo4j 2026.x" — even though a v5 dump loads and runs
      perfectly on the latest neo4j (verified live: movies-50.dump loaded into neo4j
      2026.05.0 -> database online, 171 nodes). We want people on the latest Neo4j, so a
      "5" dumpfile must be selectable for targets that are 5.x OR calver (>=2025.0) OR the
      literal "latest".
      FIX (neo4j-cli/internal/dataset, resolve.go + version.go):
      1. Resolve must accept the literal target "latest" (today canonicalVersion("latest")
         is not valid semver and Resolve rejects it). Treat "latest" as "newest neo4j"
         (calver-equivalent) for matching.
      2. Define a 5.x-line dump entry as one whose range lower bound is >= 5.0.0 (and the
         existing 4.x/3.5 entries have lower bounds < 5.0.0). When the target is calver
         (semver major year >= 2025, i.e. semver.Compare(target, "v2025.0.0") >= 0) OR
         "latest", an entry MATCHES if its lower bound >= 5.0.0 — i.e. a 5.x-or-newer dump
         applies to calver/latest. Concrete (non-calver) targets keep the existing exact
         range matching unchanged.
      3. Keep the newest-lower-bound tie-break so that if a manifest later adds an explicit
         calver entry (e.g. ">=2025.0.0"), a calver/latest target prefers it over the 5.x
         entry (2025.0.0 > 5.0.0), while a concrete "5.26" target still picks the 5.x entry.
      This also unblocks the desktop new-DBMS path, which auto-picks Desktop's latest stable
      enterprise version (a calver string) and passes it to Resolve — today that would fail.
    status: pending
    dependencies: []
    source: review
    acceptance_criteria:
      - "Resolve accepts target \"latest\" (no longer rejected as invalid semver) and selects the newest 5.x-or-later dump"
      - "Calver targets (e.g. 2025.01.0, 2026.05.0) select the 5.x dump entry from a movies-style manifest (3.5/4.0/4.3/5.0 entries)"
      - "Concrete targets still match exactly: 5 / 5.26 / 5.26.0 -> 5.x entry; 4.4 -> 4.3 entry; 3.5.1 -> 3.5 entry"
      - "With a manifest containing BOTH a 5.x entry and an explicit >=2025.0.0 entry, a calver/latest target picks the calver entry (newest lower bound), while 5.26 picks the 5.x entry"
      - "A manifest whose only entry is <5.0.0 yields a clear 'no dump entry compatible' error for calver/latest targets"
      - "Table-driven tests cover all the above; make test, make fmt-check, make lint clean"
    status: completed
    completed_at: 2026-06-05T12:00:00Z

  - id: task-017
    title: 'Docker load: default to latest Neo4j; map "latest" image to neo4j:enterprise'
    description: |
      Per the product decision, loading a dataset should default to the LATEST Neo4j (not a
      pinned 5.x), so users don't run old versions. Change docker load's --version default
      from "5" to "latest" in LoadDumpIntoNewContainer / the docker load leaf
      (neo4j-cli/internal/subcommands/docker/load.go). Two things must be handled:
      1. Image mapping: the loader currently hardcodes `image := "neo4j:" + version +
         "-enterprise"`, which for version "latest" yields the UNPUBLISHED tag
         `neo4j:latest-enterprise`. create.go already has the correct mapping (enterprise +
         "latest" -> `neo4j:enterprise`; enterprise + explicit version -> `neo4j:<v>-enterprise`,
         create.go lines ~299-307). Factor that into a small shared helper in the docker
