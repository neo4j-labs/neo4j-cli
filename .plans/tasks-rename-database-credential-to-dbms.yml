      - 'The `--credential` flag usage string in `query.go` references `credential dbms list`'
      - '`connect_test.go` test cases that assert the not-found error message are updated to expect `credential dbms list`'
      - '`make test` passes for the `neo4j-cli/query` package'
    completed_at: 2026-05-06T10:30:00Z

