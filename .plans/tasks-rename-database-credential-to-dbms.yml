tasks:
  - id: task-001
    title: 'Rename credential storage layer: database → dbms'
    description: |
      Rename all types and files in the credential storage layer from `database` to `dbms`.
      Create `common/clicfg/credentials/dbms.go` with renamed types (`DbmsCredentials`,
      `DbmsCredential`, `PrintableDbmsCredentials`) by renaming `database.go`. Update
      `credentials.go` to rename the `Database` field to `Dbms`, change the JSON tag from
      `"database"` to `"dbms"`, and update the `onUpdate` wiring after JSON unmarshal.
      Rename `database_test.go` to `dbms_test.go` and update all type references within it.
    status: completed
    dependencies: []
    acceptance_criteria:
      - '`common/clicfg/credentials/database.go` is deleted; `dbms.go` exists with types `DbmsCredentials`, `DbmsCredential`, `PrintableDbmsCredentials`'
      - '`CredentialsFile` and `Credentials` structs in `credentials.go` use field `Dbms *DbmsCredentials` with JSON tag `"dbms"`'
      - '`credentials.go` `load()` re-wires `onUpdate` for the `Dbms` field (not `Database`)'
      - '`database_test.go` is deleted; `dbms_test.go` exists with all type references updated'
      - '`make test` passes for the `common/clicfg/credentials` package'
    completed_at: 2026-05-06T09:15:00Z

  - id: task-002
    title: 'Rename credential command package: database → dbms'
    description: |
      Rename the Go package and directory from `credential/database` to `credential/dbms`.
      Create `neo4j-cli/internal/subcommands/credential/dbms/` with all files from the
      old `database/` directory, updating the package declaration to `package dbms` in each
      file. Change the parent command `Use` field from `"database"` to `"dbms"` and update
      `Short` descriptions to say "dbms" where applicable. Update `credential.go` to import
      the new `dbms` package and call `dbms.NewCmd(cfg)` instead of `database.NewCmd(cfg)`.
    status: completed
    dependencies:
      - task-001
    acceptance_criteria:
      - '`neo4j-cli/internal/subcommands/credential/database/` directory is deleted; `dbms/` directory exists with all four leaf files'
      - 'All files in `dbms/` declare `package dbms`'
      - '`database.go` (the parent) has `Use: "dbms"`'
      - '`credential.go` imports `dbms` package and calls `dbms.NewCmd(cfg)`'
      - '`make test` passes for the `credential/dbms` package'
    completed_at: 2026-05-06T10:00:00Z

