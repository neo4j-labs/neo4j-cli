tasks:
  - id: task-001
    title: 'Add hashicorp/mdns dep and scaffold isolated discovery_mdns.go'
    description: |
      Add github.com/hashicorp/mdns (MIT) via go get and run go mod tidy. Create
      neo4j-cli/internal/desktopclient/discovery_mdns.go isolating ALL mDNS library
      imports and the macOS dns-sd exec. Define MDNSServiceType="_neo4j-desktop-2._tcp",
      mdnsInstanceName="Neo4j Desktop 2", mdnsDomain="local.", tight tier timeouts,
      and the test seams (mdnsBrowseFn=browseDesktopMDNS, dnssdLookupFn=lookupDesktopDNSSD)
      with SetXxxFnForTest restorers. Implement browseDesktopMDNS (mdns.QueryContext,
      first ServiceEntry.Port) and lookupDesktopDNSSD (goosFn()=="darwin" + exec.LookPath
      gate; dns-sd -L streamed under a deadline, parse first ":<port>" line, then kill).
      Both return (port int, ok bool) and never an error the caller must branch on.
      Include a doc comment capturing the macOS Local Network permission rationale.
    status: completed
    dependencies: []
    acceptance_criteria:
      - "github.com/hashicorp/mdns is in go.mod/go.sum; transitive deps (miekg/dns, x/net) resolve; go build ./... passes"
      - "All mDNS library imports and the dns-sd exec live only in discovery_mdns.go"
      - "browseDesktopMDNS and lookupDesktopDNSSD return (port, ok), returning (0,false) on miss/error/timeout/missing-binary/non-darwin"
      - "mdnsBrowseFn and dnssdLookupFn seams exist with SetMDNSBrowseFnForTest / SetDNSSDLookupFnForTest restorers matching the package pattern"
      - "New .go file carries the Neo4j copyright header (make license-check passes)"
    completed_at: 2026-06-01T09:05:00Z

  - id: task-002
    title: 'Add Discover orchestrator, DiscoverViaMDNS, mdnsOrigin, and e2e mDNS seam'
    status: completed
    description: |
      In discovery.go add the high-level Discover(ctx, pinned) orchestrator plus
      DiscoverViaMDNS(ctx), discoverPinned(ctx, pinned), and mdnsOrigin(port) (returns
      "http://127.0.0.1:<port>", honoring e2eOriginOverride). Ordering: pinned!=0 -> mDNS
      confirm the port (127.0.0.1) else ProbePort(ctx,pinned) (localhost); pinned==0 ->
      (1) mDNS multicast, (2) macOS dns-sd if (1) empty, (3) ProbePort(ctx,0) legacy scan.
      Every tier fails gracefully and falls through; Discover returns ErrNoDesktop ONLY
      after the port scan also misses. Leave ProbePort/origin/ProbeResult intact (update
      ProbeResult.Origin doc to note localhost-or-127.0.0.1). Declare e2eMDNSPortOverride
      in discovery.go and wire NEO4J_CLI_DESKTOP_E2E_MDNS_PORT in seams_e2e.go (assignment
      only there); update the seams_e2e.go package doc block. seams_default.go unchanged.
    dependencies:
      - task-001
    acceptance_criteria:
      - "Discover(ctx,pinned) implements the documented tier ordering and graceful per-tier fallthrough"
      - "mDNS/dns-sd results carry Origin http://127.0.0.1:<port>; port-scan results keep http://localhost:<port>"
      - "Discover returns ErrNoDesktop only when all tiers (including the legacy scan) miss"
      - "ProbePort, origin(), and ProbeResult are unchanged except the Origin doc comment"
      - "e2eMDNSPortOverride is declared in discovery.go and assigned only under the e2e_desktop_seams build tag via NEO4J_CLI_DESKTOP_E2E_MDNS_PORT"
    completed_at: 2026-06-01T08:41:41Z

  - id: task-003
    title: 'Unit-test all discovery tiers via seams (hermetic)'
    description: |
      Create discovery_mdns_test.go and extend discovery_test.go to drive Discover /
      DiscoverViaMDNS / discoverPinned through the mdnsBrowseFn, dnssdLookupFn, httpClientFn
      and goosFn seams with NO real multicast or dns-sd invocation. Cover: mDNS hit
      (127.0.0.1 origin+port), mDNS miss + dns-sd hit on darwin (127.0.0.1), all-miss ->
      port-scan fallback (localhost), pinned + mDNS-confirm (127.0.0.1), pinned + silent
      (localhost), and ctx-cancelled. Prefer table-driven cases. Must pass on ubuntu,
      windows, and macos runners without network access.
    status: completed
    dependencies:
      - task-002
    acceptance_criteria:
      - "Tests exercise every tier and the pinned-port branches purely through seams (no real multicast/dns-sd)"
      - "Origin assertions verify 127.0.0.1 for mDNS/dns-sd paths and localhost for port-scan path"
      - "go test ./neo4j-cli/internal/desktopclient/... passes and is hermetic (no network dependency)"
      - "Tests follow the existing SetXxxFnForTest restore pattern with t.Cleanup/defer"
    completed_at: 2026-06-01T10:05:00Z

