  - id: task-018
    title: "Warn on non-ErrNotFound errors in loadCredFromKeyring"
    description: |
      In loadCredFromKeyring (credentials.go, the startup/SetStorageMode path), when a keyring read
      returns an error that is not ErrNotFound, the function currently silently stops processing
      remaining sensitive fields and returns migrated=false with no output. The warnW parameter is
      threaded through this call chain for exactly this purpose but goes unused on this path.

      Fix: before the early return on a non-ErrNotFound error, write a warning to warnW:
        fmt.Fprintf(warnW, "Warning: keyring read failed for %s: %v\n", f.key, err) //nolint:errcheck
        return migrated

      This surfaces unexpected keyring I/O failures (daemon crash, permission denied) immediately
      rather than letting the user encounter confusing downstream auth errors.

      Add a test in the appropriate keyring test file asserting that when the mock keyring returns a
      non-ErrNotFound error for a field, the warning appears in the bytes.Buffer passed as warnW.
      Run make test, make fmt-check, make lint as final gates.
    status: completed
    completed_at: "2026-05-28T18:30:00Z"
    source: review
    dependencies:
      - task-017
    acceptance_criteria:
      - "loadCredFromKeyring writes 'Warning: keyring read failed for <key>: <err>' to warnW before returning on non-ErrNotFound errors"
      - "A test asserts the warning appears in the warnW buffer when the keyring returns an unexpected error"
      - "ErrNotFound paths (missing field, auto-migrate) are unaffected"
      - "make test, make fmt-check, make lint all pass"

