  - id: task-013
    title: "Move deleteFromKeyring to item types and add to keyringCredential interface"
    description: |
      Currently deleteFromKeyring is on collection types (*AuraCredentials, *DbmsCredentials,
      *EmbedCredentials) and takes a name string parameter because the item was already removed
      from the slice. All other keyring methods (writeToKeyring, loadFromKeyring, etc.) are on
      item types and accessible via the keyringCredential interface. This asymmetry means deletion
      is not part of the uniform interface.
      Refactor RemoveAura, RemoveDbms, and RemoveEmbed in credentials.go to use a Get-before-Remove
      pattern: lookup the item pointer before calling Remove(), then call deleteFromKeyring on
      the item pointer (which knows its own name). Move deleteFromKeyring from the collection types
      (*AuraCredentials, *DbmsCredentials, *EmbedCredentials) to the item types (*AuraCredential,
      *DbmsCredential, *EmbedCredential) with signature deleteFromKeyring(provider KeyringProvider) error.
      Add deleteFromKeyring(provider KeyringProvider) error to the keyringCredential interface.
      Update compile-time assertions. Update tests to call the new item-type methods.
      Run make test, make fmt-check, make lint as final gates.
    status: completed
