  - id: task-016
    title: "Replace 6 keyringCredential interface methods with sensitiveFields() for generic implementations"
    description: |
      The keyringCredential interface currently has 8 methods. Five of them (zeroSensitiveFields,
      saveSensitiveFields, restoreSensitiveFields, validateForMigration, and to a large extent
      writeToKeyring and loadFromKeyring) exist solely to service the generic loops in
      saveWithKeyring, MigrateToKeyring, and loadSensitiveFieldsFromKeyring. These methods are
      implementation-detail helpers for a single caller leaking into the interface. The per-type
      code (aura.go, dbms.go, embed.go) each implement them separately with positional slice
      indexing and identical structural logic.

      Code-judo move: add a sensitiveField struct to keyring.go:
        type sensitiveField struct {
            ptr      *string  // pointer into the credential struct field
            key      string   // full keyring key string (e.g. "aura/prod/client-secret")
            required bool     // true: missing → hard error; false: missing → silent skip
        }
      Replace the five per-type methods with a single sensitiveFields() []sensitiveField method on
      each credential type (AuraCredential, DbmsCredential, EmbedCredential). Implement
      zeroSensitiveFields, validateForMigration, the keyring-write loop, the keyring-read loop
      (loadFromKeyring/migrateFromKeyring), and the save/zero/restore dance generically in
      credentials.go using the sensitiveFields() slice. The keyringCredential interface shrinks to
      two methods: sensitiveFields() []sensitiveField and deleteFromKeyring(provider KeyringProvider)
      error. Remove the five replaced methods from all three concrete types. Update compile-time
      assertions. Run make test, make fmt-check, make lint as final gates.

      Per-type sensitiveFields() implementations:
        AuraCredential: [{&c.ClientSecret, "aura/<name>/client-secret", true},
                         {&c.AccessToken,  "aura/<name>/access-token",  false}]
        DbmsCredential: [{&c.Password, "dbms/<name>/password", true}]
        EmbedCredential:[{&c.APIKey,   "embed/<name>/api-key", false}]
    status: completed
    completed_at: "2026-05-28T17:30:00Z"
    source: review
    dependencies:
