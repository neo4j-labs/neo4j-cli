      on Credentials. The method contains the json.Marshal + fileutils.WriteFile logic currently
      in save()'s else branch. save() calls saveToJSON() for the insecure path; saveWithKeyring
      and MigrateToInsecure will also call it in later tasks. No behavioural change; all
      existing tests must pass unchanged.
    status: pending
    dependencies: []
    acceptance_criteria:
      - "saveToJSON() method exists on Credentials and contains the json.Marshal + fileutils.WriteFile path"
      - "save() calls saveToJSON() for the insecure branch; saveWithKeyring() is unchanged for now"
      - "make test passes with no changes to test files"
    completed_at: null

  - id: task-002
    title: "Fix GlobalConfig.CredentialStorage() default to StorageModeInsecure"
    description: |
      Change GlobalConfig.CredentialStorage() in common/clicfg/clicfg.go to return
      StorageModeInsecure (not "keyring") when credential-storage is absent from viper.
      Add a comment explaining that the actual first-run default decision lives in
      initCredentialStorageDefault; CredentialStorage() is only the persisted-value accessor.
      This aligns the method's documented default with the NewCredentials() boot default.
    status: pending
    dependencies: []
    acceptance_criteria:
      - "CredentialStorage() returns StorageModeInsecure when viper has no credential-storage key"
      - "A comment on the method explains it is a read accessor; first-run default logic lives in initCredentialStorageDefault"
      - "make test passes; no test expectations change"
    completed_at: null

  - id: task-003
    title: "Extract per-type keyring methods on AuraCredentials, DbmsCredentials, EmbedCredentials"
    description: |
      Add unexported keyring methods to each credential type in their respective files.
      AuraCredentials gets writeToKeyring(provider KeyringProvider) error,
      loadFromKeyring(provider KeyringProvider, warnW io.Writer) error (warn-and-continue semantics
      for startup), and migrateFromKeyring(provider KeyringProvider) error (strict/error semantics
      for explicit migration). DbmsCredentials and EmbedCredentials get equivalent methods for
      their respective fields. Each method encapsulates all sensitive fields for that type.
      The KeyringProvider is passed in (not accessed via the package-level defaultKeyring) so
      tests can inject mocks. zeroSensitiveFields() is also added to each type.
    status: completed
    dependencies: []
    acceptance_criteria:
      - "AuraCredentials has writeToKeyring, loadFromKeyring (warn-and-continue), migrateFromKeyring (strict), and zeroSensitiveFields methods"
      - "DbmsCredentials has the equivalent methods for the password field"
      - "EmbedCredentials has the equivalent methods for the api-key field"
      - "Each method is tested in the corresponding *_test.go file with a mock KeyringProvider"
      - "make test passes"
    completed_at: "2026-05-28T00:00:00Z"

  - id: task-004
    title: "Replace triple-iteration loops in credentials.go with per-type method calls"
    description: |
      Replace all five groups of three for _, cred := range c.{Aura,Dbms,Embed}.Credentials
      loops in credentials.go with calls to the per-type methods from task-003. After this change
      each function's iteration body is three calls (one per type). The MigrateToKeyring rollback
      logic (written/rollback/setKey) stays in credentials.go since it is cross-type. The
      loadSensitiveFieldsFromKeyring and saveWithKeyring functions still call the per-type
