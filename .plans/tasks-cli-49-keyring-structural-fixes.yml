  - id: task-014
    title: "Make MigrateToKeyring own its storageMode transition; simplify set.go"
    description: |
      MigrateToInsecure() sets c.storageMode = StorageModeInsecure as an internal side effect.
      MigrateToKeyring() does not — it leaves storageMode unchanged and expects the caller to call
      SetStorageMode() after persisting the config key. This asymmetry forces set.go to have two
      separate credential-storage if-blocks: one for migration (both directions) and a second one
      only for the keyring direction to call SetStorageMode. Any future maintainer reading the code
      must understand this hidden coupling to avoid double-setting or missing the mode update.

      Fix: at the end of MigrateToKeyring(), after zeroSensitiveFields() and save() succeed, set
      c.storageMode = StorageModeKeyring directly (mirroring MigrateToInsecure). In set.go, remove
      the second if-block that conditionally calls cfg.Credentials.SetStorageMode for the keyring
      path; the migration method now owns the transition for both directions. The doc comment on
      MigrateToKeyring that says "This method must be called while storageMode is still
      StorageModeInsecure" and "The caller should call SetStorageMode after persisting the config
      key" must be removed or corrected — the precondition is already wrong (the repair pass calls
      MigrateToKeyring when storageMode is already keyring and it works correctly because fields are
      zeroed before save() is called).

      Note on save() dispatch: MigrateToKeyring zeroes all sensitive fields before calling save(). If
      storageMode is insecure at that point, save() calls saveToJSON() (correct, scrubs JSON). If
      storageMode is already keyring (repair pass), save() calls saveWithKeyring(), which finds all
      fields zeroed and writes no keyring entries, then scrubs JSON — also correct. Setting
      c.storageMode = StorageModeKeyring AFTER save() avoids any dispatch ambiguity and is the
      cleanest placement.
    status: completed
    completed_at: "2026-05-28T17:00:00Z"
    source: review
    dependencies:
      - task-013
    acceptance_criteria:
      - "MigrateToKeyring() sets c.storageMode = StorageModeKeyring after save() returns nil"
      - "The doc comment on MigrateToKeyring no longer says 'must be called while storageMode is insecure' or 'caller should call SetStorageMode'"
      - "set.go has no post-migration if-block that calls cfg.Credentials.SetStorageMode for the keyring path"
      - "set.go's credential-storage handling is a single symmetric block: migrate then persist config (SetStorageMode call removed)"
      - "make test, make fmt-check, make lint all pass"

