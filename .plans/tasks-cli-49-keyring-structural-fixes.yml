  - id: task-023
    title: "Simplify dead error check after c.save() in MigrateToKeyring"
    description: |
      In MigrateToKeyring, after zeroing all sensitive fields, the function calls c.save() and
      checks its error return. At this point all fields are zeroed, so save() dispatches to
      either saveToJSON() (which panics on error, never returns one) or saveWithKeyring() (whose
      loop skips all empty fields and returns nil unconditionally). The error check is dead in
      both paths.

      Two acceptable remedies:
        a. Simplify to a bare c.save() call with a comment explaining why no error is possible,
           plus a //nolint:errcheck if the linter requires it.
        b. If save() can be replaced with saveToJSON() directly (since mode is still insecure
           during migration), prefer the more direct call.
      Run make test, make fmt-check, make lint as final gates.
    status: pending
    source: review
    dependencies:
      - task-022
    acceptance_criteria:
      - "The dead if-err block after c.save() in MigrateToKeyring is removed or replaced with a documented intent"
      - "make test, make fmt-check, make lint all pass"

  - id: task-024
    title: "Thread warnW through getToken in token.go; remove direct os.Stderr write"
    description: |
