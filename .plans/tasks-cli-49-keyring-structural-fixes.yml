  - id: task-017
    title: "Extract removeAndCleanKeyring helper; deduplicate RemoveAura/Dbms/Embed"
    description: |
      RemoveAura, RemoveDbms, and RemoveEmbed in credentials.go are line-for-line copies of the same
      three-step pattern: Get the credential item, call the type-specific Remove, then (in keyring mode)
      call cred.deleteFromKeyring and write any error as a warning to warnW.

      Add a private method on Credentials:
        func (c *Credentials) removeAndCleanKeyring(cred keyringCredential, remove func() error, warnW io.Writer) error

      The method calls remove(); if that succeeds and storageMode == StorageModeKeyring, it calls
      cred.deleteFromKeyring(defaultKeyring) and writes any non-nil error as a warning to warnW. No
      error is returned for keyring cleanup failures.

      Rewrite each Remove* method to: Get the item, return the Get error if any, then delegate to
      c.removeAndCleanKeyring(cred, func() error { return c.Xxx.Remove(name) }, warnW).

      No behaviour changes — the three methods must exhibit identical observable behaviour after the
      refactor. Run make test, make fmt-check, make lint as final gates.
    status: completed
    completed_at: "2026-05-28T18:00:00Z"
    source: review
    dependencies:
      - task-016
    acceptance_criteria:
