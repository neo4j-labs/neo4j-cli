      - "saveWithKeyring, MigrateToKeyring, MigrateToInsecure, and loadSensitiveFieldsFromKeyring each delegate to per-type methods"
      - "make test passes with no changes to test expectations"
    completed_at: null

  - id: task-005
    title: "Replace saveWithKeyring snapshot boilerplate with zero-restore pattern"
    description: |
      Remove the three scrubbed-snapshot struct constructions (auraSnap, dbmsSnap, embedSnap)
      from saveWithKeyring. Replace with: save sensitive field values to locals, call each
      type's zeroSensitiveFields(), call saveToJSON(), then restore the saved values.
      This collapses ~30 lines to ~10 lines and eliminates the per-type snapshot variables.
      Restoration on panic is acceptable to omit (consistent with current marshal-panic behaviour).
    status: pending
    dependencies:
      - task-001
      - task-004
    acceptance_criteria:
      - "saveWithKeyring contains no auraSnap, dbmsSnap, or embedSnap variables"
      - "saveWithKeyring calls saveToJSON() instead of directly marshalling scrubbed copies"
      - "Sensitive in-memory fields are restored to their original values after saveToJSON() returns"
      - "make test passes; credentials written to keyring are still persisted correctly"
    completed_at: null

  - id: task-006
    title: "Fix MigrateToInsecure: use saveToJSON() + own storageMode; simplify config/set.go"
    description: |
      In MigrateToInsecure, replace the prevMode/c.storageMode temporary mutation with a direct
      call to saveToJSON(). Before calling saveToJSON(), set c.storageMode = StorageModeInsecure
      so the function owns its own mode transition. Remove the doc comment that previously
      delegated this responsibility to callers. In config/set.go, remove the credentialStorageModeChanged
      flag and the post-migration SetStorageMode call for the MigrateToInsecure path, since
      MigrateToInsecure now handles it. Keep the SetStorageMode call after MigrateToKeyring.
    status: pending
    dependencies:
      - task-001
    acceptance_criteria:
      - "MigrateToInsecure contains no prevMode variable or temporary storageMode mutation"
      - "MigrateToInsecure sets c.storageMode = StorageModeInsecure before calling saveToJSON()"
      - "config/set.go has no post-migration SetStorageMode call for the insecure path"
      - "credentialStorageModeChanged flag is removed or simplified to cover only the keyring path"
      - "make test passes; migrating to insecure still writes plaintext to credentials.json"
    completed_at: null

