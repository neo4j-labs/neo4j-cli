tasks:
  - id: task-001
    title: "Randomise tmpNew filename in Swap() and update docstrings"
    description: |
      Edit neo4j-cli/internal/subcommands/update/swap.go. Inside
      `Swap()`, after `planSwap` returns success and before any
      network I/O, generate a per-invocation 8-byte random suffix
      using `crypto/rand` (both `crypto/rand` and `encoding/hex` are
      already imported) and build
      `tmpNew := filepath.Join(plan.tmpDir, "neo4j-cli.new."+hex.EncodeToString(randBytes[:]))`.
      On `rand.Read` failure return `fmt.Errorf("swap: generate tmp suffix: %w", err)`
      so the function fails closed before downloading anything.
      Remove the now-meaningless best-effort
      `_ = os.Remove(tmpNew)` at the current `swap.go:439` —
      collision is effectively impossible and `O_EXCL` in
      `writeRegularFile` already covers the theoretical case.
      Apply the random suffix uniformly to both direct and elevated
      branches (single construction site; `plan.tmpDir` already
      differs per branch). Update the file-level docstring at
      lines 29-35 (change `<plan.tmpDir>/neo4j-cli.new` to
      `<plan.tmpDir>/neo4j-cli.new.<rand>` and add a one-line note
      that the suffix closes a multi-user /tmp pre-plant DoS) and
      the inline comment block at lines 431-435 similarly. All
      existing cleanup `os.Remove(tmpNew)` calls keep targeting the
      same `tmpNew` variable — no logic change beyond the name
      construction.
    status: completed
    dependencies: []
    acceptance_criteria:
      - "`Swap()` constructs `tmpNew` with a 16-hex-char per-invocation random suffix using `crypto/rand` once per call."
      - "Construction happens after `planSwap` returns and before any HTTP download; a `rand.Read` failure returns a wrapped error and aborts before network I/O."
      - "Random suffix applied uniformly to both direct and elevated branches (single construction site, no branch-specific code)."
      - "Stale `_ = os.Remove(tmpNew)` pre-extract call removed; all subsequent `os.Remove(tmpNew)` cleanup calls still target the same `tmpNew` variable."
      - "File-level docstring (lines 29-35) and inline comment block (lines 431-435) updated to reflect the random suffix and reference the pre-plant DoS rationale."
      - "No new imports added (`crypto/rand` and `encoding/hex` already present)."
    completed_at: 2026-05-20T09:57:46Z

