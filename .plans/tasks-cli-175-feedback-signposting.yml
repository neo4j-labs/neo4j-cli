  - id: task-005
    title: 'Extract reportIssueFatal helper to collapse duplicated fatal panics in response.go'
    description: |
      handleResponseError in neo4j-cli/aura/internal/api/response.go repeats the same
      "unexpected error [status %d] running CLI with args %s, please report an issue in %s"
      NewFatalError construction ~8 times verbatim (status 308, 400-unmarshal,
      403-unmarshal, 404-unmarshal, 405-unmarshal, 402-unmarshal, 409-unmarshal,
      415, 5xx-unmarshal). There is a real code-judo move: a private helper
      reportIssueFatal(statusCode int) error that builds the canonical fatal error
      (using clievents.RedactArgs(os.Args[1:]) and clierr.IssuesURL) collapses every
      identical site to one line and single-sources the "report an issue" contract.
      Callers then do panic(reportIssueFatal(code)) or return reportIssueFatal(code).
      Leave the structurally different sites as-is unless they fit cleanly: the body-%s
      variant (~line 191, includes resBody) and the NewAuthError variant (~line 473,
      different type + WithSuggestion) and the plain message-append at ~line 483 are NOT
      part of the identical set — do not force them through the helper if it distorts them
      (the auth-error one keeps .WithSuggestion(authSuggestion)). Behavior must not change.
    status: completed
    source: review
    dependencies: []
    acceptance_criteria:
      - "A private reportIssueFatal(statusCode int) error helper exists in response.go and returns the canonical NewFatalError using clievents.RedactArgs and clierr.IssuesURL"
      - "All ~8 identical 'unexpected error [status %d]...report an issue' NewFatalError sites call the helper (via panic(...) or return ...)"
      - "Behaviour is unchanged: the rendered message text and exit code for each affected status code are identical to before"
      - "make test, make fmt-check, make lint pass"
    completed_at: 2026-06-01T12:05:00Z

