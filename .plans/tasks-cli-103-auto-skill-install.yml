  - id: task-006
    title: "Add bats-core behavioral tests for install-neo4j-cli.sh"
    description: |
      Create `distribution/installation-scripts/tests/install-neo4j-cli.bats`
      using bats-core. Each test injects a stub `neo4j-cli` script into PATH
      that records its arguments to a temp file. Test cases:
      1. `NEO4J_CLI_AUTO_INSTALL_SKILL=1`: stub is called with `skill install --rw`.
      2. Env var unset or `=0`: stub is never called.
      3. `=1` but stub exits non-zero: install script still exits 0.
      Document local run command in the test file header:
      `bats distribution/installation-scripts/tests/install-neo4j-cli.bats`
    status: not_started
    dependencies: []
    acceptance_criteria:
      - "All three test cases pass via `bats distribution/installation-scripts/tests/`"
      - "Tests pass on macOS and Linux without a real neo4j-cli binary installed"
