tasks:
  - id: task-001
    title: "Add NEO4J_CLI_AUTO_INSTALL_SKILL postinstall hook to npm package template"
    description: |
      Add a `scripts.postinstall` entry to `distribution/npm/cli/package.json.tmpl`
      that checks if `NEO4J_CLI_AUTO_INSTALL_SKILL === "1"` and, if so, calls
      `neo4j-cli skill install --rw` via the existing `bin/neo4j-cli.js` shim.
      The invocation must be wrapped in try/catch so any failure (including
      ErrNoAgentsDetected) does not fail `npm install`. If the env var is absent
      or any other value, the script exits 0 immediately.
    status: completed
    dependencies: []
    acceptance_criteria:
      - "`NEO4J_CLI_AUTO_INSTALL_SKILL=1 npm install -g @neo4j-labs/cli` triggers `skill install --rw`"
      - "`npm install -g @neo4j-labs/cli` with unset or `=0` var exits 0 with no skill action"
      - "Any non-zero exit from `skill install --rw` is caught and suppressed; `npm install` succeeds"
      - "`make npm-publish-dry` renders `postinstall` in the generated `package.json`"
    completed_at: 2026-05-14T00:00:00Z

  - id: task-002
    title: "Add post_install Ruby block to Homebrew formula via .goreleaser.yaml"
    description: |
      Add a `post_install` field to the `brews:` block in `.goreleaser.yaml`.
      GoReleaser embeds the string verbatim as a Ruby method in the generated
      formula. The block must return early unless `NEO4J_CLI_AUTO_INSTALL_SKILL`
      equals `"1"`, then call `system "#{bin}/neo4j-cli", "skill", "install", "--rw"`.
      Validate the rendered output using `make snapshot` and inspecting
      `dist/homebrew/Formula/neo4j-cli.rb`.
    status: completed
    dependencies: []
    acceptance_criteria:
      - "`make snapshot` produces a formula containing the correct `post_install` method"
      - "Formula `post_install` returns early when env var is unset or `=0`"
      - "Formula `post_install` calls `skill install --rw` when env var is `=1`"
      - "`brew audit --strict --formula dist/homebrew/Formula/neo4j-cli.rb` passes (or equivalent local check)"
    completed_at: 2026-05-14T10:00:00Z

  - id: task-003
    title: "Add NEO4J_CLI_AUTO_INSTALL_SKILL guard to install-neo4j-cli.sh"
    description: |
      Edit `distribution/installation-scripts/install-neo4j-cli.sh` on the main
      branch. After the binary is placed in PATH, add a block that skips unless
      `NEO4J_CLI_AUTO_INSTALL_SKILL` equals `"1"`, then calls
      `neo4j-cli skill install --rw || true` so any failure is non-fatal and
      the overall install is unaffected. The shellcheck.yml CI workflow validates
      this file on every PR.
    status: completed
    dependencies: []
    acceptance_criteria:
      - "`NEO4J_CLI_AUTO_INSTALL_SKILL=1 ./install-neo4j-cli.sh` calls `neo4j-cli skill install --rw` after binary placement"
      - "`./install-neo4j-cli.sh` with unset or `=0` var does not call `skill install`"
      - "A failed `skill install --rw` (e.g. no agents detected) does not abort the install script"
      - "`shellcheck distribution/installation-scripts/install-neo4j-cli.sh` passes with no errors"
    completed_at: 2026-05-14T00:00:00Z

  - id: task-004
    title: "Add NEO4J_CLI_AUTO_INSTALL_SKILL guard to install-neo4j-cli.ps1"
