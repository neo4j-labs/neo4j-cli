    status: completed
    dependencies:
      - task-016
    acceptance_criteria:
      - "Reads run inside ExecuteRead; writes (post-classification) run inside ExecuteWrite"
      - "Existing output rendering unchanged (queryResult shape preserved)"
      - "Schema and run output match prior CLI output for representative queries"
    completed_at: 2026-05-06T19:00:00Z

