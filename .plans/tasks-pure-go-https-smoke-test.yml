tasks:
  - id: task-001
    title: "Rewrite query_https_smoke_test.go as pure-Go integration test"
    description: |
      Replace the contents of neo4j-cli/query/query_https_smoke_test.go
      with a self-contained pure-Go test that performs the full HTTPS
      smoke flow: stdlib cert generation, random free-port allocation,
      docker container boot via os/exec, readiness wait, in-process
      cobra invocation for both positive (--insecure succeeds) and
      negative (default verification fails) assertions, and guaranteed
      teardown via t.Cleanup. Keep //go:build !windows and the
      NEO4J_HTTPS_TEST=1 env-var skip gate. No new module dependencies.
      Drive the CLI in-process via NewCmd(cfg).Execute() with stdout/
      stderr buffers — same harness pattern as run_test.go:77-87.
    status: completed
    dependencies: []
    acceptance_criteria:
      - "TestHTTPS_Smoke skips cleanly when NEO4J_HTTPS_TEST is not set to 1"
      - "Pre-flight checks docker via exec.LookPath and t.Fatals with a clear message when missing"
      - "Self-signed RSA-2048 cert (CN=localhost, 30-day) generated with stdlib crypto/* into t.TempDir(); private.key/public.crt at 0644, trusted/ and revoked/ subdirs at 0755"
      - "HTTPS and HTTP host ports picked via net.Listen('tcp', '127.0.0.1:0') — no hard-coded 7473/7474 on the host side"
      - "Container booted with the same NEO4J_* env vars as the old script, bind-mounted at /ssl:ro; pre-clean and t.Cleanup both run docker rm -f neo4j-https-test"
      - "Readiness loop polls https://127.0.0.1:<port> (InsecureSkipVerify) for up to 60s and dumps docker logs --tail 50 on timeout before t.Fatalf"
      - "Positive assertion: in-process NewCmd(cfg).Execute() with --insecure returns nil err and stdout contains '1'"
      - "Negative assertion: same invocation without --insecure returns an error whose message matches (?i)tls|x509|certificate"
      - "NEO4J_HTTPS_TEST=1 go test -run TestHTTPS_Smoke -v ./neo4j-cli/query/... passes locally; docker ps shows no neo4j-https-test after exit"
      - "go test ./... (no env var) is unaffected; make fmt-check and make lint are clean"
    completed_at: 2026-05-05T00:00:00Z

