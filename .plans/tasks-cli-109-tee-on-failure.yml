  - id: task-011
    title: 'Add integration test for the tee-on-failure wiring'
    description: |
      TEST GAP. main() is not unit-testable (it calls os.Exit), so the
      composition of the tee feature is currently verified only by manual smoke
      testing: the MultiWriter capture buffer being installed before
      cmd.Execute(), tee.Save being called with buf.Bytes(), WithTeePath being
      attached to the resolved *clierr.CLIError, the process exit code being
      preserved, and the confirm.ErrCancelled-before-Save ordering (cancellation
      must NOT tee). Every piece is unit-tested in isolation (common/tee,
      RedactText, BuildEnvelope/Render tee_path, commandSlug, teeContent) but
      their integration in main() is not — this is exactly the seam where the
      iteration-6 SilenceErrors bug hid (caught by code review, not by a test).
      Extract the failure-handling block from main() into a small testable helper
      (e.g. handleFailure(cfg, cmd, args, err) *clierr.CLIError that runs
      tee.Save on the captured+error content, attaches WithTeePath when a path is
      returned, and returns the resolved *CLIError) and add an integration test
      that drives it with a memfs-backed config and a synthetic failing error.
      Keep main() thin (call the helper); do not regress the existing
      confirm.ErrCancelled exit-0 path or the exit-code behaviour.
    status: pending
