    title: 'Regenerate skill bundle, add changelog, pass all gates'
    description: |
      Run go generate ./neo4j-cli/internal/skill/... to refresh the skill bundle
      (config help text embeds ValidConfigKeys) and commit source + regenerated
      bundle together. Add a user-facing changie Minor entry. Ensure the full gate
      suite passes.
    status: pending
    dependencies:
      - task-003
      - task-005
    acceptance_criteria:
      - "go generate ./neo4j-cli/internal/skill/... produces a clean git diff (TestGenerator_RoundTrip passes)"
      - "A single changie Minor entry for neo4j-cli describes the tee-on-failure feature"
      - "make test, make fmt-check, make lint, and make license-check all pass"
      - "End-to-end: a failing command writes a redacted tee file and tee_path appears in the JSON envelope"
    completed_at: null
