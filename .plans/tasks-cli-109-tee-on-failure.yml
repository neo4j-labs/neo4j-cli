tasks:
  - id: task-001
    title: 'Add tee_path to the clierr error envelope'
    description: |
      Extend the structured error envelope to carry the tee file path. Add a
      TeePath string field to clierr.CLIError with a chainable
      WithTeePath(string) *CLIError setter, add a
      `TeePath string `json:"tee_path,omitempty"`` field to EnvelopeBody, and
      project it in BuildEnvelope(). Update clierr.Render so that, after the
      `Error: <message> (exit N)` stderr line in every format branch, it prints
      `Full output saved: <path>` to stderr when TeePath is non-empty.
    status: completed
    dependencies: []
    acceptance_criteria:
      - "CLIError has a TeePath field and a chainable WithTeePath setter returning *CLIError"
      - "EnvelopeBody has tee_path with omitempty; BuildEnvelope projects e.TeePath"
      - "JSON and toon envelopes include tee_path when set and omit it when empty"
      - "Render prints `Full output saved: <path>` to stderr in json/toon/plaintext when TeePath set"
      - "Existing clierr render tests still pass; new cases cover tee_path present/absent"
    completed_at: 2026-06-03T00:00:00Z

  - id: task-002
    title: 'Add clievents.RedactText for multi-line secret scrubbing'
    description: |
      Add RedactText(s string) string to common/clievents/redact.go as the
      text-level single source of truth for redacting secrets in arbitrary
      multi-line output (RedactArgs is argv-only). Apply conservative regexes for
      URI userinfo passwords in free text, password/secret/token/api-key/auth
      key-value assignments, and bearer headers, reusing the existing secret
      vocabulary where practical.
    status: completed
    dependencies: []
    acceptance_criteria:
      - "RedactText scrubs neo4j://user:pw@host to neo4j://user:***@host (userinfo in free text)"
      - "RedactText scrubs password=/secret=/token=/api-key=/auth= and `Bearer <token>` values to ***"
      - "Non-secret text (e.g. limit=10, ordinary prose) is left unchanged"
      - "Multi-line input with multiple secrets has every match redacted"
      - "Table-driven tests in redact_test.go cover positives and no false positives"
    completed_at: 2026-06-03T00:00:00Z

  - id: task-003
    title: 'Add tee-enabled / tee-limit global config keys'
    description: |
      Mirror the history-enabled/history-limit pattern in
      common/clicfg/clicfg.go. Add `tee-enabled` (bool, default true) and
      `tee-limit` (int, default 20) to ValidConfigKeys and setDefaultValues, add
      validation in setGlobal (bool for tee-enabled, non-negative int for
      tee-limit), and add GlobalConfig accessors TeeEnabled() bool and
      TeeLimit() int.
    status: completed
    dependencies: []
    acceptance_criteria:
      - "tee-enabled and tee-limit appear in ValidConfigKeys and have defaults (true / 20)"
      - "setGlobal rejects non-true/false tee-enabled and negative/non-int tee-limit with usage errors"
      - "cfg.Global.TeeEnabled() and cfg.Global.TeeLimit() return the configured/default values"
      - "config set/get/list operate on both keys (Global scope)"
      - "clicfg validation tests cover valid and invalid values for both keys"
    completed_at: 2026-06-03T00:00:00Z

  - id: task-004
    title: 'Create common/tee package (LimitedBuffer, Dir, Save, rotation)'
    description: |
      Add a cobra-free common/tee package modeled on history/store.go. Provide a
      LimitedBuffer io.Writer capping at ~5 MiB that keeps the head and appends a
      truncation footer on overflow; Dir() returning
      ConfigPrefix/neo4j/cli/tee; and Save(cfg, commandSlug, content) that
      short-circuits when disabled/limit<=0/fs nil/empty content, redacts via
      clievents.RedactText, writes <UTC-timestamp>_<slug>.log atomically (0600)
      via fileutils.WriteFileErr, and rotates to keep at most tee-limit files per
      slug.
    status: pending
    dependencies:
      - task-002
      - task-003
    acceptance_criteria:
      - "LimitedBuffer caps at ~5 MiB, keeps head, and Bytes() appends a truncation footer when exceeded"
      - "Dir() resolves to ConfigPrefix/neo4j/cli/tee; filenames use the FS-safe UTC timestamp + slug"
      - "Save writes a redacted 0600 file and returns its absolute path on success"
      - "Save returns empty path/no write when tee disabled, tee-limit<=0, fs nil, or content empty"
      - "Rotation keeps at most tee-limit files matching *_<slug>.log, independently per slug; tests use afero memfs"
    completed_at: null

  - id: task-005
    title: 'Wire tee-on-failure into main.go'
    description: |
      In neo4j-cli/main.go wrap the root command out/err with a single shared
      LimitedBuffer via io.MultiWriter before cmd.Execute(). On a non-nil error
      (after the existing confirm.ErrCancelled exit-0 return), derive the command
      slug via cmd.Find(os.Args[1:]).CommandPath() (root name stripped, spaces to
      '-', fallback "root"), call tee.Save, resolve the error to a *clierr.CLIError
      (errors.As else NewFatalError), set WithTeePath when non-empty, and pass it
      to clierr.Render.
    status: pending
    dependencies:
      - task-001
      - task-004
    acceptance_criteria:
      - "cmd out/err are wrapped with io.MultiWriter(real, buf) before Execute; pass-through unchanged"
      - "Command slug derived from cmd.Find/CommandPath (e.g. aura-instance-list), fallback root"
      - "On failure a tee file is written and its path set on the rendered *CLIError via WithTeePath"
      - "confirm.ErrCancelled still exits 0 with no tee file; exit code is unchanged by tee logic"
      - "Tee write failure never changes exit code and yields an empty tee_path"
    completed_at: null

