  - id: task-007
    title: 'Redact secrets in JSON output (RedactText quoted-key gap)'
    description: |
      SECURITY (HIGH). clievents.RedactText only matches bare `key=value` /
      `key: value` assignments; it cannot match the quoted-key JSON shape
      `"password": "..."` because the `"` between the key and the `:` breaks the
      assignment regex. Empirically confirmed: `{"password":"hunter2"}` and
      `"token": "..."` pass through unredacted, while connection URIs (caught by
      the URI regex via `://user:pw@`) are fine. This is a reachable leak on the
      tee failure path, not theoretical: neo4j-cli/aura/internal/subcommands/instance/create.go
      RunE prints the new instance INCLUDING the Aura-generated `password`
      (create_core.go renderInstanceResult, field list includes "password") to
      stdout at line ~119, THEN `--wait` polls readiness and returns an error at
      line ~127. So `aura instance create --wait --format json` whose poll times
      out captures the generated DB admin password in the tee buffer, then
      tee.Save runs RedactText which misses the JSON field, persisting the live
      credential to the tee log and advertising its path via tee_path in the
      error envelope for an agent to read. JSON is the agent-facing format and
      the file is designed to be read/forwarded by automation, so the 0600 perm
      is a weak mitigation. Fix: add a JSON-field redaction pass to RedactText
      that matches a quoted key containing a secret word followed by `:` and a
      quoted value, rewriting the value to "***" while keeping valid JSON
      (handle both `"k":"v"` and `"k": "v"`). Match the key by substring (like
      the existing secretParamKeyParts philosophy) so `"client_secret"`,
      `"x-api-key"`, `"current_password"` are all covered.
    status: completed
    source: review
    dependencies:
      - task-002
    acceptance_criteria:
      - "RedactText turns {\"password\":\"x\"} and {\"password\": \"x\"} into ...\"***\" (valid JSON preserved)"
      - "\"token\":\"...\", \"client_secret\":\"...\", and \"x-api-key\":\"...\" values are redacted"
      - "A JSON field named \"name\" (non-secret) is left unchanged; bare key=value redaction still works"
      - "New table-driven RedactText cases cover JSON positives and the non-secret negative; make test/lint/fmt-check pass"
    completed_at: 2026-06-03T00:00:00Z

  - id: task-008
    title: 'Redact Authorization: Basic credentials in RedactText'
    description: |
      SECURITY (LOW). RedactText's bearer pass only handles `Bearer <token>`;
      `Authorization: Basic <base64 user:pass>` passes through unredacted
      (verified). neo4j-cli's Aura client uses OAuth Bearer so this is unlikely
      in real output, but verbose/debug HTTP dumps could include it and the
      addition is trivial. Extend the bearer regex to also cover the Basic scheme
      (e.g. `(?i)(bearer\s+|basic\s+)\S+`) so the base64 credential blob is
      replaced with ***.
    status: completed
    source: review
    dependencies:
      - task-007
    acceptance_criteria:
      - "RedactText rewrites `Authorization: Basic dXNlcjpwYXNz` to `Authorization: Basic ***`"
      - "Existing `Bearer` redaction still works"
      - "New test case added; make test/lint/fmt-check pass"
    completed_at: 2026-06-03T00:00:00Z

  - id: task-009
    title: 'Address table-format secret column leak'
    description: |
      SECURITY (MEDIUM). Same root cause as task-007 but for table output:
      `password │ <value>` table cells are not matched by RedactText, so
      `aura instance create --format table` (which prints the generated password
      column via renderInstanceResult) leaks the credential into the tee file on
      the same --wait-failure path. Robust generic column-layout redaction is
      hard, so the realistic remedy is to mask the credential at the source for
      captured/non-success contexts: evaluate having renderInstanceResult (and
      similar printers) omit or mask the `password` value, OR add a conservative
      table-cell redaction pass keyed on a leading secret-word column label. Pick
      the approach that is robust without over-redacting normal table output, and
      document the residual risk if full coverage isn't achievable. Coordinate
      with task-007 so the chosen vocab/source stays consistent.
    status: completed
    source: review
    dependencies:
      - task-008
    acceptance_criteria:
      - "A generated password is not present in cleartext in the tee output for `instance create --format table` on a post-print failure"
      - "Normal non-secret table output is not over-redacted"
      - "Chosen approach + any residual risk documented (code comment or progress note); make test/lint/fmt-check pass"
    completed_at: 2026-06-03T00:00:00Z

