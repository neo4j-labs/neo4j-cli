updated_at: 2026-05-13T16:00:00Z

tasks:
  - id: task-001
    title: "Drop `-f` shorthand from `--format` registration"
    description: |
      Edit `common/flags/flags.go` to remove the `"f"` shorthand from
      `RegisterOutputFlag`'s `StringP` call so `--format` no longer claims `-f`.
      Update the function's doc comment (line 32) from `--format/-f` to
      `--format`. Mirror the same change in the test-only helper at
      `neo4j-cli/internal/versioncheck/versioncheck_test.go:278` so the test
      surface stays honest. See PRD REQ-F-001, REQ-F-002, REQ-F-004.
    status: completed
    completed_at: 2026-05-13T16:30:00Z
    dependencies: []
    acceptance_criteria:
      - "`common/flags/flags.go` calls `cmd.PersistentFlags().String(\"format\", \"\", …)` (no `\"f\"` shorthand argument)"
      - "`common/flags/flags.go:32` doc comment reads `// RegisterOutputFlag adds a persistent --format flag …` (no `/-f`)"
      - "`neo4j-cli/internal/versioncheck/versioncheck_test.go:278` uses `String(\"format\", \"\", \"format\")` (no `StringP`/`\"f\"`)"
      - "`grep -rn 'StringP(\"format\"' .` returns no hits in source or test files"
      - "`go build ./...` succeeds after the change"

  - id: task-002
    title: "Wire `-f` shorthand on `update --force`"
    description: |
      Edit `neo4j-cli/internal/subcommands/update/update.go:125` to change
      `cmd.Flags().BoolVar(&force, forceFlag, …)` to
      `cmd.Flags().BoolVarP(&force, forceFlag, "f", false, …)`. The flag
      description string stays the same. `update` does not register its own
      `--format`, and the persistent `--format` no longer claims `-f`, so no
      collision. `update check` (child) does not inherit `--force` and its
      existing `TestCheckCmd_UnknownForceFlag` must stay green. See PRD
      REQ-F-003.
    status: completed
    completed_at: 2026-05-13T16:45:00Z
    dependencies: []
    acceptance_criteria:
      - "`update.go:125` calls `cmd.Flags().BoolVarP(&force, forceFlag, \"f\", false, …)`"
      - "Flag description string is unchanged from the original"
      - "`go run ./neo4j-cli update --help` shows `-f, --force` in the flag block"
      - "`go run ./neo4j-cli update check --help` does not show `--force` (child still has no force flag)"
      - "Existing `TestCheckCmd_UnknownForceFlag` still passes"

  - id: task-003
    title: "Strip `-f` references from hand-written markdown source"
    description: |
      Update every hand-written markdown file that documents `-f` as a
      shorthand for `--format`. In skill-bundle source: drop the
      ``(shorthand `-f`)`` parenthetical and ``(`-f toon`)`` mentions in
      `neo4j-cli/internal/skill/additions.md` (lines 6-7) and
      `neo4j-cli/aura/internal/skill/additions.md` (lines 5-6), and replace
      every `-f <value>` token in `neo4j-cli/internal/skill/query-additions.md`
      with `--format <value>` (~14 occurrences). In repo docs: drop the
      trailing ``(shorthand `-f`)`` clause in `AGENTS.md:103`,
      `CONTRIBUTING.md:170`, `.agents/architecture.md:45`, and
      `.agents/repo-layout.md:12`. Do NOT edit `CLAUDE.md` (it's a symlink to
      `AGENTS.md`). See PRD REQ-F-007 through REQ-F-013.
    status: completed
    completed_at: 2026-05-13T17:00:00Z
    dependencies: []
    acceptance_criteria:
      - "`grep -rn '\\-f toon\\|\\-f json\\|\\-f table' neo4j-cli/internal/skill/ neo4j-cli/aura/internal/skill/` returns no hits in `additions.md` or `query-additions.md`"
      - "`grep -n 'shorthand \\`-f\\`' AGENTS.md CONTRIBUTING.md .agents/architecture.md .agents/repo-layout.md` returns no hits"
      - "`AGENTS.md:103` line ends with `for all read commands` (no shorthand suffix)"
      - "Surrounding prose in every edited file remains intact (only the `-f` tokens / parentheticals are removed or rewritten to long form)"
      - "`CLAUDE.md` is unchanged (still a symlink to `AGENTS.md`)"

  - id: task-004
    title: "Add regression tests for both flag changes"
    description: |
      Add a regression assertion in `common/flags/flags_test.go` confirming
      `RegisterOutputFlag` registers `format` with empty `Shorthand`. Add a
      regression assertion in
      `neo4j-cli/internal/subcommands/update/update_test.go` confirming the
      `update` command's `force` flag has `Shorthand == "f"`, plus a positive
      parse-path check that `update -f --version <valid>` parses without
      cobra error (force=true reaches `runOpts`). Optionally add a negative
      case confirming `update check -f` still errors. These lock the freed
      slot and the new binding so neither can silently regress. See PRD
      REQ-F-005, REQ-F-006.
    status: pending
    dependencies:
      - task-001
      - task-002
    acceptance_criteria:
      - "`common/flags/flags_test.go` has a new test (or case) asserting `cmd.PersistentFlags().Lookup(\"format\").Shorthand == \"\"` after `RegisterOutputFlag`"
      - "`update_test.go` has a new assertion that the `update` cmd's `force` flag has `Shorthand == \"f\"`"
      - "`update_test.go` has a positive case confirming cobra parses `update -f --version <valid>` (force=true)"
      - "`go test ./common/flags/... ./neo4j-cli/internal/subcommands/update/...` passes"
      - "Existing tests in both files remain green"

  - id: task-005
    title: "Regenerate skill bundles"
    description: |
      Run `go generate ./neo4j-cli/internal/skill/... ./neo4j-cli/aura/internal/skill/...`
      to refresh the committed bundle files in
      `neo4j-cli/internal/skill/bundle/**` and
      `neo4j-cli/aura/internal/skill/bundle/**`. The flag table inside the
      generated `SKILL.md` / `references/*.md` reads `.Shorthand` from the
      live pflag set, so `-f` disappears from the `--format` row and appears
      on the `update --force` row automatically. The committed copies of
      `additions.md` / `query-additions.md` propagate from source. Skipping
      this trips `TestGenerator_RoundTrip`. See PRD REQ-F-014 and AGENTS.md
      "Cobra Help / Skill Bundle Rendering Notes".
    status: pending
    dependencies:
      - task-001
      - task-002
      - task-003
    acceptance_criteria:
      - "`go generate ./neo4j-cli/internal/skill/... ./neo4j-cli/aura/internal/skill/...` exits 0"
      - "`neo4j-cli/internal/skill/bundle/SKILL.md` no longer shows `-f` next to `--format` in the Global Flags table"
      - "`neo4j-cli/internal/skill/bundle/references/update.md` shows `-f, --force` (or equivalent) in its flag block"
      - "`neo4j-cli/aura/internal/skill/bundle/SKILL.md` no longer mentions `-f` as a `--format` shorthand"
      - "`make generate-check` is clean (re-running `go generate ./...` produces no diff)"
      - "`TestGenerator_RoundTrip` passes"

