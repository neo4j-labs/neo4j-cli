  - id: task-001
    title: "Allow --database/NEO4J_DATABASE override with --credential in resolveConn"
    description: |
      In neo4j-cli/query/connect.go resolveConn's --credential branch: shrink the
      conflict list from {uri, username, password, database} to {uri, username,
      password} and update the error message. Apply a database-override step to the
      conn returned by all three credential paths (desktop active and
      desktop-connection via finishDesktopMatch, persisted via
      buildConnFromPersistedCred): --database flag when f.Changed (even explicit
      empty) > os.Getenv(envDatabase) when non-empty > credential-supplied database.
      Small helper func or inline after each path. Keep the resolveConn doc comment
      in sync (it currently says none of the four params may be set alongside
      --credential). Do NOT load dotenv in the credential path.
    status: completed
    dependencies: []
    acceptance_criteria:
      - "--credential desktop --database movies resolves conn.database == \"movies\""
      - "NEO4J_DATABASE env applies with --credential when flag unset; flag beats env; no override leaves credential-supplied value (empty for desktop forms, stored DatabaseName for persisted)"
      - "--uri/--username/--password still rejected alongside --credential; --database absent from conflict error message"
      - "resolveConn doc comment updated; dotenv still not consulted in the credential path"
      - "go build ./... and go test ./neo4j-cli/query/... pass"
    completed_at: 2026-06-09T20:38:16Z

