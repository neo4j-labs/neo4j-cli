  - id: task-004
    title: 'Implement changelogForRange with 3-entry cap and elided flag'
    description: |
      In `changelog.go`, implement
      `changelogForRange(releases []Release, current, target string) (entries []releaseNotesEntry, elided bool)`.
      Filter to `(current, target]` — `semver.Compare(tag, current) > 0 && semver.Compare(tag, target) <= 0`
      — newest first, skipping entries whose body is empty (a skipped entry must NOT consume a cap
      slot). Truncate to the 3 newest and run each surviving body through `trimReleaseBody`.

      Set `elided` true when the cap dropped entries OR when `current` does not appear among the
      supplied releases (stale binary more than 30 releases behind), so the caller knows to print
      the full-changelog link. A downgrade (`target` older than `current`) yields an empty range by
      construction — no special-case branch. Extend `changelog_test.go`. (REQ-F-003, REQ-F-004,
      REQ-F-005, REQ-F-012, REQ-NF-003)
    status: pending
    dependencies:
      - task-002
      - task-003
    acceptance_criteria:
      - 'A 3-version range returns 3 entries newest-first with `elided` false'
      - 'A range wider than 3 returns exactly the 3 newest with `elided` true'
      - 'A `current` absent from the supplied releases sets `elided` true (stale-binary case)'
      - 'Empty-body releases are skipped without consuming a cap slot; a downgrade range returns zero entries'
      - 'Prereleases are included or excluded consistently with the `preReleases` filtering already applied by `ListReleases`'
    completed_at: null

  - id: task-005
    title: 'Implement printChangelog with StripControl and link line'
    description: |
      In `changelog.go`, implement
      `printChangelog(cmd *cobra.Command, entries []releaseNotesEntry, elided bool)`. Per entry emit
      `## <tag>`, a blank line, then the body passed through `output.StripControl`, with a blank line
      between entries. When `elided`, append a trailing `Full changelog: <changelogURL>` line.

      The `StripControl` call is the security requirement, not cosmetic: release bodies are
      third-party content rendered straight into a terminal, and a tampered release could otherwise
      inject ANSI escapes to move the cursor or spoof output. Note the toon path already gets this
      via `stripControlDeep` (`common/output/output.go:345`) and JSON via `encoding/json` escaping —
      the PLAIN-TEXT path is the one needing the explicit call. Extend `changelog_test.go` with an
      ANSI/C0-laden body case and a case asserting the link line appears ONLY when `elided`.
      (REQ-F-007, REQ-F-005, REQ-NF-001)
    status: pending
    dependencies:
      - task-003
      - task-004
    acceptance_criteria:
      - 'Each entry renders as `## <tag>`, blank line, trimmed body, with blank lines between entries'
      - 'A body containing ANSI escapes and C0 bytes is neutralised in the rendered output'
      - 'The `Full changelog:` line appears when `elided` is true and is absent when false'
      - 'Output is written through the passed `*cobra.Command` so tests can capture it'
    completed_at: null

