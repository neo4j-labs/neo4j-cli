tasks:
  - id: task-001
    title: 'Add TestMain network guard to the update package'
    description: |
      Add a `TestMain` to `neo4j-cli/internal/subcommands/update/` (the package currently has
      none — verified via `grep -rn "func TestMain"`). It points the package-level `httpDoFn`
      seam (`release.go:54`) at a fake that returns an error and records the violation, so any
      test reaching real network fails loudly instead of silently hitting api.github.com.

      Standalone hardening win, independent of the changelog feature, and the precondition for
      REQ-NF-002. Existing tests that legitimately stub `httpDoFn` (all of `release_test.go`,
      `swap_test.go`) must keep passing untouched — the guard is the DEFAULT, not an override,
      so per-test stubbing still wins. Place it in a new `main_test.go` or at the top of
      `update_test.go`; do not modify any existing test body. (REQ-NF-002 mitigation 2)
    status: completed
    dependencies: []
    acceptance_criteria:
      - 'A `TestMain` exists in the update package and installs a failing default `httpDoFn`'
      - '`go test -count=1 ./neo4j-cli/internal/subcommands/update/...` passes with zero edits to existing test bodies'
      - 'Tests that stub `httpDoFn` themselves still exercise their own stub, not the guard'
      - 'A deliberately unstubbed network call in a scratch test fails with a clear message naming the guard'
    completed_at: '2026-08-14T09:00:02Z'

