tasks:
  - id: task-001
    title: "Implement port-pair fallback loop in `create.go`"
    description: |
      Edit `neo4j-cli/internal/subcommands/docker/create.go`:
      (a) Add `const maxPortOffset = 100` next to `maxNameSuffix` (line 39) with
      a comment citing parity with `maxNameSuffix=99`.
      (b) Add a `portFree(port int) bool` helper that wraps `listenerFactory(port)`
      + `ln.Close()`, returning `true` on successful bind.
      (c) Add `findFreePortPair(boltStart, httpStart int) (bolt, http int, err error)`
      that iterates `offset = 0 … maxPortOffset-1`, returns the first pair where
      both `portFree` calls succeed, or returns `clierr.NewUsageError(
      "could not find a free port pair starting at %d/%d after %d attempts; pass --bolt-port / --http-port",
      boltStart, httpStart, maxPortOffset)` on exhaustion.
      (d) In `RunE`, replace the two `checkPortFree(boltPort, ...)` +
      `checkPortFree(httpPort, ...)` calls (lines ~209–214) with one call to
      `findFreePortPair`; reassign the local `boltPort` / `httpPort` to the
      resolved values BEFORE any downstream code reads them.
      (e) When the resolved pair differs from the requested pair, emit
      `fmt.Fprintf(cmd.ErrOrStderr(), "info: ports %d/%d in use; using %d/%d (bolt/http)\n", reqBolt, reqHttp, boltPort, httpPort)`.
      (f) Keep the equal-ports guard `if boltPort == httpPort { ... }` (lines 206–208)
      in place AND IN FRONT OF the loop call.
      (g) Delete the now-unused `checkPortFree` helper (lines 498–505).
      See PRD REQ-F-001 through REQ-F-007, REQ-F-010, REQ-F-011.
    status: pending
    dependencies: []
    acceptance_criteria:
      - "`maxPortOffset = 100` constant exists with a comment referencing `maxNameSuffix`"
      - "`portFree` and `findFreePortPair` helpers exist and route through `listenerFactory`"
      - "`RunE` reassigns `boltPort` and `httpPort` to the resolved values before argv build / label set / credential persist"
      - "Equal-ports guard runs BEFORE the new loop"
      - "Stderr `info: ports A/B in use; using C/D (bolt/http)` line fires only when the resolved pair differs from the requested pair"
      - "`checkPortFree` is deleted; no callers remain"
      - "`go build ./...` succeeds"
    completed_at: null

  - id: task-002
    title: "Update existing port-preflight tests and add fallback tests in `create_test.go`"
    description: |
      Edit `neo4j-cli/internal/subcommands/docker/create_test.go`:
      (a) Rewrite the three subtests inside `TestCreate_PortPreflight` (lines
      351–383) that previously expected `clierr.UsageError`:
      `"bolt port occupied surfaces --bolt-port hint"` → assert fallback lands
      on `(7688, 7475)` and the stderr `info:` line fires.
      `"http port occupied surfaces --http-port hint"` → same flip.
      `"custom bolt port occupied is named correctly"` → assert fallback to the
      next free pair from the user-supplied start.
      (b) KEEP `"equal ports rejected before any Listen"` UNCHANGED.
      (c) Add `TestCreate_AutoPortFallback_DefaultsTaken` — mark 7687 + 7474 busy,
      expect resolved `(7688, 7475)`, assert the `info:` line on stderr, the
      argv carries `-p 7475:7474 -p 7688:7687`, and the rendered output row
      has `bolt-port=7688 http-port=7475 uri=neo4j://localhost:7688`.
      (d) Add `TestCreate_AutoPortFallback_PreservesOffset` — args
      `--bolt-port 8000 --http-port 9000`, mark 8000 busy, expect `(8001, 9001)`.
      (e) Add `TestCreate_AutoPortFallback_Exhausted` — mark every port in
      `[7687, 7786]` AND `[7474, 7573]` busy; expect `clierr.UsageError` whose
      message names the start pair `7687/7474` and the cap `100`; assert
      `docker run` is NOT invoked.
      (f) Add `TestCreate_AutoPortFallback_NoNarrationOnHappyPath` — defaults
      free; assert no `info: ports` substring appears on stderr.
      All new tests must use the existing `stubListenerFactory` seam (lines 55–77).
      See PRD REQ-F-040 through REQ-F-045.
    status: pending
    dependencies:
      - task-001
    acceptance_criteria:
      - "The three rewritten subtests assert the resolved fallback pair instead of an error"
      - "The equal-ports subtest is unchanged"
      - "Four new tests exist with the names listed in the description"
      - "`TestCreate_AutoPortFallback_Exhausted` verifies the error message names both the start pair and `100`, and asserts `fake.RunCalls` is empty"
      - "`TestCreate_AutoPortFallback_NoNarrationOnHappyPath` greps stderr for the `info: ports` substring and asserts it is absent"
      - "All tests use `stubListenerFactory`; no new listener seam is introduced"
      - "`go test ./neo4j-cli/internal/subcommands/docker/...` passes"
    completed_at: null

