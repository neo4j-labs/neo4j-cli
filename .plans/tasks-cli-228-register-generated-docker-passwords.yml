      Do NOT touch create.go's `Long` or `Example` (create.go:137-179) —
      `neo4j-cli/internal/skill/bundle/references/docker.md:29,49` embeds that text and any edit
      forces a skill-bundle regenerate. Leave the `homeDirFn` comment at create.go:30-35 alone;
      its reference to package seams including randSource stays true package-wide.
    status: completed
    dependencies:
      - task-001
    acceptance_criteria:
      - "create.go:286-296 is replaced by a generatePassword() call using plain `=` assignment on the existing closure-scoped err"
      - "create.go no longer imports crypto/rand, encoding/base64 or io"
      - "create.go Long/Example strings are byte-identical to before"
      - "`go build ./...` and `go vet ./neo4j-cli/internal/subcommands/docker/` succeed"
      - "Existing docker create tests still pass unmodified, including those asserting the exact generated password in raw stdout"
    completed_at: 2026-08-05T12:15:29Z

  - id: task-003
    title: "Unit-test generatePassword: registration and randSource failure"
    description: |
      Add `neo4j-cli/internal/subcommands/docker/password_test.go` (package `docker`, reusing the
      existing `constantReader` from create_test.go:34).

      `TestGeneratePassword_RegistersSecretValueForRedaction` — swap in a deterministic
      randSource, call generatePassword(), assert the returned value equals the expected base64,
      then assert `clievents.RedactText(pw) == "***"` AND that it is scrubbed inside a synthetic
      box-drawing table cell so the assertion pins shape-independence rather than accidentally
      relying on a key=value match.

      `TestGeneratePassword_RandSourceError_Wrapped` — inject a reader that always errors; assert
      the error is non-nil, wraps the sentinel via errors.Is, and its message contains
      `generate password`. This closes a real existing gap: no test in the repo currently injects
      a failing randSource.

      Use byte values from the free range 0x01-0x05 (0x10, 0x42, 0x55, 0x66, 0x77, 0x88, 0xAB,
      0xCD, 0xEF are already taken) so each test registers a distinct literal in the additive
      process-global registry. Restore randSource via defer.
    status: completed
    dependencies:
      - task-001
    acceptance_criteria:
      - "password_test.go exists with the copyright header and both named tests"
      - "The registration test asserts scrubbing both standalone and inside a synthetic table cell"
      - "The failure test injects an erroring reader and asserts errors.Is against the sentinel"
      - "randSource is restored via defer in every test that swaps it; byte values do not collide with existing tests"
      - "Both tests fail if the RegisterSecretValue call is removed from generatePassword"
    completed_at: 2026-08-05T12:24:27Z

  - id: task-004
    title: "Pin docker create scrubbing across table, toon and json formats"
    description: |
      Add `TestCreate_GeneratedPassword_ScrubbedFromRedactedCapture` to create_test.go, table-driven
      over `table`, `toon` and `json`. For each format, run docker create through cobra with a
      deterministic randSource, then assert all three of: raw stdout STILL contains the generated
      password (proving human-facing output is unchanged by this fix), `clievents.RedactText(stdout)`
      does NOT contain it, and the redacted text contains `***`.

      This is the primary pin for the fix. Verified empirically: pre-fix, `table` and `toon` leak
      while `json` is already caught by textJSONFieldRe — so the json case passes both before and
      after and should carry a comment saying so. `toon` is the most important case because it is
      the agent-harness default that CLI-218's `mcp serve` will emit.

      Also add `TestCreate_Ephemeral_GeneratedPassword_ScrubbedFromRedactedCapture` for the
      `--ephemeral` `.env` blob path. Its comment MUST state honestly that this passes pre-fix too,
      because the blob's `NEO4J_PASSWORD=` line is caught by the unanchored textAssignmentRe — it
      is a regression guard for the blob path, not a pin of this change.

      HONESTY REQUIREMENT (from review of task-001/002): these tests call
      `clievents.RedactText(stdout)` themselves, so they pin a HELPER-LEVEL invariant — "the value
      is registered and therefore scrubbable" — NOT an end-to-end leak path. No production code
      currently feeds successful stdout through RedactText (the tee buffer is persisted only on
      failure; --debug covers stderr and env NAMES only). Say so in a comment on the test, so a
      future reader does not mistake it for proof that a live leak was closed.

      Byte values: task-003 consumed 0x01. Five tests across task-004/005/006 need distinct values,
      so 0x02-0x05 is one short — pick a fifth outside the taken set
      (0x10, 0x42, 0x55, 0x66, 0x77, 0x88, 0xAB, 0xCD, 0xEF and now 0x01).
    status: completed
    dependencies:
      - task-002
    acceptance_criteria:
      - "Format matrix covers table, toon and json, asserting raw-stdout-contains AND redacted-does-not-contain for each"
      - "The json subtest carries a comment noting it passes pre-fix via textJSONFieldRe"
      - "The ephemeral test comment states honestly that it passes pre-fix and is a regression guard, not a pin"
      - "A comment records that these tests pin a helper-level invariant, not an end-to-end leak path"
      - "The table and toon subtests fail when the RegisterSecretValue call is removed"
      - "Distinct, non-colliding constantReader byte values; randSource restored via defer"
    completed_at: 2026-08-05T12:39:10Z

  - id: task-005
    title: "Pin that an operator-supplied --password is NOT registered"
    description: |
      Add `TestCreate_ExplicitPassword_NotRegisteredAsSecret` to create_test.go. Run docker create
      with an explicit `--password` and assert that `clievents.RedactText(<that literal>)` returns
      the literal unchanged, pinning the deliberate scope decision in REQ-F-006 so any future
      widening to all passwords is a conscious choice rather than a silent regression.

      Use a distinctive literal such as `cli228-operator-supplied`. Do NOT use `mysecret` — it is
      already used at create_test.go:299, and because `knownSecrets` is a process-global additive
      registry with no exported reset, an earlier test in the same package registering a substring
      of the asserted value would break this negative assertion. Note that RegisterSecretValue
      no-ops below 4 characters (redact.go:163).
    status: completed
    dependencies:
      - task-002
    acceptance_criteria:
      - "Test asserts RedactText returns the operator-supplied literal unchanged"
      - "The literal is distinctive and collision-proof — not `mysecret`, not a substring of any other registered test value"
      - "A comment explains the over-redaction rationale (literal ReplaceAll would rewrite neo4j://... / neo4j:enterprise / username: neo4j)"
      - "Test passes both before and after the fix, and fails if registration is widened to cover supplied passwords"
    completed_at: 2026-08-05T12:51:47Z

  - id: task-006
    title: "Pin docker load new-container scrubbing"
    description: |
      Add `TestLoad_NewContainer_GeneratedPassword_ScrubbedFromRedactedCapture` to load_test.go —
      the second-site pin, covering the password minted inside LoadDumpIntoNewContainer
      (load.go:344-350) and rendered at load.go:173.

      load_test.go currently never swaps `randSource` (it runs against the real rand.Reader), so
      this test must install a deterministic one with a distinct byte value and restore it via
      defer. Drive the new-container path with `--format table` and assert the same pair as
      task-004: raw stdout still contains the generated password, `clievents.RedactText(stdout)`
      does not.

      Same HONESTY REQUIREMENT as task-004: the test calls RedactText itself, so it pins a
      helper-level invariant ("registered, therefore scrubbable"), not an end-to-end leak path —
      note that in a comment.

      Note `docker load` has no --no-print-password / --no-store-credential / --password flags, so
      unlike create there is no suppression path to consider.
    status: completed
