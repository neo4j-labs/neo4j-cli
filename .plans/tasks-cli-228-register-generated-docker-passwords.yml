      load.go:344-350. The helper now owns the error prefix, so just `return err`.

      Then remove the imports that the extraction made unused: `"crypto/rand"` (create.go:8),
      `"encoding/base64"` (:9) and `"io"` (:12). Their only uses were the moved lines 57, 292
