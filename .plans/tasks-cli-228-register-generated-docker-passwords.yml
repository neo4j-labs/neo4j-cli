  - id: task-011
    title: "Make per-test password uniqueness structural instead of a hand-tracked byte ledger"
    description: |
      This branch made per-test password uniqueness load-bearing: `knownSecrets` (common/clievents)
      is process-global, additive, and has no exported reset, so a negative assertion can be
      silently carried by a sibling test's registration. The mechanism currently enforcing that
      invariant is a HAND-MAINTAINED byte allocation table kept in prose — create_test.go records
      which bytes it consumed, load_test.go asserts "byte 0x06 is unused package-wide", and the
      authoritative ledger lives in the progress notes ("task-006 must pick outside it; 0x06 is
      free"). A uniqueness constraint spread across three files plus a planning doc is exactly the
      kind of invariant that should be code, not comments.

      There are ~13 sites repeating this four-line dance:
        origRand := randSource
        randSource = constantReader{b: 0xNN}
        defer func() { randSource = origRand }()
        expectedPassword := base64.RawURLEncoding.EncodeToString(bytes.Repeat([]byte{0xNN}, generatedPasswordBytes))

      Add one helper in helpers_test.go that derives the reader deterministically from `t.Name()`,
      restores via `t.Cleanup`, and RETURNS the password `generatePassword` will mint. That deletes
      the boilerplate, deletes the whole allocation-bookkeeping apparatus (both the comments and the
      progress-note ledger), and makes collision-proofness structural rather than asserted in prose.
      Apply it to the four sites this branch added at minimum; prefer all ~13 since this branch is
      the reason uniqueness matters at all.

      Also collapse the copy-pasted assertion triple (raw Contains, redacted NotContains, redacted
      Contains "***") — it appears three times with only the needle varying. One
      assertRedactionScrubs(t, raw, pw) helper covers all three.

      Once this lands, delete the now-obsolete byte-allocation prose and remove the ledger lines from
      the progress file rather than leaving them to rot.
    status: completed
    source: review
    dependencies:
      - task-010
    acceptance_criteria:
      - "A helpers_test.go helper derives randSource from t.Name(), restores via t.Cleanup, and returns the expected minted password"
      - "The four sites added by this branch use it; the manual origRand/defer/base64 dance is gone from them"
      - "An assertRedactionScrubs-style helper replaces the three copy-pasted assertion triples"
      - "All byte-allocation bookkeeping prose is deleted from the test files AND the progress-note ledger"
      - "Uniqueness no longer depends on a human picking an unused byte; `make test` passes and the docker package is green under -shuffle=on"
    completed_at: 2026-08-05T14:58:31Z

