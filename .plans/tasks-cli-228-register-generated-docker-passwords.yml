tasks:
  - id: task-001
    title: "Extract docker password minting into password.go and register the secret"
    description: |
      Create `neo4j-cli/internal/subcommands/docker/password.go` as the single place a Neo4j
      password is minted for a local container. Move `randSource` (from create.go:54-57) and
      `generatedPasswordBytes` (from create.go:67-70) verbatim, and move `generatePassword()`
      from load.go:445-453, adding a `clievents.RegisterSecretValue(pw)` call before it returns.
      Unify the error message on `docker: generate password: %w` (REQ-F-005).

      Keep the tree compiling: delete the two moved declarations from create.go and delete the
      duplicate `generatePassword` from load.go in this same task, otherwise the package has
      duplicate package-level declarations. create.go's inline generation block (lines 286-296)
      stays for now and still resolves `randSource` from password.go (same package) — task-002
      rewires it. Drop the now-unused `"encoding/base64"` from load.go (its only use was line
      452) but KEEP `"io"` (still used at load.go:283, :286, :470, :518).

      The doc comment must explain WHY registration is needed: RedactText is shape-based and
      catches `NEO4J_PASSWORD=<v>` and `"password":"<v>"` but NOT a box-drawing table cell or a
      TOON array row. It must also record that operator-supplied `--password` is deliberately
      NOT registered, because RegisterSecretValue is a literal ReplaceAll and a short value like
      `neo4j` would rewrite `neo4j://localhost:7687` / `neo4j:enterprise` / `username: neo4j`.
    status: completed
    dependencies: []
    acceptance_criteria:
      - "password.go exists with the Neo4j copyright header (CI addlicense) and owns randSource, generatedPasswordBytes and generatePassword"
      - "generatePassword calls clievents.RegisterSecretValue on the minted value BEFORE returning it"
      - "Error message is `docker: generate password: %w`, owned by the helper"
      - "randSource/generatedPasswordBytes are gone from create.go and generatePassword is gone from load.go — no duplicate package-level declarations"
      - "load.go no longer imports encoding/base64 but still imports io; `go build ./...` succeeds"
      - "Doc comment states the table/TOON shape gap and the deliberate exclusion of operator-supplied --password"
    completed_at: 2026-08-05T12:10:41Z

  - id: task-002
